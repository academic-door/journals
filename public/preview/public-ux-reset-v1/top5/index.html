const initialIssue = {"schema_version":"1.0","issue_id":"aer-116-10","journal_id":"aer","journal_name":"American Economic Review","volume":"116","issue":"10","publication_date":"October 2026","source_url":"https://www.aeaweb.org/journals/aer/current-issue","retrieved_at":"2026-10-09T14:17:59+00:00","expected_article_count":9,"research_article_count":9,"status":"ready","development_sample":false,"articles":[{"paper_id":"doi:10.1257/aer.20250115","sequence":1,"source_sequence":2,"article_type":"research-article","title_en":"Who Marries Whom? The Role of Segregation by Race and Class","title_cn":"谁与谁结婚？种族和阶级隔离的作用","authors":["Benjamin Goldman","Jamie Gracie","Sonya R. Porter"],"abstract_en":"Americans rarely marry outside their race or class group, a pattern with well-documented implications for inequality and intergenerational mobility. Limited exposure may partly explain these low intergroup marriage rates. We instrument for exposure using variation in childhood neighborhoods based on whether other race and class groups had more opposite-sex children of similar age. Exposure increases interclass (high- and low-parent income) marriage but has no detectable effect on interracial (White and Black) marriage. A spatial marriage model predicts that residential segregation—one of many forms of exposure—accounts for more than one-third of marital sorting by class but less than 5 percent by race.","abstract_cn":"美国人很少与自己的种族或阶级群体之外的人结婚，这一模式对不平等和代际流动性的影响已有充分记录。有限的接触可能部分解释了这些较低的群体间结婚率。我们利用童年社区中其他种族和阶级群体是否有更多年龄相仿的异性子女这一变异，来为接触进行工具变量估计。接触增加了阶级间（高父母收入和低父母收入）婚姻，但对种族间（白人和黑人）婚姻没有可检测到的影响。一个空间婚姻模型预测，居住隔离——众多接触形式之一——解释了超过三分之一的阶级婚姻匹配，但解释了不到5%的种族婚姻匹配。","doi":"10.1257/aer.20250115","source_url":"https://www.aeaweb.org/articles?id=10.1257/aer.20250115","publication_date":"","sources":{"inventory":"official-issue-page","title":"official-article-page","authors":"official-article-page","abstract":"official-article-page","doi":"official-article-id"},"translation":{"status":"complete","provider":"deepseek","prompt_version":"academic-door-abstract-zh-v2","glossary_version":"1","model":"deepseek-v4-flash","translated_at":"2026-10-09T14:18:00+00:00","source_hash":"a2052e9ebc0594e5a298598001c1a34d289cfd4a1961af1c3829e88f49f63a9e"},"quality_flags":[],"china_relevance":{"status":"no","evidence":"no substantive China signal","matched_terms":[],"source":"academic-door-rules-v1"}},{"paper_id":"doi:10.1257/aer.20241596","sequence":2,"source_sequence":3,"article_type":"research-article","title_en":"Taxing Top Wealth: Migration Responses and Their Aggregate Economic Implications","title_cn":"对顶级财富征税：移民响应及其总体经济影响","authors":["Katrine Jakobsen","Henrik Kleven","Jonas Kolsrud","Camille Landais","Mathilde Munoz"],"abstract_en":"Using administrative data from Scandinavian countries, we provide evidence on international migration responses to wealth taxes and evaluate their aggregate economic implications. We find significant migration responses among the wealthy: A 1 percentage point increase in the top wealth tax rate decreases the stock of wealthy taxpayers by about 2 percent. A large fraction of the wealthy are business owners, and their businesses are negatively affected by owner out-migration. The aggregate effects are nevertheless modest: The migration responses to a 1 percentage point increase in the top wealth tax rate reduce employment by 0.02 percent, investments by 0.07 percent, and value added by 0.10 percent.","abstract_cn":"利用斯堪的纳维亚国家的行政数据，我们提供了关于对财富税的国际移民响应的证据，并评估了其总体经济影响。我们发现富人群体中存在显著的移民响应：最高财富税率每提高1个百分点，富裕纳税人的存量减少约2%。富人中很大一部分是企业主，其企业受到所有者外迁的负面影响。尽管如此，总体影响是温和的：对最高财富税率提高1个百分点的移民响应使就业减少0.02%，投资减少0.07%，增加值减少0.10%。","doi":"10.1257/aer.20241596","source_url":"https://www.aeaweb.org/articles?id=10.1257/aer.20241596","publication_date":"","sources":{"inventory":"official-issue-page","title":"official-article-page","authors":"official-article-page","abstract":"official-article-page","doi":"official-article-id"},"translation":{"status":"complete","provider":"deepseek","prompt_version":"academic-door-abstract-zh-v2","glossary_version":"1","model":"deepseek-v4-flash","translated_at":"2026-10-09T14:18:02+00:00","source_hash":"cc998508e3a48970d1122841b6fd24b5631bddf83b3da9200f05ba2d5b1595f7"},"quality_flags":[],"china_relevance":{"status":"no","evidence":"no substantive China signal","matched_terms":[],"source":"academic-door-rules-v1"}},{"paper_id":"doi:10.1257/aer.20231368","sequence":3,"source_sequence":4,"article_type":"research-article","title_en":"Racial Promotion Gaps","title_cn":"种族晋升差距","authors":["Deepak Hegde","Alexander Ljungqvist","Manav Raj"],"abstract_en":"We study racial disparities in promotions in a setting in which promotions are formulaic: the US patent office. Using detailed administrative data that allow us to observe who is eligible for promotion when, we document that Black patent examiners experience delays in promotions they are entitled to, slowing their climb to the top of the career ladder by a year and reducing career earnings by 2.5 percent. Institutional features rule out statistical discrimination with accurate priors. Slow promotions even under Black supervisors argue against taste-based animus. Instead, the patterns fit models of belief-based discrimination.","abstract_cn":"我们研究了一个晋升规则公式化的环境中的种族差异：美国专利局。利用详细的行政数据，这些数据使我们能够观察到谁在何时有资格晋升，我们记录了黑人专利审查员在其有权获得的晋升中经历延迟，使其攀登职业阶梯顶端的时间延缓了一年，并使职业收入减少2.5%。制度特征排除了具有准确先验的统计歧视。即使在黑人主管手下晋升也缓慢，这反对基于偏好的敌意。相反，这些模式符合基于信念的歧视模型。","doi":"10.1257/aer.20231368","source_url":"https://www.aeaweb.org/articles?id=10.1257/aer.20231368","publication_date":"","sources":{"inventory":"official-issue-page","title":"official-article-page","authors":"official-article-page","abstract":"official-article-page","doi":"official-article-id"},"translation":{"status":"complete","provider":"deepseek","prompt_version":"academic-door-abstract-zh-v2","glossary_version":"1","model":"deepseek-v4-flash","translated_at":"2026-10-09T14:18:03+00:00","source_hash":"f2a2f11274b939f70543d85b7a3bf397f053420d572d9b66110cd869b1de7c05"},"quality_flags":[],"china_relevance":{"status":"no","evidence":"no substantive China signal","matched_terms":[],"source":"academic-door-rules-v1"}},{"paper_id":"doi:10.1257/aer.20250206","sequence":4,"source_sequence":5,"article_type":"research-article","title_en":"Screening and Segmenting: A Consumer Surplus Perspective","title_cn":"筛选与分割：消费者剩余视角","authors":["Dirk Bergemann","Tibor Heumann","Michael C. Wang"],"abstract_en":"We analyze consumer surplus when a monopolist can adjust both prices and product qualities across segments, engaging in second and third-degree price discrimination simultaneously. We characterize the consumer-optimal segmentation and show that it has a striking structure: Consumers with the same value receive the same quality in every segment, though prices differ. Under mild conditions, any segmentation harms consumers if and only if demand is sufficiently more elastic than supply. Hence, potential benefits for consumers depend critically on demand and supply elasticities. These findings have implications for regulatory policy regarding price discrimination and market segmentation.","abstract_cn":"我们分析了当垄断者能够同时调整不同细分市场的价格和产品质量，并同时实施二级和三级价格歧视时的消费者剩余。我们刻画了消费者最优分割，并表明其具有一个引人注目的结构：具有相同价值的消费者在每个细分市场中获得相同的质量，尽管价格不同。在温和条件下，任何分割都会损害消费者，当且仅当需求比供给弹性足够大时。因此，消费者的潜在收益关键取决于需求和供给弹性。这些发现对关于价格歧视和市场分割的监管政策具有启示意义。","doi":"10.1257/aer.20250206","source_url":"https://www.aeaweb.org/articles?id=10.1257/aer.20250206","publication_date":"","sources":{"inventory":"official-issue-page","title":"official-article-page","authors":"official-article-page","abstract":"official-article-page","doi":"official-article-id"},"translation":{"status":"complete","provider":"deepseek","prompt_version":"academic-door-abstract-zh-v2","glossary_version":"1","model":"deepseek-v4-flash","translated_at":"2026-10-09T14:18:05+00:00","source_hash":"b618611b052b81e18b79914996c950ff90727a4968806bc1dcabf3a67689933c"},"quality_flags":[],"china_relevance":{"status":"no","evidence":"no substantive China signal","matched_terms":[],"source":"academic-door-rules-v1"}},{"paper_id":"doi:10.1257/aer.20240651","sequence":5,"source_sequence":6,"article_type":"research-article","title_en":"A Model of the Attention Economy: Data, Platforms, and Discovery","title_cn":"注意力经济模型：数据、平台与发现","authors":["Daniel Chen"],"abstract_en":"This paper develops a dynamic model of the attention economy featuring two interlinked markets: a product market, where consumers have limited awareness of firms, and an attention market, where platforms attract attention by investing in free services (e.g., social media, streaming, podcasts) and sell targeted ads using data on consumer preferences. The model provides a tractable framework in which platform investment, ad-driven discovery, product demand, and ad revenue are jointly determined. The effects of data and interoperability policies can reverse over time, platform quality may be inefficiently high or low, and the rise of data-rich digital advertising can coincide with a declining ad revenue-to-GDP ratio.","abstract_cn":"本文构建了一个注意力经济的动态模型，包含两个相互关联的市场：产品市场，其中消费者对企业的认知有限；以及注意力市场，其中平台通过投资免费服务（例如社交媒体、流媒体、播客）来吸引注意力，并利用消费者偏好数据销售定向广告。该模型提供了一个易于处理的框架，其中平台投资、广告驱动的发现、产品需求和广告收入被联合决定。数据和互操作性政策的效果可能随时间逆转，平台质量可能无效率地过高或过低，而数据丰富的数字广告的兴起可能与广告收入占GDP比率的下降同时发生。","doi":"10.1257/aer.20240651","source_url":"https://www.aeaweb.org/articles?id=10.1257/aer.20240651","publication_date":"","sources":{"inventory":"official-issue-page","title":"official-article-page","authors":"official-article-page","abstract":"official-article-page","doi":"official-article-id"},"translation":{"status":"complete","provider":"deepseek","prompt_version":"academic-door-abstract-zh-v2","glossary_version":"1","model":"deepseek-v4-flash","translated_at":"2026-10-09T14:18:06+00:00","source_hash":"a27d01b7c730885f197fbe70f828c1e7646ddde6e157a183971fe7ee799f8c76"},"quality_flags":[],"china_relevance":{"status":"no","evidence":"no substantive China signal","matched_terms":[],"source":"academic-door-rules-v1"}},{"paper_id":"doi:10.1257/aer.20240393","sequence":6,"source_sequence":7,"article_type":"research-article","title_en":"Fighting for Growth: Labor Scarcity and Technological Progress during the British Industrial Revolution","title_cn":"为增长而战：英国工业革命期间的劳动力稀缺与技术进步","authors":["Hans-Joachim Voth ⓡ","Bruno Caprettini ⓡ","Alex Trew"],"abstract_en":"We establish a link between labor scarcity and the adoption of laborsaving technology in industrializing England. During the Napoleonic Wars, more than 10 percent of the male population served in the armed forces. Where recruitment was heavy, more machines economizing on labor were adopted. Naval recruitment, instrumented by warships' coastal access, provides exogenous variation in labor scarcity and suggests that the link between labor shortages and adoption is causal. Where mechanical skills were abundant, the impact of labor scarcity on adoption appears to be larger.","abstract_cn":"我们确立了在工业化英格兰劳动力稀缺与采用节约劳动技术之间的联系。在拿破仑战争期间，超过10%的男性人口在武装部队服役。在征兵繁重的地方，更多节约劳动的机器被采用。海军征兵，以军舰的沿海通道为工具变量，提供了劳动力稀缺的外生变化，并表明劳动力短缺与采用之间的联系是因果性的。在机械技能丰富的地方，劳动力稀缺对采用的影响似乎更大。","doi":"10.1257/aer.20240393","source_url":"https://www.aeaweb.org/articles?id=10.1257/aer.20240393","publication_date":"","sources":{"inventory":"official-issue-page","title":"official-article-page","authors":"official-article-page","abstract":"official-article-page","doi":"official-article-id"},"translation":{"status":"complete","provider":"deepseek","prompt_version":"academic-door-abstract-zh-v2","glossary_version":"1","model":"deepseek-v4-flash","translated_at":"2026-10-09T14:18:07+00:00","source_hash":"ba835e4d1fb5c77fde05b8fd5297da5ab0a94464dd4fa8ebd071cac7627d3c93"},"quality_flags":[],"china_relevance":{"status":"no","evidence":"no substantive China signal","matched_terms":[],"source":"academic-door-rules-v1"}},{"paper_id":"doi:10.1257/aer.20231417","sequence":7,"source_sequence":8,"article_type":"research-article","title_en":"Social Push and the Direction of Innovation","title_cn":"社会推动与创新方向","authors":["Elias Einiö","Josh Feng","Xavier Jaravel"],"abstract_en":"What are the implications of unequal access to innovation careers for the direction of innovation and inequality? Leveraging novel linked datasets in the United States and Finland, we document that innovators create products more likely to be purchased by consumers like them in terms of gender, socioeconomic status, and age. Homophily exists both within narrow product categories and across industries and has been stable in recent decades. Incorporating this \"social push\" channel into a growth model, we estimate that unequal access to innovation careers has a large effect on cost of living inequality and long-run growth.","abstract_cn":"创新职业机会的不平等对创新方向和不平等有何影响？利用美国和芬兰的新颖关联数据集，我们记录到创新者创造的产品更可能被与其在性别、社会经济地位和年龄方面相似的消费者购买。同质性既存在于狭窄的产品类别内，也存在于跨行业之间，并且在近几十年一直保持稳定。将这一“社会推动”渠道纳入增长模型，我们估计创新职业机会的不平等对生活成本不平等和长期增长有巨大影响。","doi":"10.1257/aer.20231417","source_url":"https://www.aeaweb.org/articles?id=10.1257/aer.20231417","publication_date":"","sources":{"inventory":"official-issue-page","title":"official-article-page","authors":"official-article-page","abstract":"official-article-page","doi":"official-article-id"},"translation":{"status":"complete","provider":"deepseek","prompt_version":"academic-door-abstract-zh-v2","glossary_version":"1","model":"deepseek-v4-flash","translated_at":"2026-10-09T14:18:08+00:00","source_hash":"10db007f87382d692dfe2a98046334ae1c92e76855d006f872c75f17eeba9e88"},"quality_flags":[],"china_relevance":{"status":"no","evidence":"no substantive China signal","matched_terms":[],"source":"academic-door-rules-v1"}},{"paper_id":"doi:10.1257/aer.20230714","sequence":8,"source_sequence":9,"article_type":"research-article","title_en":"Knowledge Spillovers, Competition, and Individual Careers","title_cn":"知识溢出、竞争与个人职业发展","authors":["Thomas Cornelissen","Christian Dustmann","Uta Schönberg"],"abstract_en":"Exposure to better peers in the workplace can influence career trajectories through two opposing channels: positively, via knowledge spillovers, and negatively, through competition for advancement. We disentangle these effects by studying untrained labor market entrants and distinguishing between coworkers in the same occupation with whom they are likely to compete versus those with whom they are unlikely to compete. We find robust evidence of persistent knowledge spillovers but also identify countervailing competition effects of comparable magnitude. Both effects are more pronounced for men than for women.","abstract_cn":"在工作场所接触更优秀的同伴可以通过两个相反的渠道影响职业轨迹：通过知识溢出产生正向影响，以及通过晋升竞争产生负向影响。我们通过研究未经培训的劳动力市场新进入者，并区分与其可能竞争的同职业同事和与其不太可能竞争的同事，来分离这些效应。我们发现了持续知识溢出的稳健证据，但也识别出规模相当的反向竞争效应。这两种效应对男性都比对女性更为显著。","doi":"10.1257/aer.20230714","source_url":"https://www.aeaweb.org/articles?id=10.1257/aer.20230714","publication_date":"","sources":{"inventory":"official-issue-page","title":"official-article-page","authors":"official-article-page","abstract":"official-article-page","doi":"official-article-id"},"translation":{"status":"complete","provider":"deepseek","prompt_version":"academic-door-abstract-zh-v2","glossary_version":"1","model":"deepseek-v4-flash","translated_at":"2026-10-09T14:18:10+00:00","source_hash":"c0519ffedcc05ee04078ef25588d7ba3cf1b32bfa2d4a15d0820cc000329a985"},"quality_flags":[],"china_relevance":{"status":"no","evidence":"no substantive China signal","matched_terms":[],"source":"academic-door-rules-v1"}},{"paper_id":"doi:10.1257/aer.20251879","sequence":9,"source_sequence":10,"article_type":"research-article","title_en":"Truth Elicitation in a Nonstrategic Environment","title_cn":"非策略性环境中的真相揭示","authors":["Jacob Glazer","Ariel Rubinstein"],"abstract_en":"A principal decides which party deserves a prize. Only the parties observe the state that determines who is deserving. The principal gives each party a text describing the conditions under which that party deserves the prize and asks each to report the state. The parties are nonstrategic. Each activates a known cheating procedure whose outcome depends on the state and on the text. Implementation is achieved if, whenever the parties disagree, the liar is identified by the \"one-way cheating principle\": The truthful party is the unique party who could not have produced his story had the rival's story been true.","abstract_cn":"委托人决定哪一方应获得奖励。只有各方观察到决定谁应获得奖励的状态。委托人给每一方一份描述该方在何种条件下应获得奖励的文本，并要求每一方报告状态。各方是非策略性的。每一方激活一个已知的作弊程序，其结果取决于状态和文本。如果每当各方意见不一致时，说谎者通过“单向作弊原则”被识别出来，则实施得以实现：说真话的一方是唯一一方，如果对手的故事为真，他不可能编造出自己的故事。","doi":"10.1257/aer.20251879","source_url":"https://www.aeaweb.org/articles?id=10.1257/aer.20251879","publication_date":"","sources":{"inventory":"official-issue-page","title":"official-article-page","authors":"official-article-page","abstract":"official-article-page","doi":"official-article-id"},"translation":{"status":"complete","provider":"deepseek","prompt_version":"academic-door-abstract-zh-v2","glossary_version":"1","model":"deepseek-v4-flash","translated_at":"2026-10-09T14:18:11+00:00","source_hash":"31478d9360cd61ac7f9b77481b0ce304e2b75b4ffff966cc3a2ab7acc6a875d9"},"quality_flags":[],"china_relevance":{"status":"no","evidence":"no substantive China signal","matched_terms":[],"source":"academic-door-rules-v1"}}],"quality":{"roster_match":true,"order_preserved":true,"official_item_count":10,"excluded_item_count":1,"excluded_items":[{"source_sequence":1,"title_en":"Front Matter","reason":"non-research-title","article_type":"front-matter"}],"detail_failure_count":0,"doi_complete":9,"authors_complete":9,"abstract_en_complete":9,"translation_complete":9,"duplicate_count":0,"flags":[],"publishable_item_count":9,"content_counts":{"official_items":10,"observed_items":10,"publishable_items":9,"research_articles":9,"comments":0,"short_communications":0,"corrections":0,"editorial_material":0,"front_matter":1,"other_excluded":0,"catalog_content_items":9}},"content_counts":{"official_items":10,"observed_items":10     const journal = state.activeJournal || {};
    const isLegacyCurrent = Boolean(
      issue?.issue_id
      && issue.issue_id === journal.latest_issue_id
      && journal.latest_issue_url
      && journal.content_status === "complete"
      && evidence.official
      && ["ready", "complete"].includes(journal.update_state || journal.status)
    );
    return isLegacyCurrent ? "ready" : "unknown";
  };

  const fetchIssueUrl = (url) => {
    if (!state.issueCache.has(url)) {
      const request = fetch(url)
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .catch((error) => {
          state.issueCache.delete(url);
          throw error;
        });
      state.issueCache.set(url, request);
    }
    return state.issueCache.get(url);
  };

  const fetchIssue = (journal) => fetchIssueUrl(displayIssueUrl(journal));

  const fetchIssueIndex = (journal) => {
    const url = `${dataBase}api/v1/journals/${encodeURIComponent(journal.journal_id)}/issues/index.json`;
    if (!state.issueIndexCache.has(url)) {
      const request = fetch(url)
        .then((response) => {
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          return response.json();
        })
        .catch((error) => {
          state.issueIndexCache.delete(url);
          throw error;
        });
      state.issueIndexCache.set(url, request);
    }
    return state.issueIndexCache.get(url);
  };

  const enabledJournals = () =>
    (state.collection?.journals || []).filter((journal) => displayIssueUrl(journal));

  const visibleJournals = () =>
    (state.collection?.journals || []).filter(
      (journal) => state.field === "all" || journal.field === state.field
    );

  const renderTabs = () => {
    const tabs = document.querySelector("#journal-tabs");
    const select = document.querySelector("#journal-select");
    if (select) {
      const journals = visibleJournals();
      select.innerHTML = journals.map((journal) => `
        <option
          value="${escapeHtml(journal.journal_id)}"
          ${journal.journal_id === state.activeJournal?.journal_id ? "selected" : ""}
          ${displayIssueUrl(journal) ? "" : "disabled"}
        >${escapeHtml(journal.short_name)} · ${escapeHtml(journal.name_cn || journal.name)}</option>
      `).join("");
      select.onchange = () => {
        const journal = state.collection.journals.find(
          (item) => item.journal_id === select.value
        );
        if (journal) {
          loadIssue(journal).catch((error) => {
            document.querySelector("#issue-summary").innerHTML =
              `<p class="error-message">卷期载入失败：${escapeHtml(error.message)}</p>`;
          });
        }
      };
      return;
    }
    if (!tabs) return;
    tabs.innerHTML = visibleJournals().map((journal) => {
      const enabled = Boolean(displayIssueUrl(journal));
      const active = journal.journal_id === state.activeJournal?.journal_id;
      return `
        <button
          type="button"
          role="tab"
          data-journal="${escapeHtml(journal.journal_id)}"
          id="journal-tab-${escapeHtml(journal.journal_id)}"
          aria-selected="${active}"
          aria-controls="issue-panel"
          tabindex="${active && enabled ? "0" : "-1"}"
          class="${active ? "active" : ""}"
          ${enabled ? "" : "disabled"}
        >
          ${escapeHtml(journal.short_name)}
          ${enabled ? "" : "<small>接入中</small>"}
        </button>`;
    }).join("");
    const activeTab = tabs.querySelector('button[aria-selected="true"]');
    const issuePanel = document.querySelector("#issue-panel");
    if (activeTab?.id && issuePanel) issuePanel.setAttribute("aria-labelledby", activeTab.id);
    tabs.querySelectorAll("button:not(:disabled)").forEach((button) => {
      const warmIssue = () => {
        const journal = state.collection.journals.find(
          (item) => item.journal_id === button.dataset.journal
        );
        if (journal) fetchIssue(journal).catch(() => null);
      };
      button.addEventListener("pointerenter", warmIssue, { once: true });
      button.addEventListener("focus", warmIssue, { once: true });
      button.addEventListener("click", () => {
        const journal = state.collection.journals.find(
          (item) => item.journal_id === button.dataset.journal
        );
        if (journal) {
          loadIssue(journal).catch((error) => {
            document.querySelector("#issue-summary").innerHTML =
              `<p class="error-message">卷期载入失败：${escapeHtml(error.message)}</p>`;
          });
        }
      });
    });
    tabs.onkeydown = (event) => {
      if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
      const buttons = [...tabs.querySelectorAll('button[role="tab"]:not(:disabled)')];
      if (!buttons.length) return;
      const current = Math.max(0, buttons.indexOf(document.activeElement));
      const nextIndex = event.key === "Home"
        ? 0
        : event.key === "End"
          ? buttons.length - 1
          : (current + (event.key === "ArrowRight" ? 1 : -1) + buttons.length) % buttons.length;
      const next = buttons[nextIndex];
      const journal = state.collection.journals.find(
        (item) => item.journal_id === next.dataset.journal
      );
      event.preventDefault();
      if (!journal) return;
      state.pendingTabFocus = journal.journal_id;
      loadIssue(journal).catch((error) => {
        document.querySelector("#issue-summary").innerHTML =
          `<p class="error-message">卷期载入失败：${escapeHtml(error.message)}</p>`;
      });
    };
    if (state.pendingTabFocus) {
      const pending = tabs.querySelector(
        `button[data-journal="${CSS.escape(state.pendingTabFocus)}"]`
      );
      state.pendingTabFocus = "";
      if (pending) window.requestAnimationFrame(() => pending.focus());
    }
  };

  const renderIssue = () => {
    const summary = document.querySelector("#issue-summary");
    const list = document.querySelector("#article-list");
    const composerLink = document.querySelector("#composer-link");
    if (!state.issue) return;

    const issue = state.issue;
    const quality = issue.quality || {};
    const abstracts = quality.abstract_en_complete || 0;
    const translated = quality.translation_complete || 0;
    const total = issue.research_article_count || issue.articles.length;
    const counts = issue.content_counts || quality.content_counts || {};
    const corrections = counts.corrections || 0;
    const issueCountLabel = `${total} 篇学术文章${corrections ? `，另有 ${corrections} 篇勘误` : ""}`;
    const publicationState = publicationStateForIssue(issue);
    const ready = publicationState === "ready";
    const contentReady = issue.content_status === "complete"
      || (abstracts === total && translated === total);
    const sourcePending = publicationState === "source_pending";
    const publicationDate = formatDate(issue.publication_date);
    composerLink.href = `${base}composer/?journal=${encodeURIComponent(issue.journal_id)}&issue=${encodeURIComponent(issue.issue_id)}`;
    const journal = state.activeJournal || {};
    const announcementNotice = journal.latest_announced_is_newer ? `
      <div class="issue-note announced-issue-notice">
        <strong>新一期已发布</strong>
        · ${escapeHtml(journal.latest_announced_issue_label || journal.latest_announced_issue_id || "")}
        ${journal.latest_announced_publication_date ? ` · ${escapeHtml(formatDate(journal.latest_announced_publication_date))}` : ""}
        · 内容整理中
        ${journal.latest_announced_source_url ? ` · <a href="${escapeHtml(journal.latest_announced_source_url)}" target="_blank" rel="noreferrer">官方发布来源</a>` : ""}
        <small>下方为最近完整可读卷期</small>
      </div>` : "";

    summary.innerHTML = `
      ${announcementNotice}
      <div class="issue-identity">
        <p class="section-kicker">${escapeHtml(issue.journal_id.toUpperCase())}</p>
        <h2>${escapeHtml(issue.journal_name)}</h2>
        <p>
          ${escapeHtml(issueLabel(issue))}
          ${publicationDate ? ` · ${escapeHtml(publicationDate)}` : ""}
          · ${issueCountLabel}
        </p>
      </div>
      <div class="issue-note-stack">
        <div class="issue-note ${ready ? "complete" : ""}">
          ${ready
            ? "已收录 · 可阅读"
            : sourcePending
              ? "内容已齐，待来源核验"
            : abstracts < total
              ? `等待英文摘要 · ${abstracts}/${total}`
              : translated < total
                ? `中文翻译中 · ${translated}/${total}`
                : contentReady
                  ? "发布状态待确认"
                  : "内容整理中"}
        </div>
        <div class="issue-note">中国相关：${issue.articles.filter((article) => chinaRelevance(article).status === "yes").length} 篇</div>
      </div>`;

    const query = state.query.toLocaleLowerCase();
    const articles = issue.articles.filter((article) =>
      (!state.chinaOnly || chinaRelevance(article).status === "yes") &&
      [
        article.title_en,
        article.title_cn,
        article.authors.join(" "),
        article.abstract_en,
        article.abstract_cn,
      ].join(" ").toLocaleLowerCase().includes(query)
    );

    if (!articles.length) {
      const reason = state.chinaOnly
        ? "本期没有识别到中国相关论文；已收录的其他论文仍可点击“显示全部”查看。"
        : state.query
          ? "当前检索条件没有匹配论文；清空搜索即可查看本期全部内容。"
          : "本期文章暂未载入。";
      list.innerHTML = `<p class="empty-state">${escapeHtml(reason)}</p>`;
      return;
    }

    list.innerHTML = articles.map((article) => {
      const englishAbstract = article.abstract_en
        ? `<section class="abstract-panel abstract-en" aria-label="英文摘要">
            <p class="abstract-label">Abstract</p>
            <p>${escapeHtml(article.abstract_en)}</p>
          </section>`
        : article.abstract_status === "official_not_provided"
          ? `<section class="abstract-panel abstract-en" aria-label="英文摘要缺失说明">
              <p class="abstract-label">Abstract</p>
              <p>The publisher did not provide a standalone Abstract; please refer to the official full text beginning with Introduction.</p>
            </section>`
        : article.article_type === "comment"
          ? `<section class="abstract-panel abstract-en" aria-label="英文摘要">
              <p class="abstract-label">Abstract</p>
              <p>This comment has no standalone abstract.</p>
            </section>`
          : "";
      const chineseAbstract = article.abstract_cn
        ? `<section class="abstract-panel abstract-cn" aria-label="中文摘要">
            <p class="abstract-label">摘要</p>
            <p>${escapeHtml(article.abstract_cn)}</p>
          </section>`
        : article.abstract_status === "official_not_provided"
          ? `<section class="abstract-panel abstract-cn" aria-label="中文摘要缺失说明">
              <p class="abstract-label">摘要</p>
              <p>官方未提供独立 Abstract；请参阅从 Introduction 开始的官方全文。</p>
            </section>`
        : article.article_type === "comment"
          ? `<section class="abstract-panel abstract-cn" aria-label="中文摘要">
              <p class="abstract-label">摘要</p>
              <p>该评论未提供独立摘要。</p>
            </section>`
          : "";
      const abstractGrid = englishAbstract || chineseAbstract
        ? `<div class="abstract-grid">${englishAbstract}${chineseAbstract}</div>`
        : "";
      return `
      <article class="paper-entry">
        <header class="paper-header">
          <div class="paper-number">${String(article.sequence).padStart(2, "0")}</div>
          <div class="paper-content">
            <h3>${escapeHtml(article.title_cn || article.title_en)}</h3>
            ${article.title_cn ? `<p class="paper-title-en">${escapeHtml(article.title_en)}</p>` : ""}
            <p class="paper-authors">${escapeHtml(article.authors.join(", "))}</p>
          </div>
        </header>
        ${abstractGrid}
        <footer class="paper-meta">
          ${article.doi ? `<span>DOI ${escapeHtml(article.doi)}</span>` : ""}
          <a href="${escapeHtml(article.source_url)}" target="_blank" rel="noreferrer">
            查看期刊原文
          </a>
        </footer>
      </article>`;
    }).join("");
  };

  const renderIssueHistory = () => {
    const select = document.querySelector("#issue-history-select");
    if (!select || !state.activeJournal) return;
    const index = state.issueIndex;
    const entries = [...(index?.issues || [])].sort((left, right) => issueSortKey(right) - issueSortKey(left));
    const displayId = state.activeJournal.latest_display_issue_id
      || state.activeJournal.latest_detected_issue_id
      || state.activeJournal.latest_issue_id;
    const readyId = state.activeJournal.latest_ready_issue_id
      || state.activeJournal.latest_issue_id;
    const options = [
      {
        issue_id: displayId,
        issue_label: state.activeJournal.latest_display_issue_label
          || state.activeJournal.latest_detected_issue_label
          || state.activeJournal.latest_issue_label
          || "最新卷期",
        publication_date: state.activeJournal.latest_display_publication_date
          || state.activeJournal.latest_detected_publication_date
          || state.activeJournal.publication_date
          || "",
        url: displayIssueUrl(state.activeJournal),
        latest: true,
        ready: displayId === readyId,
        publication_state: state.activeJournal.latest_display_publication_state
          || state.activeJournal.latest_detected_publication_state
          || state.activeJournal.publication_state
          || (displayId === readyId ? "ready" : "unknown"),
      },
      ...(readyId && readyId !== displayId && state.activeJournal.latest_issue_url ? [{
        issue_id: readyId,
        issue_label: state.activeJournal.latest_issue_label || "最近可发布卷期",
        publication_date: state.activeJournal.publication_date || "",
        url: state.activeJournal.latest_issue_url,
        latest: false,
        ready: true,
        publication_state: state.activeJournal.latest_publication_state
          || state.activeJournal.publication_state
          || "ready",
      }] : []),
      ...entries
        .filter((entry) =>
          entry.issue_id !== displayId
          && entry.issue_id !== readyId
          && entry.publication_state === "ready"
        )
        .map((entry) => ({ ...entry, latest: false, ready: true })),
    ];
    select.innerHTML = options.map((entry) => `
      <option
        value="${escapeHtml(entry.url)}"
        ${entry.issue_id === state.issue?.issue_id ? "selected" : ""}
      >
        ${entry.latest ? "最新 · " : ""}${escapeHtml(entry.issue_label)}
        ${entry.publication_date ? ` · ${escapeHtml(formatDate(entry.publication_date))}` : ""}
      </option>
    `).join("");
    select.disabled = options.length === 0;
    select.title = options.length === 1 ? "目前仅收录这一期" : "选择卷期";
  };

  const resetArticleFilters = () => {
    state.query = "";
    state.chinaOnly = false;
    const searchInput = document.querySelector("#paper-search");
    if (searchInput) searchInput.value = "";
    const chinaToggle = document.querySelector("#china-filter");
    if (chinaToggle) {
      chinaToggle.classList.remove("active");
      chinaToggle.textContent = "仅看中国相关";
    }
  };

  const loadIssueUrl = async (url) => {
    resetArticleFilters();
    state.issue = null;
    document.querySelector("#issue-summary").innerHTML =
      '<p class="loading-copy">正在载入卷期……</p>';
    document.querySelector("#article-list").innerHTML = "";
    state.issue = await fetchIssueUrl(url);
    renderIssueHistory();
    renderIssue();
  };

  const loadIssue = async (journal) => {
    resetArticleFilters();
    state.activeJournal = journal;
    state.issue = null;
    state.issueIndex = null;
    renderTabs();
    document.querySelector("#issue-summary").innerHTML =
      `<p class="loading-copy">正在载入 ${escapeHtml(journal.short_name)} 最新卷期……</p>`;
    document.querySelector("#article-list").innerHTML = "";
    const indexRequest = fetchIssueIndex(journal).catch(() => null);
    state.issue = await fetchIssue(journal);
    renderIssueHistory();
    renderIssue();
    state.issueIndex = await indexRequest;
    renderIssueHistory();
  };

  document.querySelector("#issue-history-select")?.addEventListener("change", (event) => {
    loadIssueUrl(event.target.value).catch((error) => {
      document.querySelector("#issue-summary").innerHTML =
        `<p class="error-message">卷期载入失败：${escapeHtml(error.message)}</p>`;
    });
  });

  document.querySelector("#paper-search")?.addEventListener("input", (event) => {
    state.query = event.target.value.trim();
    renderIssue();
  });

  const chinaToggle = document.querySelector("#china-filter");
  chinaToggle?.addEventListener("click", () => {
    state.chinaOnly = !state.chinaOnly;
    chinaToggle.classList.toggle("active", state.chinaOnly);
    chinaToggle.textContent = state.chinaOnly ? "显示全部" : "仅看中国相关";
    renderIssue();
  });

  const fieldFilter = document.querySelector("#field-filter");
  fieldFilter?.addEventListener("change", async (event) => {
    state.field = event.target.value;
    const journals = visibleJournals().filter((journal) => displayIssueUrl(journal));
    if (!journals.length) {
      state.activeJournal = null;
      renderTabs();
      document.querySelector("#issue-summary").innerHTML =
        '<p class="empty-state">该领域的最新卷期正在接入。</p>';
      document.querySelector("#article-list").innerHTML = "";
      return;
    }
    if (!journals.some((journal) => journal.journal_id === state.activeJournal?.journal_id)) {
      await loadIssue(journals[0]);
    } else {
      renderTabs();
    }
  });

  const scheduleBackgroundPrefetch = (journals) => {
    const warm = () => {
      const candidates = collectionId === "top5"
        ? journals.slice(1)
        : journals
            .filter((journal) => journal.field === initialJournal?.field)
            .slice(1, 6);
      candidates.forEach((journal) => fetchIssue(journal).catch(() => null));
    };
    if ("requestIdleCallback" in window) {
      window.requestIdleCallback(warm, { timeout: 1500 });
    } else {
      window.setTimeout(warm, 600);
    }
  };

  Promise.resolve()
    .then(async () => {
      const journals = enabledJournals();
      renderTabs();
      if (!journals.length) throw new Error("尚无可用期刊数据");
      await loadIssue(journals[0]);
      scheduleBackgroundPrefetch(journals);
    })
    .catch((error) => {
      document.querySelector("#issue-summary").innerHTML =
        `<p class="error-message">目录载入失败：${escapeHtml(error.message)}</p>`;
    });
})();</script> </main>  <footer class="site-footer"> <div class="footer-brand"> <strong>Academic Door · 期刊</strong> <span>顶刊之门与领域之门，共享同一套可追溯期刊数据。</span> </div> <nav class="footer-links" aria-label="期刊辅助链接"> <a href="/journals/preview/public-ux-reset-v1/status/">数据状态</a> <a href="/journals/preview/public-ux-reset-v1/composer/">发布预览</a> <a href="https://academic-door.github.io/">Academic Door 门厅</a> </nav> <p class="translation-provenance">中文标题与摘要由 Academic Door 辅助翻译；引用与版权信息请以期刊原文为准。</p> </footer> </body></html>
