name: G06 Land Economics authority writer

on:
  push:
    branches:
      - g06-landecon-authority-writer

permissions:
  contents: write
  models: read

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Restore current data truth
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api data/translation-cache
          git archive origin/data public/api public/project-manifest.json data/translation-cache | tar -x

      - name: Snapshot Land Economics baseline
        shell: bash
        run: |
          python scripts/publish_data_delta.py snapshot             --root .             --output "$RUNNER_TEMP/landecon-baseline"             --path public/api/v1/journals/landecon             --path data/translation-cache

      - name: Recollect and lift verified same-roster authority
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_journals.py --journal LANDECON --translate
          python scripts/repair_history_dates.py
          python scripts/rebuild_public_snapshot.py --check
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_privacy.py
          python -m unittest discover -s tests

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("public/api/v1/journals/landecon/issues/current.json")
          issue = json.loads(p.read_text(encoding="utf-8"))
          q = issue["quality"]

          assert issue["issue_id"] == "landecon-102-3", issue["issue_id"]
          assert issue.get("source_status") == "official_verified", issue.get("source_status")
          assert issue.get("publication_state") == "ready", issue.get("publication_state")
          assert issue.get("content_status") == "complete", issue.get("content_status")
          assert q.get("roster_authority") == "official-issue-page", q.get("roster_authority")
          assert q.get("roster_transport") == "official-page-read", q.get("roster_transport")
          assert q.get("translation_complete") == issue["research_article_count"]

          target = next(
              a for a in issue["articles"]
              if str(a.get("doi", "")).lower() == "10.3368/le.102.3.013026-0018"
          )
          zh = target.get("abstract_cn", "")
          assert "345万美元" in zh, zh
          assert "3.45万美元" not in zh, zh

          print(json.dumps({
              "issue_id": issue["issue_id"],
              "source_status": issue["source_status"],
              "publication_state": issue["publication_state"],
              "authority": q["roster_authority"],
              "transport": q["roster_transport"],
              "translations": q["translation_complete"],
              "welfare_translation_preserved": True,
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publish guarded Land Economics delta to data
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/landecon-baseline"
          generated="$RUNNER_TEMP/landecon-generated"
          data_tree="$RUNNER_TEMP/landecon-data-tree"

          python scripts/publish_data_delta.py snapshot             --root .             --output "$generated"             --path public/api/v1/journals/landecon             --path data/translation-cache

          for attempt in 1 2 3 4 5; do
            git fetch origin data
            git worktree remove --force "$data_tree" 2>/dev/null || true
            rm -rf "$data_tree"
            git worktree add "$data_tree" origin/data
            git -C "$data_tree" switch -C data

            if ! python scripts/publish_data_delta.py apply               --baseline "$baseline"               --generated "$generated"               --target "$data_tree"               --path public/api/v1/journals/landecon               --path data/translation-cache; then
              sleep $((attempt * 10))
              continue
            fi

            rm -rf "$GITHUB_WORKSPACE/public/api"
            mkdir -p "$GITHUB_WORKSPACE/public"
            cp -R "$data_tree/public/api" "$GITHUB_WORKSPACE/public/api"

            python scripts/rebuild_public_snapshot.py
            python scripts/publish_data_delta.py rebuild-archive-indexes               --root "$GITHUB_WORKSPACE"
            python scripts/audit_source_alignment.py --strict
            python scripts/rebuild_public_snapshot.py --check
            python scripts/audit_public_data.py --strict-provenance
            python scripts/audit_privacy.py

            rm -rf "$data_tree/public/api"
            cp -R "$GITHUB_WORKSPACE/public/api" "$data_tree/public/api"
            cp "$GITHUB_WORKSPACE/public/project-manifest.json"               "$data_tree/public/project-manifest.json"

            git -C "$data_tree" config user.name "academic-door-bot"
            git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
            git -C "$data_tree" add -A public/api data/translation-cache
            git -C "$data_tree" add public/project-manifest.json

            if git -C "$data_tree" diff --cached --quiet; then
              echo "Land Economics authority repair is already published."
              git -C "$data_tree" rev-parse HEAD
              exit 0
            fi

            git -C "$data_tree" commit -m "Restore verified Land Economics authority"
            if git -C "$data_tree" push origin HEAD:data; then
              git -C "$data_tree" rev-parse HEAD
              exit 0
            fi
            sleep $((attempt * 10))
          done

          echo "Failed to publish guarded Land Economics delta after five attempts."
          exit 1
