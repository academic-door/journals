name: Backfill field journal history

on:
  # Auto-continue until every volume is complete or blocked: each run resumes
  # the shared state file and skips already-complete issues, so the loop is
  # self-terminating (no data changes once everything is done).
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      journal:
        description: Field journal code or ALL
        required: true
        default: ALL
        type: choice
        options: [ALL, JDE, JPubE, JEEM, JUE, EER, GEB, JET, JEBO, JIE, JFE, WD, JME, JOE, FOODPOLICY, LUP, IER, EJ, JEEA, QE, AEJMICRO, AERI, AER, JPE, QJE, RES, ECTA, AJAE, JEP, TE, RAND, JEH, JF, RFS, RESTAT, AEJAPP, AEJPOL, AEJMACRO, JLE, JAERE, LANDECON, ERE, JHE, JCE, CER, ENERGY, ECOLECON, LABECO, RED, JEDC]
      from_year:
        description: From publication year
        required: true
        default: "2025"
        type: choice
        options: ["2025", "2026"]
      to_year:
        description: To publication year
        required: true
        default: "2026"
        type: choice
        options: ["2025", "2026"]
      max_issues:
        description: Maximum issues in this resumable batch
        required: true
        default: "12"
        type: string
      max_translations:
        description: Maximum new translations per run
        required: true
        default: "120"
        type: string
      translation_model:
        description: >-
          DeepSeek model ID for translations (default deepseek-chat; use
          deepseek-reasoner for a targeted high-fidelity retry pass)
        required: false
        default: deepseek-chat
        type: string

permissions:
  contents: write
  models: read

concurrency:
  # Run different journals in parallel (same journal serializes). The publish
  # step below MERGES journal-scoped files into the shared data branch instead
  # of replacing the whole public/ tree, so parallel publishers no longer
  # clobber each other's archives.
  group: field-history-backfill-${{ github.event.inputs.journal || 'ALL' }}
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Restore public data and resumable backfill state
        shell: bash
        run: |
          set -euo pipefail
          main_cache="$RUNNER_TEMP/main-translation-cache"
          mkdir -p "$main_cache"
          cp -R data/translation-cache/. "$main_cache/"
          if git ls-remote --exit-code origin refs/heads/data >/dev/null 2>&1; then
            git fetch origin data
            rm -rf public/api
            git archive origin/data public/api public/project-manifest.json | tar -x
            if git cat-file -e origin/data:public/backfill-status.md 2>/dev/null; then
              git show origin/data:public/backfill-status.md > public/backfill-status.md
            fi
            for path in data/translation-cache data/backfill-state data/backfill-staging; do
              if git cat-file -e "origin/data:$path" 2>/dev/null; then
                git archive origin/data "$path" | tar -x
              fi
            done
          fi
          MAIN_CACHE="$main_cache" python - <<'PY'
          import json
          import os
          from pathlib import Path
          target_dir = Path("data/translation-cache")
          target_dir.mkdir(parents=True, exist_ok=True)
          for override_path in Path(os.environ["MAIN_CACHE"]).glob("*.json"):
              target_path = target_dir / override_path.name
              base = json.loads(target_path.read_text(encoding="utf-8")) if target_path.exists() else {}
              base.update(json.loads(override_path.read_text(encoding="utf-8")))
              target_path.write_text(json.dumps(base, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Check pending work
        id: check
        shell: bash
        run: |
          set -euo pipefail
          state="data/backfill-state/field-2025-2026.json"
          journal_key="${{ inputs.journal || 'ALL' }}"
          has_pending=false
          if [ -f "$state" ]; then
            pending=$(python - "$state" "$journal_key" <<'PY'
          import json, sys
          state = json.load(open(sys.argv[1], encoding="utf-8"))
          journal = sys.argv[2]
          entries = state.get("issues", {}).values()
          journal_entries = [
              entry for entry in entries
              if journal == "ALL" or entry.get("journal", "") == journal
          ]
          if not journal_entries:
              # A journal with no checkpoints at all has never been discovered
              # or collected; it must run so discovery can populate the plan.
              print(1)
              raise SystemExit(0)
          actionable = 0
          for entry in journal_entries:
              status = entry.get("status", "")
              if status == "complete":
                  continue
              if status == "blocked" and "possible_incomplete_volume" in entry.get("last_error", ""):
                  continue
              actionable += 1
          print(actionable)
          PY
          )
            [ "$pending" -gt 0 ] && has_pending=true
          else
            has_pending=true
          fi
          echo "has_pending=$has_pending" >> "$GITHUB_OUTPUT"
          echo "Pending actionable volumes: $pending"

      - name: Collect, translate, validate and archive
        if: steps.check.outputs.has_pending == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ inputs.translation_model || 'deepseek-chat' }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          mkdir -p output
          global_flags=""
          if [ "${{ inputs.journal || 'ALL' }}" != "ALL" ]; then
            # Per-journal runs must not regenerate global collections/health
            # indexes from their partial snapshot; the ALL run does that.
            global_flags="--skip-global-indexes"
          fi
          python scripts/backfill_history.py \
            --config config/field-history.yml \
            --state data/backfill-state/field-2025-2026.json \
            --journal "${{ inputs.journal || 'ALL' }}" \
            --from-year "${{ inputs.from_year || '2025' }}" \
            --to-year "${{ inputs.to_year || '2026' }}" \
            --translate \
            --max-issues "${{ inputs.max_issues || '12' }}" \
            --max-translations "${{ inputs.max_translations || '120' }}" \
            --max-minutes 75 \
            $global_flags \
            --report-json output/backfill-report.json
          python scripts/backfill_status.py \
            --state data/backfill-state/field-2025-2026.json \
            --out-json public/api/v1/backfill-status.json \
            --out-md public/backfill-status.md
          python scripts/audit_public_data.py --strict-provenance
          python -m unittest discover -s tests -v
          python scripts/audit_privacy.py

      - name: Notify backfill batch result
        if: always() && hashFiles('output/backfill-report.json') != ''
        # Notification is auxiliary: an intermittent SMTP rejection must not
        # mark a successful backfill as failed.
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
        run: |
          python scripts/backfill_notify.py \
            --state data/backfill-state/field-2025-2026.json \
            --report output/backfill-report.json

      - name: Publish archives, indexes, cache and checkpoints
        # Preserve collected/translated progress even when a validation step
        # fails (e.g. a brand-new journal has no current.json until the update
        # workflow runs). The journal-scoped merge below cannot clobber other
        # journals' archives, and the resumable state file makes the next run
        # skip already-complete issues.
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/generated"
          mkdir -p "$generated/public/api" "$generated/data"
          cp -R public/api/. "$generated/public/api/"
          cp public/project-manifest.json "$generated/public/project-manifest.json"
          [ ! -f public/backfill-status.md ] || cp public/backfill-status.md "$generated/public/backfill-status.md"
          cp -R data/translation-cache "$generated/data/"
          [ ! -d data/backfill-state ] || cp -R data/backfill-state "$generated/data/"
          [ ! -d data/backfill-staging ] || cp -R data/backfill-staging "$generated/data/"

          journal_key="${{ inputs.journal || 'ALL' }}"

          publish_and_push() {
            git fetch origin data
            if [ -d "$RUNNER_TEMP/data-tree" ]; then
              git worktree remove --force "$RUNNER_TEMP/data-tree" 2>/dev/null || true
              rm -rf "$RUNNER_TEMP/data-tree"
            fi
            git worktree add "$RUNNER_TEMP/data-tree" origin/data
            cd "$RUNNER_TEMP/data-tree"
            git switch -C data

            # Merge instead of replace: the shared data branch is written by
            # parallel per-journal publishers, so deleting public/ wholesale
            # would clobber other journals' archives.
            if [ "$journal_key" = "ALL" ]; then
              rm -rf public/api
              mkdir -p public/api
              cp -R "$generated/public/api"/. public/api/
              cp "$generated/public/project-manifest.json" public/project-manifest.json
              [ ! -f "$generated/public/backfill-status.md" ] || cp "$generated/public/backfill-status.md" public/backfill-status.md
              mkdir -p data/translation-cache
              cp -R "$generated/data/translation-cache/." data/translation-cache/ 2>/dev/null || true
            else
              journal_id=$(python -c "import sys; print(sys.argv[1].lower())" "$journal_key")
              mkdir -p "public/api/v1/journals/$journal_id/issues"
              cp -R "$generated/public/api/v1/journals/$journal_id/issues/." "public/api/v1/journals/$journal_id/issues/"
              mkdir -p data/translation-cache
              if [ -f "$generated/data/translation-cache/$journal_id.json" ]; then
                cp "$generated/data/translation-cache/$journal_id.json" "data/translation-cache/$journal_id.json"
              fi
              if [ -d "$generated/data/backfill-staging/$journal_id" ]; then
                mkdir -p data/backfill-staging
                rm -rf "data/backfill-staging/$journal_id"
                cp -R "$generated/data/backfill-staging/$journal_id" "data/backfill-staging/$journal_id"
              fi
            fi

            # Merge the resumable state file by issue key so concurrent
            # journals never drop each other's checkpoints. This run's own
            # journal keys are the freshest source for that journal and
            # overwrite; other journals' keys keep the already-published
            # (fresher) values already on the data branch.
            mkdir -p data/backfill-state
            python - "$generated/data/backfill-state/field-2025-2026.json" "$journal_key" <<'PY'
          import json, os, sys
          new_path, journal_key = sys.argv[1], sys.argv[2]
          target = "data/backfill-state/field-2025-2026.json"
          new = json.load(open(new_path, encoding="utf-8"))
          existing = json.load(open(target, encoding="utf-8")) if os.path.exists(target) else {"schema_version": "1.0", "issues": {}}
          merged = existing.setdefault("issues", {})
          for key, value in new.get("issues", {}).items():
              if journal_key == "ALL" or value.get("journal", "") == journal_key:
                  merged[key] = value
              else:
                  merged.setdefault(key, value)
          json.dump(existing, open(target, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY

            if [ -d "$generated/data/backfill-staging" ]; then
              mkdir -p data/backfill-staging
              cp -R "$generated/data/backfill-staging/." data/backfill-staging/
            fi

            # Regenerate the global backfill status from the merged state.
            python "$GITHUB_WORKSPACE/scripts/backfill_status.py" \
              --state data/backfill-state/field-2025-2026.json \
              --out-json public/api/v1/backfill-status.json \
              --out-md public/backfill-status.md

            git rm -f --ignore-unmatch public/search.js
            git config user.name "academic-door-bot"
            git config user.email "academic-door-bot@users.noreply.github.com"
            git add -A public/api data/translation-cache
            git add public/project-manifest.json public/backfill-status.md
            git add -f data/backfill-state data/backfill-staging 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "No historical data changes."
              exit 0
            fi
            git commit -m "Backfill field journal history"
            cd "$GITHUB_WORKSPACE"
          }

          for attempt in 1 2 3 4 5; do
            publish_and_push
            if git -C "$RUNNER_TEMP/data-tree" push origin HEAD:data; then
              exit 0
            fi
            echo "Data-branch push rejected (attempt $attempt); re-publishing from the latest data branch."
            sleep $((attempt * 15))
          done
          echo "Failed to publish to the data branch after 5 attempts."
          exit 1
