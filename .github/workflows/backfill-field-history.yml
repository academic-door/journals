name: Backfill field journal history

on:
  # Daily rotating batch (06:35 Beijing = 22:35 UTC). Each ALL run picks up to
  # --max-journals journals with actionable pending work, so one large journal
  # cannot starve the queue. The 2023-2024 campaign runs first; manual
  # dispatch can target any year range.
  schedule:
    - cron: "35 22 * * *"
  workflow_dispatch:
    inputs:
      journal:
        description: Field journal code or ALL (rotation picks max_journals)
        required: true
        default: ALL
        type: choice
        options: [ALL, JDE, JPubE, JEEM, JUE, EER, GEB, JET, JEBO, JIE, JFE, WD, JME, JOE, FOODPOLICY, LUP, IER, EJ, JEEA, QE, AEJMICRO, AERI, AER, JPE, QJE, RES, ECTA, AJAE, JEP, TE, RAND, JEH, JF, RFS, RESTAT, AEJAPP, AEJPOL, AEJMACRO, JLE, JAERE, LANDECON, ERE, JHE, JCE, CER, ENERGY, ECOLECON, LABECO, RED, JEDC]
      from_year:
        description: From publication year
        required: true
        default: "2023"
        type: choice
        options: ["2023", "2024", "2025", "2026"]
      to_year:
        description: To publication year
        required: true
        default: "2024"
        type: choice
        options: ["2023", "2024", "2025", "2026"]
      max_issues:
        description: Maximum issues per journal per round
        required: true
        default: "6"
        type: string
      max_translations:
        description: Maximum new translations per journal per round
        required: true
        default: "80"
        type: string
      max_journals:
        description: Maximum journals per ALL round
        required: true
        default: "4"
        type: string
      translation_model:
        description: >-
          DeepSeek model ID for translations (default deepseek-chat; use
          deepseek-reasoner for a targeted high-fidelity retry pass)
        required: false
        default: deepseek-chat
        type: string
      refresh_discovery_only:
        description: Refresh discovery snapshots and re-gate archives only
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  models: read

concurrency:
  # Every workflow that writes the shared data branch uses this group. Long
  # collection runs are serialized until publishing is split into a dedicated
  # single-writer job; correctness takes priority over monitor latency.
  group: journal-data-update
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Restore public data and resumable backfill state
        shell: bash
        run: |
          set -euo pipefail
          main_cache="$RUNNER_TEMP/main-translation-cache"
          mkdir -p "$main_cache"
          cp -R data/translation-cache/. "$main_cache/"
          if git ls-remote --exit-code origin refs/heads/data >/dev/null 2>&1; then
            git fetch origin data
            rm -rf public/api
            git archive origin/data public/api public/project-manifest.json | tar -x
            if git cat-file -e origin/data:public/backfill-status.md 2>/dev/null; then
              git show origin/data:public/backfill-status.md > public/backfill-status.md
            fi
            for path in data/translation-cache data/backfill-state data/backfill-staging; do
              if git cat-file -e "origin/data:$path" 2>/dev/null; then
                git archive origin/data "$path" | tar -x
              fi
            done
          fi
          MAIN_CACHE="$main_cache" python - <<'PY'
          import json
          import os
          from pathlib import Path
          target_dir = Path("data/translation-cache")
          target_dir.mkdir(parents=True, exist_ok=True)
          for override_path in Path(os.environ["MAIN_CACHE"]).glob("*.json"):
              target_path = target_dir / override_path.name
              base = json.loads(target_path.read_text(encoding="utf-8")) if target_path.exists() else {}
              base.update(json.loads(override_path.read_text(encoding="utf-8")))
              target_path.write_text(json.dumps(base, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Snapshot data publication baseline
        shell: bash
        run: |
          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$RUNNER_TEMP/data-baseline" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --exclude 'public/api/v1/journals/*/issues/index.json'

      - name: Check pending work
        id: check
        shell: bash
        run: |
          set -euo pipefail
          state="data/backfill-state/field-${{ inputs.from_year || '2023' }}-${{ inputs.to_year || '2024' }}.json"
          journal_key="${{ inputs.journal || 'ALL' }}"
          if [ "${{ inputs.refresh_discovery_only || false }}" = "true" ]; then
            echo "Discovery-only refresh requested for $journal_key."
            echo "has_pending=true" >> "$GITHUB_OUTPUT"
            echo "state=$state" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pending=$(python scripts/backfill_history.py \
            --config config/field-history.yml \
            --state "$state" \
            --journal "$journal_key" \
            --from-year "${{ inputs.from_year || '2023' }}" \
            --to-year "${{ inputs.to_year || '2024' }}" \
            --max-journals "${{ inputs.max_journals || '4' }}" \
            --print-pending-journals)
          echo "Pending journals: $pending"
          if [ "$pending" != "[]" ]; then
            has_pending=true
          else
            has_pending=false
          fi
          echo "has_pending=$has_pending" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      - name: Collect, translate, validate and archive
        id: collect
        if: steps.check.outputs.has_pending == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ inputs.translation_model || 'deepseek-chat' }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          mkdir -p output
          global_flags=""
          mode_flags="--translate"
          if [ "${{ inputs.refresh_discovery_only || false }}" = "true" ]; then
            mode_flags="--refresh-discovery-only"
          fi
          if [ "${{ inputs.journal || 'ALL' }}" != "ALL" ]; then
            # Per-journal runs must not regenerate global collections/health
            # indexes from their partial snapshot; the ALL run does that.
            global_flags="--skip-global-indexes"
          fi
          python scripts/backfill_history.py \
            --config config/field-history.yml \
            --state "data/backfill-state/field-${{ inputs.from_year || '2023' }}-${{ inputs.to_year || '2024' }}.json" \
            --journal "${{ inputs.journal || 'ALL' }}" \
            --from-year "${{ inputs.from_year || '2023' }}" \
            --to-year "${{ inputs.to_year || '2024' }}" \
            $mode_flags \
            --max-issues "${{ inputs.max_issues || '6' }}" \
            --max-translations "${{ inputs.max_translations || '80' }}" \
            --max-journals "${{ inputs.max_journals || '4' }}" \
            --max-minutes 35 \
            $global_flags \
            --report-json output/backfill-report.json
          python scripts/backfill_status.py \
            --state data/backfill-state/field-2023-2024.json \
            --state data/backfill-state/field-2025-2026.json \
            --out-json public/api/v1/backfill-status.json \
            --out-md public/backfill-status.md
          python scripts/audit_public_data.py --strict-provenance
          python -m unittest discover -s tests -v
          python scripts/audit_privacy.py

      - name: Notify backfill batch result
        if: always() && hashFiles('output/backfill-report.json') != ''
        # Notification is auxiliary: an intermittent SMTP rejection must not
        # mark a successful backfill as failed.
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
        run: |
          python scripts/backfill_notify.py             --state "data/backfill-state/field-${{ inputs.from_year || '2023' }}-${{ inputs.to_year || '2024' }}.json"             --report output/backfill-report.json

      - name: Publish validated archives, indexes, cache and checkpoints
        if: steps.collect.outcome == 'success'
        env:
          STRICT_HISTORY_COVERAGE_ENABLED: ${{ vars.STRICT_HISTORY_COVERAGE_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/data-baseline"
          generated="$RUNNER_TEMP/generated-data"
          data_tree="$RUNNER_TEMP/data-tree"
          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$generated" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --exclude 'public/api/v1/journals/*/issues/index.json'

          for attempt in 1 2 3 4 5; do
            if ! git fetch origin data; then
              sleep $((attempt * 15))
              continue
            fi
            git worktree remove --force "$data_tree" 2>/dev/null || true
            rm -rf "$data_tree"
            git worktree add "$data_tree" origin/data
            git -C "$data_tree" switch -C data
            if ! python scripts/publish_data_delta.py apply \
              --baseline "$baseline" \
              --generated "$generated" \
              --target "$data_tree" \
              --path public/api/v1/journals \
              --path data/translation-cache \
              --path data/backfill-state \
              --path data/backfill-staging \
              --exclude 'public/api/v1/journals/*/issues/index.json'; then
              sleep $((attempt * 15))
              continue
            fi

            rm -rf "$GITHUB_WORKSPACE/public/api"
            mkdir -p "$GITHUB_WORKSPACE/public"
            cp -R "$data_tree/public/api" "$GITHUB_WORKSPACE/public/api"
            python scripts/rebuild_public_snapshot.py
            python scripts/publish_data_delta.py rebuild-archive-indexes \
              --root "$GITHUB_WORKSPACE"
            state_args=()
            for state in \
              data/backfill-state/field-2023-2024.json \
              data/backfill-state/field-2025-2026.json; do
              if [ -f "$data_tree/$state" ]; then
                state_args+=(--state "$data_tree/$state")
              fi
            done
            python scripts/backfill_status.py \
              "${state_args[@]}" \
              --api-root public/api/v1 \
              --out-json public/api/v1/backfill-status.json \
              --out-md public/backfill-status.md
            python scripts/audit_source_alignment.py --strict
            if [ -f scripts/audit_history_coverage.py ]; then
              history_flags=()
              if [ "${STRICT_HISTORY_COVERAGE_ENABLED:-false}" = "true" ]; then
                history_flags+=(--strict)
              fi
              python scripts/audit_history_coverage.py \
                "${state_args[@]}" \
                --api-root public/api/v1 \
                --report-json "$RUNNER_TEMP/history-coverage.json" \
                "${history_flags[@]}"
            fi
            python scripts/rebuild_public_snapshot.py --check
            python scripts/audit_public_data.py --strict-provenance
            python scripts/audit_privacy.py
            mkdir -p "$data_tree/public/api"
            cp -R "$GITHUB_WORKSPACE/public/api/." "$data_tree/public/api/"
            cp "$GITHUB_WORKSPACE/public/project-manifest.json" \
              "$data_tree/public/project-manifest.json"
            cp "$GITHUB_WORKSPACE/public/backfill-status.md" \
              "$data_tree/public/backfill-status.md"

            git -C "$data_tree" rm -f --ignore-unmatch public/search.js
            git -C "$data_tree" config user.name "academic-door-bot"
            git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
            git -C "$data_tree" add -A public/api data/translation-cache
            git -C "$data_tree" add public/project-manifest.json public/backfill-status.md
            git -C "$data_tree" add -f data/backfill-state data/backfill-staging 2>/dev/null || true
            if git -C "$data_tree" diff --cached --quiet; then
              echo "No historical data changes."
              exit 0
            fi
            git -C "$data_tree" commit -m "Backfill field journal history"
            if git -C "$data_tree" push origin HEAD:data; then
              exit 0
            fi
            echo "Data changed during publish; refetching and reapplying the delta."
            sleep $((attempt * 15))
          done
          echo "Failed to publish the validated backfill delta after five attempts."
          exit 1

      - name: Preserve failed-run cache and checkpoints only
        if: >-
          always() && steps.collect.outcome == 'failure' &&
          inputs.refresh_discovery_only != true
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/data-baseline"
          generated="$RUNNER_TEMP/failed-checkpoints"
          data_tree="$RUNNER_TEMP/checkpoint-data-tree"
          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$generated" \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging

          # Public API and manifest paths are intentionally absent here.
          for attempt in 1 2 3 4 5; do
            if ! git fetch origin data; then
              sleep $((attempt * 15))
              continue
            fi
            git worktree remove --force "$data_tree" 2>/dev/null || true
            rm -rf "$data_tree"
            git worktree add "$data_tree" origin/data
            git -C "$data_tree" switch -C data
            if ! python scripts/publish_data_delta.py apply \
              --baseline "$baseline" \
              --generated "$generated" \
              --target "$data_tree" \
              --path data/translation-cache \
              --path data/backfill-state \
              --path data/backfill-staging; then
              sleep $((attempt * 15))
              continue
            fi
            git -C "$data_tree" config user.name "academic-door-bot"
            git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
            git -C "$data_tree" add data/translation-cache
            git -C "$data_tree" add -f data/backfill-state data/backfill-staging 2>/dev/null || true
            if git -C "$data_tree" diff --cached --quiet; then
              echo "No failed-run checkpoints changed."
              exit 0
            fi
            git -C "$data_tree" commit -m "Preserve failed backfill checkpoints"
            if git -C "$data_tree" push origin HEAD:data; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "Failed to preserve backfill checkpoints after five attempts."
          exit 1
