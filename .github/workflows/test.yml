name: Test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/rebuild_public_snapshot.py --check
      - run: python scripts/audit_public_data.py --strict-provenance
      - name: Semantic numeric shadow audit over canonical data (non-gating)
        run: |
          echo "::notice::shadow-main-sha=${{ github.sha }}"
          git fetch --depth=1 origin data || true
          data_sha="$(git rev-parse -q --verify origin/data || echo 'unknown')"
          echo "::notice::shadow-data-sha=${data_sha}"
          # Overlay the latest canonical data-branch public snapshot; never mutates data.
          rm -rf public/api
          git archive origin/data public/api public/project-manifest.json | tar -x
          if git cat-file -e origin/data:public/backfill-status.md 2>/dev/null; then
            git show origin/data:public/backfill-status.md > public/backfill-status.md
          fi
          if git cat-file -e origin/data:data/translation-cache 2>/dev/null; then
            git archive origin/data data/translation-cache | tar -x
          fi
          SHADOW_MAIN_SHA="${{ github.sha }}" SHADOW_DATA_SHA="${data_sha}" \
            python scripts/audit_numeric_semantics_shadow.py
      - run: python scripts/audit_source_alignment.py --strict
      - run: python scripts/audit_privacy.py

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
