name: Test

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/265-ecta-association-announcement

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Apply bounded ECTA association GREEN wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          def replace_function(text: str, name: str, next_name: str, replacement: str) -> str:
              start = text.index(f"def {name}(")
              end = text.index(f"def {next_name}(", start)
              return text[:start] + replacement.rstrip() + "\n\n\n" + text[end:]

          monitor_path = Path("scripts/journal_monitor.py")
          monitor = monitor_path.read_text(encoding="utf-8")

          import_line = "from collectors.wiley import parse_latest_issue_signal\n"
          assoc_import = "from collectors.econometric_society import parse_latest_econometrica_issue_signal\n"
          if assoc_import not in monitor:
              if import_line not in monitor:
                  raise SystemExit("monitor import marker missing")
              monitor = monitor.replace(import_line, assoc_import + import_line, 1)

          fetch_fn = dedent('''\
          def fetch_official_issue_signal(
              config: dict[str, Any],
              *,
              session: requests.Session | None = None,
          ) -> dict[str, Any] | None:
              """Fetch configured first-party issue-existence evidence, fail closed."""

              source_type = str(config.get("announcement_source", "")).strip()
              if source_type not in {"wiley_recent_issues", "econometric_society_volume"}:
                  return None
              source_url = str(config.get("announcement_url", "")).strip()
              if not source_url:
                  return None
              client = session or requests.Session()
              client.headers.update({"User-Agent": USER_AGENT, "Accept": "text/html"})
              response = _request_with_retry(client, source_url, attempts=2, timeout=30)
              if source_type == "wiley_recent_issues":
                  return parse_latest_issue_signal(response.content, source_url)
              return parse_latest_econometrica_issue_signal(response.content, source_url)
          ''')
          monitor = replace_function(
              monitor,
              "fetch_official_issue_signal",
              "_issue_signal_matches_candidate",
              fetch_fn,
          )

          match_fn = dedent('''\
          def _issue_signal_matches_candidate(
              candidate: Candidate | None,
              signal: dict[str, Any] | None,
          ) -> bool:
              if not candidate or not signal:
                  return False
              source_kind = str(signal.get("source_kind", "")).strip()
              source_url = str(signal.get("source_url", "")).strip()
              if source_kind == "official_archive":
                  trusted_source = source_url.startswith("https://onlinelibrary.wiley.com/")
              elif source_kind == "association_announcement":
                  trusted_source = source_url.startswith(
                      "https://www.econometricsociety.org/publications/econometrica"
                  )
              else:
                  trusted_source = False
              return (
                  candidate.volume.strip() == str(signal.get("volume", "")).strip()
                  and candidate.issue.strip() == str(signal.get("issue", "")).strip()
                  and trusted_source
              )
          ''')
          monitor = replace_function(
              monitor,
              "_issue_signal_matches_candidate",
              "_official_issue_signal_announcement",
              match_fn,
          )

          candidate_marker = "def _candidate_payload(candidate: Candidate) -> dict[str, Any]:\n"
          if "def _association_issue_signal_announcement(" not in monitor:
              if candidate_marker not in monitor:
                  raise SystemExit("candidate payload marker missing")
              assoc_builder = dedent('''\
              def _association_issue_signal_announcement(
                  journal_id: str,
                  candidate: Candidate | None,
                  signal: dict[str, Any] | None,
                  observed_at: str,
              ) -> dict[str, Any] | None:
                  if not _issue_signal_matches_candidate(candidate, signal):
                      return None
                  if not signal or str(signal.get("source_kind", "")) != "association_announcement":
                      return None
                  assert candidate is not None
                  volume = candidate.volume.strip()
                  issue = candidate.issue.strip()
                  publication_date = str(signal.get("publication_date", "")).strip()
                  if not volume or not issue or not publication_date:
                      return None
                  token = lambda value: re.sub(r"[^a-z0-9]+", "-", value.casefold()).strip("-")
                  volume_token = token(volume)
                  issue_token = token(issue)
                  if not volume_token or not issue_token:
                      return None
                  return {
                      "schema_version": "1.0",
                      "journal_id": journal_id,
                      "issue_id": f"{journal_id}-{volume_token}-{issue_token}",
                      "volume": volume,
                      "issue": issue,
                      "issue_label": f"Vol. {volume} · No. {issue}",
                      "publication_date": publication_date,
                      "publication_state": "announced",
                      "source_authority": "first_party",
                      "source_kind": "association_announcement",
                      "source_url": str(signal["source_url"]),
                      "observed_at": observed_at,
                  }


              ''')
              monitor = monitor.replace(candidate_marker, assoc_builder + candidate_marker, 1)

          eval_fn = dedent('''\
          def evaluate_observation(
              candidate: Candidate | None,
              baseline: dict[str, Any],
              previous_entry: dict[str, Any],
              *,
              rss_dois: set[str] | None = None,
              official_issue_match: bool = False,
              association_issue_match: bool = False,
          ) -> tuple[str, dict[str, Any]]:
              if candidate is None:
                  return "unchanged", {
                      "candidate": None,
                      "candidate_seen_count": 0,
                      "evidence": ["crossref"],
                  }
              previous_candidate = previous_entry.get("candidate") or {}
              seen_count = (
                  int(previous_entry.get("candidate_seen_count", 0)) + 1
                  if previous_candidate.get("fingerprint") == candidate.fingerprint
                  else 1
              )
              evidence = ["crossref"]
              if rss_dois and set(candidate.unseen_dois) & rss_dois:
                  evidence.append("official_rss")
              if official_issue_match:
                  evidence.append("official_archive")
              if association_issue_match:
                  evidence.append("association_announcement")

              same_issue = candidate.issue_key == (
                  f"{baseline.get('volume', '')}:{baseline.get('issue', '')}"
              )
              baseline_volume = _numeric(str(baseline.get("volume", "")))
              candidate_volume = _numeric(candidate.volume)
              clearly_new_issue = bool(
                  candidate_volume is not None
                  and baseline_volume is not None
                  and candidate_volume > baseline_volume
              )
              confirmed = (
                  "official_rss" in evidence
                  or "official_archive" in evidence
                  or "association_announcement" in evidence
                  or same_issue
                  or clearly_new_issue
                  or seen_count >= 2
              )
              return ("confirmed" if confirmed else "candidate"), {
                  "candidate": _candidate_payload(candidate),
                  "candidate_seen_count": seen_count,
                  "evidence": evidence,
              }
          ''')
          monitor = replace_function(
              monitor,
              "evaluate_observation",
              "_current_issue_path",
              eval_fn,
          )

          signal_start_marker = "                issue_signal: dict[str, Any] | None = None\n"
          signal_end_marker = "                status, observation = evaluate_observation(\n"
          signal_start = monitor.index(signal_start_marker)
          signal_end = monitor.index(signal_end_marker, signal_start)
          signal_block = indent(
              dedent('''\
              issue_signal: dict[str, Any] | None = None
              official_issue_match = False
              association_issue_match = False
              if candidate and config.get("announcement_source"):
                  try:
                      issue_signal = issue_signal_fetcher(config)
                      issue_signal_matches = _issue_signal_matches_candidate(candidate, issue_signal)
                      signal_kind = str((issue_signal or {}).get("source_kind", ""))
                      official_issue_match = (
                          issue_signal_matches and signal_kind == "official_archive"
                      )
                      association_issue_match = (
                          issue_signal_matches and signal_kind == "association_announcement"
                      )
                  except Exception:
                      # First-party signals are additive only; source blocking
                      # must not break metadata detection or manufacture authority.
                      issue_signal = None
                      official_issue_match = False
                      association_issue_match = False
              '''),
              "                ",
          )
          monitor = monitor[:signal_start] + signal_block + monitor[signal_end:]

          call_marker = "                    official_issue_match=official_issue_match,\n"
          if "association_issue_match=association_issue_match" not in monitor:
              call_at = monitor.index(call_marker, signal_start)
              monitor = (
                  monitor[: call_at + len(call_marker)]
                  + "                    association_issue_match=association_issue_match,\n"
                  + monitor[call_at + len(call_marker) :]
              )

          archive_start_marker = '                if "official_archive" in observation.get("evidence", []):\n'
          awaiting_marker = "                if _awaiting_status(previous, same_deep_candidate):\n"
          archive_start = monitor.index(archive_start_marker, signal_start)
          awaiting_at = monitor.index(awaiting_marker, archive_start)
          existing_archive_block = monitor[archive_start:awaiting_at]
          if 'if "association_announcement" in observation.get' not in existing_archive_block:
              assoc_call = indent(
                  dedent('''\
                  if "association_announcement" in observation.get("evidence", []):
                      announcement = _association_issue_signal_announcement(
                          config["id"],
                          candidate,
                          issue_signal,
                          checked_at,
                      )
                      if announcement:
                          entry["announcement"] = announcement
                  '''),
                  "                ",
              )
              monitor = monitor[:awaiting_at] + assoc_call + monitor[awaiting_at:]

          required = [
              "parse_latest_econometrica_issue_signal",
              'source_type not in {"wiley_recent_issues", "econometric_society_volume"}',
              'evidence.append("association_announcement")',
              "association_issue_match: bool = False",
              "association_issue_match=association_issue_match",
              "def _association_issue_signal_announcement(",
          ]
          missing = [token for token in required if token not in monitor]
          if missing:
              raise SystemExit(f"monitor patch incomplete: {missing}")
          monitor_path.write_text(monitor, encoding="utf-8")

          config_path = Path("config/journals.yml")
          config = config_path.read_text(encoding="utf-8")
          start = config.index("  ECTA:\n")
          end = config.index("\n  JDE:\n", start)
          block = config[start:end]
          issue_line = "    current_issue_url: https://onlinelibrary.wiley.com/toc/14680262/current\n"
          additions = (
              issue_line
              + "    announcement_source: econometric_society_volume\n"
              + "    announcement_url: https://www.econometricsociety.org/publications/econometrica/volume/2026\n"
          )
          if "announcement_source: econometric_society_volume" not in block:
              if issue_line not in block:
                  raise SystemExit("ECTA config marker missing")
              block = block.replace(issue_line, additions, 1)
              config = config[:start] + block + config[end:]
              config_path.write_text(config, encoding="utf-8")
          PY

          python -m py_compile scripts/journal_monitor.py collectors/econometric_society.py
          python -m unittest tests.test_econometric_society_signal tests.test_association_announcements tests.test_monitor_announcements -v

          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add scripts/journal_monitor.py config/journals.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "ECTA GREEN wiring already present; no branch mutation needed."
          else
            git commit -m "feat(freshness): wire Econometric Society announcement signal"
            git push origin HEAD:feat/265-ecta-association-announcement
          fi
