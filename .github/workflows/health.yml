name: Public health check

on:
  workflow_dispatch:
  schedule:
    - cron: "45 1 * * *"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check public endpoints and semantics
        id: health
        shell: bash
        run: |
          set -euo pipefail
          base="https://academic-door.github.io/journals"
          output="$RUNNER_TEMP/public-health"
          mkdir -p "$output"
          for route in / /top5/ /fields/ /search/ /composer/ /status/; do
            curl --fail --retry 3 --silent --show-error \
              "$base$route?health_run=${{ github.run_id }}" >/dev/null
          done
          curl --fail --retry 3 --silent --show-error \
            "$base/api/v1/health.json?health_run=${{ github.run_id }}" \
            > "$output/health.json"
          curl --fail --retry 3 --silent --show-error \
            "$base/api/v1/monitoring.json?health_run=${{ github.run_id }}" \
            > "$output/monitoring.json"
          curl --fail --retry 3 --silent --show-error \
            "$base/api/v1/source-audit.json?health_run=${{ github.run_id }}" \
            > "$output/source-audit.json"
          curl --fail --retry 3 --silent --show-error \
            "$base/api/v1/completeness/2026.json?health_run=${{ github.run_id }}" \
            > "$output/completeness-2026.json"
          curl --fail --retry 3 --silent --show-error \
            "$base/project-manifest.json?health_run=${{ github.run_id }}" \
            > "$output/project-manifest.json"
          curl --fail --retry 3 --silent --show-error \
            "$base/feeds/all.xml?health_run=${{ github.run_id }}" \
            > "$output/all.xml"

          python - "$output" <<'PY'
          import json
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path(sys.argv[1])
          now = datetime.now(timezone.utc)

          def load(name):
              return json.loads((root / name).read_text(encoding="utf-8"))

          def timestamp_field(payload, name, field, max_age_hours):
              raw = str(payload.get(field, "")).replace("Z", "+00:00")
              stamp = datetime.fromisoformat(raw)
              if stamp.tzinfo is None:
                  raise AssertionError(f"{name}.{field} has no timezone")
              age = (now - stamp.astimezone(timezone.utc)).total_seconds() / 3600
              if age < -0.25 or age > max_age_hours:
                  raise AssertionError(f"{name} is stale ({age:.1f} hours)")
              return stamp

          def timestamp(payload, name, max_age_hours):
              return timestamp_field(payload, name, "updated_at", max_age_hours)

          health = load("health.json")
          monitoring = load("monitoring.json")
          source = load("source-audit.json")
          completeness = load("completeness-2026.json")
          manifest = load("project-manifest.json")
          for name, payload in (
              ("health", health),
              ("monitoring", monitoring),
              ("source-audit", source),
          ):
              if payload.get("schema_version") != "1.0":
                  raise AssertionError(f"{name} schema_version is not 1.0")

          summary = health.get("summary", {})
          if summary.get("enabled_journals") != 49:
              raise AssertionError("health enabled_journals is not 49")
          if summary.get("available_journals") != 49:
              raise AssertionError("health available_journals is not 49")
          if health.get("content_status") != "complete":
              raise AssertionError("public translations are incomplete")
          if not summary.get("articles") or (
              summary.get("translated_articles") != summary.get("articles")
          ):
              raise AssertionError("article and translation totals do not reconcile")
          failed_checks = [
              key for key, value in health.get("checks", {}).items() if value is False
          ]
          hard_failures = [
              key for key in failed_checks if not key.endswith("_primary_transport")
          ]
          if hard_failures:
              raise AssertionError("structural health checks failed: " + ", ".join(hard_failures))
          if health.get("status") not in {"healthy", "degraded"}:
              raise AssertionError("health status is invalid")
          health_stamp = timestamp(health, "health", 6)

          monitor_summary = monitoring.get("summary", {})
          if monitoring.get("status") != "healthy":
              raise AssertionError("journal monitor is not healthy")
          if monitor_summary.get("configured_journals") != 49:
              raise AssertionError("monitor configured_journals is not 49")
          if monitor_summary.get("failed") != 0:
              raise AssertionError("journal monitor has failed journals")
          timestamp(monitoring, "monitoring", 6)

          source_summary = source.get("summary", {})
          if source.get("status") != "healthy":
              raise AssertionError("source audit is not healthy")
          if source_summary.get("configured_journals") != 49:
              raise AssertionError("source audit configured_journals is not 49")
          for key in ("needs_attention", "missing", "invariant_errors"):
              if source_summary.get(key) != 0:
                  raise AssertionError(f"source audit {key} is not zero")
          timestamp(source, "source-audit", 6)

          if completeness.get("schema_version") != "1.3":
              raise AssertionError("completeness schema_version is not 1.3")
          if completeness.get("scope") != "journals_tracked":
              raise AssertionError("completeness scope is invalid")
          reconciliation = completeness.get("reconciliation", {})
          if reconciliation.get("journal_count") != 49:
              raise AssertionError("completeness journal_count is not 49")
          status_total = sum(
              int(reconciliation.get(key, 0))
              for key in ("complete", "partial", "not_measured", "source_blocked")
          )
          if status_total != 49:
              raise AssertionError("completeness status counts do not reconcile")
          if len(completeness.get("journals", [])) != 49:
              raise AssertionError("completeness journal records do not reconcile")
          timestamp_field(completeness, "completeness", "generated_at", 6)

          if manifest.get("project_id") != "journals":
              raise AssertionError("project manifest id is invalid")
          if manifest.get("journal_count") != 49 or manifest.get("available_journal_count") != 49:
              raise AssertionError("project manifest journal counts do not reconcile")
          if manifest.get("status") != health.get("status"):
              raise AssertionError("manifest and health status disagree")
          manifest_stamp = timestamp(manifest, "project-manifest", 6)
          if abs((manifest_stamp - health_stamp).total_seconds()) > 300:
              raise AssertionError("manifest and health timestamps differ by more than five minutes")

          feed = (root / "all.xml").read_text(encoding="utf-8")
          if "<rss" not in feed or "<item" not in feed:
              raise AssertionError("all-journals RSS feed is empty or malformed")
          print(
              "public semantic health: 49/49 journals, complete translations, "
              "fresh monitor, completeness endpoint present"
          )
          PY

      - name: Create a visible issue when health check fails
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "[Health] Academic Door Journals public check failed";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "health"
            });
            if (!existing.data.some((issue) => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ["health"],
                body: `The scheduled public endpoint check failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }

      - name: Close recovered health issue
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "[Health] Academic Door Journals public check failed";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "health"
            });
            for (const issue of existing.data.filter((item) => item.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered in run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
            }
