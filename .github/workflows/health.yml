name: Public health check

on:
  workflow_dispatch:
  schedule:
    - cron: "45 1 * * *"
  workflow_run:
    workflows:
      - Deploy GitHub Pages
    types:
      - completed

permissions:
  contents: read
  issues: write

jobs:
  check:
    # Independent public health only after a *successful* Pages deployment.
    # A failed or cancelled deploy must not produce a healthy acceptance, so we
    # only run the real check when this is a non-workflow_run event (manual or
    # scheduled) or the triggering deploy concluded successfully.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check public endpoints and semantics
        id: health
        shell: bash
        run: |
          set -euo pipefail
          base="https://academic-door.github.io/journals"
          output="$RUNNER_TEMP/public-health"
          mkdir -p "$output"
          for route in / /top5/ /fields/ /search/ /composer/ /status/; do
            curl --fail --retry 3 --silent --show-error \
              "$base$route?health_run=${{ github.run_id }}" >/dev/null
          done
          curl --fail --retry 3 --silent --show-error \
            "$base/api/v1/health.json?health_run=${{ github.run_id }}" \
            > "$output/health.json"
          # A new title is not accepted merely because aggregate JSON says 50.
          if [ "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["summary"]["enabled_journals"])' "$output/health.json")" -ge 50 ]; then
            curl --fail --retry 3 --silent --show-error \
              "$base/api/v1/journals/jegrowth/issues/current.json?health_run=${{ github.run_id }}" \
              > "$output/jegrowth-current.json"
          fi
          if [ "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["summary"]["enabled_journals"])' "$output/health.json")" -ge 51 ]; then
            curl --fail --retry 3 --silent --show-error \
              "$base/api/v1/journals/jae/issues/current.json?health_run=${{ github.run_id }}" \
              > "$output/jae-current.json"
          fi
          if [ "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["summary"]["enabled_journals"])' "$output/health.json")" -ge 52 ]; then
            curl --fail --retry 3 --silent --show-error \
              "$base/api/v1/journals/itpf/issues/current.json?health_run=${{ github.run_id }}" \
              > "$output/itpf-current.json"
          fi
          if [ "$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["summary"]["enabled_journals"])' "$output/health.json")" = "53" ]; then
            curl --fail --retry 3 --silent --show-error \
              "$base/api/v1/journals/joeg/issues/current.json?health_run=${{ github.run_id }}" \
              > "$output/joeg-current.json"
          fi
          curl --fail --retry 3 --silent --show-error \
            "$base/api/v1/monitoring.json?health_run=${{ github.run_id }}" \
            > "$output/monitoring.json"
          curl --fail --retry 3 --silent --show-error \
            "$base/api/v1/source-audit.json?health_run=${{ github.run_id }}" \
            > "$output/source-audit.json"
          # Validate the already-published source-route and measurement-only
          # freshness diagnostics; do not add a collector or stricter source gate.
          curl --fail --retry 3 --silent --show-error \
            "$base/api/v1/source-diagnostics.json?health_run=${{ github.run_id }}" \
            > "$output/source-diagnostics.json"
          curl --fail --retry 3 --silent --show-error \
            "$base/api/v1/slo.json?health_run=${{ github.run_id }}" \
            > "$output/slo.json"
          curl --fail --retry 3 --silent --show-error \
            "$base/api/v1/completeness/2026.json?health_run=${{ github.run_id }}" \
            > "$output/completeness-2026.json"
          curl --fail --retry 3 --silent --show-error \
            "$base/project-manifest.json?health_run=${{ github.run_id }}" \
            > "$output/project-manifest.json"
          curl --fail --retry 3 --silent --show-error \
            "$base/feeds/all.xml?health_run=${{ github.run_id }}" \
            > "$output/all.xml"

          python scripts/verify_public_health.py "$output"

      - name: Create a visible issue when health check fails
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "[Health] Academic Door Journals public check failed";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "health"
            });
            if (!existing.data.some((issue) => issue.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: ["health"],
                body: `The scheduled public endpoint check failed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
              });
            }

      - name: Close recovered health issue
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "[Health] Academic Door Journals public check failed";
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "health"
            });
            for (const issue of existing.data.filter((item) => item.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `Recovered in run ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.`
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: "closed"
              });
            }
