name: Probe R3 current history debt

on:
  push:
    branches:
      - probe/r3-current-history-audit-20260910

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore current canonical data branch
        run: |
          set -euo pipefail
          git fetch --depth=1 origin data
          for path in public/api data/backfill-state; do
            rm -rf "$path"
            git archive origin/data "$path" | tar -x
          done
          echo "DATA_SHA=$(git rev-parse origin/data)"
      - name: Simulate legacy-state reconciliation in runner workspace only
        run: |
          set -euo pipefail
          python - <<'PY'
          import copy, json, yaml
          from pathlib import Path
          from scripts.backfill_history import migrate_legacy_state

          root = Path('.')
          journals = yaml.safe_load((root/'config/journals.yml').read_text())['journals']
          targets = {'aer-116-9','aeri-8-3','res-93-5','qe-14-1','qe-14-2','qe-14-3','qe-14-4','qe-15-1','qe-15-2','qe-15-3','qe-15-4','qe-17-4','ere-85-3-4','ere-86-1-2'}
          for state_path in [root/'data/backfill-state/field-2023-2024.json', root/'data/backfill-state/field-2025-2026.json']:
              state = json.loads(state_path.read_text())
              before = copy.deepcopy(state)
              changed = migrate_legacy_state(state, journals, public_api=root/'public/api/v1')
              print('STATE', state_path.name, 'changed', changed)
              before_issues = before.get('issues', {})
              after_issues = state.get('issues', {})
              for iid in sorted(set(before_issues)|set(after_issues)):
                  if before_issues.get(iid) != after_issues.get(iid) and iid in targets:
                      print('TARGET_DELTA', iid, 'BEFORE', json.dumps(before_issues.get(iid), sort_keys=True), 'AFTER', json.dumps(after_issues.get(iid), sort_keys=True))
              # Save only inside ephemeral runner so the existing audit can measure effect.
              state_path.write_text(json.dumps(state, ensure_ascii=False, indent=2)+'\n')
          PY
          python scripts/audit_history_coverage.py \
            --state data/backfill-state/field-2023-2024.json \
            --state data/backfill-state/field-2025-2026.json \
            --api-root public/api/v1 \
            --report-json /tmp/after.json || true
          python - <<'PY'
          import json
          r=json.load(open('/tmp/after.json'))
          measured_prefixes=('aer-','aeri-','res-','qe-','ere-')
          print('AFTER_TOTAL', r['error_count'])
          print('AFTER_TARGET_FAMILY_ERRORS_BEGIN')
          for e in r['errors']:
              if e.startswith(measured_prefixes): print(e)
          print('AFTER_TARGET_FAMILY_ERRORS_END')
          PY
