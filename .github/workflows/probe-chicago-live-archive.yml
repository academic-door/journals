name: Probe Chicago live archive transport

on:
  push:
    branches: [probe/chicago-live-archive-20260909]
    paths: [.github/workflows/probe-chicago-live-archive.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Probe official Chicago issue archives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse

          headers = {
              "User-Agent": "AcademicDoorJournals/0.1 (non-profit academic metadata service; https://academic-door.github.io/)",
              "Accept-Language": "en-US,en;q=0.8",
          }
          cases = {
              "JLE": (
                  "https://www.journals.uchicago.edu/loi/jole",
                  ["jle-43-1", "jle-43-2", "jle-43-3", "jle-43-4", "jle-43-S1", "jle-44-1", "jle-44-2", "jle-44-3"],
              ),
              "JAERE": (
                  "https://www.journals.uchicago.edu/loi/jaere",
                  ["jaere-12-1", "jaere-12-2", "jaere-12-3", "jaere-12-4", "jaere-12-5", "jaere-12-6", "jaere-13-1", "jaere-13-2", "jaere-13-3", "jaere-13-4", "jaere-13-5", "jaere-13-6"],
              ),
          }
          for journal, (url, expected) in cases.items():
              response = requests.get(url, headers=headers, timeout=(10, 45))
              print(journal, response.status_code, response.url, len(response.content))
              response.raise_for_status()
              soup = BeautifulSoup(response.content, "html.parser")
              archive_slug = urlparse(url).path.rstrip('/').rsplit('/', 1)[-1]
              found = {}
              for link in soup.select("a[href]"):
                  href = urljoin(url, link.get("href", ""))
                  match = re.fullmatch(rf"/toc/{re.escape(archive_slug)}/(20\\d{{2}})/(\\d+)/([^/]+)", urlparse(href).path)
                  if not match:
                      continue
                  year, volume, issue = match.groups()
                  if int(year) not in (2025, 2026):
                      continue
                  issue_id = f"{journal.lower()}-{volume}-{issue}"
                  found[issue_id] = href.split('?', 1)[0].split('#', 1)[0]
              got = sorted(found, key=lambda x: (int(x.split('-')[1]), x.split('-')[2].casefold()))
              print(journal, got)
              missing = [item for item in expected if item not in found]
              extras = [item for item in found if item not in expected]
              if missing or extras:
                  raise SystemExit(f"{journal} exact live archive mismatch: missing={missing} extras={extras}")
          PY
