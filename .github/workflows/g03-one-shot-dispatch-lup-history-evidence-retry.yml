name: G03 one-shot dispatch LUP history evidence retry

on:
  push:
    branches:
      - ops/g03-dispatch-lup-history-evidence-retry-20260916

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical history sprint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          payload='{"ref":"main","inputs":{"max_issues":"1","max_translations":"120","categories":"browser","state_source_run_id":"32734420419","strict_final":"false","evidence_issue_ids":"lup-170-c","capture_wiley_evidence":"false"}}'
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/history-sprint.yml/dispatches" \
            -d "$payload"
