name: R2 RES official roster promotion

on:
  push:
    branches:
      - r2-res-evidence-promotion-run

permissions:
  contents: write
  models: read

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Preserve merged RES evidence and restore latest governed data
        shell: bash
        run: |
          set -euo pipefail
          evidence_root="$RUNNER_TEMP/res-evidence"
          mkdir -p "$evidence_root"
          cp data/provenance/official-rosters/res/res-93-{1,2,3,4}.json "$evidence_root/"

          git fetch origin data
          rm -rf public/api data/backfill-state data/backfill-staging data/translation-cache data/provenance/official-rosters
          mkdir -p public data
          git archive origin/data public/api public/project-manifest.json data/backfill-state data/backfill-staging data/translation-cache | tar -x
          if git ls-tree -r --name-only origin/data -- data/provenance/official-rosters | grep -q .; then
            git archive origin/data data/provenance/official-rosters | tar -x
          fi

          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$RUNNER_TEMP/data-baseline" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --path data/provenance/official-rosters \
            --exclude 'public/api/v1/journals/*/issues/index.json'

          mkdir -p data/provenance/official-rosters/res
          cp "$evidence_root"/*.json data/provenance/official-rosters/res/

      - name: Apply exact official RES evidence and translation gate
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          TRANSLATION_RETRIES: "5"
          TRANSLATION_WORKERS: "4"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/res-candidates"
          for issue_id in res-93-1 res-93-2 res-93-3 res-93-4; do
            python scripts/import_official_roster_evidence.py \
              "data/provenance/official-rosters/res/${issue_id}.json" \
              --api-root public/api/v1 \
              --output "$RUNNER_TEMP/res-candidates/${issue_id}.json" \
              --state-root data/backfill-state \
              --translation-cache-root data/translation-cache \
              --translate \
              --promote
          done

      - name: Rebuild and verify RES 4/4 acceptance
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rebuild_public_snapshot.py
          python scripts/publish_data_delta.py rebuild-archive-indexes --root .

          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/backfill_status.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json public/api/v1/backfill-status.json \
            --out-md public/backfill-status.md
          python scripts/build_gap_manifest.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json public/api/v1/gap-manifest.json \
            --out-md public/gap-manifest.md

          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_privacy.py
          python -m unittest discover -s tests -v
          python scripts/rebuild_public_snapshot.py --check

          python scripts/build_completeness_ledger.py \
            --state data/backfill-state/field-2025-2026.json \
            --api-root public/api/v1 \
            --out-json "$RUNNER_TEMP/completeness-2026.json"
          LEDGER="$RUNNER_TEMP/completeness-2026.json" python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path(os.environ["LEDGER"]).read_text(encoding="utf-8"))
          rows = {row["journalKey"]: row for row in payload["journals"]}
          for key, expected, ready in (("QJE", 3, 3), ("RES", 4, 4)):
              row = rows[key]
              print(json.dumps({k: row.get(k) for k in (
                  "journalKey", "authority", "authorityClassification", "freshnessStatus",
                  "expectedIssueCount", "publicationReadyIssueCount", "status", "discoveryRefreshedAt"
              )}, ensure_ascii=False))
              if row["authorityClassification"] != "authoritative":
                  raise SystemExit(f"{key} authority is not authoritative")
              if row["freshnessStatus"] != "CURRENT_FOR_AUDIT_END":
                  raise SystemExit(f"{key} evidence is not current")
              if row["expectedIssueCount"] != expected or row["publicationReadyIssueCount"] != ready:
                  raise SystemExit(f"{key} is not {ready}/{expected} publication-ready")
              if row["status"] != "COMPLETE":
                  raise SystemExit(f"{key} status is {row['status']}, expected COMPLETE")
          PY

      - name: Publish validated RES delta to data branch
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/generated-data"
          data_tree="$RUNNER_TEMP/data-tree"
          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$generated" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --path data/provenance/official-rosters \
            --exclude 'public/api/v1/journals/*/issues/index.json'

          git fetch origin data
          git worktree add "$data_tree" origin/data
          git -C "$data_tree" switch -C data
          python scripts/publish_data_delta.py apply \
            --baseline "$RUNNER_TEMP/data-baseline" \
            --generated "$generated" \
            --target "$data_tree" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --path data/provenance/official-rosters \
            --exclude 'public/api/v1/journals/*/issues/index.json'

          rm -rf "$data_tree/public/api"
          cp -R "$GITHUB_WORKSPACE/public/api" "$data_tree/public/api"
          cp "$GITHUB_WORKSPACE/public/project-manifest.json" "$data_tree/public/project-manifest.json"
          cp "$GITHUB_WORKSPACE/public/backfill-status.md" "$data_tree/public/backfill-status.md"
          cp "$GITHUB_WORKSPACE/public/gap-manifest.md" "$data_tree/public/gap-manifest.md"
          git -C "$data_tree" rm -f --ignore-unmatch public/search.js
          git -C "$data_tree" config user.name "academic-door-bot"
          git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
          git -C "$data_tree" add -A public/api data/translation-cache data/backfill-state data/backfill-staging data/provenance/official-rosters
          git -C "$data_tree" add public/project-manifest.json public/backfill-status.md public/gap-manifest.md
          if git -C "$data_tree" diff --cached --quiet; then
            echo "No RES promotion data changes."
            exit 0
          fi
          git -C "$data_tree" commit -m "Promote RES 2026 official roster evidence"
          git -C "$data_tree" push origin HEAD:data
