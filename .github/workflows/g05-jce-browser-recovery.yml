name: Backfill field journal history

on:
  push:
    branches:
      - brain/g05-jce-54-3-browser-recovery

permissions:
  contents: write

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  recover-jce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Restore canonical data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          for path in public/api data/translation-cache data/backfill-state data/backfill-staging; do
            if git cat-file -e "origin/data:$path" 2>/dev/null; then
              rm -rf "$path"
              git archive origin/data "$path" | tar -x
            fi
          done
          python scripts/publish_data_delta.py snapshot             --root .             --output "$RUNNER_TEMP/data-baseline"             --path public/api/v1/journals             --path data/translation-cache             --path data/backfill-state             --path data/backfill-staging             --exclude 'public/api/v1/journals/*/issues/index.json'

      - name: Build and gate JCE 54(3)
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_sciencedirect_browser_archives.py             data/provenance/browser-snapshots/sciencedirect/jce-54-3.json             --state-root data/backfill-state             --translation-cache-root data/translation-cache             --translate
          python scripts/rebuild_public_snapshot.py
          python scripts/publish_data_delta.py rebuild-archive-indexes --root .
          python scripts/rebuild_public_snapshot.py --check
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_privacy.py
          python -m unittest             tests.test_issue_schema             tests.test_public_snapshot_consistency             tests.test_public_data_branch_ownership -v
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("public/api/v1/journals/jce/issues/jce-54-3.json")
          x=json.loads(p.read_text())
          assert x["publication_state"] == "ready", x.get("publication_state")
          assert x["source_status"] == "official_verified", x.get("source_status")
          assert x["research_article_count"] == 16, x.get("research_article_count")
          assert len(x["articles"]) == 16, len(x["articles"])
          print(json.dumps({
            "issue_id":x["issue_id"],
            "publication_state":x["publication_state"],
            "source_status":x["source_status"],
            "research_article_count":x["research_article_count"],
          }, sort_keys=True))
          PY

      - name: Publish guarded delta
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_data_delta.py snapshot             --root .             --output "$RUNNER_TEMP/generated-data"             --path public/api/v1/journals             --path data/translation-cache             --path data/backfill-state             --path data/backfill-staging             --exclude 'public/api/v1/journals/*/issues/index.json'
          data_tree="$RUNNER_TEMP/data-tree"
          for attempt in 1 2 3 4 5; do
            git fetch origin data
            git worktree remove --force "$data_tree" 2>/dev/null || true
            rm -rf "$data_tree"
            git worktree add "$data_tree" origin/data
            git -C "$data_tree" switch -C data
            if python scripts/publish_data_delta.py apply               --baseline "$RUNNER_TEMP/data-baseline"               --generated "$RUNNER_TEMP/generated-data"               --target "$data_tree"               --path public/api/v1/journals               --path data/translation-cache               --path data/backfill-state               --path data/backfill-staging               --exclude 'public/api/v1/journals/*/issues/index.json'; then
              rm -rf public/api
              cp -R "$data_tree/public/api" public/api
              cp -R "$RUNNER_TEMP/generated-data/public/api/v1/journals/." public/api/v1/journals/
              python scripts/rebuild_public_snapshot.py
              python scripts/publish_data_delta.py rebuild-archive-indexes --root .
              cp -R public/api/. "$data_tree/public/api/"
              git -C "$data_tree" config user.name "academic-door-bot"
              git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
              git -C "$data_tree" add -A public/api data/translation-cache
              git -C "$data_tree" add -f data/backfill-state data/backfill-staging 2>/dev/null || true
              if git -C "$data_tree" diff --cached --quiet; then
                echo "No data changes."
                exit 0
              fi
              git -C "$data_tree" commit -m "data(r2): recover JCE 54(3) from ScienceDirect roster"
              if git -C "$data_tree" push origin HEAD:data; then
                exit 0
              fi
            fi
            sleep $((attempt * 10))
          done
          exit 1
