name: G03 monitor scoped force-deep GREEN

on:
  push:
    branches:
      - feat/g03-monitor-scoped-force-deep-20260916

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/g03-monitor-scoped-force-deep-20260916
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Implement scoped manual deep retry
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          monitor = Path('scripts/journal_monitor.py')
          text = monitor.read_text(encoding='utf-8')
          old = '''def run_deep_updates(
              confirmed: list[str],
              state: dict[str, Any],
              result: dict[str, Any],
              *,
              translate: bool,
          ) -> int:
              update_results: list[dict[str, Any]] = []
              failure_total = 0
          '''
          new = '''def run_deep_updates(
              confirmed: list[str],
              state: dict[str, Any],
              result: dict[str, Any],
              *,
              translate: bool,
              force_journals: set[str] | None = None,
          ) -> int:
              update_results: list[dict[str, Any]] = []
              failure_total = 0
              forced = force_journals or set()
          '''
          if old not in text:
              raise SystemExit('run_deep_updates signature anchor not found')
          text = text.replace(old, new, 1)
          old = '''        next_retry_text = str(entry.get("next_deep_retry_at", ""))
                  if next_retry_text:
          '''
          new = '''        next_retry_text = str(entry.get("next_deep_retry_at", ""))
                  if next_retry_text and key not in forced:
          '''
          if old not in text:
              raise SystemExit('retry gate anchor not found')
          text = text.replace(old, new, 1)
          old = '''    parser.add_argument("--run-updates", action="store_true")
              parser.add_argument("--translate", action="store_true")
          '''
          new = '''    parser.add_argument("--run-updates", action="store_true")
              parser.add_argument("--translate", action="store_true")
              parser.add_argument(
                  "--force-deep-journal",
                  action="append",
                  default=[],
                  metavar="JOURNAL",
                  help=(
                      "Bypass the stored deep retry window for this journal key on an "
                      "explicit update run. Repeat for multiple journals."
                  ),
              )
          '''
          if old not in text:
              raise SystemExit('parser anchor not found')
          text = text.replace(old, new, 1)
          old = '''    config = yaml.safe_load(CONFIG_PATH.read_text(encoding="utf-8"))["journals"]
              state = read_json(args.state) or {
          '''
          new = '''    config = yaml.safe_load(CONFIG_PATH.read_text(encoding="utf-8"))["journals"]
              force_journals = {
                  str(key).strip().upper()
                  for key in args.force_deep_journal
                  if str(key).strip()
              }
              unknown_force_journals = sorted(force_journals - set(config))
              if unknown_force_journals:
                  parser.error(
                      "unknown --force-deep-journal key(s): "
                      + ", ".join(unknown_force_journals)
                  )
              if force_journals and not args.run_updates:
                  parser.error("--force-deep-journal requires --run-updates")
              state = read_json(args.state) or {
          '''
          if old not in text:
              raise SystemExit('config anchor not found')
          text = text.replace(old, new, 1)
          old = '''            result,
                      translate=args.translate,
                  )
          '''
          new = '''            result,
                      translate=args.translate,
                      force_journals=force_journals,
                  )
          '''
          if old not in text:
              raise SystemExit('run_deep_updates call anchor not found')
          text = text.replace(old, new, 1)
          monitor.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/monitor-journals.yml')
          lines = workflow.read_text(encoding='utf-8').splitlines()
          dispatch_idx = lines.index('  workflow_dispatch:')
          lines[dispatch_idx:dispatch_idx + 1] = [
              '  workflow_dispatch:',
              '    inputs:',
              '      force_deep_journals:',
              '        description: "Comma-separated journal keys whose stored deep retry windows should be bypassed"',
              '        required: false',
              '        default: ""',
              '        type: string',
          ]
          detect_idx = lines.index('      - name: Detect changes and update confirmed journals')
          deepseek_idx = next(
              i for i in range(detect_idx, len(lines))
              if lines[i].startswith('          DEEPSEEK_API_KEY:')
          )
          lines.insert(
              deepseek_idx + 1,
              '          FORCE_DEEP_JOURNALS: $' + '{{ inputs.force_deep_journals }}',
          )
          run_idx = lines.index('        run: |', deepseek_idx)
          command_idx = lines.index(
              '          python scripts/journal_monitor.py --run-updates --translate',
              run_idx,
          )
          lines[command_idx:command_idx + 1] = [
              '          args=(--run-updates --translate)',
              '          IFS=\',\' read -ra forced <<< "${FORCE_DEEP_JOURNALS:-}"',
              '          for journal in "${forced[@]}"; do',
              '            journal="$(printf \'%s\' "$journal" | tr -d \'[:space:]\')"',
              '            if [ -n "$journal" ]; then',
              '              args+=(--force-deep-journal "$journal")',
              '            fi',
              '          done',
              '          python scripts/journal_monitor.py "${args[@]}"',
          ]
          workflow.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Verify GREEN and focused monitor regressions
        run: |
          python -m unittest tests.test_monitor_force_deep -v
          python -m unittest tests.test_journal_monitor tests.test_update_journals -v
          git diff --check
      - name: Commit code-only implementation
        shell: bash
        run: |
          git config user.name academic-door-bot
          git config user.email academic-door-bot@users.noreply.github.com
          git add scripts/journal_monitor.py
          git commit -m 'feat(monitor): support scoped deep-retry bypass'
          git push origin HEAD:feat/g03-monitor-scoped-force-deep-20260916
