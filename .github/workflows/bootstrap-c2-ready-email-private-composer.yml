name: Bootstrap C2 READY Composer host migration

on:
  push:
    branches: [c2/ready-email-private-composer-20260910]
    paths: [.github/workflows/bootstrap-c2-ready-email-private-composer.yml]

permissions:
  contents: write

jobs:
  verify-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Apply host-only READY email migration
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/email_notifications.py')
          text = path.read_text(encoding='utf-8')
          old = 'SITE_ROOT = "https://academic-door.github.io/journals"\nSTATE_SCHEMA_VERSION = "1.2"\n'
          new = (
              'SITE_ROOT = "https://academic-door.github.io/journals"\n'
              'COMPOSER_ROOT = "https://academic-door-composer.academic-door.workers.dev"\n'
              'STATE_SCHEMA_VERSION = "1.2"\n'
          )
          if old not in text:
              raise SystemExit('email host constant anchor not found')
          text = text.replace(old, new, 1)
          old = (
              '        "composer_url": (\n'
              '            f"{SITE_ROOT}/composer/?journal={journal_id}"\n'
              '            f"&issue={issue.get(\'issue_id\', \'\')}"\n'
              '        ),\n'
          )
          new = (
              '        "composer_url": (\n'
              '            f"{COMPOSER_ROOT}/?journal={journal_id}"\n'
              '            f"&issue={issue.get(\'issue_id\', \'\')}"\n'
              '        ),\n'
          )
          if old not in text:
              raise SystemExit('composer URL builder anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('tests/test_email_notifications.py')
          text = path.read_text(encoding='utf-8')
          old = '    build_message,\n    send_test_notification,\n'
          new = '    build_message,\n    issue_snapshot,\n    send_test_notification,\n'
          if old not in text:
              raise SystemExit('test import anchor not found')
          text = text.replace(old, new, 1)
          anchor = 'class EmailNotificationTests(unittest.TestCase):\n'
          test = '''class EmailNotificationTests(unittest.TestCase):
    def test_ready_composer_link_uses_private_worker_without_identity_drift(self):
        issue = {
            "journal_id": "AER",
            "journal_name": "American Economic Review",
            "issue_id": "aer-116-8",
            "volume": "116",
            "issue": "8",
            "publication_date": "August 2026",
            "research_article_count": 1,
            "quality": {"abstract_en_complete": 1, "translation_complete": 1},
            "articles": [{"paper_id": "doi:10.1/one"}],
        }
        snapshot = issue_snapshot(issue, {"aer": ["top5"]})
        self.assertEqual(
            "https://academic-door-composer.academic-door.workers.dev/?journal=aer&issue=aer-116-8",
            snapshot["composer_url"],
        )
        self.assertEqual(
            "https://academic-door.github.io/journals/?journal=aer",
            snapshot["directory_url"],
        )

    def test_sync_steps_still_precede_ready_email_delivery(self):
        root = Path(__file__).resolve().parents[1]
        for name in ("monitor-journals.yml", "update-journals.yml"):
            source = (root / ".github" / "workflows" / name).read_text(encoding="utf-8")
            self.assertLess(
                source.index("      - name: Sync audited"),
                source.index("      - name: Send private new-issue email"),
            )

'''
          if anchor not in text:
              raise SystemExit('test class anchor not found')
          path.write_text(text.replace(anchor, test, 1), encoding='utf-8')
          PY

      - name: Run C2 email contract tests
        run: python -m unittest tests.test_email_notifications -v

      - name: Run full unit suite
        run: python -m unittest discover -s tests -v

      - name: Persist host-only implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name academic-door-bot
          git config user.email academic-door-bot@users.noreply.github.com
          git add scripts/email_notifications.py tests/test_email_notifications.py
          git diff --cached --check
          git commit -m 'feat(email): route READY Composer links to private workbench'
          git push origin HEAD:c2/ready-email-private-composer-20260910
