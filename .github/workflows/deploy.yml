name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Update journal data
      - Monitor journal updates
      - Backfill field journal history
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Overlay generated data branch when available
        shell: bash
        run: |
          if git ls-remote --exit-code origin refs/heads/data >/dev/null 2>&1; then
            git fetch origin data
            rm -rf public/api
            git archive origin/data public/api public/project-manifest.json | tar -x
            if git cat-file -e origin/data:public/backfill-status.md 2>/dev/null; then
              git show origin/data:public/backfill-status.md > public/backfill-status.md
            fi
            state_root="$RUNNER_TEMP/data-state"
            mkdir -p "$state_root"
            for state in \
              data/backfill-state/field-2023-2024.json \
              data/backfill-state/field-2025-2026.json; do
              if git cat-file -e "origin/data:$state" 2>/dev/null; then
                git show "origin/data:$state" > "$state_root/$(basename "$state")"
              fi
            done
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Audit overlaid release data
        env:
          PYTHONPATH: ${{ github.workspace }}
          STRICT_HISTORY_COVERAGE_ENABLED: ${{ vars.STRICT_HISTORY_COVERAGE_ENABLED }}
        run: |
          python scripts/rebuild_public_snapshot.py
          python scripts/rebuild_public_snapshot.py --check
          set +e
          python scripts/audit_public_data.py --strict-provenance > "$RUNNER_TEMP/public-audit-after.log" 2>&1
          audit_status=$?
          set -e
          if [ -f public/api/v1/baseline-strict-debt.json ]; then
            python -c 'import json; [print("FAIL " + str(item.get("exact_failure", ""))) for item in json.load(open("public/api/v1/baseline-strict-debt.json", encoding="utf-8")).get("failures", []) if item.get("exact_failure")]' > "$RUNNER_TEMP/public-audit-before.log"
            python scripts/check_incremental_audit.py \
              --before "$RUNNER_TEMP/public-audit-before.log" \
              --after "$RUNNER_TEMP/public-audit-after.log" \
              --api-root public/api/v1 \
              --report "$RUNNER_TEMP/public-audit-incremental.json"
          elif [ "$audit_status" -ne 0 ]; then
            cat "$RUNNER_TEMP/public-audit-after.log"
            exit "$audit_status"
          fi
          echo "full strict deploy audit exit=$audit_status"
          python scripts/audit_source_alignment.py \
            --strict \
            --output "$RUNNER_TEMP/source-audit.json"
          state_args=()
          for state in "$RUNNER_TEMP/data-state"/*.json; do
            [ ! -f "$state" ] || state_args+=(--state "$state")
          done
          if [ -f scripts/audit_history_coverage.py ] && [ "${#state_args[@]}" -gt 0 ]; then
            history_flags=()
            if [ "${STRICT_HISTORY_COVERAGE_ENABLED:-false}" = "true" ]; then
              history_flags+=(--strict)
            fi
            python scripts/audit_history_coverage.py \
              "${state_args[@]}" \
              --api-root public/api/v1 \
              --report-json "$RUNNER_TEMP/history-coverage.json" \
              "${history_flags[@]}"
          fi
          python scripts/audit_privacy.py
          python -m unittest \
            tests.test_issue_schema \
            tests.test_history_period_audit \
            tests.test_public_snapshot_consistency \
            -v

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
