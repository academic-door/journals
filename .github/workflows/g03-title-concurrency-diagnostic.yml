name: G03 title numeric suffix RED

on:
  push:
    branches:
      - fix/g03-sciencedirect-title-cosmetic-20260916

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run focused title regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_sciencedirect_title_numeric_suffix -v
          python -m unittest tests.test_sciencedirect_archive_titles -v
          git diff --check
