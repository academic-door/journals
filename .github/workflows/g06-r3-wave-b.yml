name: G06 R3 wave B recover missing archives

on:
  push:
    branches:
      - g06-r3-wave-b

permissions:
  actions: read
  contents: write
  models: read

jobs:
  recover:
    uses: ./.github/workflows/history-sprint.yml
    with:
      max_issues: "12"
      max_translations: "120"
      categories: "recoverable"
      source_run_id: ""
      state_source_run_id: ""
      strict_final: false
      evidence_issue_ids: ""
      capture_wiley_evidence: false
    secrets: inherit
