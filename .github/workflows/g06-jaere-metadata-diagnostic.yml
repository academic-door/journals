name: G06 JAERE metadata fallback diagnostic

on:
  push:
    branches:
      - g06-r2-diagnostic

permissions:
  contents: read

concurrency:
  group: g06-jaere-metadata-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Diagnose official-roster metadata enrichment
        env:
          PYTHONPATH: ${{ github.workspace }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          import yaml

          from collectors.metadata_fallback import enrich_missing_metadata
          from scripts.build_archives_from_roster_evidence import (
              _crossref_map,
              _metadata_for_dois,
              build_candidate_from_evidence,
          )
          from scripts.update_journals import normalize_issue_content

          evidence = json.loads(
              Path("data/provenance/official-rosters/jaere/jaere-13-5.json")
              .read_text(encoding="utf-8")
          )
          journal = yaml.safe_load(
              Path("config/journals.yml").read_text(encoding="utf-8")
          )["journals"]["JAERE"]
          session = requests.Session()
          dois = [str(x["doi"]).strip().casefold() for x in evidence["items"]]
          crossref = _crossref_map(
              session,
              str(journal["issn"]),
              start_year=2026,
              timeout=45,
          )
          metadata = _metadata_for_dois(
              session,
              dois,
              crossref,
              timeout=45,
          )
          candidate = build_candidate_from_evidence(
              evidence,
              journal,
              metadata,
              publication_date="2026",
          )
          candidate = normalize_issue_content(candidate)
          before = [
              a["doi"] for a in candidate["articles"]
              if not str(a.get("abstract_en") or "").strip()
          ]
          candidate = enrich_missing_metadata(candidate, session=session, timeout=45)
          candidate = normalize_issue_content(candidate)
          after = [
              a["doi"] for a in candidate["articles"]
              if not str(a.get("abstract_en") or "").strip()
          ]
          print("G06_JAERE_METADATA", json.dumps({
              "before_missing": before,
              "after_missing": after,
              "abstract_en_complete": candidate["quality"]["abstract_en_complete"],
              "authors_complete": candidate["quality"]["authors_complete"],
              "sources": {
                  a["doi"]: a.get("sources", {}).get("abstract_en", "")
                  for a in candidate["articles"]
              },
          }, sort_keys=True))
          PY
