name: Refresh R2 Cambridge expected sets

on:
  schedule:
    - cron: "25 23 * * *"
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  jeh:
    uses: academic-door/journals/.github/workflows/backfill-field-history.yml@main
    with:
      journal: JEH
      from_year: "2025"
      to_year: "2026"
      max_issues: "1"
      max_translations: "0"
      max_journals: "1"
      translation_model: deepseek-chat
      refresh_discovery_only: true
    secrets: inherit
