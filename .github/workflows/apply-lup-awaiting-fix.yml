name: Apply bounded LUP awaiting classification fix

on:
  push:
    branches:
      - fix/monitor-future-repec-awaiting-20260913
    paths:
      - .github/workflows/apply-lup-awaiting-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/monitor-future-repec-awaiting-20260913
      - name: Apply exact classification marker and remove runner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/journal_monitor.py')
          text = path.read_text(encoding='utf-8')
          old = '''            "source authority is not publication-ready",\n'''
          new = '''            "source authority is not publication-ready",\n            "RePEc candidate is outside the configured publication horizon",\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one classification insertion point, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git rm .github/workflows/apply-lup-awaiting-fix.yml
          git config user.name academic-door-bot
          git config user.email academic-door-bot@users.noreply.github.com
          git add scripts/journal_monitor.py
          git diff --cached --check
          git commit -m "fix(monitor): await future RePEc preregistrations"
          git push origin HEAD:fix/monitor-future-repec-awaiting-20260913
