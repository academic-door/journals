name: Bootstrap Cambridge addendum repair

on:
  push:
    branches:
      - fix/cambridge-addendum-20260910
    paths:
      - .github/workflows/bootstrap-cambridge-addendum.yml

permissions:
  contents: write

jobs:
  verify-and-persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/cambridge-addendum-20260910
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Patch bounded Cambridge addendum classification
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("scripts/capture_cambridge_roster_evidence.py")
          text = source.read_text(encoding="utf-8")
          needle = 'BOOK_REVIEW_RE = re.compile(r"\\bPp\\.\\s*\\d+|\\(Orgs?\\.\\)|\\s+By\\s+[A-Z]", re.IGNORECASE)\n'
          replacement = needle + 'ADDENDUM_RE = re.compile(r"(?:[-–—]\\s*)?ADDENDUM\\s*$", re.IGNORECASE)\n'
          if 'ADDENDUM_RE = ' not in text:
              assert needle in text
              text = text.replace(needle, replacement, 1)
          needle2 = '    if NON_RESEARCH_RE.search(title):\n        return "non-research-title"\n'
          replacement2 = needle2 + '    if ADDENDUM_RE.search(title):\n        return "addendum"\n'
          if 'return "addendum"' not in text:
              assert needle2 in text
              text = text.replace(needle2, replacement2, 1)
          source.write_text(text, encoding="utf-8")

          test = Path("tests/test_cambridge_roster_capture.py")
          t = test.read_text(encoding="utf-8")
          marker = '</div>\n</body></html>\n"""\n\n\nclass CambridgeRosterCaptureTests'
          block = '''</div>\n<div class="product-listing-with-inputs-content">\n  <a class="part-link" href="/core/journals/journal-of-economic-history/article/addendum/EEE">Research Paper —ADDENDUM</a>\n  <div class="author"><a class="more-by-this-author">Author Three</a></div>\n  <div class="altmetric-embed" data-doi="10.1017/S000000000000005"></div>\n</div>\n</body></html>\n"""\n\n\nclass CambridgeRosterCaptureTests'''
          if 'article/addendum/EEE' not in t:
              assert marker in t
              t = t.replace(marker, block, 1)
              t = t.replace('self.assertEqual(2, len(excluded))', 'self.assertEqual(3, len(excluded))', 1)
              t = t.replace('self.assertEqual("front-matter-no-detail", excluded[1]["reason"])', 'self.assertEqual("front-matter-no-detail", excluded[1]["reason"])\n        self.assertEqual("addendum", excluded[2]["reason"])', 1)
          test.write_text(t, encoding="utf-8")
          PY
      - name: Run Cambridge regression
        run: python -m unittest tests.test_cambridge_roster_capture -v
      - name: Live exact JEH 86-2 roster comparison
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          git show origin/data:public/api/v1/journals/jeh/issues/jeh-86-2.json > "$RUNNER_TEMP/jeh-86-2.json"
          RUNNER_TEMP="$RUNNER_TEMP" python - <<'PY'
          import json, os
          from pathlib import Path
          from scripts.capture_cambridge_roster_evidence import capture_record
          record = {"journal":"JEH","issue_id":"jeh-86-2","year":2026,"issue":"2","source_status":"source_pending","official_url":"https://www.cambridge.org/core/journals/journal-of-economic-history"}
          evidence = capture_record(record, captured_at="2026-09-10T00:00:00+00:00")
          archive = json.loads((Path(os.environ["RUNNER_TEMP"]) / "jeh-86-2.json").read_text(encoding="utf-8"))
          official = [x["doi"].casefold() for x in evidence["items"]]
          existing = [x["doi"].casefold() for x in archive["articles"]]
          print("official_url", evidence["official_url"])
          print("official_publishable", len(official), official)
          print("existing_publishable", len(existing), existing)
          print("excluded", evidence["excluded_item_count"])
          assert official == existing, {"official": official, "existing": existing}
          assert len(official) == 7
          print("JEH_86_2_ROSTER_EXACT=true")
          PY
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Persist verified repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add scripts/capture_cambridge_roster_evidence.py tests/test_cambridge_roster_capture.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(history): classify Cambridge addenda as non-research"
          git push origin HEAD:fix/cambridge-addendum-20260910
