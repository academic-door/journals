name: Bootstrap R2 Cambridge JEH

on:
  push:
    branches: [r2/cambridge-jeh-20260910]
    paths: [.github/workflows/bootstrap-r2-cambridge-jeh.yml]

permissions:
  contents: write
  models: read

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  repair-jeh-86-2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Restore canonical data baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api data/backfill-state data/backfill-staging data/translation-cache data/provenance/official-rosters
          mkdir -p public data
          git archive origin/data public/api data/backfill-state data/backfill-staging data/translation-cache | tar -x
          mkdir -p data/provenance/official-rosters
          if git ls-tree -r --name-only origin/data -- data/provenance/official-rosters | grep -q .; then
            git archive origin/data data/provenance/official-rosters | tar -x
          fi

      - name: Build and scope the exact JEH 86(2) gap
        shell: bash
        run: |
          set -euo pipefail
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/build_gap_manifest.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json "$RUNNER_TEMP/gaps.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          src = Path(os.environ['RUNNER_TEMP']) / 'gaps.json'
          dst = Path(os.environ['RUNNER_TEMP']) / 'jeh-86-2-gap.json'
          payload = json.loads(src.read_text())
          records = [r for r in payload.get('records', []) if r.get('issue_id') == 'jeh-86-2']
          assert len(records) == 1, records
          rec = records[0]
          assert rec.get('source_status') == 'source_pending', rec
          assert 'cambridge.org' in str(rec.get('official_url', '')), rec
          payload['records'] = records
          dst.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n')
          print(json.dumps(rec, ensure_ascii=False, indent=2))
          PY

      - name: Capture official Cambridge roster evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/provenance/official-rosters/cambridge
          python scripts/capture_cambridge_roster_evidence.py \
            --gap-manifest "$RUNNER_TEMP/jeh-86-2-gap.json" \
            --output-root data/provenance/official-rosters/cambridge \
            --diagnostics-root "$RUNNER_TEMP/cambridge-diagnostics"
          evidence=data/provenance/official-rosters/cambridge/jeh-86-2.json
          test -s "$evidence"
          EVIDENCE="$evidence" python - <<'PY'
          import json, os
          p = json.load(open(os.environ['EVIDENCE']))
          assert p['issue_id'] == 'jeh-86-2'
          assert p['method'] == 'official-page-read'
          assert p['finalized'] is True
          assert len(p['items']) == 7, len(p['items'])
          excluded = p.get('excluded_items', [])
          assert p.get('excluded_item_count') == len(excluded)
          addenda = [item for item in excluded if item.get('reason') == 'addendum']
          assert len(addenda) == 3, addenda
          print('official roster:', [x.get('doi') for x in p['items']])
          print('excluded:', excluded)
          PY

      - name: Promote exact official roster evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/import_official_roster_evidence.py \
            data/provenance/official-rosters/cambridge/jeh-86-2.json \
            --api-root public/api/v1 \
            --output "$RUNNER_TEMP/jeh-86-2-candidate.json" \
            --state-root data/backfill-state \
            --translation-cache-root data/translation-cache \
            --promote
          python - <<'PY'
          import json
          p = json.load(open('public/api/v1/journals/jeh/issues/jeh-86-2.json'))
          assert p.get('content_status') == 'complete', p.get('content_status')
          assert p.get('source_status') == 'official_verified', p.get('source_status')
          assert p.get('publication_state') == 'ready', p.get('publication_state')
          q = p.get('quality', {})
          assert q.get('roster_match') is True
          assert q.get('order_preserved') is True
          assert q.get('roster_authority') == 'official-issue-page', q.get('roster_authority')
          assert q.get('roster_transport') == 'official-page-read', q.get('roster_transport')
          print('JEH 86(2) promoted official_verified/ready')
          PY

      - name: Rebuild and audit canonical public data
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rebuild_public_snapshot.py
          python scripts/publish_data_delta.py rebuild-archive-indexes --root .
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/backfill_status.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json public/api/v1/backfill-status.json \
            --out-md public/backfill-status.md
          python scripts/build_gap_manifest.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json public/api/v1/gap-manifest.json \
            --out-md public/gap-manifest.md
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_privacy.py
          python -m unittest discover -s tests -v
          python scripts/rebuild_public_snapshot.py --check

      - name: Push bounded canonical delta to data
        shell: bash
        run: |
          set -euo pipefail
          data_tree="$RUNNER_TEMP/data-tree"
          git fetch origin data
          git worktree add "$data_tree" origin/data
          git -C "$data_tree" switch -C data
          rm -rf "$data_tree/public/api" "$data_tree/data/backfill-state" "$data_tree/data/backfill-staging"
          cp -R public/api "$data_tree/public/api"
          cp -R data/backfill-state "$data_tree/data/backfill-state"
          cp -R data/backfill-staging "$data_tree/data/backfill-staging"
          mkdir -p "$data_tree/data/provenance/official-rosters/cambridge"
          cp data/provenance/official-rosters/cambridge/jeh-86-2.json "$data_tree/data/provenance/official-rosters/cambridge/jeh-86-2.json"
          cp public/backfill-status.md "$data_tree/public/backfill-status.md"
          cp public/gap-manifest.md "$data_tree/public/gap-manifest.md"
          git -C "$data_tree" config user.name academic-door-bot
          git -C "$data_tree" config user.email academic-door-bot@users.noreply.github.com
          git -C "$data_tree" add -A public/api data/backfill-state data/backfill-staging data/provenance/official-rosters/cambridge/jeh-86-2.json public/backfill-status.md public/gap-manifest.md
          if git -C "$data_tree" diff --cached --quiet; then
            echo 'No canonical data change to publish.'
            exit 0
          fi
          git -C "$data_tree" commit -m 'fix(history): promote JEH 86(2) official Cambridge roster'
          git -C "$data_tree" push origin HEAD:data
