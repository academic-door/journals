name: G03 ScienceDirect metadata retry GREEN

on:
  push:
    branches:
      - fix/g03-sciencedirect-metadata-retry-20260916

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/g03-sciencedirect-metadata-retry-20260916
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Patch bounded transient retries
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/build_sciencedirect_browser_archives.py")
          text = path.read_text(encoding="utf-8")
          marker = "        worker_session = requests.Session()\n"
          start = text.index("        for attempt in range(3):\n", text.index(marker))
          end = text.index("        assert response is not None\n", start)
          new = (
              "        for attempt in range(3):\n"
              "            try:\n"
              "                response = worker_session.get(\n"
              "                    f\"{ELSEVIER_ARTICLE_API}/pii/{pii}\",\n"
              "                    params={\"view\": \"META_ABS\", \"httpAccept\": \"application/xml\"},\n"
              "                    headers=headers,\n"
              "                    timeout=min(timeout, 30),\n"
              "                )\n"
              "            except (requests.Timeout, requests.ConnectionError):\n"
              "                if attempt == 2:\n"
              "                    raise\n"
              "                time.sleep(min(10, 2 ** (attempt + 1)))\n"
              "                continue\n"
              "            retryable_status = response.status_code == 429 or 500 <= response.status_code < 600\n"
              "            if not retryable_status:\n"
              "                break\n"
              "            if attempt == 2:\n"
              "                break\n"
              "            if response.status_code == 429:\n"
              "                retry_after = response.headers.get(\"Retry-After\", \"5\")\n"
              "                try:\n"
              "                    delay = min(30, max(2, int(retry_after)))\n"
              "                except ValueError:\n"
              "                    delay = 5\n"
              "                time.sleep(min(20, delay * (attempt + 1)))\n"
              "            else:\n"
              "                time.sleep(min(10, 2 ** (attempt + 1)))\n"
          )
          path.write_text(text[:start] + new + text[end:], encoding="utf-8")
          PY
      - name: Verify focused retry contract
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -p 'test_sciencedirect_browser_archive_metadata.py' -v
          python -m unittest discover -s tests -p 'test_sciencedirect_archive_titles.py' -v
          git diff --check
      - name: Commit permanent GREEN
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add scripts/build_sciencedirect_browser_archives.py
          git commit -m "fix(history): retry transient Elsevier metadata failures"
          git push origin HEAD:fix/g03-sciencedirect-metadata-retry-20260916
