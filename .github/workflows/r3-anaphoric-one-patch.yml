name: R3 anaphoric one patch

on:
  push:
    branches:
      - ops/r3-anaphoric-one-numeric-gate-20260911

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/r3-anaphoric-one-numeric-gate-20260911
          fetch-depth: 1
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install parser test dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply exact parser patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('scripts/translate_issue.py')
          text = path.read_bytes().decode('utf-8')

          helper_pattern = re.compile(
              r'(?P<ret>    return source_q, translated_q\r?\n)'
              r'(?P<gap>\r?\n)'
              r'(?=def _semantic_numbers\(value: str\) -> list\[str\]:)'
          )
          helper_matches = list(helper_pattern.finditer(text))
          if len(helper_matches) != 1:
              raise SystemExit(f'expected one semantic helper anchor, found {len(helper_matches)}')
          m = helper_matches[0]
          helper_lines = [
              '',
              'def _is_parallel_anaphoric_one(value: str, match: re.Match[str]) -> bool:',
              '    """True only for a bounded parallel pro-form such as ``an environment ... nor ... one ...``.',
              '',
              '    Bare ``one`` is normally a numeric quantity.  Exempt it only when the',
              '    same clause contains an explicit singular antecedent in a ``neither ...',
              '    nor ...`` parallel construction and the pro-form is followed by ``with``.',
              '    Unit-bearing quantities such as ``one year`` never reach this exemption.',
              '    """',
              '    if match.group("num").strip().lower() != "one":',
              '        return False',
              '    if match.group("scale") or match.group("unit"):',
              '        return False',
              '    if re.match(r"\\s+with\\b", value[match.end():], re.IGNORECASE) is None:',
              '        return False',
              '    prefix = value[: match.start()]',
              '    return re.search(',
              '        r"\\bneither\\s+almost\\s+an?\\s+[A-Za-z][A-Za-z-]*\\s+with\\b"',
              '        r"[^.;:!?]{0,160}\\bnor\\s+almost\\s*$",',
              '        prefix,',
              '        re.IGNORECASE,',
              '    ) is not None',
              '',
          ]
          helper = '\n'.join(helper_lines)
          text = text[:m.end('ret')] + helper + text[m.end('ret'):]

          loop_pattern = re.compile(
              r'(?P<head>    for match in _EN_NUMBER_UNIT_RE\.finditer\(value\):\r?\n'
              r'        span = match\.span\(\)\r?\n'
              r'        if overlaps\(span\):\r?\n'
              r'            continue\r?\n'
              r'        if _is_english_century_ordinal\(value, match\):\r?\n'
              r'            continue\r?\n)'
              r'(?=        base = _en_cardinal_value\(match\.group\("num"\)\))'
          )
          loop_matches = list(loop_pattern.finditer(text))
          if len(loop_matches) != 1:
              raise SystemExit(f'expected one semantic loop anchor, found {len(loop_matches)}')
          m = loop_matches[0]
          guard = (
              '        if _is_parallel_anaphoric_one(value, match):\n'
              '            continue\n'
          )
          text = text[:m.end('head')] + guard + text[m.end('head'):]
          path.write_bytes(text.encode('utf-8'))
          PY

      - name: Verify target regression
        run: python -m unittest discover -s tests -p 'test_translation_anaphoric_one.py' -v

      - name: Commit durable change and remove patch workflow
        shell: bash
        run: |
          rm .github/workflows/r3-anaphoric-one-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/translate_issue.py tests/test_translation_anaphoric_one.py .github/workflows/r3-anaphoric-one-patch.yml
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'fix(translation): ignore bounded anaphoric one'
          git push origin HEAD:ops/r3-anaphoric-one-numeric-gate-20260911
