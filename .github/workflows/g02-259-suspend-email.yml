name: G02 #259 suspend invalid email delivery

on:
  push:
    branches:
      - fix/259-suspend-email-delivery

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/259-suspend-email-delivery
      - name: Fail closed the monitor email step
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/monitor-journals.yml')
          text = path.read_text(encoding='utf-8')
          old = """      - name: Send private new-issue email\n        id: email\n        if: always() && steps.publish.outcome == 'success'\n"""
          new = """      # #259: fail closed until the designated recipient binding is repaired\n      # and independently verified by a state-free mailbox smoke.\n      - name: Send private new-issue email\n        id: email\n        if: ${{ false }}\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif 'if: ${{ false }}' not in text:
              raise SystemExit('email step anchor changed')
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/monitor-journals.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "fix(email): suspend delivery for invalid recipient binding"
          git push origin HEAD:fix/259-suspend-email-delivery
