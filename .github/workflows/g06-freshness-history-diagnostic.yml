name: G06 freshness history diagnostic

on:
  push:
    branches:
      - g06-freshness-history-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: |
          python -m unittest tests.test_econometric_society_signal tests.test_history_search_ui
          python -m unittest discover -s tests
      - name: Production data authority-floor and display diagnostics
        run: |
          git fetch origin data
          rm -rf public/api data/monitoring
          git archive origin/data public/api data/monitoring | tar -x
          python - <<'PY'
          import json
          import yaml
          from pathlib import Path
          from scripts.update_journals import (
              archived_issues,
              issue_publication_state,
              issue_source_status,
              prefer_ready_archive,
              select_display_issue,
          )

          current = json.loads(Path("public/api/v1/journals/landecon/issues/current.json").read_text())
          archive = json.loads(Path("public/api/v1/journals/landecon/issues/landecon-102-3.json").read_text())
          chosen = prefer_ready_archive(current, archive)
          print(json.dumps({
              "landecon_current": [issue_source_status(current), issue_publication_state(current)],
              "landecon_archive": [issue_source_status(archive), issue_publication_state(archive)],
              "landecon_chosen": [issue_source_status(chosen), issue_publication_state(chosen)],
          }, indent=2))
          assert chosen is archive
          assert issue_publication_state(chosen) == "ready"

          rand_ready = json.loads(Path("public/api/v1/journals/rand/issues/current.json").read_text())
          rand_detected = json.loads(Path("public/api/v1/journals/rand/issues/detected.json").read_text())
          print("RAND display:", select_display_issue(rand_detected, rand_ready))
          assert select_display_issue(rand_detected, rand_ready) == "ready"
          PY
      - name: Live Econometric Society roster diagnostic
        run: |
          python - <<'PY'
          import json
          import requests
          from collectors.econometric_society import parse_latest_econometrica_roster

          url = "https://www.econometricsociety.org/publications/econometrica/volume/2026"
          response = requests.get(url, timeout=60)
          response.raise_for_status()
          roster = parse_latest_econometrica_roster(response.content, url)
          print(json.dumps({
              "volume": roster["volume"],
              "issue": roster["issue"],
              "publication_date": roster["publication_date"],
              "research_article_count": roster["research_article_count"],
              "dois": [item["doi"] for item in roster["articles"]],
              "excluded": roster["excluded_items"],
          }, indent=2))
          assert roster["volume"] == "94"
          assert roster["issue"] == "5"
          assert roster["publication_date"] == "September 2026"
          assert roster["research_article_count"] == 12
          PY
      - name: Live ECTA first-party qualification diagnostic
        env:
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          from collectors.econometric_society import fetch_latest_econometrica_issue

          issue = fetch_latest_econometrica_issue(
              source_url="https://www.econometricsociety.org/publications/econometrica/volume/2026",
              journal_id="ecta",
              journal_name="Econometrica",
              issn="0012-9682",
              current_issue_url="https://onlinelibrary.wiley.com/toc/14680262/current",
              repec_series_code="wly/emetrp",
          )
          q = issue["quality"]
          print(json.dumps({
              "issue_id": issue["issue_id"],
              "articles": issue["research_article_count"],
              "abstracts": q["abstract_en_complete"],
              "authors": q["authors_complete"],
              "authority": q["roster_authority"],
              "transport": q["roster_transport"],
              "flags": q["flags"],
          }, indent=2))
          assert issue["issue_id"] == "ecta-94-5"
          assert issue["research_article_count"] == 12
          assert q["roster_authority"] == "official-issue-page"
          assert "crossref_provisional_roster" not in q["flags"]
          PY
