name: Probe R2 Elsevier API qualification

on:
  push:
    branches:
      - r2/elsevier-api-qualification-20260910

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    env:
      ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
      ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify known DOI lookup against Article Metadata API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, re, time, uuid
          from datetime import datetime, timezone
          from urllib.error import HTTPError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from xml.etree import ElementTree as ET

          endpoint = "https://api.elsevier.com/content/metadata/article"
          api_key = os.environ.get("ELSEVIER_API_KEY", "").strip()
          inst_token = os.environ.get("ELSEVIER_INST_TOKEN", "").strip()
          if not api_key:
              raise SystemExit("ELSEVIER_API_KEY is not configured")

          cases = [
              ("JCE", "10.1016/j.jce.2026.01.006"),
              ("JDE", "10.1016/j.jdeveco.2026.103834"),
          ]

          def local(tag):
              return tag.rsplit("}", 1)[-1]

          def first_text(node, *names):
              wanted = {name.casefold() for name in names}
              for child in node.iter():
                  if local(child.tag).casefold() in wanted and child.text:
                      value = " ".join(child.text.split())
                      if value:
                          return value
              return ""

          result = {
              "schema_version": 1,
              "observed_at": datetime.now(timezone.utc).replace(microsecond=0).isoformat(),
              "credential_presence": {"api_key_configured": bool(api_key), "inst_token_configured": bool(inst_token)},
              "semantic_scholar_used": False,
              "authority_role": "known_item_metadata_qualification",
              "cases": [],
          }
          last = 0.0
          for journal, doi in cases:
              wait = 0.25 - (time.monotonic() - last)
              if wait > 0:
                  time.sleep(wait)
              query = f"DOI({doi})"
              params = {"query": query, "view": "COMPLETE", "count": "10", "start": "0", "httpAccept": "application/xml", "suppressNavLinks": "true"}
              fingerprint = hashlib.sha256(json.dumps(params, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
              headers = {"Accept": "application/xml", "X-ELS-APIKey": api_key, "X-ELS-ReqId": str(uuid.uuid4())}
              if inst_token:
                  headers["X-ELS-Insttoken"] = inst_token
              try:
                  with urlopen(Request(endpoint + "?" + urlencode(params), headers=headers), timeout=45) as r:
                      body = r.read()
                      status = int(r.status)
                      h = {str(k).casefold(): str(v) for k, v in r.headers.items()}
              except HTTPError as e:
                  body = e.read()
                  status = int(e.code)
                  h = {str(k).casefold(): str(v) for k, v in (e.headers or {}).items()}
              last = time.monotonic()
              row = {
                  "journal": journal,
                  "doi_sha256": hashlib.sha256(doi.encode()).hexdigest(),
                  "request_fingerprint": fingerprint,
                  "status": status,
                  "limit": h.get("x-ratelimit-limit", ""),
                  "remaining": h.get("x-ratelimit-remaining", ""),
                  "reset": h.get("x-ratelimit-reset", ""),
                  "els_status": h.get("x-els-status", ""),
              }
              if status == 200:
                  root = ET.fromstring(body)
                  total = first_text(root, "totalResults")
                  entries = []
                  for entry in root.iter():
                      if local(entry.tag).casefold() != "entry":
                          continue
                      observed_doi = first_text(entry, "doi")
                      identifier = first_text(entry, "identifier")
                      if not observed_doi:
                          match = re.search(r"10\.\d{4,9}/\S+", identifier)
                          observed_doi = match.group(0) if match else ""
                      pii = first_text(entry, "pii")
                      volume = first_text(entry, "volume")
                      issue = first_text(entry, "issueIdentifier")
                      cover = first_text(entry, "coverDate")
                      if observed_doi or pii or volume or issue or cover:
                          entries.append({
                              "identity_present": bool(observed_doi or pii),
                              "doi_matches_requested": observed_doi.casefold() == doi.casefold() if observed_doi else False,
                              "pii_present": bool(pii),
                              "volume": volume,
                              "issue_identifier": issue,
                              "cover_date": cover,
                          })
                  row.update({
                      "total_results": int(total) if total.isdigit() else None,
                      "valid_entries": len(entries),
                      "first_entry": entries[0] if entries else None,
                  })
              else:
                  row["error_payload_sha256"] = hashlib.sha256(body).hexdigest() if body else ""
              result["cases"].append(row)
          print("KNOWN_ITEM_RESULT=" + json.dumps(result, sort_keys=True))
          PY
