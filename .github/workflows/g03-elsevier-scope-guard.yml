name: G03 Elsevier scope guard

on:
  push:
    branches:
      - fix/g03-elsevier-editorial-type-20260916

permissions:
  contents: write

jobs:
  scope-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/g03-elsevier-editorial-type-20260916
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Confirm over-broad title classification RED
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_elsevier_publisher_type.ElsevierPublisherTypeTests.test_research_report_title_is_not_reclassified_as_editorial -v 2>&1 | tee /tmp/scope-red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected scope regression to fail before narrowing."
            exit 1
          fi
          grep -q "test_research_report_title_is_not_reclassified_as_editorial" /tmp/scope-red.log
          if grep -Eq "ImportError|ModuleNotFoundError|SyntaxError" /tmp/scope-red.log; then
            echo "Scope RED failed for infrastructure, not behavior."
            exit 1
          fi
          echo "Expected scope RED confirmed."
      - name: Narrow implementation to explicit publisher subtype only
        shell: bash
        run: |
          echo ' ' | tr -d ' ' | base64 -d > /tmp/narrow_elsevier.py
          python /tmp/narrow_elsevier.py
      - name: Verify narrowed GREEN and focused baselines
        run: |
          python -m unittest tests.test_elsevier_publisher_type -v
          python -m unittest tests.test_elsevier_collector tests.test_metadata_fallback tests.test_update_journals -v
          git diff --check
      - name: Commit scope-safe implementation and retire workflow
        run: |
          git config user.name academic-door-bot
          git config user.email academic-door-bot@users.noreply.github.com
          git rm .github/workflows/g03-elsevier-scope-guard.yml
          git add collectors/elsevier.py tests/test_elsevier_publisher_type.py
          git commit -m 'fix(elsevier): narrow editorial subtype exclusion'
          git push origin HEAD:fix/g03-elsevier-editorial-type-20260916
