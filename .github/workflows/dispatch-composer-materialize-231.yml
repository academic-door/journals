name: Dispatch Composer materialization 231

on:
  push:
    branches: [handoff/composer-materialize-231]
    paths: [.github/workflows/dispatch-composer-materialize-231.yml]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch governed targeted journal update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"ref":"main","inputs":{"journal":"AERI"}}' \
            | gh api --method POST \
                repos/academic-door/journals/actions/workflows/update-journals.yml/dispatches \
                --input -
          echo "Dispatched Update journal data on main for AERI."
