name: G03 Elsevier enrichment probe

on:
  push:
    branches:
      - probe/g03-elsevier-enrichment-20260916

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: probe/g03-elsevier-enrichment-20260916
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Probe missing DOI enrichment without exposing content
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import requests
          from collectors.metadata_fallback import _elsevier_lookup, enrich_missing_metadata

          dois = [
              '10.1016/j.landusepol.2026.108195',
              '10.1016/j.worlddev.2026.107513',
          ]
          session = requests.Session()
          direct = []
          for doi in dois:
              lookup = _elsevier_lookup(session, '', doi=doi, timeout=45)
              direct.append({
                  'doi': doi,
                  'status': lookup.get('status', ''),
                  'source': lookup.get('source', ''),
                  'abstract_length': len(str(lookup.get('abstract', ''))),
                  'teaser_length': len(str(lookup.get('teaser', ''))),
                  'attempts': [
                      {
                          'source': attempt.get('source', ''),
                          'status_code': attempt.get('status_code', 0),
                          'outcome': attempt.get('outcome', ''),
                      }
                      for attempt in lookup.get('attempts', [])
                  ],
              })
          print('DIRECT=' + json.dumps(direct, sort_keys=True))

          issue = {
              'articles': [
                  {
                      'doi': doi,
                      'authors': ['probe'],
                      'abstract_en': '',
                      'sources': {},
                  }
                  for doi in dois
              ]
          }
          enriched = enrich_missing_metadata(issue, session=session, timeout=45)
          result = [
              {
                  'doi': article['doi'],
                  'abstract_length': len(str(article.get('abstract_en', ''))),
                  'abstract_source': article.get('sources', {}).get('abstract_en', ''),
              }
              for article in enriched['articles']
          ]
          print('ENRICH=' + json.dumps(result, sort_keys=True))
          PY
      - name: Retire temporary probe workflow
        if: always()
        run: |
          git config user.name academic-door-bot
          git config user.email academic-door-bot@users.noreply.github.com
          git rm .github/workflows/g03-elsevier-enrichment-probe.yml
          git commit -m 'chore: retire G03 Elsevier enrichment probe'
          git push origin HEAD:probe/g03-elsevier-enrichment-20260916
