name: Diagnostic RAND season hotfix executor

on:
  push:
    branches: [diag-oup-archive-transport]

permissions:
  contents: write

jobs:
  patch-rand:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Apply exact patch through GitHub Contents API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = "academic-door/journals"
          branch = "fix-rand-season-monitor-health"
          path = "collectors/metadata_fallback.py"
          url = (
              f"https://api.github.com/repos/{repo}/contents/{path}"
              f"?ref={urllib.parse.quote(branch, safe='')}"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "academic-door-rand-hotfix",
          }
          request = urllib.request.Request(url, headers=headers)
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)

          text = base64.b64decode(payload["content"]).decode("utf-8")
          old = "\n".join([
              '    month_name = MONTHS_BY_ISSUE.get(issn, {}).get(issue, "")',
              '    if month_name:',
              '        issue_month = datetime.strptime(month_name, "%B").month',
              '        return (issue_year, issue_month) <= (current.year, current.month)',
              '',
          ])
          new = "\n".join([
              '    month_name = MONTHS_BY_ISSUE.get(issn, {}).get(issue, "")',
              '    if month_name:',
              '        season_months = {',
              '            "spring": 3,',
              '            "summer": 6,',
              '            "fall": 9,',
              '            "autumn": 9,',
              '            "winter": 12,',
              '        }',
              '        issue_month = season_months.get(month_name.casefold())',
              '        if issue_month is None:',
              '            issue_month = datetime.strptime(month_name, "%B").month',
              '        return (issue_year, issue_month) <= (current.year, current.month)',
              '',
          ])
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one target snippet, found {count}")
          updated = text.replace(old, new)

          body = json.dumps({
              "message": "fix: handle seasonal issue horizon",
              "content": base64.b64encode(updated.encode("utf-8")).decode("ascii"),
              "sha": payload["sha"],
              "branch": branch,
          }).encode("utf-8")
          put = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/contents/{path}",
              data=body,
              headers={**headers, "Content-Type": "application/json"},
              method="PUT",
          )
          with urllib.request.urlopen(put, timeout=30) as response:
              result = json.load(response)
          print("patched_commit=" + result["commit"]["sha"])
          PY
