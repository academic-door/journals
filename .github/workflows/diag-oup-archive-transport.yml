name: Diagnostic RAND season hotfix executor

on:
  push:
    branches: [diag-oup-archive-transport]

permissions:
  contents: write

jobs:
  patch-rand:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v7
        with:
          ref: fix-rand-season-monitor-health
          fetch-depth: 0

      - name: Apply exact season-horizon patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("collectors/metadata_fallback.py")
          text = path.read_text(encoding="utf-8")
          old = '''    month_name = MONTHS_BY_ISSUE.get(issn, {}).get(issue, "")
              if month_name:
                  issue_month = datetime.strptime(month_name, "%B").month
                  return (issue_year, issue_month) <= (current.year, current.month)
          '''
          new = '''    month_name = MONTHS_BY_ISSUE.get(issn, {}).get(issue, "")
              if month_name:
                  season_months = {
                      "spring": 3,
                      "summer": 6,
                      "fall": 9,
                      "autumn": 9,
                      "winter": 12,
                  }
                  issue_month = season_months.get(month_name.casefold())
                  if issue_month is None:
                      issue_month = datetime.strptime(month_name, "%B").month
                  return (issue_year, issue_month) <= (current.year, current.month)
          '''
          if text.count(old) != 1:
              raise SystemExit(f"expected exactly one target snippet, found {text.count(old)}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Verify focused regression
        run: |
          python -m pip install -r requirements.txt
          python -m unittest tests.test_rand_season_horizon -v

      - name: Commit only production fix
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short
          test "$(git diff --name-only)" = "collectors/metadata_fallback.py"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collectors/metadata_fallback.py
          git commit -m "fix: handle seasonal issue horizon"
          git push origin HEAD:fix-rand-season-monitor-health
