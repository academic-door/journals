name: G06 R3 alternative authority diagnostic

on:
  push:
    branches:
      - g06-r3-alt-authority-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Restore current historical archives
        shell: bash
        run: |
          git fetch origin data
          rm -rf public/api
          git archive origin/data public/api/v1/journals | tar -x

      - name: Verify publisher-supplied RePEc as exact historical authority
        env:
          PYTHONPATH: ${{ github.workspace }}
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from collectors.elsevier import fetch_elsevier_repec_history_issue
          from collectors.metadata_fallback import fetch_repec_history_issue

          restat = [
              ("105","5"),("105","6"),
              ("106","1"),("106","2"),("106","4"),("106","5"),("106","6"),
              ("107","1"),("107","2"),("107","3"),("107","4"),("107","5"),("107","6"),
          ]
          red = [str(v) for v in range(47,59)]
          cer = ["80","94"]

          def archive(journal, issue_id):
              return json.loads(
                  Path(f"public/api/v1/journals/{journal}/issues/{issue_id}.json").read_text()
              )

          def dois(issue):
              return [
                  str(a.get("doi","")).strip().casefold()
                  for a in issue.get("articles", [])
                  if str(a.get("doi","")).strip()
              ]

          results=[]

          for volume, number in restat:
              issue_id=f"restat-{volume}-{number}"
              row={"journal":"RESTAT","issue_id":issue_id}
              try:
                  candidate=fetch_repec_history_issue(
                      journal_id="restat",
                      journal_name="The Review of Economics and Statistics",
                      issn="0034-6535",
                      volume=volume,
                      issue=number,
                      repec_series_code="tpr/restat",
                  )
                  old=archive("restat",issue_id)
                  row.update({
                      "candidate_count":candidate["research_article_count"],
                      "archive_count":old["research_article_count"],
                      "exact_ordered_doi":dois(candidate)==dois(old),
                      "same_doi_set":set(dois(candidate))==set(dois(old)),
                      "candidate_doi_complete":candidate["quality"]["doi_complete"],
                      "candidate_authors_complete":candidate["quality"]["authors_complete"],
                      "candidate_abstracts_complete":candidate["quality"]["abstract_en_complete"],
                      "authority":candidate["quality"]["roster_authority"],
                      "transport":candidate["quality"]["roster_transport"],
                      "candidate_dois":dois(candidate),
                      "archive_dois":dois(old),
                  })
              except Exception as exc:
                  row["error"]=f"{type(exc).__name__}: {exc}"
              results.append(row)

          for journal, volumes, series, issn, name in [
              ("red", red, "https://ideas.repec.org/s/red/issued.html", "1094-2025", "Review of Economic Dynamics"),
              ("cer", cer, "https://ideas.repec.org/s/eee/chieco.html", "1043-951X", "China Economic Review"),
          ]:
              for volume in volumes:
                  issue_id=f"{journal}-{volume}-c"
                  row={"journal":journal.upper(),"issue_id":issue_id}
                  try:
                      candidate=fetch_elsevier_repec_history_issue(
                          journal_id=journal,
                          journal_name=name,
                          issn=issn,
                          volume=volume,
                          issue="c",
                          repec_series_url=series,
                      )
                      old=archive(journal,issue_id)
                      row.update({
                          "candidate_count":candidate["research_article_count"],
                          "archive_count":old["research_article_count"],
                          "exact_ordered_doi":dois(candidate)==dois(old),
                          "same_doi_set":set(dois(candidate))==set(dois(old)),
                          "candidate_doi_complete":candidate["quality"]["doi_complete"],
                          "candidate_authors_complete":candidate["quality"]["authors_complete"],
                          "candidate_abstracts_complete":candidate["quality"]["abstract_en_complete"],
                          "authority":candidate["quality"]["roster_authority"],
                          "transport":candidate["quality"]["roster_transport"],
                          "candidate_dois":dois(candidate),
                          "archive_dois":dois(old),
                      })
                  except Exception as exc:
                      row["error"]=f"{type(exc).__name__}: {exc}"
                  results.append(row)

          print(json.dumps(results, indent=2))
          summary={
              "total":len(results),
              "errors":sum("error" in r for r in results),
              "exact_ordered_doi":sum(r.get("exact_ordered_doi") is True for r in results),
              "same_doi_set":sum(r.get("same_doi_set") is True for r in results),
              "candidate_complete":sum(
                  r.get("candidate_count")
                  and r.get("candidate_doi_complete")==r.get("candidate_count")
                  and r.get("candidate_authors_complete")==r.get("candidate_count")
                  and r.get("candidate_abstracts_complete")==r.get("candidate_count")
                  for r in results
              ),
          }
          print("SUMMARY", json.dumps(summary, indent=2))
          PY
