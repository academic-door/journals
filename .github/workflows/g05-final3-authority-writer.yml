name: Backfill field journal history

on:
  push:
    branches:
      - brain/g05-final3-authority-writer

permissions:
  contents: write

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  publish-final3-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Build final-three 2026 authoritative state on latest data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          data_tree="$RUNNER_TEMP/data-tree"
          git worktree add "$data_tree" origin/data
          git -C "$data_tree" switch -C data

          python scripts/apply_official_expected_set_observation.py \
            --evidence data/provenance/expected-set-observations/final3-2026-browser.json \
            --journals-config config/journals.yml \
            --output "$data_tree/data/backfill-state/final3-2026-browser.json"

          DATA_TREE="$data_tree" python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["DATA_TREE"]) / "data/backfill-state/final3-2026-browser.json"
          state = json.loads(path.read_text(encoding="utf-8"))
          journal_count = len(state["discovery"])
          entry_count = sum(len(s["issue_ids"]) for s in state["discovery"].values())
          excluded_count = len(state["expected_issue_exclusions"])
          assert journal_count == 3, journal_count
          assert entry_count == 13, entry_count
          assert excluded_count == 1, excluded_count
          assert set(state["discovery"]) == {"JLE", "JAERE", "RESTAT"}, state["discovery"]
          assert all(s["authority"] == "official_archive_snapshot" for s in state["discovery"].values())
          print(json.dumps({
              "journal_count": journal_count,
              "entry_count": entry_count,
              "excluded_count": excluded_count,
              "updated_at": state["updated_at"],
          }, sort_keys=True))
          PY

          state_args=()
          for state in "$data_tree"/data/backfill-state/*.json; do
            [ ! -f "$state" ] || state_args+=(--state "$state")
          done
          python scripts/build_completeness_ledger.py \
            "${state_args[@]}" \
            --api-root "$data_tree/public/api/v1" \
            --journals-config config/journals.yml \
            --window-end 2026-09-18 \
            --out-json "$RUNNER_TEMP/completeness-2026.json"

          LEDGER="$RUNNER_TEMP/completeness-2026.json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          ledger = json.loads(Path(os.environ["LEDGER"]).read_text(encoding="utf-8"))
          rec = ledger["reconciliation"]
          assert rec["journal_count"] == 49, rec
          assert rec["not_measured"] == 0, rec
          assert rec["authoritative_expected_issues_total"] == 296, rec
          assert rec["excluded_issues_total"] == 31, rec
          assert rec["effective_expected_issues_total"] == 265, rec
          print(json.dumps(rec, sort_keys=True))
          for row in ledger["journals"]:
              if row["journalKey"] in {"JLE", "JAERE", "RESTAT"}:
                  print(json.dumps({
                      "journal": row["journalKey"],
                      "status": row["status"],
                      "expected": row["expectedIssueCount"],
                      "ready": row["publicationReadyIssueCount"],
                      "missing": row["missingIssueCount"],
                      "blocked": row["sourceBlockedIssueCount"],
                      "excluded": len(row["excludedIssues"]),
                  }, sort_keys=True))
          PY

          python scripts/audit_history_coverage.py \
            "${state_args[@]}" \
            --api-root "$data_tree/public/api/v1" \
            --report-json "$RUNNER_TEMP/history-coverage.json"

          git -C "$data_tree" add data/backfill-state/final3-2026-browser.json
          if git -C "$data_tree" diff --cached --quiet; then
            echo "Final-three authority shard already matches target; no data commit required."
            exit 0
          fi
          git -C "$data_tree" config user.name "github-actions[bot]"
          git -C "$data_tree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$data_tree" commit -m "data(r2): bind final three 2026 expected sets"
          git -C "$data_tree" push origin data
