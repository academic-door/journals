name: G03 patch Elsevier RePEc authority once

on:
  push:
    branches:
      - fix/g03-elsevier-repec-authority-20260917

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: patch Elsevier authority propagation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/g03-elsevier-repec-authority-20260917
      - name: Apply minimal provenance propagation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('collectors/elsevier.py')
          text = path.read_text(encoding='utf-8')
          needle = '''        "quality": {
            "roster_match": True,
            "order_preserved": True,
            "official_item_count": len(source_rows),
'''
          replacement = '''        "quality": {
            "roster_match": True,
            "order_preserved": True,
            "roster_authority": (
                "official-issue-page" if official_rows else "repec-publisher-supplied"
            ),
            "roster_transport": (
                "official-issue-page" if official_rows else "repec-serial-page"
            ),
            "official_item_count": len(source_rows),
'''
          if text.count(needle) != 1:
              raise SystemExit(f'expected exactly one target block, found {text.count(needle)}')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY
          git diff --check
          python -m unittest tests.test_elsevier_repec_source_authority -v
          git config user.name academic-door-bot
          git config user.email academic-door-bot@users.noreply.github.com
          git add collectors/elsevier.py
          git commit -m 'fix(elsevier): preserve RePEc source authority'
          git push origin HEAD:fix/g03-elsevier-repec-authority-20260917
