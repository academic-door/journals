name: Probe R2 Land Economics exact inventory

on:
  push:
    branches: [probe/sciencedirect-r2-20260910]
    paths: [.github/workflows/probe-r2-sciencedirect.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify official UW Press 2025-2026 expected set
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/landecon-issues.txt"
          : > "$tmp"
          for year in 2025 2026; do
            url="https://le.uwpress.org/content/by/year/${year}"
            body="$RUNNER_TEMP/landecon-${year}.html"
            code=$(curl -L --compressed --retry 2 --connect-timeout 10 --max-time 60 \
              -A 'AcademicDoorJournals/0.1 (non-profit academic metadata service; https://academic-door.github.io/)' \
              -o "$body" -sS -w '%{http_code}' "$url")
            echo "$year HTTP: $code"
            test "$code" = 200
            grep -Eo 'href="[^"]+"' "$body" \
              | sed -E 's/^href="|"$//g' \
              | grep -E '^/content/(101|102)/[1-4]$' \
              | sort -u >> "$tmp"
          done
          sort -u "$tmp" -o "$tmp"
          cat "$tmp"
          cat > "$RUNNER_TEMP/expected.txt" <<'EOF'
          /content/101/1
          /content/101/2
          /content/101/3
          /content/101/4
          /content/102/1
          /content/102/2
          /content/102/3
          EOF
          diff -u "$RUNNER_TEMP/expected.txt" "$tmp"
      - name: Verify canonical archive readiness for the exact set
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          python - <<'PY'
          import json, subprocess
          expected = [
              'landecon-101-1','landecon-101-2','landecon-101-3','landecon-101-4',
              'landecon-102-1','landecon-102-2','landecon-102-3',
          ]
          rows=[]
          for issue_id in expected:
              raw=subprocess.check_output(['git','show',f'origin/data:public/api/v1/journals/landecon/issues/{issue_id}.json'])
              p=json.loads(raw)
              row=(issue_id,p.get('content_status'),p.get('source_status'),p.get('publication_state'),p.get('expected_article_count'),len(p.get('articles',[])))
              rows.append(row)
              print(row)
          assert all(r[1]=='complete' and r[2]=='official_verified' and r[3]=='ready' for r in rows), rows
          PY
