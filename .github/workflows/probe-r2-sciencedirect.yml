name: Probe R2 remaining archive transports

on:
  push:
    branches: [probe/sciencedirect-r2-20260910]
    paths: [.github/workflows/probe-r2-sciencedirect.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe official archive surfaces
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'LANDECON|https://le.uwpress.org/content/by/year'
            'RESTAT|https://direct.mit.edu/rest/issue'
            'ECTA|https://onlinelibrary.wiley.com/loi/14680262'
            'IER|https://onlinelibrary.wiley.com/loi/14682354'
            'AJAE|https://onlinelibrary.wiley.com/loi/14678276'
            'TE|https://onlinelibrary.wiley.com/loi/15567568'
            'RAND|https://onlinelibrary.wiley.com/loi/17562171'
            'JF|https://onlinelibrary.wiley.com/loi/15406261'
          )
          for pair in "${urls[@]}"; do
            key="${pair%%|*}"
            url="${pair#*|}"
            body="$RUNNER_TEMP/${key}.html"
            headers="$RUNNER_TEMP/${key}.headers"
            code=$(curl -L --compressed --retry 2 --connect-timeout 10 --max-time 60 \
              -A 'AcademicDoorJournals/0.1 (non-profit academic metadata service; https://academic-door.github.io/)' \
              -D "$headers" -o "$body" -sS -w '%{http_code}' "$url" || true)
            echo "=== ${key} ==="
            echo "URL: $url"
            echo "HTTP: $code"
            echo "BYTES: $(wc -c < "$body" 2>/dev/null || echo 0)"
            grep -i '^content-type:' "$headers" | tail -1 || true
            echo '-- archive markers --'
            grep -Eo 'href="[^"]+"' "$body" 2>/dev/null \
              | sed -E 's/^href="|"$//g' \
              | grep -Ei '(issue|toc|volume|content/[0-9]{4})' \
              | head -30 || true
            grep -Eo '(2025|2026|Volume [0-9]+|Vol\. [0-9]+)' "$body" 2>/dev/null \
              | head -30 || true
          done
