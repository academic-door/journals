name: G05 AJAE JF legacy archive build qualification

on:
  push:
    branches:
      - brain/g05-ajae-jf-legacy-browser-evidence
    paths:
      - .github/workflows/g05-ajae-jf-legacy-build-qualify.yml

permissions:
  contents: read
  models: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restore latest canonical data without publishing
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api data/backfill-state data/backfill-staging data/translation-cache
          mkdir -p public data
          git archive origin/data public/api data/backfill-state data/backfill-staging data/translation-cache | tar -x
      - name: Apply six exact rosters to existing provisional archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          for issue_id in ajae-108-1 ajae-108-2 ajae-108-3 jf-81-1 jf-81-2 jf-81-3; do
            python scripts/import_official_roster_evidence.py \
              "data/provenance/official-rosters/wiley/${issue_id}.json" \
              --api-root public/api/v1 \
              --state-root data/backfill-state \
              --output "output/${issue_id}.candidate.json" \
              --promote
          done
          python scripts/rebuild_public_snapshot.py
          python scripts/publish_data_delta.py rebuild-archive-indexes --root .
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_privacy.py
          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "ajae-108-1": ("ajae", 15, 1),
              "ajae-108-2": ("ajae", 12, 10),
              "ajae-108-3": ("ajae", 12, 1),
              "jf-81-1": ("jf", 12, 3),
              "jf-81-2": ("jf", 13, 4),
              "jf-81-3": ("jf", 13, 3),
          }
          for issue_id,(journal,count,excluded) in expected.items():
              path=Path(f"public/api/v1/journals/{journal}/issues/{issue_id}.json")
              issue=json.loads(path.read_text(encoding="utf-8"))
              got=(issue["publication_state"], issue["source_status"], issue["expected_article_count"], issue["research_article_count"], len(issue["articles"]), issue["quality"]["excluded_item_count"])
              want=("ready","official_verified",count,count,count,excluded)
              print("PROMOTED", issue_id, json.dumps({"got":got,"authority":issue["quality"].get("roster_authority"),"transport":issue["quality"].get("roster_transport")}, default=list, sort_keys=True))
              if got != want:
                  raise SystemExit(f"{issue_id}: candidate tuple {got!r} != {want!r}")
              if issue["quality"]["roster_authority"] != "official-issue-page":
                  raise SystemExit(f"{issue_id}: roster authority regression")
              if issue["quality"]["roster_transport"] != "browser-authorized":
                  raise SystemExit(f"{issue_id}: roster transport regression")
              if not issue["quality"].get("roster_match") or not issue["quality"].get("order_preserved"):
                  raise SystemExit(f"{issue_id}: exact roster/order gate failed")
              if not all(a.get("translation",{}).get("status")=="complete" for a in issue["articles"]):
                  raise SystemExit(f"{issue_id}: translation gate incomplete")
          PY
