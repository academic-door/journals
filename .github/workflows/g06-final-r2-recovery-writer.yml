name: G06 final R2 recovery writer

on:
  push:
    branches:
      - g06-r2-final-writer

permissions:
  contents: write
  models: read

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  close-final-r2-debt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Restore canonical data and snapshot baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          for path in public/api data/translation-cache data/backfill-state data/backfill-staging; do
            if git cat-file -e "origin/data:$path" 2>/dev/null; then
              rm -rf "$path"
              git archive origin/data "$path" | tar -x
            fi
          done
          python scripts/publish_data_delta.py snapshot             --root .             --output "$RUNNER_TEMP/data-baseline"             --path public/api/v1/journals             --path data/translation-cache             --path data/backfill-state             --path data/backfill-staging             --exclude 'public/api/v1/journals/*/issues/index.json'

      - name: Recover JAERE 13(5) and reconcile RESTAT 108(1-4)
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          TRANSLATION_RETRIES: "5"
          TRANSLATION_WORKERS: "1"
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          import requests
          import yaml

          from collectors.metadata_fallback import fetch_repec_history_issue
          from scripts.build_archives_from_roster_evidence import (
              _crossref_map,
              _metadata_for_dois,
              build_candidate_from_evidence,
          )
          from scripts.import_official_roster_evidence import reconcile_state_files
          from scripts.translate_issue import translate_missing
          from scripts.update_journals import (
              apply_translation_cache,
              archive_issue,
              normalize_issue_content,
              stamp_issue_readiness,
              validate_issue,
          )

          api_root = Path("public/api/v1")
          state_root = Path("data/backfill-state")
          evidence = json.loads(
              Path("data/provenance/official-rosters/jaere/jaere-13-5.json")
              .read_text(encoding="utf-8")
          )
          journal = yaml.safe_load(
              Path("config/journals.yml").read_text(encoding="utf-8")
          )["journals"]["JAERE"]

          if len(evidence["items"]) != 8 or len(evidence.get("excluded_items", [])) != 1:
              raise RuntimeError("JAERE official roster baseline changed unexpectedly")

          session = requests.Session()
          session.headers.update({
              "User-Agent": "AcademicDoorJournals/1.0 (R2 metadata reconciliation)",
              "Accept": "application/json,text/html",
          })
          dois = [str(item["doi"]).strip().casefold() for item in evidence["items"]]
          crossref = _crossref_map(
              session,
              str(journal["issn"]),
              start_year=2026,
              timeout=45,
          )
          metadata = _metadata_for_dois(
              session,
              dois,
              crossref,
              timeout=45,
          )

          repec = fetch_repec_history_issue(
              journal_id="jaere",
              journal_name=str(journal["name"]),
              issn=str(journal["issn"]),
              volume="13",
              issue="5",
              repec_series_code=str(journal.get("repec_series_code", "ucp/jaerec")),
              session=session,
              timeout=60,
          )
          repec_by_doi = {
              str(article.get("doi", "")).strip().casefold(): article
              for article in repec.get("articles", [])
              if str(article.get("doi", "")).strip()
          }
          if set(dois) != set(repec_by_doi):
              raise RuntimeError(
                  f"JAERE RePEc DOI set mismatch: official={len(dois)} repec={len(repec_by_doi)}"
              )

          candidate = build_candidate_from_evidence(
              evidence,
              journal,
              metadata,
              publication_date=str(repec.get("publication_date", "") or "2026"),
          )
          for article in candidate["articles"]:
              doi = str(article.get("doi", "")).strip().casefold()
              fallback = repec_by_doi[doi]
              if not article.get("authors") and fallback.get("authors"):
                  article["authors"] = list(fallback["authors"])
                  article.setdefault("sources", {})["metadata"] = "repec-publisher-supplied"
              if (
                  not str(article.get("abstract_en", "")).strip()
                  and str(fallback.get("abstract_en", "")).strip()
              ):
                  article["abstract_en"] = str(fallback["abstract_en"]).strip()
                  article.setdefault("sources", {})["abstract_en"] = "repec-publisher-supplied"
                  repec_url = str(fallback.get("sources", {}).get("repec", "")).strip()
                  if repec_url:
                      article.setdefault("sources", {})["repec"] = repec_url

          candidate = normalize_issue_content(candidate)
          if candidate["quality"]["authors_complete"] != 8:
              raise RuntimeError(f"JAERE authors incomplete: {candidate['quality']}")
          if candidate["quality"]["abstract_en_complete"] != 8:
              raise RuntimeError(f"JAERE abstracts incomplete: {candidate['quality']}")

          cache_path = Path("data/translation-cache/jaere.json")
          report = translate_missing(candidate, cache_path, max_translations=20)
          print("JAERE_TRANSLATE_REPORT", json.dumps(report, sort_keys=True))
          candidate = apply_translation_cache(candidate, cache_path=cache_path)
          candidate = normalize_issue_content(candidate)
          stamp_issue_readiness(candidate)
          validate_issue(candidate)

          if candidate.get("source_status") != "official_verified":
              raise RuntimeError(f"JAERE source gate failed: {candidate.get('source_status')}")
          if candidate.get("publication_state") != "ready":
              raise RuntimeError(
                  f"JAERE publication gate failed: {candidate.get('publication_state')} "
                  f"quality={candidate.get('quality')}"
              )
          if candidate["quality"]["translation_complete"] != 8:
              raise RuntimeError(f"JAERE translation incomplete: {candidate['quality']}")

          archived = archive_issue(
              candidate,
              api_root=api_root,
              replace_non_ready=True,
          )
          if archived is None:
              raise RuntimeError("JAERE archive promotion failed")
          reconcile_state_files(candidate, state_root)
          print(json.dumps({
              "issue_id": "jaere-13-5",
              "research": 8,
              "source": candidate["source_status"],
              "publication_state": candidate["publication_state"],
          }, sort_keys=True))
          PY

          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          import requests
          import yaml

          from scripts.build_archives_from_roster_evidence import (
              _crossref_map,
              _metadata_for_dois,
          )
          from scripts.import_official_roster_evidence import (
              apply_evidence,
              reconcile_state_files,
          )
          from scripts.translate_issue import translate_missing
          from scripts.update_journals import (
              apply_translation_cache,
              archive_issue,
              normalize_issue_content,
              stamp_issue_readiness,
              validate_issue,
          )

          api_root = Path("public/api/v1")
          state_root = Path("data/backfill-state")
          cache_path = Path("data/translation-cache/restat.json")
          evidence_root = Path("data/provenance/official-rosters/restat")
          journal = yaml.safe_load(
              Path("config/journals.yml").read_text(encoding="utf-8")
          )["journals"]["RESTAT"]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "AcademicDoorJournals/1.0 (R2 official roster reconciliation)",
              "Accept": "application/json",
          })
          crossref = _crossref_map(
              session,
              str(journal["issn"]),
              start_year=2026,
              timeout=45,
          )

          expected_counts = {
              "restat-108-1": 19,
              "restat-108-2": 18,
              "restat-108-3": 21,
              "restat-108-4": 21,
          }
          restoration_counts = {}
          for issue_id, expected_count in expected_counts.items():
              evidence_path = evidence_root / f"{issue_id}.json"
              evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
              archive_path = api_root / "journals/restat/issues" / f"{issue_id}.json"
              issue = json.loads(archive_path.read_text(encoding="utf-8"))
              if issue.get("publication_state") == "ready":
                  raise RuntimeError(f"{issue_id}: refusing to rewrite an already-ready archive")

              archive_dois = {
                  str(article.get("doi", "")).strip().casefold()
                  for article in issue.get("articles", [])
              }
              missing = [
                  item for item in evidence["items"]
                  if str(item["doi"]).strip().casefold() not in archive_dois
              ]
              restoration_counts[issue_id] = len(missing)
              missing_dois = [str(item["doi"]).strip().casefold() for item in missing]
              metadata = _metadata_for_dois(
                  session,
                  missing_dois,
                  crossref,
                  timeout=45,
              )
              enriched = copy.deepcopy(evidence)
              enriched_by_doi = {
                  str(item["doi"]).strip().casefold(): item
                  for item in enriched["items"]
              }
              for source_item in missing:
                  doi = str(source_item["doi"]).strip().casefold()
                  meta = metadata.get(doi, {})
                  authors = [
                      str(author).strip()
                      for author in meta.get("authors", [])
                      if str(author).strip()
                  ]
                  abstract = str(meta.get("abstract", "")).strip()
                  official_article_url = str(
                      source_item.get("official_article_url", "")
                  ).strip()
                  if not authors or not abstract or not official_article_url:
                      raise RuntimeError(
                          f"{issue_id}: missing restoration metadata for {doi}: "
                          f"authors={bool(authors)} abstract={bool(abstract)} "
                          f"official_url={bool(official_article_url)}"
                      )
                  enriched_by_doi[doi].update(
                      authors=authors,
                      abstract_en=abstract,
                      source_url=official_article_url,
                  )

              candidate = apply_evidence(issue, enriched)
              report = translate_missing(candidate, cache_path, max_translations=30)
              print(issue_id, "TRANSLATE_REPORT", json.dumps(report, sort_keys=True))
              candidate = apply_translation_cache(candidate, cache_path=cache_path)
              candidate = normalize_issue_content(candidate)
              stamp_issue_readiness(candidate)
              validate_issue(candidate)

              if len(candidate.get("articles", [])) != expected_count:
                  raise RuntimeError(
                      f"{issue_id}: expected {expected_count} research articles, "
                      f"got {len(candidate.get('articles', []))}"
                  )
              if candidate.get("source_status") != "official_verified":
                  raise RuntimeError(
                      f"{issue_id}: source gate failed: {candidate.get('source_status')}"
                  )
              if candidate.get("publication_state") != "ready":
                  raise RuntimeError(
                      f"{issue_id}: publication gate failed: "
                      f"{candidate.get('publication_state')} quality={candidate.get('quality')}"
                  )

              archived = archive_issue(
                  candidate,
                  api_root=api_root,
                  replace_non_ready=True,
              )
              if archived is None:
                  raise RuntimeError(f"{issue_id}: archive promotion failed")
              reconcile_state_files(candidate, state_root)

          expected_restorations = {
              "restat-108-1": 4,
              "restat-108-2": 4,
              "restat-108-3": 4,
              "restat-108-4": 0,
          }
          if restoration_counts != expected_restorations:
              raise RuntimeError(
                  f"RESTAT archive baseline changed unexpectedly: {restoration_counts}"
              )
          print(json.dumps({"restoration_counts": restoration_counts}, sort_keys=True))
          PY

          python scripts/rebuild_public_snapshot.py
          python scripts/publish_data_delta.py rebuild-archive-indexes --root .
          python scripts/rebuild_public_snapshot.py --check
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_privacy.py
          python -m unittest             tests.test_issue_schema             tests.test_public_snapshot_consistency             tests.test_public_data_branch_ownership             tests.test_r2_final_roster_evidence -v

          python - <<'PY'
          import json
          from pathlib import Path

          expected = {
              "jaere": {"jaere-13-5": 8},
              "restat": {
                  "restat-108-1": 19,
                  "restat-108-2": 18,
                  "restat-108-3": 21,
                  "restat-108-4": 21,
              },
          }
          for journal, issues in expected.items():
              for issue_id, count in issues.items():
                  path = Path(
                      f"public/api/v1/journals/{journal}/issues/{issue_id}.json"
                  )
                  issue = json.loads(path.read_text(encoding="utf-8"))
                  assert issue["source_status"] == "official_verified", (
                      issue_id, issue["source_status"]
                  )
                  assert issue["publication_state"] == "ready", (
                      issue_id, issue["publication_state"]
                  )
                  assert issue["research_article_count"] == count, (
                      issue_id, issue["research_article_count"]
                  )
                  assert len(issue["articles"]) == count, (
                      issue_id, len(issue["articles"])
                  )
                  assert issue["quality"]["translation_complete"] == count, (
                      issue_id, issue["quality"]["translation_complete"]
                  )
                  print(json.dumps({
                      "issue_id": issue_id,
                      "research": count,
                      "source": issue["source_status"],
                      "publication_state": issue["publication_state"],
                  }, sort_keys=True))
          PY

          state_args=()
          for state in data/backfill-state/*.json; do
            [ ! -f "$state" ] || state_args+=(--state "$state")
          done
          python scripts/build_completeness_ledger.py             "${state_args[@]}"             --api-root public/api/v1             --journals-config config/journals.yml             --window-end 2026-09-18             --out-json "$RUNNER_TEMP/completeness-2026.json"

          LEDGER="$RUNNER_TEMP/completeness-2026.json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          ledger = json.loads(Path(os.environ["LEDGER"]).read_text(encoding="utf-8"))
          rec = ledger["reconciliation"]
          print("FINAL_R2_RECONCILIATION", json.dumps(rec, sort_keys=True))
          assert rec["journal_count"] == 49, rec
          assert rec["complete"] == 49, rec
          assert rec["not_measured"] == 0, rec
          assert rec["partial"] == 0, rec
          assert rec["source_blocked"] == 0, rec
          assert rec["confirmed_missing_issues_total"] == 0, rec
          assert rec["blocked_issues_total"] == 0, rec
          assert (
              rec["publication_ready_issues_total"]
              == rec["effective_expected_issues_total"]
          ), rec
          for key in ("JAERE", "RESTAT", "JLE"):
              row = next(r for r in ledger["journals"] if r["journalKey"] == key)
              assert row["status"] == "COMPLETE", row
          PY

      - name: Publish guarded delta
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_data_delta.py snapshot             --root .             --output "$RUNNER_TEMP/generated-data"             --path public/api/v1/journals             --path data/translation-cache             --path data/backfill-state             --path data/backfill-staging             --exclude 'public/api/v1/journals/*/issues/index.json'

          data_tree="$RUNNER_TEMP/data-tree"
          for attempt in 1 2 3 4 5; do
            git fetch origin data
            git worktree remove --force "$data_tree" 2>/dev/null || true
            rm -rf "$data_tree"
            git worktree add "$data_tree" origin/data
            git -C "$data_tree" switch -C data

            if python scripts/publish_data_delta.py apply               --baseline "$RUNNER_TEMP/data-baseline"               --generated "$RUNNER_TEMP/generated-data"               --target "$data_tree"               --path public/api/v1/journals               --path data/translation-cache               --path data/backfill-state               --path data/backfill-staging               --exclude 'public/api/v1/journals/*/issues/index.json'; then

              rm -rf public/api
              cp -R "$data_tree/public/api" public/api
              cp -R "$RUNNER_TEMP/generated-data/public/api/v1/journals/."                 public/api/v1/journals/
              python scripts/rebuild_public_snapshot.py
              python scripts/publish_data_delta.py rebuild-archive-indexes --root .
              cp -R public/api/. "$data_tree/public/api/"

              git -C "$data_tree" config user.name "academic-door-bot"
              git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
              git -C "$data_tree" add -A public/api data/translation-cache
              git -C "$data_tree" add -f data/backfill-state data/backfill-staging                 2>/dev/null || true
              if git -C "$data_tree" diff --cached --quiet; then
                echo "No final R2 data changes."
                exit 0
              fi
              git -C "$data_tree" commit -m "data(r2): close JAERE and RESTAT 2026 debt"
              if git -C "$data_tree" push origin HEAD:data; then
                exit 0
              fi
            fi
            sleep $((attempt * 10))
          done
          exit 1
