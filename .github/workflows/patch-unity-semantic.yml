name: Patch bounded mathematical unity semantics

on:
  push:
    branches:
      - fix/translation-unity-semantic-20260911
    paths:
      - .github/workflows/patch-unity-semantic.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/translation-unity-semantic-20260911
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Apply exact parser patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/translate_issue.py')
          raw = path.read_bytes()
          nl = b'\r\n' if b'\r\n' in raw else b'\n'

          helper_anchor = nl.join([
              b'    ) is not None',
              b'',
              b'def _semantic_numbers(value: str) -> list[str]:',
          ])
          helper = nl.join([
              b'    ) is not None',
              b'',
              b'_MATHEMATICAL_UNITY_RE = re.compile(',
              b'    r"(?:\\b(?:equals?|equal\\s+to|above|below|greater\\s+than|less\\s+than|relative\\s+to)\\s+"',
              b'    r"(?P<direct>unity)\\b|"',
              b'    r"\\b(?:relationship|ratio|value|coefficient|elasticity|parameter|statistic|index|measure)\\b"',
              b'    r"[^.;:!?]{0,80}\\b(?:with|to)\\s+(?P<relational>unity)\\b)",',
              b'    re.IGNORECASE,',
              b')',
              b'',
              b'def _semantic_numbers(value: str) -> list[str]:',
          ])
          if raw.count(helper_anchor) != 1:
              raise SystemExit(f'helper anchor count={raw.count(helper_anchor)}')
          raw = raw.replace(helper_anchor, helper, 1)

          loop_anchor = nl.join([
              b'    value = value.replace("\\u2010", "-").replace("\\u2011", "-")',
              b'',
              b'    # 0. Shared-scale ranges: "585.9 to 598.4 billion", "849\xe8\x87\xb3867\xe4\xba\xbf\xe7\xbe\x8e\xe5\x85\x83",',
          ])
          loop = nl.join([
              b'    value = value.replace("\\u2010", "-").replace("\\u2011", "-")',
              b'',
              b'    # Mathematical "unity" denotes numeric 1 only in explicit comparator/relation contexts.',
              b'    for match in _MATHEMATICAL_UNITY_RE.finditer(value):',
              b'        group = "direct" if match.group("direct") is not None else "relational"',
              b'        span = match.span(group)',
              b'        if overlaps(span):',
              b'            continue',
              b'        record("1", span)',
              b'',
              b'    # 0. Shared-scale ranges: "585.9 to 598.4 billion", "849\xe8\x87\xb3867\xe4\xba\xbf\xe7\xbe\x8e\xe5\x85\x83",',
          ])
          if raw.count(loop_anchor) != 1:
              raise SystemExit(f'loop anchor count={raw.count(loop_anchor)}')
          raw = raw.replace(loop_anchor, loop, 1)
          path.write_bytes(raw)
          PY
          python -m unittest tests.test_translation_unity_semantics tests.test_translation_anaphoric_one -v
          git diff --check
      - name: Commit production patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-unity-semantic.yml
          git config user.name 'academic-door-bot'
          git config user.email 'academic-door-bot@users.noreply.github.com'
          git add scripts/translate_issue.py .github/workflows/patch-unity-semantic.yml
          git diff --cached --check
          git commit -m 'fix(translation): recognize bounded mathematical unity as one'
          git push origin HEAD:fix/translation-unity-semantic-20260911
