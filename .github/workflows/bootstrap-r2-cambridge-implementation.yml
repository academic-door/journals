name: Bootstrap R2 Cambridge implementation

on:
  push:
    branches: [r2/cambridge-jeh-20260910]
    paths: [.github/workflows/bootstrap-r2-cambridge-implementation.yml]

permissions:
  contents: write

jobs:
  verify-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Apply bounded Cambridge parser and JEH config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          history = Path('collectors/history.py')
          text = history.read_text()
          needle = (
              '        elif platform == "wiley":\n'
              '            match = re.search(r"/toc/14680262/(20\\d{2})/(\\d+)/(\\d+)", path)\n'
              '            if match:\n'
              '                year, volume, issue = int(match.group(1)), match.group(2), match.group(3)\n'
          )
          replacement = (
              '        elif platform == "cambridge":\n'
              '            match = re.fullmatch(\n'
              '                r"/core/journals/journal-of-economic-history/issue/[^/]+",\n'
              '                path.rstrip("/"),\n'
              '            )\n'
              '            issue_match = re.search(r"\\b(?:Special\\s+)?Issue\\s+(\\d+)\\b", text, re.IGNORECASE)\n'
              '            panel = link.find_parent("div", id=re.compile(r"^panel\\d+$"))\n'
              '            panel_id = str(panel.get("id", "")) if panel is not None else ""\n'
              '            panel_match = re.fullmatch(r"panel(\\d+)", panel_id)\n'
              '            year_match = YEAR_PATTERN.search(text)\n'
              '            if match and issue_match and panel_match and year_match:\n'
              '                volume = panel_match.group(1)\n'
              '                issue = issue_match.group(1)\n'
              '                year = int(year_match.group(1))\n'
              '        elif platform == "wiley":\n'
              '            match = re.search(r"/toc/14680262/(20\\d{2})/(\\d+)/(\\d+)", path)\n'
              '            if match:\n'
              '                year, volume, issue = int(match.group(1)), match.group(2), match.group(3)\n'
          )
          if needle not in text:
              raise SystemExit('history parser anchor not found')
          history.write_text(text.replace(needle, replacement, 1))

          config = Path('config/field-history.yml')
          text = config.read_text()
          needle = (
              '  JEH:\n'
              '    platform: crossref\n'
              '    issn: 0022-0507\n'
              '    issue_url_template: https://www.cambridge.org/core/journals/journal-of-economic-history\n'
          )
          replacement = (
              '  JEH:\n'
              '    platform: cambridge\n'
              '    issn: 0022-0507\n'
              '    archive_url: https://www.cambridge.org/core/journals/journal-of-economic-history/all-issues\n'
              '    allowed_host: www.cambridge.org\n'
              '    issue_url_template: https://www.cambridge.org/core/journals/journal-of-economic-history\n'
          )
          if needle not in text:
              raise SystemExit('JEH config anchor not found')
          config.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Verify exact live Cambridge expected set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          from collectors.history import discover_official_issues

          definition = yaml.safe_load(open('config/field-history.yml'))['journals']['JEH']
          issues = discover_official_issues('JEH', definition, years=[2025, 2026])
          got = [issue.issue_id for issue in issues]
          expected = [
              'jeh-85-1', 'jeh-85-2', 'jeh-85-3', 'jeh-85-4',
              'jeh-86-1', 'jeh-86-2',
          ]
          print('live JEH issues:', got)
          assert got == expected, got
          PY

      - name: Run unit suite
        run: python -m unittest discover -s tests -v

      - name: Persist bounded implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name academic-door-bot
          git config user.email academic-door-bot@users.noreply.github.com
          git add collectors/history.py config/field-history.yml
          git diff --cached --check
          git commit -m 'feat(history): add JEH live Cambridge expected set'
          git push origin HEAD:r2/cambridge-jeh-20260910
