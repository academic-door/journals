name: Bootstrap R2 Cambridge implementation

on:
  push:
    branches: [r2/cambridge-jeh-20260910]
    paths: [.github/workflows/bootstrap-r2-cambridge-implementation.yml]

permissions:
  contents: write

jobs:
  verify-and-persist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Apply bounded Cambridge parser and JEH config
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          history = Path('collectors/history.py')
          text = history.read_text()
          needle = '''        elif platform == "wiley":
            match = re.search(r"/toc/14680262/(20\\d{2})/(\\d+)/(\\d+)", path)
            if match:
                year, volume, issue = int(match.group(1)), match.group(2), match.group(3)
'''
          replacement = '''        elif platform == "cambridge":
            match = re.fullmatch(
                r"/core/journals/journal-of-economic-history/issue/[^/]+",
                path.rstrip("/"),
            )
            issue_match = re.search(r"\\b(?:Special\\s+)?Issue\\s+(\\d+)\\b", text, re.IGNORECASE)
            panel = link.find_parent("div", id=re.compile(r"^panel\\d+$"))
            panel_id = str(panel.get("id", "")) if panel is not None else ""
            panel_match = re.fullmatch(r"panel(\\d+)", panel_id)
            year_match = YEAR_PATTERN.search(text)
            if match and issue_match and panel_match and year_match:
                volume = panel_match.group(1)
                issue = issue_match.group(1)
                year = int(year_match.group(1))
        elif platform == "wiley":
            match = re.search(r"/toc/14680262/(20\\d{2})/(\\d+)/(\\d+)", path)
            if match:
                year, volume, issue = int(match.group(1)), match.group(2), match.group(3)
'''
          if needle not in text:
              raise SystemExit('history parser anchor not found')
          history.write_text(text.replace(needle, replacement, 1))

          config = Path('config/field-history.yml')
          text = config.read_text()
          needle = '''  JEH:
    platform: crossref
    issn: 0022-0507
    issue_url_template: https://www.cambridge.org/core/journals/journal-of-economic-history
'''
          replacement = '''  JEH:
    platform: cambridge
    issn: 0022-0507
    archive_url: https://www.cambridge.org/core/journals/journal-of-economic-history/all-issues
    allowed_host: www.cambridge.org
    issue_url_template: https://www.cambridge.org/core/journals/journal-of-economic-history
'''
          if needle not in text:
              raise SystemExit('JEH config anchor not found')
          config.write_text(text.replace(needle, replacement, 1))
          PY

      - name: Verify exact live Cambridge expected set
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          from collectors.history import discover_official_issues

          definition = yaml.safe_load(open('config/field-history.yml'))['journals']['JEH']
          issues = discover_official_issues('JEH', definition, years=[2025, 2026])
          got = [issue.issue_id for issue in issues]
          expected = [
              'jeh-85-1', 'jeh-85-2', 'jeh-85-3', 'jeh-85-4',
              'jeh-86-1', 'jeh-86-2',
          ]
          print('live JEH issues:', got)
          assert got == expected, got
          PY

      - name: Run unit suite
        run: python -m unittest discover -s tests -v

      - name: Persist bounded implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name academic-door-bot
          git config user.email academic-door-bot@users.noreply.github.com
          git add collectors/history.py config/field-history.yml
          git diff --cached --check
          git commit -m 'feat(history): add JEH live Cambridge expected set'
          git push origin HEAD:r2/cambridge-jeh-20260910
