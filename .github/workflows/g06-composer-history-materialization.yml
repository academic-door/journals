name: G06 Composer history materialization

on:
  push:
    branches:
      - g06-freshness-history-fix
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: g06-composer-history-materialization
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Restore current journals data branch truth
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api
          mkdir -p public
          git archive origin/data public/api public/project-manifest.json | tar -x

      - name: Materialize current journals data into Composer main
        env:
          COMPOSER_DEPLOY_KEY: ${{ secrets.COMPOSER_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$COMPOSER_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          target="$RUNNER_TEMP/composer-history-sync"
          git clone --depth=1 git@github.com:academic-door/academic-door-composer.git "$target"

          python "$target/scripts/build_data.py"             --journals-source "$GITHUB_WORKSPACE/public"             --output "$target/site/data"

          python "$target/scripts/validate_bundle.py" --site "$target/site"

          TARGET="$target" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["TARGET"])
          index = json.loads((root / "site/data/index.json").read_text(encoding="utf-8"))
          journals = next(source for source in index["sources"] if source["id"] == "journals")
          descriptors = journals["issues"]

          by_journal = {}
          for item in descriptors:
              by_journal.setdefault(item["journal_id"], []).append(item)

          for journal_id in ("ej", "aer"):
              rows = by_journal.get(journal_id, [])
              assert len(rows) > 1, f"{journal_id}: expected multiple audited issues, got {len(rows)}"
              for row in rows:
                  payload = root / "site" / row["url"]
                  assert payload.is_file(), f"missing historical payload: {payload}"

          for journal_id, rows in by_journal.items():
              candidates = [row for row in rows if row.get("publication_queue_candidate") is True]
              assert len(candidates) == 1, (
                  f"{journal_id}: expected exactly one publication queue candidate, got {len(candidates)}"
              )
          print(json.dumps({
              "journal_issue_count": len(descriptors),
              "journal_count": len(by_journal),
              "ej_issue_count": len(by_journal.get("ej", [])),
              "aer_issue_count": len(by_journal.get("aer", [])),
              "queue_candidate_count": sum(
                  1 for row in descriptors if row.get("publication_queue_candidate") is True
              ),
          }, indent=2))
          PY

          cd "$target"
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then
            echo "Composer already contains current multi-issue journal materialization."
            git rev-parse HEAD
            exit 0
          fi
          git commit -m "Sync audited journal history"
          git push origin HEAD:main
          git rev-parse HEAD
