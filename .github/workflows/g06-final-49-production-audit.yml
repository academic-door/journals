name: G06 final 49-journal production audit

on:
  push:
    branches:
      - g06-final-49-production-audit

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Restore current production truth
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api data/monitoring
          git archive origin/data public/api public/project-manifest.json data/monitoring | tar -x

      - name: Re-run live 49-journal detector without publishing
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/journal_monitor.py             --state "$RUNNER_TEMP/monitor-state.json"             --result "$RUNNER_TEMP/monitor-result.json"             --public-status "$RUNNER_TEMP/monitoring.json"

          python - <<'PY'
          import json, os
          from pathlib import Path

          status = json.loads(Path(os.environ["RUNNER_TEMP"], "monitoring.json").read_text())
          summary = status["summary"]
          print(json.dumps({
              "updated_at": status["updated_at"],
              "status": status["status"],
              "summary": summary,
              "warnings": status.get("warning_journals", []),
              "awaiting": status.get("awaiting_official_journals", []),
              "failed": status.get("failed_journals", []),
          }, indent=2))
          assert summary["configured_journals"] == 49, summary
          assert summary["warnings"] == 0, summary
          assert summary["awaiting_official"] == 0, summary
          assert summary["failed"] == 0, summary
          assert summary["candidates"] == 0, summary
          assert summary["confirmed_updates"] == 0, summary
          assert summary["unchanged"] == 49, summary
          PY

      - name: Verify canonical current issue invariants
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(journal):
              return json.loads(
                  Path(f"public/api/v1/journals/{journal}/issues/current.json").read_text()
              )

          expected = {
              "ecta": ("ecta-94-5", "September 2026", "official_verified", "ready"),
              "landecon": ("landecon-102-3", "July 2026", "official_verified", "ready"),
              "rand": ("rand-57-3", "Fall 2026", "publisher_verified", "ready"),
          }
          for journal, values in expected.items():
              issue = load(journal)
              actual = (
                  issue["issue_id"],
                  issue["publication_date"],
                  issue["source_status"],
                  issue["publication_state"],
              )
              print(journal, actual)
              assert actual == values, (journal, actual, values)

          ecta = load("ecta")
          q = ecta["quality"]
          assert ecta["research_article_count"] == 12
          assert q["authors_complete"] == 12
          assert q["abstract_en_complete"] == 12
          assert q["translation_complete"] == 12
          assert q["roster_authority"] == "official-issue-page"
          assert q["roster_transport"] == "econometric-society-page"
          assert q["flags"] == []
          PY

      - name: Verify reader-facing ready-only contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n --exclude-dir=node_modules --exclude-dir=.git "待来源核验"             src public scripts tests
          grep -F 'entry.publication_state === "ready"' src/components/Top5Explorer.astro
          grep -F 'issue.publication_state === "ready"' src/pages/composer/index.astro
          grep -F 'issue_publication_state(archived) == "ready"' scripts/update_journals.py

          python - <<'PY'
          import json
          from pathlib import Path

          roots = Path("public/api/v1/journals")
          total = 0
          nonready = []
          for index_path in roots.glob("*/issues/index.json"):
              payload = json.loads(index_path.read_text())
              for issue in payload.get("issues", []):
                  total += 1
                  # Diagnostic index may retain non-ready history, but all reader
                  # surfaces must filter it. Count it here for transparency only.
                  if issue.get("publication_state") != "ready":
                      nonready.append((index_path.parts[-3], issue.get("issue_id"), issue.get("publication_state")))
          print(json.dumps({
              "issue_index_entries": total,
              "diagnostic_nonready_entries": len(nonready),
              "sample": nonready[:20],
          }, indent=2))
          PY

      - name: Run production audits
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_freshness.py
          python scripts/rebuild_public_snapshot.py --check
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_privacy.py
          python -m unittest discover -s tests

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
