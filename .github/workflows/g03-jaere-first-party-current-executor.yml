name: G03 Chicago public surface probe

on:
  push:
    branches:
      - feat/g03-jaere-first-party-current-20260916

permissions:
  contents: read

jobs:
  probe:
    if: "${{ github.event.head_commit.message == 'chore: probe G03 Chicago public surfaces' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.32.4
      - name: Probe official machine-readable and HTML surfaces
        run: |
          python - <<'PY'
          import requests

          headers = {
              'User-Agent': 'AcademicDoorJournals/0.1 (non-profit academic metadata service; https://academic-door.github.io/)'
          }
          urls = {
              'current': 'https://www.journals.uchicago.edu/toc/jaere/current',
              'issues': 'https://www.journals.uchicago.edu/loi/jaere',
              'rss': 'https://www.journals.uchicago.edu/action/showFeed?type=etoc&feed=rss&jc=jaere',
              'rss-list-xlsx': 'https://www.journals.uchicago.edu/pb-assets/docs/division/chicago-journals-rss-feeds-1768405514380.xlsx',
              'kbart': 'https://www.journals.uchicago.edu/kbart',
          }
          for name, url in urls.items():
              try:
                  response = requests.get(url, headers=headers, timeout=30)
                  print(f'PROBE {name}: status={response.status_code} type={response.headers.get("content-type", "")} bytes={len(response.content)} final={response.url}')
                  if name in {'rss', 'kbart'} and response.status_code == 200:
                      sample = response.content[:5000].decode('utf-8', errors='replace')
                      print(f'BEGIN {name} SAMPLE')
                      print(sample)
                      print(f'END {name} SAMPLE')
              except Exception as exc:
                  print(f'PROBE {name}: ERROR {type(exc).__name__}: {exc}')
          PY
