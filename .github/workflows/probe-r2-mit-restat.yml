name: Probe R2 MIT RESTAT

on:
  push:
    branches:
      - probe/r2-mit-restat-20260910

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Probe MIT Press official issue archive
        run: |
          python - <<'PY'
          import re
          from urllib.request import Request, urlopen

          url = "https://direct.mit.edu/rest/issue/browse-by-year"
          headers = {
              "User-Agent": "AcademicDoorJournals/0.1 (non-profit academic metadata service; https://academic-door.github.io/)",
              "Accept-Language": "en-US,en;q=0.8",
          }
          request = Request(url, headers=headers)
          with urlopen(request, timeout=45) as response:
              status = response.status
              final_url = response.geturl()
              content = response.read()
          print(f"RESTAT archive status={status} bytes={len(content)} url={final_url}")
          text = content.decode("utf-8", errors="replace")
          markers = sorted(set(re.findall(r"Volume\s*108\s*,?\s*Issue\s*(\d+)", text, flags=re.IGNORECASE)))
          print(f"RESTAT 2026 volume=108 observed_issue_markers={markers}")
          if not markers:
              raise SystemExit("RESTAT archive returned no Volume 108 issue markers")
          PY
