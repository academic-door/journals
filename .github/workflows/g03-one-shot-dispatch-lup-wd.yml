name: G03 one-shot LUP WD dispatcher

on:
  push:
    branches:
      - ops/g03-dispatch-lup-wd-20260916

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical production monitor on main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/academic-door/journals/actions/workflows/monitor-journals.yml/dispatches \
            -d '{"ref":"main","inputs":{"force_deep_journals":"LUP,WD"}}'
