name: G03 Elsevier RePEc authority TDD

on:
  push:
    branches:
      - fix/g03-elsevier-repec-authority-20260917

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run focused source-authority regression
        run: |
          set -euo pipefail
          python -m unittest tests.test_elsevier_repec_source_authority -v
          git diff --check
