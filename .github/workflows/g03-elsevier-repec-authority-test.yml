name: G03 Elsevier RePEc authority TDD

on:
  push:
    branches:
      - fix/g03-elsevier-repec-authority-20260917

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Apply local provenance propagation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('collectors/elsevier.py')
          text = path.read_text(encoding='utf-8')
          marker = '            "official_item_count": len(source_rows),\n'
          authority_line = '            "roster_authority": (\n'
          insertion = (
              '            "roster_authority": (\n'
              '                "official-issue-page" if official_rows else "repec-publisher-supplied"\n'
              '            ),\n'
              '            "roster_transport": (\n'
              '                "official-issue-page" if official_rows else "repec-serial-page"\n'
              '            ),\n'
          )
          if authority_line not in text:
              if text.count(marker) != 1:
                  raise SystemExit(f'expected one authority insertion marker, found {text.count(marker)}')
              path.write_text(text.replace(marker, insertion + marker, 1), encoding='utf-8')
          PY
          git diff --check
          python -m unittest tests.test_elsevier_repec_source_authority -v
      - name: Upload patched collector
        uses: actions/upload-artifact@v4
        with:
          name: patched-elsevier
          path: collectors/elsevier.py
          if-no-files-found: error
