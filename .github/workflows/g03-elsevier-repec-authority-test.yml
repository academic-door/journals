name: G03 Elsevier RePEc authority TDD

on:
  push:
    branches:
      - fix/g03-elsevier-repec-authority-20260917

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Apply local provenance propagation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('collectors/elsevier.py')
          text = path.read_text(encoding='utf-8')
          needle = '''        "quality": {
            "roster_match": True,
            "order_preserved": True,
            "official_item_count": len(source_rows),
'''
          replacement = '''        "quality": {
            "roster_match": True,
            "order_preserved": True,
            "roster_authority": (
                "official-issue-page" if official_rows else "repec-publisher-supplied"
            ),
            "roster_transport": (
                "official-issue-page" if official_rows else "repec-serial-page"
            ),
            "official_item_count": len(source_rows),
'''
          if needle in text:
              text = text.replace(needle, replacement, 1)
              path.write_text(text, encoding='utf-8')
          elif replacement not in text:
              raise SystemExit('target authority block not found')
          PY
          git diff --check
          python -m unittest tests.test_elsevier_repec_source_authority -v
      - name: Upload patched collector
        uses: actions/upload-artifact@v4
        with:
          name: patched-elsevier
          path: collectors/elsevier.py
          if-no-files-found: error
