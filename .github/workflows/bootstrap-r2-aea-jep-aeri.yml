name: Bootstrap R2 AEA JEP AERI tranche

on:
  push:
    branches: [r2/aea-jep-aeri-20260909]
    paths: [.github/workflows/bootstrap-r2-aea-jep-aeri.yml]

permissions:
  contents: write

jobs:
  patch-and-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: r2/aea-jep-aeri-20260909
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Patch bounded AEA expected-set scope
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          config = Path('config/field-history.yml')
          text = config.read_text(encoding='utf-8')
          old_aeri = '''  AERI:\n    platform: crossref\n    issn: 2640-205X\n    issue_url_template: https://www.aeaweb.org/journals/aeri/issue/{volume}/{issue}\n'''
          new_aeri = '''  AERI:\n    platform: aea\n    issn: 2640-205X\n    archive_url: https://www.aeaweb.org/journals/aeri/issues\n    allowed_host: www.aeaweb.org\n    issue_url_template: https://www.aeaweb.org/journals/aeri/issue/{volume}/{issue}\n'''
          old_jep = '''  JEP:\n    platform: crossref\n    issn: 0895-3309\n    issue_url_template: https://www.aeaweb.org/journals/jep/issue/{volume}/{issue}\n'''
          new_jep = '''  JEP:\n    platform: aea\n    issn: 0895-3309\n    archive_url: https://www.aeaweb.org/journals/jep/issues\n    allowed_host: www.aeaweb.org\n    issue_url_template: https://www.aeaweb.org/journals/jep/issue/{volume}/{issue}\n'''
          for old, new, label in ((old_aeri, new_aeri, 'AERI'), (old_jep, new_jep, 'JEP')):
              if old not in text:
                  raise SystemExit(f'expected {label} field-history block not found')
              text = text.replace(old, new, 1)
          config.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/backfill-field-history.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '--journals AER,AEJAPP,AEJMACRO,AEJMICRO,AEJPOL'
          new = '--journals AER,AEJAPP,AEJMACRO,AEJMICRO,AEJPOL,JEP,AERI'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one scheduled AEA journal list, found {text.count(old)}')
          workflow.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_r2_aea_family.py')
          test.write_text('''from pathlib import Path\nimport unittest\n\nimport yaml\n\nfrom collectors.history import parse_archive\n\nROOT = Path(__file__).resolve().parents[1]\nCONFIG = ROOT / "config" / "field-history.yml"\nWORKFLOW = ROOT / ".github" / "workflows" / "backfill-field-history.yml"\n\n\nclass R2AEAFamilyContractTests(unittest.TestCase):\n    def test_r2_aea_journals_use_live_aea_archives(self):\n        journals = yaml.safe_load(CONFIG.read_text(encoding="utf-8"))["journals"]\n        expected = {\n            "AEJAPP": "https://www.aeaweb.org/journals/app/issues",\n            "AEJMACRO": "https://www.aeaweb.org/journals/mac/issues",\n            "AEJMICRO": "https://www.aeaweb.org/journals/mic/issues",\n            "AEJPOL": "https://www.aeaweb.org/journals/pol/issues",\n            "JEP": "https://www.aeaweb.org/journals/jep/issues",\n            "AERI": "https://www.aeaweb.org/journals/aeri/issues",\n        }\n        for key, archive_url in expected.items():\n            with self.subTest(journal=key):\n                definition = journals[key]\n                self.assertEqual("aea", definition["platform"])\n                self.assertEqual(archive_url, definition["archive_url"])\n                self.assertEqual("www.aeaweb.org", definition["allowed_host"])\n                self.assertNotIn("observed_evidence_path", definition)\n\n    def test_scheduled_refresh_includes_jep_and_aeri(self):\n        text = WORKFLOW.read_text(encoding="utf-8")\n        self.assertIn(\n            "--journals AER,AEJAPP,AEJMACRO,AEJMICRO,AEJPOL,JEP,AERI",\n            text,\n        )\n\n    def test_aea_archive_parser_accepts_jep_and_aeri_issue_links(self):\n        cases = (\n            ("JEP", "https://www.aeaweb.org/journals/jep/issues", b'<a href="/issues/777">Vol. 40, No. 3, Summer 2026</a>', "jep-40-3"),\n            ("AERI", "https://www.aeaweb.org/journals/aeri/issues", b'<a href="/issues/778">Vol. 8, No. 3, September 2026</a>', "aeri-8-3"),\n        )\n        for journal, archive_url, html, expected_id in cases:\n            with self.subTest(journal=journal):\n                issues = parse_archive(\n                    html, archive_url, journal=journal, platform="aea", years=[2026], allowed_host="www.aeaweb.org"\n                )\n                self.assertEqual([expected_id], [item.issue_id for item in issues])\n\n    def test_jpe_qe_observed_snapshot_contract_is_unchanged(self):\n        journals = yaml.safe_load(CONFIG.read_text(encoding="utf-8"))["journals"]\n        for key in ("JPE", "QE"):\n            self.assertEqual("year_ranges", journals[key]["platform"])\n            self.assertIn("observed_evidence_path", journals[key])\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8')
          PY
      - name: Probe exact live AEA archive issue sets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          from pathlib import Path
          from collectors.history import discover_official_issues

          config = yaml.safe_load(Path('config/field-history.yml').read_text(encoding='utf-8'))['journals']
          expected = {
              'JEP': ['jep-39-1','jep-39-2','jep-39-3','jep-39-4','jep-40-1','jep-40-2','jep-40-3'],
              'AERI': ['aeri-7-1','aeri-7-2','aeri-7-3','aeri-7-4','aeri-8-1','aeri-8-2','aeri-8-3'],
          }
          for journal, wanted in expected.items():
              issues = discover_official_issues(journal, config[journal], years=range(2025, 2027))
              got = [item.issue_id for item in issues]
              print(journal, got)
              if got != wanted:
                  raise SystemExit(f'{journal} live AEA issue set mismatch: {got} != {wanted}')
          PY
      - name: Run bounded regression tests
        run: python -m unittest tests.test_r2_aea_family -v
      - name: Commit bounded implementation and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-r2-aea-jep-aeri.yml
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add config/field-history.yml .github/workflows/backfill-field-history.yml tests/test_r2_aea_family.py
          git add -u .github/workflows/bootstrap-r2-aea-jep-aeri.yml
          git commit -m "feat(history): add JEP AERI live AEA expected sets"
          git push origin HEAD:r2/aea-jep-aeri-20260909
