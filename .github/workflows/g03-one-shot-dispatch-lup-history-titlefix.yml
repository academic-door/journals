name: G03 one-shot dispatch LUP history titlefix

on:
  push:
    branches:
      - ops/g03-dispatch-lup-history-titlefix-20260916

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical history sprint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/history-sprint.yml/dispatches \
            -d '{"ref":"main","inputs":{"evidence_issue_ids":"lup-170-c"}}'
