name: Probe R3 ERE compound fix

on:
  push:
    branches:
      - probe/r3-ere-compound-fix-20260910

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify live Springer compound identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          from pathlib import Path
          from collectors.history import discover_official_issues

          definition=yaml.safe_load(Path('config/field-history.yml').read_text())['journals']['ERE']
          issues=discover_official_issues('ERE', definition, years=[2023, 2024])
          ids=[i.issue_id for i in issues]
          expected=[
              'ere-84-1','ere-84-2','ere-84-3','ere-84-4',
              'ere-85-1','ere-85-2','ere-85-3-4',
              'ere-86-1-2','ere-86-3','ere-86-4',
              *[f'ere-87-{i}' for i in range(1,13)],
          ]
          assert ids==expected, (ids, expected)
          urls={i.issue_id:i.official_url for i in issues}
          assert urls['ere-85-3-4'].endswith('/85-3'), urls
          assert urls['ere-86-1-2'].endswith('/86-1'), urls
          assert 'ere-85-3' not in ids and 'ere-86-1' not in ids
          print('ERE_COMPOUND_FIX_OK', len(ids), ids)
          print('ERE_COMPOUND_URLS', urls['ere-85-3-4'], urls['ere-86-1-2'])
          PY
