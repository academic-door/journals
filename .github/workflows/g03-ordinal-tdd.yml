name: G03 English ordinal translation TDD

on:
  push:
    branches:
      - fix/g03-translation-english-ordinal-20260916

permissions:
  contents: write

jobs:
  tdd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/g03-translation-english-ordinal-20260916
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Confirm ordinal regression RED
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_translation_english_ordinals -v 2>&1 | tee /tmp/red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected ordinal equivalence regression to fail before implementation."
            exit 1
          fi
          grep -q "test_thirtieth_year_matches_chinese_arabic_ordinal" /tmp/red.log
          if grep -Eq "ImportError|ModuleNotFoundError|SyntaxError" /tmp/red.log; then
            echo "RED failed for infrastructure rather than behavior."
            exit 1
          fi
      - name: Implement bounded English temporal ordinal canonicalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/translate_issue.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''_EN_CARD_PATTERN = (
              r"(?:twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)"
              r"(?:[-\\s](?:one|two|three|four|five|six|seven|eight|nine))?"
              r"|(?:one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|"
              r"thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen)"
              r"|(?:a|an)"
          )
          '''
          addition = anchor + '''_EN_ORDINAL_BASE_VALUES = {
              "first": 1, "second": 2, "third": 3, "fourth": 4, "fifth": 5,
              "sixth": 6, "seventh": 7, "eighth": 8, "ninth": 9, "tenth": 10,
              "eleventh": 11, "twelfth": 12, "thirteenth": 13, "fourteenth": 14,
              "fifteenth": 15, "sixteenth": 16, "seventeenth": 17,
              "eighteenth": 18, "nineteenth": 19,
              "twentieth": 20, "thirtieth": 30, "fortieth": 40, "fiftieth": 50,
              "sixtieth": 60, "seventieth": 70, "eightieth": 80, "ninetieth": 90,
          }
          _EN_ORDINAL_TENS_VALUES = {
              "twenty": 20, "thirty": 30, "forty": 40, "fifty": 50,
              "sixty": 60, "seventy": 70, "eighty": 80, "ninety": 90,
          }
          _EN_ORDINAL_ONES_VALUES = {
              "first": 1, "second": 2, "third": 3, "fourth": 4, "fifth": 5,
              "sixth": 6, "seventh": 7, "eighth": 8, "ninth": 9,
          }
          _EN_TEMPORAL_ORDINAL_RE = re.compile(
              r"(?i)(?<![A-Za-z])"
              r"(?P<ordinal>(?:first|second|third|fourth|fifth|sixth|seventh|eighth|ninth|"
              r"tenth|eleventh|twelfth|thirteenth|fourteenth|fifteenth|sixteenth|"
              r"seventeenth|eighteenth|nineteenth|twentieth|thirtieth|fortieth|"
              r"fiftieth|sixtieth|seventieth|eightieth|ninetieth|"
              r"(?:twenty|thirty|forty|fifty|sixty|seventy|eighty|ninety)[- ]"
              r"(?:first|second|third|fourth|fifth|sixth|seventh|eighth|ninth)))"
              r"\\s+(?P<unit>years?|months?|weeks?|days?|decades?|centuries?)\\b"
          )


def _english_temporal_ordinal_value(word: str) -> int | None:
              normalized = word.lower().replace("-", " ").strip()
              if normalized in _EN_ORDINAL_BASE_VALUES:
                  return _EN_ORDINAL_BASE_VALUES[normalized]
              parts = normalized.split()
              if len(parts) == 2:
                  tens = _EN_ORDINAL_TENS_VALUES.get(parts[0])
                  ones = _EN_ORDINAL_ONES_VALUES.get(parts[1])
                  if tens is not None and ones is not None:
                      return tens + ones
              return None
          '''
          if text.count(anchor) != 1:
              raise SystemExit('cardinal anchor mismatch')
          text = text.replace(anchor, addition, 1)

          semantic_anchor = '''    # Mathematical "unity" denotes numeric 1 only in explicit comparator/relation contexts.
              for match in _MATHEMATICAL_UNITY_RE.finditer(value):
          '''
          semantic_addition = '''    # English temporal ordinals are quantitative horizons: "thirtieth year"
              # must compare as 30 against a natural Chinese rendering such as "第30年".
              for match in _EN_TEMPORAL_ORDINAL_RE.finditer(value):
                  span = match.span("ordinal")
                  if overlaps(span):
                      continue
                  ordinal_value = _english_temporal_ordinal_value(match.group("ordinal"))
                  if ordinal_value is not None:
                      record(_quantity_token(ordinal_value), span)

              # Mathematical "unity" denotes numeric 1 only in explicit comparator/relation contexts.
              for match in _MATHEMATICAL_UNITY_RE.finditer(value):
          '''
          if text.count(semantic_anchor) != 1:
              raise SystemExit('semantic anchor mismatch')
          text = text.replace(semantic_anchor, semantic_addition, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify GREEN and translation regressions
        run: |
          python -m unittest tests.test_translation_english_ordinals -v
          python -m unittest tests.test_translate_issue -v
          git diff --check
      - name: Commit implementation and retire executor
        shell: bash
        run: |
          git config user.name academic-door-bot
          git config user.email academic-door-bot@users.noreply.github.com
          git rm .github/workflows/g03-ordinal-tdd.yml
          git add scripts/translate_issue.py tests/test_translation_english_ordinals.py
          git commit -m 'fix(translation): canonicalize temporal ordinal quantities'
          git push origin HEAD:fix/g03-translation-english-ordinal-20260916
