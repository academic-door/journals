name: G03 ScienceDirect staging evidence RED

on:
  push:
    branches:
      - fix/g03-sciencedirect-staging-evidence-20260917

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run focused evidence regressions
        run: |
          set -euo pipefail
          python -m unittest tests.test_sciencedirect_browser_roster_evidence -v
          git diff --check
