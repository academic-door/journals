name: G03 Elsevier editorial GREEN

on:
  push:
    branches:
      - fix/g03-elsevier-editorial-type-20260916

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/g03-elsevier-editorial-type-20260916
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Implement minimal publisher-type fallback
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/g03_elsevier_patch.py
          python /tmp/g03_elsevier_patch.py
      - name: Verify GREEN and focused regressions
        run: |
          python -m unittest tests.test_elsevier_publisher_type -v
          python -m unittest tests.test_elsevier_collector tests.test_metadata_fallback tests.test_update_journals -v
          git diff --check
      - name: Commit permanent fix and retire executor
        run: |
          git config user.name academic-door-bot
          git config user.email academic-door-bot@users.noreply.github.com
          git rm .github/workflows/g03-elsevier-editorial-green.yml
          git add collectors/metadata_fallback.py collectors/elsevier.py tests/test_elsevier_publisher_type.py
          git commit -m 'fix(elsevier): honor publisher editorial subtype'
          git push origin HEAD:fix/g03-elsevier-editorial-type-20260916
