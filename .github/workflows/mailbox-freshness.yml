name: Poll journal project mailbox

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Auto-approve PR
    types:
      - completed
  schedule:
    - cron: "7 */2 * * *"

permissions:
  contents: write

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  mailbox:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Restore current data truth
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin refs/heads/data >/dev/null 2>&1; then
            git fetch origin data
            rm -rf public/api
            git archive origin/data public/api | tar -x
            if git cat-file -e origin/data:data/monitoring/state.json 2>/dev/null; then
              mkdir -p data/monitoring
              git show origin/data:data/monitoring/state.json > data/monitoring/state.json
            fi
          fi

      - name: Snapshot mailbox state baseline
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$RUNNER_TEMP/mailbox-baseline" \
            --path data/monitoring/state.json

      - name: Poll dedicated project mailbox
        id: mailbox
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USERNAME: ${{ secrets.IMAP_USERNAME }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        shell: bash
        run: |
          # Poll the dedicated readonly project mailbox. The Python reader does
          # not mark, move, delete, or send messages.
          set -euo pipefail
          python scripts/mailbox_announcements.py
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              Path("output/mailbox-announcement-result.json").read_text(encoding="utf-8")
          )
          changed = bool(result.get("updated_journals"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={'true' if changed else 'false'}\n")
              output.write(f"status={result.get('status', 'unknown')}\n")
              output.write(f"signals={int(result.get('signals', 0))}\n")
          PY

      - name: Publish mailbox announcement state
        if: steps.mailbox.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/mailbox-baseline"
          generated="$RUNNER_TEMP/mailbox-generated"
          data_tree="$RUNNER_TEMP/mailbox-data-tree"
          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$generated" \
            --path data/monitoring/state.json

          for attempt in 1 2 3 4 5; do
            if ! git fetch origin data; then
              sleep $((attempt * 10))
              continue
            fi
            git worktree remove --force "$data_tree" 2>/dev/null || true
            rm -rf "$data_tree"
            git worktree add "$data_tree" origin/data
            git -C "$data_tree" switch -C data
            if ! python scripts/publish_data_delta.py apply \
              --baseline "$baseline" \
              --generated "$generated" \
              --target "$data_tree" \
              --path data/monitoring/state.json; then
              sleep $((attempt * 10))
              continue
            fi
            git -C "$data_tree" config user.name "academic-door-bot"
            git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
            git -C "$data_tree" add -f data/monitoring/state.json
            if git -C "$data_tree" diff --cached --quiet; then
              echo "Mailbox announcement state is unchanged."
              exit 0
            fi
            git -C "$data_tree" commit -m "Update journal mailbox announcement state"
            if git -C "$data_tree" push origin HEAD:data; then
              exit 0
            fi
            echo "Data changed during mailbox publish; refetching and reapplying the delta."
            sleep $((attempt * 10))
          done
          echo "Failed to publish mailbox announcement state after five attempts."
          exit 1
