name: Test private email notification

on:
  workflow_dispatch:
    inputs:
      journal:
        description: Journal code to render as a realistic sample
        required: true
        default: aer
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Restore the latest audited journal data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api
          git archive origin/data public/api public/project-manifest.json | tar -x
          if git cat-file -e origin/data:public/backfill-status.md 2>/dev/null; then
            git show origin/data:public/backfill-status.md > public/backfill-status.md
          fi

      - name: Send one private test email
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
        run: |
          python scripts/email_notifications.py \
            --test-email \
            --test-journal "${{ inputs.journal }}"
