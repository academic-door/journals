name: G03 Elsevier type probe

on:
  push:
    branches:
      - probe/g03-elsevier-type-20260916

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: probe/g03-elsevier-type-20260916
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Probe publisher document-type fields only
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          from xml.etree import ElementTree
          import requests
          from collectors.metadata_fallback import ELSEVIER_ARTICLE_METADATA_API, ELSEVIER_ABSTRACT_API, _local_name

          dois = [
              '10.1016/j.landusepol.2026.108195',
              '10.1016/j.worlddev.2026.107513',
          ]
          headers = {
              'Accept': 'application/xml',
              'X-ELS-APIKey': os.environ['ELSEVIER_API_KEY'],
          }
          token = os.environ.get('ELSEVIER_INST_TOKEN', '').strip()
          if token:
              headers['X-ELS-Insttoken'] = token
          wanted_fragments = ('type', 'subtype', 'aggregation', 'document')
          session = requests.Session()
          rows = []
          for doi in dois:
              sources = [
                  ('article-metadata', ELSEVIER_ARTICLE_METADATA_API, {
                      'query': f'DOI("{doi}")', 'view': 'COMPLETE', 'httpAccept': 'application/xml'
                  }),
                  ('scopus-abstract', f'{ELSEVIER_ABSTRACT_API}/doi/{doi}', {
                      'view': 'FULL', 'httpAccept': 'application/xml'
                  }),
              ]
              for source, url, params in sources:
                  response = session.get(url, params=params, headers=headers, timeout=45)
                  record = {'doi': doi, 'source': source, 'status_code': response.status_code, 'fields': {}}
                  if response.status_code < 400:
                      try:
                          root = ElementTree.fromstring(response.content)
                          for node in root.iter():
                              name = _local_name(node.tag)
                              lowered = name.casefold()
                              if not any(fragment in lowered for fragment in wanted_fragments):
                                  continue
                              value = ' '.join(' '.join(node.itertext()).split())[:160]
                              if value:
                                  record['fields'].setdefault(name, value)
                      except ElementTree.ParseError:
                          record['parse_error'] = True
                  rows.append(record)
          print('TYPES=' + json.dumps(rows, sort_keys=True))
          PY
      - name: Retire temporary probe workflow
        if: always()
        run: |
          git config user.name academic-door-bot
          git config user.email academic-door-bot@users.noreply.github.com
          git rm .github/workflows/g03-elsevier-type-probe.yml
          git commit -m 'chore: retire G03 Elsevier type probe'
          git push origin HEAD:probe/g03-elsevier-type-20260916
