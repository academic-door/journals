name: G05 JF 81(2) semantic translation repair

on:
  push:
    branches:
      - brain/g05-jf-81-2-translation-repair
    paths:
      - .github/workflows/g05-jf-81-2-translation-publish.yml

permissions:
  contents: write

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Restore latest data baseline and snapshot it
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api data/backfill-state data/backfill-staging data/translation-cache
          mkdir -p public data
          git archive origin/data public/api data/backfill-state data/backfill-staging data/translation-cache | tar -x
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/build_gap_manifest.py             "${state_args[@]}"             --api-root public/api/v1             --out-json "$RUNNER_TEMP/gap-before.json"
          python scripts/publish_data_delta.py snapshot             --root .             --output "$RUNNER_TEMP/data-baseline"             --path public/api/v1/journals             --path data/translation-cache             --path data/backfill-state             --path data/backfill-staging             --exclude 'public/api/v1/journals/*/issues/index.json'

      - name: Apply one-DOI semantic translation repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          from scripts.import_official_roster_evidence import reconcile_state_files
          from scripts.translate_issue import TranslationError, _source_hash, validate_translation
          from scripts.update_journals import apply_translation_cache, normalize_issue_content, validate_issue

          issue_path = Path("public/api/v1/journals/jf/issues/jf-81-2.json")
          cache_path = Path("data/translation-cache/jf.json")
          issue = json.loads(issue_path.read_text(encoding="utf-8"))
          cache = json.loads(cache_path.read_text(encoding="utf-8"))
          doi = "10.1111/jofi.70006"
          article = next(a for a in issue["articles"] if a.get("doi","").lower() == doi)
          existing = cache[doi]

          if issue["publication_state"] != "translation_partial":
              raise SystemExit(f"unexpected starting issue state: {issue['publication_state']}")
          if issue["source_status"] != "official_verified":
              raise SystemExit(f"unexpected source status: {issue['source_status']}")
          if existing["source_hash"] != _source_hash(article):
              raise SystemExit("cache/source hash changed since qualification")

          try:
              validate_translation(article, {
                  "title_cn": existing["title_cn"],
                  "abstract_cn": existing["abstract_cn"],
              })
          except TranslationError as exc:
              old_error = str(exc)
          else:
              raise SystemExit("old cached translation unexpectedly passes current validator")
          if "added 10" not in old_error:
              raise SystemExit(f"unexpected old validation error: {old_error}")

          repaired_abstract = existing["abstract_cn"].replace(
              "在德国统一数十年后",
              "在德国统一多年后",
              1,
          )
          if repaired_abstract == existing["abstract_cn"]:
              raise SystemExit("expected semantic-repair phrase not found")

          validate_translation(article, {
              "title_cn": existing["title_cn"],
              "abstract_cn": repaired_abstract,
          })
          existing["abstract_cn"] = repaired_abstract
          existing["translation"] = {
              **existing.get("translation", {}),
              "provider": "manual-semantic-repair",
              "repair_reason": "avoid false-positive numeric 10 from Chinese phrase 数十年",
          }
          cache_path.write_text(
              json.dumps(cache, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          issue = apply_translation_cache(issue, cache_path=cache_path)
          issue = normalize_issue_content(issue)
          validate_issue(issue)
          repaired_article = next(a for a in issue["articles"] if a.get("doi","").lower() == doi)
          if repaired_article["translation"]["status"] != "complete":
              raise SystemExit("repaired article translation did not become complete")
          if issue["quality"]["translation_complete"] != 13:
              raise SystemExit(f"translation_complete={issue['quality']['translation_complete']} != 13")
          if issue["publication_state"] != "ready" or issue["source_status"] != "official_verified":
              raise SystemExit(
                  f"repaired issue state={issue['publication_state']}/{issue['source_status']}"
              )
          issue_path.write_text(
              json.dumps(issue, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          updated = reconcile_state_files(issue, Path("data/backfill-state"))
          print(json.dumps({
              "issue_id": issue["issue_id"],
              "doi": doi,
              "old_error": old_error,
              "publication_state": issue["publication_state"],
              "translation_complete": issue["quality"]["translation_complete"],
              "state_files_updated": [str(p) for p in updated],
          }, ensure_ascii=False, sort_keys=True))
          PY

      - name: Rebuild and run strict acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rebuild_public_snapshot.py
          python scripts/publish_data_delta.py rebuild-archive-indexes --root .
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/backfill_status.py             "${state_args[@]}"             --api-root public/api/v1             --out-json public/api/v1/backfill-status.json             --out-md public/backfill-status.md
          python scripts/build_gap_manifest.py             "${state_args[@]}"             --api-root public/api/v1             --out-json public/api/v1/gap-manifest.json             --out-md public/gap-manifest.md
          python scripts/check_recovery_progress.py             --before "$RUNNER_TEMP/gap-before.json"             --after public/api/v1/gap-manifest.json             --report "$RUNNER_TEMP/recovery-progress.json"
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_history_coverage.py             "${state_args[@]}"             --api-root public/api/v1             --report-json "$RUNNER_TEMP/history-coverage.json"
          python scripts/audit_privacy.py
          python -m unittest discover -s tests -v
          python scripts/rebuild_public_snapshot.py --check
          python scripts/build_completeness_ledger.py             "${state_args[@]}"             --api-root public/api/v1             --journals-config config/journals.yml             --window-start 2026-01-01             --window-end 2026-09-18             --out-json "$RUNNER_TEMP/completeness-after.json"
          LEDGER="$RUNNER_TEMP/completeness-after.json" python - <<'PY'
          import json, os
          payload=json.load(open(os.environ["LEDGER"], encoding="utf-8"))
          rec=payload["reconciliation"]
          required={
              "complete":23,
              "not_measured":26,
              "partial":0,
              "source_blocked":0,
              "authoritative_expected_issues_total":101,
              "archived_issues_total":101,
              "publication_ready_issues_total":101,
              "confirmed_missing_issues_total":0,
              "blocked_issues_total":0,
          }
          for key,value in required.items():
              if rec[key] != value:
                  raise SystemExit(f"{key}={rec[key]} != {value}")
          rows={row["journalKey"]:row for row in payload["journals"]}
          for journal,expected_count in (("AJAE",5),("JF",4)):
              row=rows[journal]
              got=(row["status"],row["expectedIssueCount"],row["archivedIssueCount"],row["publicationReadyIssueCount"],row["missingIssueCount"],row["sourceBlockedIssueCount"])
              want=("COMPLETE",expected_count,expected_count,expected_count,0,0)
              if got != want:
                  raise SystemExit(f"{journal}: {got!r} != {want!r}")
          print(json.dumps(rec, sort_keys=True))
          PY

      - name: Apply guarded delta to latest data and push once
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/generated-data"
          data_tree="$RUNNER_TEMP/data-tree"
          python scripts/publish_data_delta.py snapshot             --root .             --output "$generated"             --path public/api/v1/journals             --path data/translation-cache             --path data/backfill-state             --path data/backfill-staging             --exclude 'public/api/v1/journals/*/issues/index.json'
          git fetch origin data
          git worktree add "$data_tree" origin/data
          git -C "$data_tree" switch -C data
          python scripts/publish_data_delta.py apply             --baseline "$RUNNER_TEMP/data-baseline"             --generated "$generated"             --target "$data_tree"             --path public/api/v1/journals             --path data/translation-cache             --path data/backfill-state             --path data/backfill-staging             --exclude 'public/api/v1/journals/*/issues/index.json'
          rm -rf "$data_tree/public/api"
          cp -R public/api "$data_tree/public/api"
          cp public/project-manifest.json "$data_tree/public/project-manifest.json"
          cp public/backfill-status.md "$data_tree/public/backfill-status.md"
          cp public/gap-manifest.md "$data_tree/public/gap-manifest.md"
          git -C "$data_tree" rm -f --ignore-unmatch public/search.js
          git -C "$data_tree" config user.name "academic-door-bot"
          git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
          git -C "$data_tree" add -A public/api data/translation-cache data/backfill-state data/backfill-staging
          git -C "$data_tree" add public/project-manifest.json public/backfill-status.md public/gap-manifest.md
          echo "PUBLISH_DIFF_START"
          git -C "$data_tree" diff --cached --stat
          git -C "$data_tree" diff --cached --name-only
          echo "PUBLISH_DIFF_END"
          if git -C "$data_tree" diff --cached --quiet; then
            echo "No data changes after semantic repair."
            exit 0
          fi
          git -C "$data_tree" commit -m "Repair JF 81(2) translation semantics"
          git -C "$data_tree" push origin HEAD:data
          echo "PUBLISHED_DATA_SHA=$(git -C "$data_tree" rev-parse HEAD)"

      - name: Verify canonical readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          work="$RUNNER_TEMP/readback"
          rm -rf "$work"
          mkdir -p "$work"
          git archive origin/data             public/api/v1/journals/jf/issues/jf-81-2.json             public/api/v1/journals/jf/issues/index.json             data/translation-cache/jf.json             data/backfill-state | tar -x -C "$work"
          ROOT="$work" python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          issue=json.loads((root/"public/api/v1/journals/jf/issues/jf-81-2.json").read_text(encoding="utf-8"))
          cache=json.loads((root/"data/translation-cache/jf.json").read_text(encoding="utf-8"))
          doi="10.1111/jofi.70006"
          article=next(a for a in issue["articles"] if a.get("doi","").lower()==doi)
          if issue["publication_state"]!="ready" or issue["source_status"]!="official_verified":
              raise SystemExit("canonical JF 81(2) is not READY/official_verified")
          if issue["quality"]["translation_complete"]!=13:
              raise SystemExit("canonical JF 81(2) translation count is not 13")
          if "在德国统一多年后" not in article["abstract_cn"]:
              raise SystemExit("canonical repaired text missing")
          if cache[doi]["translation"].get("provider")!="manual-semantic-repair":
              raise SystemExit("canonical cache provenance missing semantic repair")
          print(json.dumps({
              "issue_id":issue["issue_id"],
              "publication_state":issue["publication_state"],
              "source_status":issue["source_status"],
              "translation_complete":issue["quality"]["translation_complete"],
              "provider":cache[doi]["translation"].get("provider"),
          }, ensure_ascii=False, sort_keys=True))
          PY
