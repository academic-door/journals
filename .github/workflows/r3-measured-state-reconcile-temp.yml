name: R3 measured state reconcile temp

on:
  push:
    branches:
      - r3/measured-state-reconcile-20260910

permissions:
  contents: write

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Restore pre-tranche derived status while preserving state repair
        shell: bash
        run: |
          set -euo pipefail
          expected_current="afa693ceccc7a5dd692bf784fbdc3e5187554de6"
          parent="5984ad731f2db9ca6b290d4b0b1b94ca4aa74d93"
          git fetch origin data
          current="$(git rev-parse origin/data)"
          if [ "$current" != "$expected_current" ]; then
            echo "Data advanced after R3 tranche; refusing to overwrite newer derived status: $current"
            exit 1
          fi
          git fetch origin "$parent"
          tree="$RUNNER_TEMP/data-tree"
          git worktree add "$tree" origin/data
          git -C "$tree" switch -C data
          git show "$parent:public/api/v1/backfill-status.json" > "$tree/public/api/v1/backfill-status.json"
          git show "$parent:public/backfill-status.md" > "$tree/public/backfill-status.md"
          changed="$(git -C "$tree" diff --name-only | sort)"
          expected=$'public/api/v1/backfill-status.json\npublic/backfill-status.md'
          if [ "$changed" != "$expected" ]; then
            echo "Unexpected corrective delta:"
            printf '%s\n' "$changed"
            exit 1
          fi
          git -C "$tree" config user.name "academic-door-bot"
          git -C "$tree" config user.email "academic-door-bot@users.noreply.github.com"
          git -C "$tree" add public/api/v1/backfill-status.json public/backfill-status.md
          git -C "$tree" commit -m "Bound measured history reconciliation delta"
          git -C "$tree" push origin HEAD:data
          echo "DATA_COMMIT=$(git -C "$tree" rev-parse HEAD)"

      - name: Verify current canonical data after correction
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api data/backfill-state
          git archive origin/data public/api data/backfill-state | tar -x
          python - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('data/backfill-state/field-2025-2026.json').read_text())
          expected={
            'aer-116-9': 'official_verified',
            'aeri-8-3': 'official_verified',
            'res-93-5': 'publisher_verified',
          }
          for iid, source in expected.items():
            e=state['issues'][iid]
            assert e['status']=='ready' and e['publication_state']=='ready'
            assert e['content_status']=='complete' and e['source_status']==source
          print('R3_STATE_REPAIR_PRESERVED', sorted(expected))
          PY
          python scripts/audit_history_coverage.py \
            --state data/backfill-state/field-2023-2024.json \
            --state data/backfill-state/field-2025-2026.json \
            --api-root public/api/v1 \
            --report-json "$RUNNER_TEMP/history-final.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path(os.environ['RUNNER_TEMP']).joinpath('history-final.json').read_text())
          assert report['error_count']==202, report['error_count']
          print('R3_FINAL_AUDIT', report['error_count'], report['counts'])
          PY
