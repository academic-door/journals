name: R3 measured state reconcile temp

on:
  push:
    branches:
      - r3/measured-state-reconcile-20260910

permissions:
  contents: write
  models: read

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Restore current canonical data
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          base="$(git rev-parse origin/data)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          rm -rf public/api data/backfill-state
          git archive origin/data public/api data/backfill-state | tar -x
          cp data/backfill-state/field-2025-2026.json "$RUNNER_TEMP/state-before.json"
          echo "DATA_BASE=$base"

      - name: Reconcile exact measured issues from existing ready archives
        shell: bash
        run: |
          set -euo pipefail
          python scripts/backfill_history.py \
            --config config/field-history.yml \
            --state data/backfill-state/field-2025-2026.json \
            --journal AER --from-year 2025 --to-year 2026 \
            --issue-ids aer-116-9 --max-issues 1 --skip-global-indexes
          python scripts/backfill_history.py \
            --config config/field-history.yml \
            --state data/backfill-state/field-2025-2026.json \
            --journal AERI --from-year 2025 --to-year 2026 \
            --issue-ids aeri-8-3 --max-issues 1 --skip-global-indexes
          python scripts/backfill_history.py \
            --config config/field-history.yml \
            --state data/backfill-state/field-2025-2026.json \
            --journal RES --from-year 2025 --to-year 2026 \
            --issue-ids res-93-5 --max-issues 1 --skip-global-indexes

      - name: Verify bounded semantic delta
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          before = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("state-before.json").read_text())
          after = json.loads(Path("data/backfill-state/field-2025-2026.json").read_text())
          targets = {"aer-116-9", "aeri-8-3", "res-93-5"}

          assert before.get("discovery") == after.get("discovery"), "discovery authority/freshness changed"
          assert before.get("expected_issue_exclusions") == after.get("expected_issue_exclusions"), "expected-set exclusions changed"

          before_issues = before.get("issues", {})
          after_issues = after.get("issues", {})
          changed_issues = {
              iid for iid in set(before_issues) | set(after_issues)
              if before_issues.get(iid) != after_issues.get(iid)
          }
          assert changed_issues == targets, f"unexpected issue-state delta: {sorted(changed_issues)}"

          expected_sources = {
              "aer-116-9": "official_verified",
              "aeri-8-3": "official_verified",
              "res-93-5": "publisher_verified",
          }
          for iid in sorted(targets):
              entry = after_issues[iid]
              assert entry["status"] == "ready", (iid, entry)
              assert entry["content_status"] == "complete", (iid, entry)
              assert entry["publication_state"] == "ready", (iid, entry)
              assert entry["source_status"] == expected_sources[iid], (iid, entry)
              assert not entry.get("last_error"), (iid, entry)
          print("R3_BOUNDED_DELTA_OK", sorted(changed_issues))
          PY

      - name: Verify four-way audit delta
        shell: bash
        run: |
          set -euo pipefail
          python scripts/audit_history_coverage.py \
            --state data/backfill-state/field-2023-2024.json \
            --state data/backfill-state/field-2025-2026.json \
            --api-root public/api/v1 \
            --report-json "$RUNNER_TEMP/history-after.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("history-after.json").read_text())
          assert report["error_count"] == 202, report["error_count"]
          targets = ("aer-116-9:", "aeri-8-3:", "res-93-5:")
          remaining = [e for e in report["errors"] if e.startswith(targets)]
          assert not remaining, remaining
          print("R3_AUDIT_AFTER", report["error_count"], report["counts"])
          PY

      - name: Rebuild backfill status
        shell: bash
        run: |
          set -euo pipefail
          python scripts/backfill_status.py \
            --state data/backfill-state/field-2023-2024.json \
            --state data/backfill-state/field-2025-2026.json \
            --api-root public/api/v1 \
            --out-json public/api/v1/backfill-status.json \
            --out-md public/backfill-status.md
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_privacy.py

      - name: Publish state-only reconciliation through data single-writer fence
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ steps.restore.outputs.base }}"
          git fetch origin data
          current="$(git rev-parse origin/data)"
          if [ "$current" != "$expected" ]; then
            echo "Data advanced during reconcile: expected $expected, got $current"
            exit 1
          fi
          tree="$RUNNER_TEMP/data-tree"
          git worktree add "$tree" origin/data
          git -C "$tree" switch -C data
          cp data/backfill-state/field-2025-2026.json "$tree/data/backfill-state/field-2025-2026.json"
          cp public/api/v1/backfill-status.json "$tree/public/api/v1/backfill-status.json"
          cp public/backfill-status.md "$tree/public/backfill-status.md"
          git -C "$tree" config user.name "academic-door-bot"
          git -C "$tree" config user.email "academic-door-bot@users.noreply.github.com"
          git -C "$tree" add -f data/backfill-state/field-2025-2026.json public/api/v1/backfill-status.json public/backfill-status.md
          git -C "$tree" commit -m "Reconcile measured history state"
          git -C "$tree" push origin HEAD:data
          echo "DATA_COMMIT=$(git -C "$tree" rev-parse HEAD)"
