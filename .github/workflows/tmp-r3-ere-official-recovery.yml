name: Temporary R3 ERE official recovery

on:
  push:
    branches:
      - ops/r3-ere-official-recovery-20260910

permissions:
  contents: write

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TARGETS: ere-85-3-4,ere-86-1-2
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Restore current canonical data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api data/backfill-state data/backfill-staging data/translation-cache data/provenance/official-rosters
          mkdir -p public data data/provenance/official-rosters
          git archive origin/data public/api data/backfill-state data/backfill-staging data/translation-cache | tar -x
          if git ls-tree -r --name-only origin/data -- data/provenance/official-rosters | grep -q .; then
            git archive origin/data data/provenance/official-rosters | tar -x
          fi
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/audit_history_coverage.py "${state_args[@]}" --api-root public/api/v1 --report-json "$RUNNER_TEMP/history-before.json"
          python scripts/build_gap_manifest.py --state data/backfill-state/field-2023-2024.json --api-root public/api/v1 --out-json "$RUNNER_TEMP/gap.json"
          python scripts/publish_data_delta.py snapshot \
            --root . --output "$RUNNER_TEMP/data-baseline" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --path data/provenance/official-rosters
          TARGETS="$TARGETS" python - <<'PY'
          import json, os
          p=json.load(open(os.environ['RUNNER_TEMP']+'/history-before.json'))
          targets=os.environ['TARGETS'].split(',')
          found=[e for e in p['errors'] if any(t in e for t in targets)]
          print('before_error_count', p['error_count'])
          print('target_errors', found)
          if len(found) < 2:
              raise SystemExit('expected unresolved ERE target errors before recovery')
          gap=json.load(open(os.environ['RUNNER_TEMP']+'/gap.json'))
          by={r.get('issue_id'):r for r in gap.get('records',[])}
          expected={'ere-85-3-4':'https://link.springer.com/journal/10640/volumes-and-issues/85-3','ere-86-1-2':'https://link.springer.com/journal/10640/volumes-and-issues/86-1'}
          for issue_id,url in expected.items():
              r=by.get(issue_id)
              if not r or r.get('official_url') != url:
                  raise SystemExit(f'authoritative recovery URL mismatch for {issue_id}: {r}')
              print(issue_id, 'recovery_url', r['official_url'])
          PY

      - name: Capture exact Springer official evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_springer_roster_evidence.py \
            --gap-manifest "$RUNNER_TEMP/gap.json" \
            --output-root data/provenance/official-rosters/springer \
            --workers 1 --detail-workers 4 \
            --issue-ids "$TARGETS" \
            --diagnostics-root "$RUNNER_TEMP/springer-diagnostics"
          TARGETS="$TARGETS" python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('data/provenance/official-rosters/springer')
          expected={'ere-85-3-4':'https://link.springer.com/journal/10640/volumes-and-issues/85-3','ere-86-1-2':'https://link.springer.com/journal/10640/volumes-and-issues/86-1'}
          for issue_id in os.environ['TARGETS'].split(','):
              path=root/f'{issue_id}.json'
              if not path.exists(): raise SystemExit(f'missing evidence: {issue_id}')
              p=json.loads(path.read_text())
              assert p['issue_id']==issue_id and p['finalized'] is True
              assert p['official_url']==expected[issue_id]
              assert len(p.get('items',[])) > 0
              print(issue_id, 'official_items', len(p.get('items',[])), 'excluded', len(p.get('excluded_items',[])), 'url', p['official_url'])
          PY

      - name: Build, translate, and archive the two issues
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          TRANSLATION_RETRIES: "5"
          TRANSLATION_WORKERS: "4"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_archives_from_roster_evidence.py \
            --evidence-root data/provenance/official-rosters/springer \
            --api-root public/api/v1 \
            --state-root data/backfill-state \
            --staging-root data/backfill-staging \
            --translation-cache-root data/translation-cache \
            --issue-ids "$TARGETS" \
            --max-translations 40 \
            --start-year 2023 \
            --report-json "$RUNNER_TEMP/archive-report.json"
          TARGETS="$TARGETS" python - <<'PY'
          import json, os
          p=json.load(open(os.environ['RUNNER_TEMP']+'/archive-report.json'))
          by={r['issue_id']:r for r in p['results']}
          for issue_id in os.environ['TARGETS'].split(','):
              r=by.get(issue_id)
              print(issue_id, r)
              if not r or r.get('result') != 'ready': raise SystemExit(f'not ready: {issue_id}')
          PY

      - name: Rebuild indexes and verify strict gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rebuild_public_snapshot.py
          python scripts/publish_data_delta.py rebuild-archive-indexes --root .
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/backfill_status.py "${state_args[@]}" --api-root public/api/v1 --out-json public/api/v1/backfill-status.json --out-md public/backfill-status.md
          python scripts/build_gap_manifest.py "${state_args[@]}" --api-root public/api/v1 --out-json public/api/v1/gap-manifest.json --out-md public/gap-manifest.md
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_history_coverage.py "${state_args[@]}" --api-root public/api/v1 --report-json "$RUNNER_TEMP/history-after.json"
          python scripts/audit_privacy.py
          python -m unittest discover -s tests -v
          python scripts/rebuild_public_snapshot.py --check
          TARGETS="$TARGETS" python - <<'PY'
          import json, os
          from pathlib import Path
          before=json.load(open(os.environ['RUNNER_TEMP']+'/history-before.json'))
          after=json.load(open(os.environ['RUNNER_TEMP']+'/history-after.json'))
          targets=os.environ['TARGETS'].split(',')
          remaining=[e for e in after['errors'] if any(t in e for t in targets)]
          print('history_errors', before['error_count'], '->', after['error_count'])
          print('remaining_target_errors', remaining)
          if remaining: raise SystemExit('ERE target history errors remain')
          if after['error_count'] >= before['error_count']: raise SystemExit('history audit did not improve')
          expected={'ere-85-3-4':('85','3-4'),'ere-86-1-2':('86','1-2')}
          for issue_id,(volume,issue) in expected.items():
              p=json.loads((Path('public/api/v1/journals/ere/issues')/f'{issue_id}.json').read_text())
              assert p['issue_id']==issue_id and str(p['volume'])==volume and str(p['issue'])==issue
              assert p['publication_state']=='ready' and p['content_status']=='complete'
              assert p['source_status'] in {'official_verified','publisher_verified'}
              assert p['quality']['roster_match'] is True
              assert p['quality']['translation_complete']==p['research_article_count']
              print(issue_id, 'ready_articles', p['research_article_count'])
          PY

      - name: Apply only the generated data delta to current data branch
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/generated-data"
          data_tree="$RUNNER_TEMP/data-tree"
          python scripts/publish_data_delta.py snapshot \
            --root . --output "$generated" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --path data/provenance/official-rosters
          git fetch origin data
          git worktree add "$data_tree" origin/data
          git -C "$data_tree" switch -C data
          python scripts/publish_data_delta.py apply \
            --baseline "$RUNNER_TEMP/data-baseline" \
            --generated "$generated" \
            --target "$data_tree" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --path data/provenance/official-rosters
          rm -rf "$data_tree/public/api"
          cp -R public/api "$data_tree/public/api"
          cp public/project-manifest.json "$data_tree/public/project-manifest.json"
          cp public/backfill-status.md "$data_tree/public/backfill-status.md"
          cp public/gap-manifest.md "$data_tree/public/gap-manifest.md"
          git -C "$data_tree" config user.name "academic-door-bot"
          git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
          git -C "$data_tree" add -A public/api data/translation-cache data/backfill-state data/backfill-staging data/provenance/official-rosters public/project-manifest.json public/backfill-status.md public/gap-manifest.md
          git -C "$data_tree" commit -m "Recover ERE compound issues from official Springer evidence"
          git -C "$data_tree" push origin HEAD:data
          git -C "$data_tree" rev-parse HEAD

      - name: Self-delete temporary workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git rm .github/workflows/tmp-r3-ere-official-recovery.yml
          git commit -m "chore(history): remove temporary ERE recovery workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
