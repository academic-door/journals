name: G06 ECTA 94-5 targeted writer

on:
  push:
    branches:
      - g06-ecta-945-writer

permissions:
  contents: write
  models: read

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Restore current data truth
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api data/translation-cache
          git archive origin/data public/api public/project-manifest.json data/translation-cache | tar -x

      - name: Snapshot ECTA baseline
        shell: bash
        run: |
          python scripts/publish_data_delta.py snapshot             --root .             --output "$RUNNER_TEMP/ecta-baseline"             --path public/api/v1/journals/ecta             --path data/translation-cache

      - name: Collect, translate, and validate Econometrica 94(5)
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/update_journals.py             --journal ECTA             --translate             --expected-volume 94             --expected-issue 5
          python scripts/repair_history_dates.py
          python scripts/rebuild_public_snapshot.py --check
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_privacy.py
          python -m unittest discover -s tests

          python - <<'PY'
          import json
          from pathlib import Path

          p = Path("public/api/v1/journals/ecta/issues/current.json")
          issue = json.loads(p.read_text(encoding="utf-8"))
          q = issue["quality"]
          assert issue["issue_id"] == "ecta-94-5", issue["issue_id"]
          assert issue["publication_date"] == "September 2026", issue["publication_date"]
          assert issue.get("publication_state") == "ready", issue.get("publication_state")
          assert issue.get("source_status") == "official_verified", issue.get("source_status")
          assert q.get("roster_authority") == "official-issue-page", q.get("roster_authority")
          assert q.get("roster_transport") == "econometric-society-page", q.get("roster_transport")
          assert issue["research_article_count"] == 12, issue["research_article_count"]
          assert q.get("authors_complete") == 12, q.get("authors_complete")
          assert q.get("abstract_en_complete") == 12, q.get("abstract_en_complete")
          assert q.get("translation_complete") == 12, q.get("translation_complete")
          assert not q.get("flags"), q.get("flags")
          print(json.dumps({
              "issue_id": issue["issue_id"],
              "publication_date": issue["publication_date"],
              "articles": issue["research_article_count"],
              "source_status": issue["source_status"],
              "publication_state": issue["publication_state"],
              "authority": q["roster_authority"],
              "transport": q["roster_transport"],
              "translations": q["translation_complete"],
          }, indent=2))
          PY

      - name: Publish guarded ECTA delta to data
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/ecta-baseline"
          generated="$RUNNER_TEMP/ecta-generated"
          data_tree="$RUNNER_TEMP/ecta-data-tree"

          python scripts/publish_data_delta.py snapshot             --root .             --output "$generated"             --path public/api/v1/journals/ecta             --path data/translation-cache

          for attempt in 1 2 3 4 5; do
            git fetch origin data
            git worktree remove --force "$data_tree" 2>/dev/null || true
            rm -rf "$data_tree"
            git worktree add "$data_tree" origin/data
            git -C "$data_tree" switch -C data

            if ! python scripts/publish_data_delta.py apply               --baseline "$baseline"               --generated "$generated"               --target "$data_tree"               --path public/api/v1/journals/ecta               --path data/translation-cache; then
              sleep $((attempt * 10))
              continue
            fi

            rm -rf "$GITHUB_WORKSPACE/public/api"
            mkdir -p "$GITHUB_WORKSPACE/public"
            cp -R "$data_tree/public/api" "$GITHUB_WORKSPACE/public/api"

            python scripts/rebuild_public_snapshot.py
            python scripts/publish_data_delta.py rebuild-archive-indexes               --root "$GITHUB_WORKSPACE"
            python scripts/audit_source_alignment.py --strict
            python scripts/rebuild_public_snapshot.py --check
            python scripts/audit_public_data.py --strict-provenance
            python scripts/audit_privacy.py

            rm -rf "$data_tree/public/api"
            cp -R "$GITHUB_WORKSPACE/public/api" "$data_tree/public/api"
            cp "$GITHUB_WORKSPACE/public/project-manifest.json"               "$data_tree/public/project-manifest.json"

            git -C "$data_tree" config user.name "academic-door-bot"
            git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
            git -C "$data_tree" add -A public/api data/translation-cache
            git -C "$data_tree" add public/project-manifest.json

            if git -C "$data_tree" diff --cached --quiet; then
              echo "ECTA 94(5) is already published on data."
              git -C "$data_tree" rev-parse HEAD
              exit 0
            fi

            git -C "$data_tree" commit -m "Publish Econometrica 94(5)"
            if git -C "$data_tree" push origin HEAD:data; then
              git -C "$data_tree" rev-parse HEAD
              exit 0
            fi
            sleep $((attempt * 10))
          done

          echo "Failed to publish guarded ECTA delta after five attempts."
          exit 1
