name: Verify Composer reconcile request

# Bounded sender-credential acceptance after changing the request route.
# Reconcile is idempotent and resolves private main on the ⑥ runner.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-journals.yml
      - scripts/request_composer_reconcile.sh

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Request reconciliation with target-only credential
        env:
          GH_TOKEN: ${{ secrets.COMPOSER_RUNNER_DISPATCH_TOKEN }}
        shell: bash
        run: bash scripts/request_composer_reconcile.sh
