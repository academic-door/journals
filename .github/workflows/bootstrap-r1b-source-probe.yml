name: Bootstrap R1B source probe

on:
  push:
    branches:
      - r1b-jpe-qe-live-evidence

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4 pyyaml
      - name: Probe official publisher transports
        shell: bash
        run: |
          python - <<'PY'
          import json
          import requests
          from collectors.chicago import _session as chicago_session, _get as chicago_get, _parse_issue_page

          urls = [
              "https://www.journals.uchicago.edu/loi/jpe",
              "https://www.journals.uchicago.edu/toc/jpe/current",
              "https://www.journals.uchicago.edu/toc/jpe/2026/134/8",
              "https://www.journals.uchicago.edu/toc/jpe/2025/133/12",
              "https://onlinelibrary.wiley.com/loi/17597331/year/2026",
          ]
          headers = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.9",
          }
          out = {}
          for url in urls:
              try:
                  r = requests.get(url, headers=headers, timeout=(10, 30), allow_redirects=True)
                  out[url] = {"status": r.status_code, "final": r.url, "bytes": len(r.content)}
              except Exception as e:
                  out[url] = {"error": f"{type(e).__name__}: {e}"}
          s = chicago_session()
          for url in urls[1:4]:
              try:
                  r = chicago_get(s, url, attempts=1, timeout=30)
                  parsed = _parse_issue_page(r.content, url)
                  out[url]["collector"] = {
                      "ok": True,
                      "volume": parsed.get("volume"),
                      "issue": parsed.get("issue"),
                      "publication_date": parsed.get("publication_date"),
                      "items": len(parsed.get("items", [])),
                  }
              except Exception as e:
                  out[url]["collector"] = {"ok": False, "error": f"{type(e).__name__}: {e}"}
          print(json.dumps(out, indent=2))
          PY
