name: Auto-approve PR

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to approve
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  checks: read

concurrency:
  group: auto-approve-${{ github.event.pull_request.number || github.event.inputs.pr_number }}
  cancel-in-progress: false

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check reviewer app secrets are configured
        env:
          APP_ID: ${{ secrets.AUTO_REVIEWER_APP_ID }}
          PRIVATE_KEY: ${{ secrets.AUTO_REVIEWER_PRIVATE_KEY }}
        run: |
          if [ -z "$APP_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::Auto-reviewer GitHub App is not configured. Add AUTO_REVIEWER_APP_ID and AUTO_REVIEWER_PRIVATE_KEY repository secrets. See docs/auto-approval.md for setup."
            exit 1
          fi

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTO_REVIEWER_APP_ID }}
          private-key: ${{ secrets.AUTO_REVIEWER_PRIVATE_KEY }}

      - name: Resolve PR number
        id: pr-number
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ github.event.inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Gate on open, non-draft, trusted author
        id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.pr-number.outputs.number }}"
          DATA="$(gh pr view "$PR_NUMBER" -R "${{ github.repository }}" --json author,state,isDraft,headRefOid --jq '{author:.author.login,state,isDraft,sha:.headRefOid}')"
          AUTHOR="$(printf '%s' "$DATA" | jq -r .author)"
          STATE="$(printf '%s' "$DATA" | jq -r .state)"
          DRAFT="$(printf '%s' "$DATA" | jq -r .isDraft)"
          SHA="$(printf '%s' "$DATA" | jq -r .sha)"
          if [ "$STATE" != "OPEN" ]; then
            echo "PR is not open; skipping auto-approval."
            echo "continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DRAFT" = "true" ]; then
            echo "PR is a draft; waiting for ready_for_review."
            echo "continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case " $AUTHOR " in
            *" SIMON-WORLD "*|*" ukinch605 "*)
              ;;
            *)
              echo "Author $AUTHOR is not in the trusted list; skipping auto-approval."
              echo "continue=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          echo "continue=true" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Wait for required test check
        if: steps.gate.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          SHA="${{ steps.gate.outputs.sha }}"
          for i in $(seq 1 180); do
            CONCLUSIONS="$(gh api "repos/${{ github.repository }}/commits/$SHA/check-runs" --jq '[.check_runs[] | select(.name == "test") | .conclusion] | join(",")')"
            echo "attempt $i: test=$CONCLUSIONS"
            case "$CONCLUSIONS" in
              success)
                echo "Required check passed."
                exit 0
                ;;
              *failure*|*cancelled*|*skipped*|*timed_out*|*action_required*)
                echo "Required check failed ($CONCLUSIONS); not approving."
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for the required test check."
          exit 1

      - name: Approve PR
        if: steps.gate.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.pr-number.outputs.number }}"
          ALREADY="$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" --jq '[.[] | select(.state == "APPROVED" and (.user.login | startswith("journal-auto-approver")))] | length')"
          if [ "$ALREADY" -gt 0 ]; then
            echo "Already approved by the auto-reviewer app; skipping."
            exit 0
          fi
          gh api --method POST "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
            -f event=APPROVE \
            -f body="Auto-approved by journal-auto-approver: required checks passed and author is trusted."

      - name: Merge approved PR
        if: steps.gate.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.pr-number.outputs.number }}"
          APPROVED="$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" \
            --jq '[.[] | select(.state == "APPROVED" and (.user.login | startswith("journal-auto-approver")))] | length')"
          if [ "$APPROVED" -lt 1 ]; then
            echo "The auto-reviewer approval is missing; refusing to merge."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" -R "${{ github.repository }}" --squash
