name: R2 OUP QJE RES authority recovery

on:
  push:
    branches:
      - r2-oup-qje-res-recovery
  workflow_dispatch:

permissions:
  contents: write
  models: read

jobs:
  qje:
    uses: ./.github/workflows/backfill-field-history.yml
    with:
      journal: QJE
      from_year: "2025"
      to_year: "2026"
      max_issues: "1"
      max_translations: "1"
      max_journals: "1"
      refresh_discovery_only: true
    secrets: inherit

  res:
    needs: qje
    uses: ./.github/workflows/backfill-field-history.yml
    with:
      journal: RES
      from_year: "2025"
      to_year: "2026"
      max_issues: "1"
      max_translations: "1"
      max_journals: "1"
      refresh_discovery_only: true
    secrets: inherit

  verify:
    needs: res
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Overlay latest governed data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api
          git archive origin/data public/api | tar -x
          mkdir -p "$RUNNER_TEMP/data-state"
          for state in \
            data/backfill-state/field-2023-2024.json \
            data/backfill-state/field-2025-2026.json; do
            git show "origin/data:$state" > "$RUNNER_TEMP/data-state/$(basename "$state")"
          done

      - name: Rebuild and verify bounded OUP authority ledger
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_completeness_ledger.py \
            --state "$RUNNER_TEMP/data-state/field-2023-2024.json" \
            --state "$RUNNER_TEMP/data-state/field-2025-2026.json" \
            --api-root public/api/v1 \
            --out-json "$RUNNER_TEMP/completeness-2026.json"
          LEDGER="$RUNNER_TEMP/completeness-2026.json" python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["LEDGER"]).read_text(encoding="utf-8"))
          rows = {row["journalKey"]: row for row in payload["journals"]}
          for key in ("QJE", "RES"):
              row = rows[key]
              summary = {
                  "journalKey": key,
                  "authority": row["authority"],
                  "authorityClassification": row["authorityClassification"],
                  "freshnessStatus": row["freshnessStatus"],
                  "expectedIssueCount": row["expectedIssueCount"],
                  "publicationReadyIssueCount": row["publicationReadyIssueCount"],
                  "confirmedMissingIssueCount": row.get("confirmedMissingIssueCount"),
                  "status": row["status"],
                  "discoveryRefreshedAt": row["discoveryRefreshedAt"],
              }
              print(json.dumps(summary, ensure_ascii=False))
              if row["authorityClassification"] != "authoritative":
                  raise SystemExit(f"{key}: expected authoritative expected-set evidence")
              if row["freshnessStatus"] != "CURRENT_FOR_AUDIT_END":
                  raise SystemExit(f"{key}: expected current authoritative evidence")
          PY

      - name: Final governed audits
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/rebuild_public_snapshot.py --check
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_privacy.py
          python -m unittest tests.test_completeness_ledger tests.test_r2_oup_family -v
