name: G02 JEH 83-4 Cambridge exact writer

on:
  push:
    branches:
      - write/g02-jeh-83-4-cambridge-20260914
    paths:
      - .github/workflows/g02-jeh-83-4-cambridge-writer.yml

permissions:
  contents: write

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Bind execution-time canonical main and data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main data
          BOUND_MAIN_SHA="$(git rev-parse origin/main)"
          BOUND_DATA_SHA="$(git rev-parse origin/data)"
          echo "BOUND_MAIN_SHA=$BOUND_MAIN_SHA" >> "$GITHUB_ENV"
          echo "BOUND_DATA_SHA=$BOUND_DATA_SHA" >> "$GITHUB_ENV"
          echo "MAIN_SHA=$BOUND_MAIN_SHA"
          echo "DATA_SHA=$BOUND_DATA_SHA"
          git checkout --detach origin/main
          rm -rf public/api public/backfill-status.md public/gap-manifest.md \
            data/backfill-state data/provenance/official-rosters
          mkdir -p public data
          git archive origin/data \
            public/api \
            public/backfill-status.md \
            public/gap-manifest.md \
            data/backfill-state \
            data/provenance/official-rosters \
            | tar -x
          cp public/api/v1/gap-manifest.json "$RUNNER_TEMP/gap-before.json"
          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$RUNNER_TEMP/data-baseline" \
            --path public/api \
            --path public/backfill-status.md \
            --path data/backfill-state \
            --path data/provenance/official-rosters

      - run: python -m pip install -r requirements.txt

      - name: Capture fresh exact Cambridge authority evidence
        shell: bash
        run: |
          set -euo pipefail
          GAP="$RUNNER_TEMP/gap-before.json" OUT="$RUNNER_TEMP/jeh-83-4-gap.json" python - <<'PY'
          import json, os
          payload=json.load(open(os.environ['GAP'], encoding='utf-8'))
          rows=[r for r in payload.get('records', []) if str(r.get('issue_id','')).lower()=='jeh-83-4']
          if len(rows)!=1:
              raise SystemExit(f'expected exactly one jeh-83-4 gap row, got {len(rows)}')
          row=rows[0]
          if row.get('category')!='source_pending' or row.get('source_status')!='source_pending':
              raise SystemExit(f'unexpected current gap state: {row}')
          if 'www.cambridge.org' not in str(row.get('official_url','')):
              raise SystemExit(f'not Cambridge official URL: {row.get("official_url")}')
          json.dump({'schema_version':'1.0','generated_at':payload.get('generated_at',''),'records':[row]}, open(os.environ['OUT'],'w',encoding='utf-8'), ensure_ascii=False, indent=2)
          print('WRITER_GAP_ROW', json.dumps(row, ensure_ascii=False, sort_keys=True))
          PY
          mkdir -p data/provenance/official-rosters/cambridge "$RUNNER_TEMP/diagnostics"
          python scripts/capture_cambridge_roster_evidence.py \
            --gap-manifest "$RUNNER_TEMP/jeh-83-4-gap.json" \
            --output-root data/provenance/official-rosters/cambridge \
            --diagnostics-root "$RUNNER_TEMP/diagnostics" \
            | tee "$RUNNER_TEMP/capture.json"
          test -f data/provenance/official-rosters/cambridge/jeh-83-4.json
          CAPTURE="$RUNNER_TEMP/capture.json" python - <<'PY'
          import json, os
          payload=json.load(open(os.environ['CAPTURE'],encoding='utf-8'))
          if payload.get('captured')!=['jeh-83-4'] or payload.get('failures'):
              raise SystemExit(f'capture gate failed: {payload}')
          PY

      - name: Requalify promotion against same execution-time data
        shell: bash
        run: |
          set -euo pipefail
          python scripts/import_official_roster_evidence.py \
            data/provenance/official-rosters/cambridge/jeh-83-4.json \
            --api-root public/api/v1 \
            --output "$RUNNER_TEMP/jeh-83-4.candidate.json" \
            | tee "$RUNNER_TEMP/dry-run.json"
          EVIDENCE=data/provenance/official-rosters/cambridge/jeh-83-4.json CANDIDATE="$RUNNER_TEMP/jeh-83-4.candidate.json" python - <<'PY'
          import json, os
          e=json.load(open(os.environ['EVIDENCE'],encoding='utf-8'))
          c=json.load(open(os.environ['CANDIDATE'],encoding='utf-8'))
          excluded={str(item.get('doi','')).strip().lower():str(item.get('reason','')) for item in e.get('excluded_items',[])}
          dois=[str(a.get('doi','')).strip().lower() for a in c.get('articles',[])]
          summary={
              'official_items':len(e.get('items',[])),
              'candidate_articles':len(c.get('articles',[])),
              'excluded_items':len(e.get('excluded_items',[])),
              'source_status':c.get('source_status'),
              'publication_state':c.get('publication_state'),
              'corrigendum_reason':excluded.get('10.1017/s0022050723000451',''),
          }
          print('WRITER_QUALIFICATION', json.dumps(summary, ensure_ascii=False, sort_keys=True))
          if len(e.get('items',[])) != len(c.get('articles',[])):
              raise SystemExit(f'official roster/article count mismatch: {summary}')
          if excluded.get('10.1017/s0022050723000451') != 'non-research-title':
              raise SystemExit(f'corrigendum exclusion gate failed: {summary}')
          if '10.1017/s0022050723000451' in dois:
              raise SystemExit(f'corrigendum remained in candidate: {summary}')
          if c.get('source_status')!='official_verified' or c.get('publication_state')!='ready':
              raise SystemExit(f'candidate not canonical-ready: {summary}')
          PY

      - name: Promote exact issue and rebuild governed derivatives
        shell: bash
        run: |
          set -euo pipefail
          python scripts/import_official_roster_evidence.py \
            data/provenance/official-rosters/cambridge/jeh-83-4.json \
            --api-root public/api/v1 \
            --state-root data/backfill-state \
            --translation-cache-root data/translation-cache \
            --promote \
            | tee "$RUNNER_TEMP/promote.json"
          python scripts/publish_data_delta.py rebuild-archive-indexes --root .
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/backfill_status.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json public/api/v1/backfill-status.json \
            --out-md public/backfill-status.md
          python scripts/build_gap_manifest.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json public/api/v1/gap-manifest.json \
            --out-md public/gap-manifest.md
          python scripts/check_recovery_progress.py \
            --before "$RUNNER_TEMP/gap-before.json" \
            --after public/api/v1/gap-manifest.json \
            --report "$RUNNER_TEMP/recovery-progress.json"

      - name: Run strict owner acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_history_coverage.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --report-json "$RUNNER_TEMP/history-coverage.json"
          python scripts/audit_privacy.py
          ISSUE=public/api/v1/journals/jeh/issues/jeh-83-4.json \
          INDEX=public/api/v1/journals/jeh/issues/index.json \
          GAP=public/api/v1/gap-manifest.json \
          EVIDENCE=data/provenance/official-rosters/cambridge/jeh-83-4.json \
          python - <<'PY'
          import json, os
          issue=json.load(open(os.environ['ISSUE'],encoding='utf-8'))
          index=json.load(open(os.environ['INDEX'],encoding='utf-8'))
          gap=json.load(open(os.environ['GAP'],encoding='utf-8'))
          evidence=json.load(open(os.environ['EVIDENCE'],encoding='utf-8'))
          bad='10.1017/s0022050723000451'
          dois=[str(a.get('doi','')).strip().lower() for a in issue.get('articles',[])]
          excluded={str(item.get('doi','')).strip().lower():str(item.get('reason','')) for item in evidence.get('excluded_items',[])}
          rows=[r for r in index.get('issues',[]) if str(r.get('issue_id','')).lower()=='jeh-83-4']
          gaps=[r for r in gap.get('records',[]) if str(r.get('issue_id','')).lower()=='jeh-83-4']
          if len(rows)!=1 or len(gaps)!=1:
              raise SystemExit(f'expected one index/gap row, got index={len(rows)} gap={len(gaps)}')
          checks={
              'article_count':len(dois),
              'expected_article_count':issue.get('expected_article_count'),
              'research_article_count':issue.get('research_article_count'),
              'source_status':issue.get('source_status'),
              'publication_state':issue.get('publication_state'),
              'index_source_status':rows[0].get('source_status'),
              'index_publication_state':rows[0].get('publication_state'),
              'gap_category':gaps[0].get('category'),
              'gap_source_status':gaps[0].get('source_status'),
              'corrigendum_reason':excluded.get(bad,''),
          }
          print('WRITER_ACCEPTANCE', json.dumps(checks, ensure_ascii=False, sort_keys=True))
          if len(dois)!=8 or issue.get('expected_article_count')!=8 or issue.get('research_article_count')!=8:
              raise SystemExit(f'unexpected article counts: {checks}')
          if bad in dois or excluded.get(bad)!='non-research-title':
              raise SystemExit(f'corrigendum classification failed: {checks}')
          if issue.get('source_status')!='official_verified' or issue.get('publication_state')!='ready':
              raise SystemExit(f'issue not ready: {checks}')
          if rows[0].get('source_status')!='official_verified' or rows[0].get('publication_state')!='ready':
              raise SystemExit(f'index not ready: {checks}')
          if gaps[0].get('category')!='ready' or gaps[0].get('source_status')!='official_verified':
              raise SystemExit(f'gap manifest not ready: {checks}')
          PY

      - name: Publish guarded bounded delta to data
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$RUNNER_TEMP/data-generated" \
            --path public/api \
            --path public/backfill-status.md \
            --path data/backfill-state \
            --path data/provenance/official-rosters
          git fetch origin data
          CURRENT_DATA_SHA="$(git rev-parse origin/data)"
          if [ "$CURRENT_DATA_SHA" != "$BOUND_DATA_SHA" ]; then
            echo "data drifted while writer held the governed lane: bound=$BOUND_DATA_SHA current=$CURRENT_DATA_SHA" >&2
            exit 1
          fi
          data_tree="$RUNNER_TEMP/data-tree"
          git worktree add "$data_tree" origin/data
          git -C "$data_tree" switch -C data
          python scripts/publish_data_delta.py apply \
            --baseline "$RUNNER_TEMP/data-baseline" \
            --generated "$RUNNER_TEMP/data-generated" \
            --target "$data_tree" \
            --path public/api \
            --path public/backfill-status.md \
            --path data/backfill-state \
            --path data/provenance/official-rosters \
            | tee "$RUNNER_TEMP/publish-delta.json"
          cp public/gap-manifest.md "$data_tree/public/gap-manifest.md"
          DATA_TREE="$data_tree" python - <<'PY'
          import os, subprocess
          root=os.environ['DATA_TREE']
          out=subprocess.check_output(['git','-C',root,'status','--porcelain'],text=True)
          paths=[]
          for line in out.splitlines():
              if not line.strip():
                  continue
              path=line[3:]
              if ' -> ' in path:
                  path=path.split(' -> ',1)[1]
              paths.append(path)
          allowed_exact={
              'public/api/v1/backfill-status.json',
              'public/api/v1/gap-manifest.json',
              'public/backfill-status.md',
              'public/gap-manifest.md',
              'data/backfill-state/field-2023-2024.json',
              'data/provenance/official-rosters/cambridge/jeh-83-4.json',
          }
          bad=[p for p in paths if not (p in allowed_exact or p.startswith('public/api/v1/journals/jeh/'))]
          print('WRITER_CHANGED_PATHS', '\n'.join(paths))
          if bad:
              raise SystemExit('unexpected data delta paths: '+', '.join(bad))
          if 'public/api/v1/journals/jeh/issues/jeh-83-4.json' not in paths:
              raise SystemExit('expected JEH 83-4 archive delta missing')
          PY
          git -C "$data_tree" config user.name "academic-door-bot"
          git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
          git -C "$data_tree" add -A \
            public/api \
            public/backfill-status.md \
            public/gap-manifest.md \
            data/backfill-state \
            data/provenance/official-rosters
          if git -C "$data_tree" diff --cached --quiet; then
            echo "expected bounded JEH 83-4 delta but nothing was staged" >&2
            exit 1
          fi
          git -C "$data_tree" commit -m "Promote JEH 83-4 Cambridge official roster"
          PUBLISHED_DATA_SHA="$(git -C "$data_tree" rev-parse HEAD)"
          echo "PUBLISHED_DATA_SHA=$PUBLISHED_DATA_SHA" >> "$GITHUB_ENV"
          git -C "$data_tree" push origin HEAD:data

      - name: Verify canonical data readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          ACTUAL="$(git rev-parse origin/data)"
          if [ "$ACTUAL" != "$PUBLISHED_DATA_SHA" ]; then
            echo "published data SHA mismatch: expected=$PUBLISHED_DATA_SHA actual=$ACTUAL" >&2
            exit 1
          fi
          git show origin/data:public/api/v1/journals/jeh/issues/jeh-83-4.json > "$RUNNER_TEMP/published-issue.json"
          git show origin/data:public/api/v1/journals/jeh/issues/index.json > "$RUNNER_TEMP/published-index.json"
          git show origin/data:public/api/v1/gap-manifest.json > "$RUNNER_TEMP/published-gap.json"
          ISSUE="$RUNNER_TEMP/published-issue.json" INDEX="$RUNNER_TEMP/published-index.json" GAP="$RUNNER_TEMP/published-gap.json" python - <<'PY'
          import json, os
          issue=json.load(open(os.environ['ISSUE'],encoding='utf-8'))
          index=json.load(open(os.environ['INDEX'],encoding='utf-8'))
          gap=json.load(open(os.environ['GAP'],encoding='utf-8'))
          bad='10.1017/s0022050723000451'
          dois=[str(a.get('doi','')).strip().lower() for a in issue.get('articles',[])]
          rows=[r for r in index.get('issues',[]) if str(r.get('issue_id','')).lower()=='jeh-83-4']
          gaps=[r for r in gap.get('records',[]) if str(r.get('issue_id','')).lower()=='jeh-83-4']
          summary={
              'articles':len(dois),
              'source_status':issue.get('source_status'),
              'publication_state':issue.get('publication_state'),
              'index_rows':len(rows),
              'gap_rows':len(gaps),
              'gap_category':gaps[0].get('category') if gaps else None,
          }
          print('PUBLISHED_READBACK', json.dumps(summary, ensure_ascii=False, sort_keys=True))
          if len(dois)!=8 or bad in dois:
              raise SystemExit(f'published article roster mismatch: {summary}')
          if issue.get('source_status')!='official_verified' or issue.get('publication_state')!='ready':
              raise SystemExit(f'published issue not ready: {summary}')
          if len(rows)!=1 or rows[0].get('source_status')!='official_verified' or rows[0].get('publication_state')!='ready':
              raise SystemExit(f'published index not ready: {summary}')
          if len(gaps)!=1 or gaps[0].get('category')!='ready':
              raise SystemExit(f'published gap row not ready: {summary}')
          PY

      - name: Preserve writer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g02-jeh-83-4-cambridge-writer
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/gap-before.json
            ${{ runner.temp }}/jeh-83-4-gap.json
            ${{ runner.temp }}/capture.json
            ${{ runner.temp }}/dry-run.json
            ${{ runner.temp }}/jeh-83-4.candidate.json
            ${{ runner.temp }}/promote.json
            ${{ runner.temp }}/recovery-progress.json
            ${{ runner.temp }}/history-coverage.json
            ${{ runner.temp }}/publish-delta.json
            ${{ runner.temp }}/published-issue.json
            ${{ runner.temp }}/published-index.json
            ${{ runner.temp }}/published-gap.json
            ${{ runner.temp }}/diagnostics
