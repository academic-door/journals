name: Check DeepSeek translation key

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Probe DeepSeek chat completions
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          key = os.environ.get("DEEPSEEK_API_KEY", "").strip()
          if not key:
              print("DEEPSEEK_API_KEY is not set; translation will use GitHub Models/Google.")
              raise SystemExit(2)
          payload = {
              "model": "deepseek-chat",
              "messages": [{"role": "user", "content": "Reply with exactly: OK"}],
              "max_tokens": 8,
              "temperature": 0,
          }
          request = urllib.request.Request(
              "https://api.deepseek.com/chat/completions",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": "Bearer " + key,
                  "Content-Type": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  body = json.loads(response.read().decode("utf-8"))
              print("DeepSeek OK, model:", body.get("model"))
              print("reply:", body["choices"][0]["message"]["content"][:80])
          except Exception as error:
              print("DeepSeek FAILED:", type(error).__name__, error)
              raise SystemExit(1)
          PY
