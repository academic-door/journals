name: Bootstrap crossref UI contract fix

on:
  push:
    branches: [fix-r2-crossref-ui-contract]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix-r2-crossref-ui-contract
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Replace fixed-journal fixture with semantic fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_composer_ui.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("    def test_legacy_crossref_ready_is_conservatively_blocked(self):\n")
          end = text.index("    def test_mobile_composer_controls_have_touch_sized_targets(self):\n", start)
          replacement = '''    def test_crossref_provisional_evidence_is_conservatively_blocked(self):\n        import json\n\n        provisional = []\n        for current in sorted((ROOT / "public/api/v1/journals").glob("*/issues/current.json")):\n            issue = json.loads(current.read_text(encoding="utf-8"))\n            quality = issue.get("quality", {})\n            flags = set(quality.get("flags", []))\n            authority = str(quality.get("roster_authority", ""))\n            transport = str(quality.get("roster_transport", ""))\n            if (\n                "crossref_provisional_roster" in flags\n                or "crossref" in authority.lower()\n                or "crossref" in transport.lower()\n            ):\n                provisional.append(issue["journal_id"])\n\n        self.assertTrue(provisional, "expected at least one current Crossref-provisional snapshot")\n        for source in (self.page, self.explorer):\n            self.assertIn('flags.has("crossref_provisional_roster")', source)\n            self.assertIn("/crossref/i.test(authority)", source)\n            self.assertIn("/crossref/i.test(transport)", source)\n            self.assertIn('["content_status", "source_status", "publication_state"].every', source)\n            self.assertNotIn(\n                "if (issue?.publication_state) return issue.publication_state;",\n                source,\n            )\n        self.assertIn("journalSourceEvidence", self.status_page)\n        self.assertIn("if (evidence.provisional) return \\"source_pending\\"", self.status_page)\n\n'''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
      - name: Verify exact regression and full suite
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_composer_ui.ComposerUiTest.test_crossref_provisional_evidence_is_conservatively_blocked -v
          python -m unittest discover -s tests -v
          git diff --check
      - name: Commit verified fix
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap-fix-crossref-ui-contract.yml
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add tests/test_composer_ui.py
          git add -u .github/workflows/bootstrap-fix-crossref-ui-contract.yml
          git diff --cached --check
          git commit -m "test: keep Crossref UI guard semantic under R2"
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          set +e
          git push origin HEAD:fix-r2-crossref-ui-contract
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Push failed after verified commit; controller may fast-forward branch to FINAL_COMMIT."
            exit "$status"
          fi
