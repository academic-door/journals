name: 24h historical recovery sprint

on:
  workflow_dispatch:
    inputs:
      max_issues:
        description: Maximum exact issues per short shard (hard capped at 12)
        required: true
        default: "10"
        type: string
      max_translations:
        description: Maximum new translations per journal in each source shard
        required: true
        default: "120"
        type: string
      categories:
        description: Comma-separated gap categories to process in this wave
        required: true
        default: recoverable,translation_required
        type: string
      issue_ids:
        description: Optional comma-separated exact issue IDs to process
        required: false
        default: ""
        type: string
      source_run_id:
        description: Reuse successful shard artifacts from this prior sprint run
        required: false
        default: ""
        type: string
      state_source_run_id:
        description: One-time successful full-shard run used to restore missing discovery state
        required: false
        default: "32734420419"
        type: string
      strict_final:
        description: Fail unless every historical discovery/state/archive/index gap is zero
        required: false
        default: false
        type: boolean
      evidence_issue_ids:
        description: Optional comma-separated issue IDs; apply only their official evidence
        required: false
        default: ""
        type: string
      publish_issue_ids:
        description: Optional comma-separated issue IDs to merge and publish
        required: false
        default: ""
        type: string
      capture_wiley_evidence:
        description: Refresh official Wiley rosters for source-pending archives before promotion
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  models: read

# The regular monitor and daily updater use this same group.  They wait while
# the sprint is collecting and publishing, so no second writer can overwrite
# a shard or a last-known-good data snapshot.
concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  prepare:
    name: Build exact recovery queue
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.queue.outputs.matrix }}
      has_work: ${{ steps.queue.outputs.has_work }}
      issue_count: ${{ steps.queue.outputs.issue_count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Rebuild the exact queue from published state and archives
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          git archive origin/data public/api/v1/journals data/backfill-state | tar -x
      - name: Download the last complete discovery-state shards
        if: inputs.state_source_run_id != ''
        uses: actions/download-artifact@v4
        with:
          pattern: history-sprint-*
          path: state-shards
          merge-multiple: false
          run-id: ${{ inputs.state_source_run_id }}
          github-token: ${{ github.token }}
      - name: Restore missing discovery state without regressing current archives
        if: inputs.state_source_run_id != ''
        shell: bash
        run: |
          set -euo pipefail
          rm -rf state-shards/history-sprint-final-reports
          python scripts/merge_history_shards.py --root . --shards-root state-shards
      - name: Build the exact gap manifest
        shell: bash
        run: |
          set -euo pipefail
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/build_gap_manifest.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json public/api/v1/gap-manifest.json
      - name: Split only unresolved issue IDs into short shards
        id: queue
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_recovery_queue.py \
            --gap-manifest public/api/v1/gap-manifest.json \
            --categories "${{ inputs.categories }}" \
            --issue-ids "${{ inputs.issue_ids }}" \
            --chunk-size "${{ inputs.max_issues }}" \
            --output-dir output/recovery-shards \
            --plan-json output/recovery-plan.json \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: history-recovery-queue
          path: |
            output/recovery-shards
            output/recovery-plan.json
            data/backfill-state
          if-no-files-found: warn

  collect:
    name: Recover ${{ matrix.shard }}
    needs: prepare
    if: inputs.source_run_id == '' && needs.prepare.outputs.has_work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: history-recovery-queue
          path: recovery-baseline

      - name: Restore last-known-good data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api data/backfill-state data/backfill-staging
          mkdir -p public data data/provenance/official-rosters
          git archive origin/data public/api data/backfill-state data/backfill-staging data/translation-cache | tar -x
          if git ls-tree -r --name-only origin/data -- data/provenance/official-rosters | grep -q .; then
            git archive origin/data data/provenance/official-rosters | tar -x
          fi
          if git ls-tree -r --name-only origin/data -- data/provenance/browser-snapshots | grep -q .; then
            git archive origin/data data/provenance/browser-snapshots | tar -x
          fi

      - name: Overlay the restored discovery state
        shell: bash
        run: |
          set -euo pipefail
          cp -R recovery-baseline/data/backfill-state/. data/backfill-state/

      - name: Stop Elsevier recovery before the shared quota is exhausted
        if: contains(matrix.action, 'elsevier')
        env:
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
        run: python scripts/elsevier_quota_check.py --write-json output/elsevier-quota.json

      - name: Run both historical year windows in this shard
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          TRANSLATION_RETRIES: "5"
          TRANSLATION_WORKERS: "4"
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
          SHARD_JOURNALS: ${{ matrix.journals }}
          SHARD_ISSUE_IDS: ${{ matrix.issue_ids }}
          SHARD_ACTION: ${{ matrix.action }}
          MAX_TRANSLATIONS: ${{ inputs.max_translations || '120' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${DEEPSEEK_API_KEY:-}" ]]; then echo "[translate] DeepSeek secret available"; else echo "[translate] DeepSeek secret unavailable to this job"; fi
          mkdir -p output data/provenance/official-rosters
          shard_manifest="recovery-baseline/output/recovery-shards/${{ matrix.shard }}.json"
          case "$SHARD_ACTION" in
            collect-*|translation)
              for window in 2023-2024 2025-2026; do
                state="data/backfill-state/field-${window}.json"
                report="output/backfill-${window}.json"
                python scripts/backfill_history.py \
                  --config config/field-history.yml \
                  --state "$state" \
                  --journals "$SHARD_JOURNALS" \
                  --issue-ids "$SHARD_ISSUE_IDS" \
                  --from-year "${window%-*}" \
                  --to-year "${window#*-}" \
                  --translate \
                  --max-issues 12 \
                  --max-translations "$MAX_TRANSLATIONS" \
                  --max-minutes 10 \
                  --skip-global-indexes \
                  --report-json "$report"
              done
              ;;
            aea-evidence)
              python scripts/capture_aea_roster_evidence.py \
                --gap-manifest "$shard_manifest" --api-root public/api/v1 \
                --output-root data/provenance/official-rosters/aea \
                --diagnostics-root output/evidence-failures
              ;;
            wiley-evidence)
              python scripts/capture_wiley_roster_evidence.py \
                --gap-manifest "$shard_manifest" --api-root public/api/v1 \
                --output-root data/provenance/official-rosters/wiley \
                --diagnostics-root output/evidence-failures
              ;;
            highwire-evidence)
              python scripts/capture_highwire_roster_evidence.py \
                --gap-manifest "$shard_manifest" --api-root public/api/v1 \
                --output-root data/provenance/official-rosters/highwire \
                --diagnostics-root output/evidence-failures
              ;;
            springer-evidence)
              python scripts/capture_springer_roster_evidence.py \
                --gap-manifest "$shard_manifest" \
                --output-root data/provenance/official-rosters/springer \
                --diagnostics-root output/evidence-failures
              ;;
            cambridge-evidence)
              python scripts/capture_cambridge_roster_evidence.py \
                --gap-manifest "$shard_manifest" \
                --output-root data/provenance/official-rosters/cambridge \
                --diagnostics-root output/evidence-failures
              ;;
            browser|official-evidence)
              cp "$shard_manifest" "output/${SHARD_ACTION}-required.json"
              ;;
            *)
              echo "Unsupported recovery action: $SHARD_ACTION" >&2
              exit 2
              ;;
          esac
          SHARD_JOURNALS="$SHARD_JOURNALS" SHARD_ISSUE_IDS="$SHARD_ISSUE_IDS" SHARD_ACTION="$SHARD_ACTION" python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("output/shard-metadata.json").write_text(
              json.dumps(
                  {
                    "journals": [value for value in os.environ["SHARD_JOURNALS"].split(",") if value],
                    "issue_ids": [value for value in os.environ["SHARD_ISSUE_IDS"].split(",") if value],
                    "action": os.environ["SHARD_ACTION"],
                  },
                  ensure_ascii=False,
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload isolated shard staging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-sprint-${{ matrix.shard }}
          if-no-files-found: warn
          path: |
            public/api/v1/journals
            data/backfill-state
            data/backfill-staging
            data/translation-cache
            data/provenance/official-rosters
            output

  publish:
    name: Merge, audit and publish one data delta
    needs: [prepare, collect]
    if: always() && (inputs.source_run_id != '' || needs.collect.result != 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - uses: actions/download-artifact@v4
        with:
          name: history-recovery-queue
          path: recovery-baseline

      - name: Restore data baseline and snapshot it
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api data/backfill-state data/backfill-staging
          mkdir -p public data data/provenance/official-rosters
          git archive origin/data public/api data/backfill-state data/backfill-staging data/translation-cache | tar -x
          if git ls-tree -r --name-only origin/data -- data/provenance/official-rosters | grep -q .; then
            git archive origin/data data/provenance/official-rosters | tar -x
          fi
          if git ls-tree -r --name-only origin/data -- data/provenance/browser-snapshots | grep -q .; then
            git archive origin/data data/provenance/browser-snapshots | tar -x
          fi
          cp -R recovery-baseline/data/backfill-state/. data/backfill-state/
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/build_gap_manifest.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json public/api/v1/gap-manifest.json
          cp public/api/v1/gap-manifest.json "$RUNNER_TEMP/gap-before.json"
          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$RUNNER_TEMP/data-baseline" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --path data/provenance/official-rosters \
            --exclude 'public/api/v1/journals/*/issues/index.json'

      - name: Download all isolated shards
        uses: actions/download-artifact@v4
        with:
          pattern: history-sprint-*
          path: shards
          merge-multiple: false
          run-id: ${{ inputs.source_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Exclude prior final reports from shard merge
        run: rm -rf shards/history-sprint-final-reports

      - name: Merge shard changes into the latest data baseline
        shell: bash
        run: |
          set -euo pipefail
          merge_args=()
          if [[ -n "${{ inputs.publish_issue_ids }}" ]]; then
            merge_args+=(--issue-ids "${{ inputs.publish_issue_ids }}")
          fi
          python scripts/merge_history_shards.py \
            --root . \
            --shards-root shards \
            "${merge_args[@]}"

      - name: Build historical archives from ScienceDirect browser snapshots
        if: inputs.evidence_issue_ids != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}

          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          TRANSLATION_RETRIES: "5"
          TRANSLATION_WORKERS: "4"
        shell: bash
        run: |
          set -euo pipefail
          snapshot_args=()
          deferred="$RUNNER_TEMP/sciencedirect-evidence-deferred.txt"
          : > "$deferred"
          mkdir -p data/provenance/browser-snapshots
          IFS=',' read -ra issue_ids <<< "${{ inputs.evidence_issue_ids }}"
          for issue_id in "${issue_ids[@]}"; do
            issue_id="${issue_id//[[:space:]]/}"
            snapshot="$(find data/provenance/browser-snapshots -type f -name "$issue_id.json" -print -quit)"
            if [[ -z "$snapshot" ]]; then
              echo "Browser-authorized snapshot not found for: $issue_id; deferred" >&2
              printf '%s\n' "$issue_id" >> "$deferred"
              continue
            fi
            snapshot_args+=("$snapshot")
          done
          if ((${#snapshot_args[@]})); then
            python scripts/build_sciencedirect_browser_archives.py \
              "${snapshot_args[@]}" \
              --state-root data/backfill-state \
              --translation-cache-root data/translation-cache \
              --translate
          else
            echo "No browser-authorized ScienceDirect snapshots available; all requested issues deferred."
          fi
          cp "$deferred" "$GITHUB_WORKSPACE/sciencedirect-evidence-deferred.txt"

      - name: Convert ScienceDirect browser snapshots to official evidence
        if: inputs.evidence_issue_ids != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          snapshot_args=()
          deferred="$RUNNER_TEMP/sciencedirect-evidence-deferred.txt"
          : > "$deferred"
          mkdir -p data/provenance/browser-snapshots
          IFS=',' read -ra issue_ids <<< "${{ inputs.evidence_issue_ids }}"
          for issue_id in "${issue_ids[@]}"; do
            issue_id="${issue_id//[[:space:]]/}"
            snapshot="$(find data/provenance/browser-snapshots -type f -name "$issue_id.json" -print -quit)"
            if [[ -z "$snapshot" ]]; then
              echo "Browser-authorized snapshot not found for: $issue_id; deferred" >&2
              printf '%s\n' "$issue_id" >> "$deferred"
              continue
            fi
            snapshot_args+=("$snapshot")
          done
          if ((${#snapshot_args[@]})); then
            python scripts/capture_sciencedirect_browser_roster_evidence.py \
              "${snapshot_args[@]}" \
              --api-root public/api/v1 \
              --output-root data/provenance/official-rosters/sciencedirect
          else
            echo "No browser-authorized ScienceDirect snapshots available; no evidence imported."
          fi

      - name: Capture official Wiley roster evidence
        if: inputs.capture_wiley_evidence
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/backfill_status.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json public/api/v1/backfill-status.json \
            --out-md public/backfill-status.md
          python scripts/build_gap_manifest.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json public/api/v1/gap-manifest.json \
            --out-md public/gap-manifest.md
          python scripts/capture_wiley_roster_evidence.py \
            --gap-manifest public/api/v1/gap-manifest.json \
            --api-root public/api/v1 \
            --output-root data/provenance/official-rosters/wiley \
            --diagnostics-root "$RUNNER_TEMP/wiley-evidence-failures"

      - name: Build archives from generic official roster evidence
        if: inputs.evidence_issue_ids != ''
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          TRANSLATION_RETRIES: "5"
          TRANSLATION_WORKERS: "4"
          EVIDENCE_ISSUE_IDS: ${{ inputs.evidence_issue_ids }}
        shell: bash
        run: |
          set -euo pipefail
          evidence_args=()
          if [[ -n "${EVIDENCE_ISSUE_IDS:-}" ]]; then
            evidence_args+=(--issue-ids "$EVIDENCE_ISSUE_IDS")
          fi
          python scripts/build_archives_from_roster_evidence.py \
            --evidence-root data/provenance/official-rosters \
            --api-root public/api/v1 \
            --state-root data/backfill-state \
            --staging-root data/backfill-staging \
            --translation-cache-root data/translation-cache \
            --report-json "$RUNNER_TEMP/roster-archive-report.json" \
            "${evidence_args[@]}"

      - name: Apply exact official roster evidence
        if: inputs.evidence_issue_ids != ''
        env:
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
          EVIDENCE_ISSUE_IDS: ${{ inputs.evidence_issue_ids }}
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/official-roster-evidence"
          mkdir -p "$output"
          evidence_list="$RUNNER_TEMP/official-roster-evidence.list"
          if [[ -n "$EVIDENCE_ISSUE_IDS" ]]; then
            : > "$evidence_list"
            IFS=',' read -ra issue_ids <<< "$EVIDENCE_ISSUE_IDS"
            for issue_id in "${issue_ids[@]}"; do
              issue_id="${issue_id//[[:space:]]/}"
              if [[ ! "$issue_id" =~ ^[A-Za-z0-9-]+$ ]]; then
                echo "Invalid evidence issue ID: $issue_id" >&2
                exit 1
              fi
              evidence="$(find data/provenance/official-rosters -type f -name "$issue_id.json" -print -quit)"
              if [[ -z "$evidence" ]]; then
                echo "Official evidence not found for: $issue_id; deferred until archive is ready" >&2
                continue
              fi
              printf '%s\0' "$evidence" >> "$evidence_list"
            done
          else
            find data/provenance/official-rosters -type f -name '*.json' -print0 \
              | sort -z > "$evidence_list"
          fi
          while IFS= read -r -d '' evidence; do
            python scripts/import_official_roster_evidence.py \
              "$evidence" \
              --api-root public/api/v1 \
              --output "$output/$(basename "$evidence")" \
              --state-root data/backfill-state \
              --translation-cache-root data/translation-cache \
              --enrich-missing-elsevier \
              --translate \
              --promote
          done < "$evidence_list"

      - name: Repair only invalid current-snapshot translations
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          TRANSLATION_RETRIES: "2"
          TRANSLATION_WORKERS: "4"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/repair_current_translations.py \
            --api-root public/api/v1 \
            --translation-cache-root data/translation-cache \
            --report-json "$RUNNER_TEMP/current-translation-repair.json"

      - name: Rebuild indexes and run strict acceptance gates
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rebuild_public_snapshot.py
          python scripts/repair_history_dates.py \
            --journal IER --journal CER --journal JPubE --journal ENERGY \
            --journal ECOLECON --journal JUE --journal JET --journal JEDC \
            --journal JPubE --journal JOE --journal JFE \
            --start-year 2023
          python scripts/publish_data_delta.py rebuild-archive-indexes --root .
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/backfill_status.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json public/api/v1/backfill-status.json \
            --out-md public/backfill-status.md
          python scripts/build_gap_manifest.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json public/api/v1/gap-manifest.json \
            --out-md public/gap-manifest.md
          python scripts/check_recovery_progress.py \
            --before "$RUNNER_TEMP/gap-before.json" \
            --after public/api/v1/gap-manifest.json \
            --report "$RUNNER_TEMP/recovery-progress.json"
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          history_args=()
          if [ "${{ inputs.strict_final }}" = "true" ]; then
            history_args+=(--strict)
          fi
          python scripts/audit_history_coverage.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --report-json "$RUNNER_TEMP/history-coverage.json" \
            "${history_args[@]}"
          python scripts/audit_privacy.py
          python -m unittest discover -s tests -v
          python scripts/rebuild_public_snapshot.py --check

      - name: Apply delta to the latest data branch and push once
        env:
          STRICT_HISTORY_COVERAGE_ENABLED: ${{ vars.STRICT_HISTORY_COVERAGE_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/generated-data"
          data_tree="$RUNNER_TEMP/data-tree"
          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$generated" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --path data/provenance/official-rosters \
            --exclude 'public/api/v1/journals/*/issues/index.json'
          git fetch origin data
          git worktree add "$data_tree" origin/data
          git -C "$data_tree" switch -C data
          python scripts/publish_data_delta.py apply \
            --baseline "$RUNNER_TEMP/data-baseline" \
            --generated "$generated" \
            --target "$data_tree" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --path data/provenance/official-rosters \
            --exclude 'public/api/v1/journals/*/issues/index.json'
          rm -rf "$data_tree/public/api"
          cp -R public/api "$data_tree/public/api"
          cp public/project-manifest.json "$data_tree/public/project-manifest.json"
          cp public/backfill-status.md "$data_tree/public/backfill-status.md"
          cp public/gap-manifest.md "$data_tree/public/gap-manifest.md"
          git -C "$data_tree" rm -f --ignore-unmatch public/search.js
          git -C "$data_tree" config user.name "academic-door-bot"
          git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
          git -C "$data_tree" add -A public/api data/translation-cache data/backfill-state data/backfill-staging
          git -C "$data_tree" add public/project-manifest.json public/backfill-status.md public/gap-manifest.md
          if git -C "$data_tree" diff --cached --quiet; then
            echo "No data changes after the sprint."
            exit 0
          fi
          git -C "$data_tree" commit -m "Run 24h historical recovery sprint"
          git -C "$data_tree" push origin HEAD:data

      - name: Upload final sprint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history-sprint-final-reports
          if-no-files-found: warn
          path: |
            public/api/v1/backfill-status.json
            public/api/v1/gap-manifest.json
            public/backfill-status.md
            public/gap-manifest.md
            ${{ runner.temp }}/history-coverage.json
            ${{ runner.temp }}/recovery-progress.json
            sciencedirect-evidence-deferred.txt

  composer:
    name: Sync only audited ready issues to Composer
    needs: publish
    if: always() && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Restore published data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api
          mkdir -p public
          git archive origin/data public/api public/project-manifest.json | tar -x
      - name: Sync audited bundle once
        continue-on-error: true
        env:
          COMPOSER_DEPLOY_KEY: ${{ secrets.COMPOSER_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$COMPOSER_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          target="$RUNNER_TEMP/composer-history-sprint"
          git clone --depth=1 git@github.com:academic-door/academic-door-composer.git "$target"
          python "$target/scripts/build_data.py" --journals-source "$GITHUB_WORKSPACE/public" --output "$target/site/data"
          python "$target/scripts/validate_bundle.py" --site "$target/site"
          cd "$target"
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add site/data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync audited history sprint issues"
          git push origin HEAD:main
