name: G03 monitor scoped force-deep RED

on:
  push:
    branches:
      - feat/g03-monitor-scoped-force-deep-20260916

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/g03-monitor-scoped-force-deep-20260916
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Confirm missing scoped force-deep behavior
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_monitor_force_deep -v 2>&1 | tee /tmp/red.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected scoped force-deep tests to fail before implementation."
            exit 1
          fi
          grep -q "test_force_deep_journals_bypass_retry_only_for_named_journal" /tmp/red.log
          grep -q "test_monitor_workflow_exposes_scoped_force_input_without_broad_force" /tmp/red.log
          if grep -Eq "ImportError|ModuleNotFoundError|SyntaxError" /tmp/red.log; then
            echo "RED failed for infrastructure instead of behavior."
            exit 1
          fi
          echo "Expected behavioral RED confirmed."
