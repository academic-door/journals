name: G03 WD207 history editorial GREEN

on:
  push:
    branches:
      - fix/g03-wd207-history-editorial-20260916

permissions:
  contents: write

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/g03-wd207-history-editorial-20260916
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Patch history fallback publisher type propagation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("collectors/elsevier.py")
          text = path.read_text(encoding="utf-8")
          marker = 'publisher_article_type = "editorial"'
          if marker not in text:
              start = text.index("def fetch_elsevier_repec_history_issue(")
              end = text.find("\ndef ", start + 1)
              if end == -1:
                  end = len(text)
              segment = text[start:end]

              import_anchor = "        from collectors.metadata_fallback import _is_elsevier_identifier\n"
              if segment.count(import_anchor) != 1:
                  raise SystemExit(f"history identifier import count={segment.count(import_anchor)}")
              segment = segment.replace(
                  import_anchor,
                  '        publisher_article_type = ""\n' + import_anchor,
                  1,
              )

              lookup_anchor = "            lookup = _elsevier_lookup(client, pii, doi=doi, timeout=timeout)\n"
              if segment.count(lookup_anchor) != 1:
                  raise SystemExit(f"history lookup call count={segment.count(lookup_anchor)}")
              segment = segment.replace(
                  lookup_anchor,
                  lookup_anchor
                  + '            if str(lookup.get("article_type", "")).strip().casefold() == "editorial":\n'
                  + '                publisher_article_type = "editorial"\n',
                  1,
              )

              type_anchor = '            "article_type": (\n'
              if segment.count(type_anchor) != 1:
                  raise SystemExit(f"history article_type field count={segment.count(type_anchor)}")
              segment = segment.replace(
                  type_anchor,
                  '            "article_type": publisher_article_type or (\n',
                  1,
              )

              path.write_text(text[:start] + segment + text[end:], encoding="utf-8")
          PY
      - run: python -m pip install -r requirements.txt
      - name: Run focused history publisher-type regressions
        run: |
          set -euo pipefail
          python -m unittest tests.test_elsevier_history_publisher_type -v
          python -m unittest tests.test_elsevier_publisher_type -v
          python -m unittest tests.test_elsevier_collector -v
          git diff --check
      - name: Commit permanent GREEN
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- collectors/elsevier.py; then
            echo "source already patched"
            exit 0
          fi
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add collectors/elsevier.py
          git commit -m "fix(history): honor publisher-declared editorials"
          git push origin HEAD:fix/g03-wd207-history-editorial-20260916
