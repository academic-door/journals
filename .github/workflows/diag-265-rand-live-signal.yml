name: Diagnose RAND Wiley live signal

on:
  push:
    branches:
      - diag/265-rand-live-signal
    paths:
      - .github/workflows/diag-265-rand-live-signal.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Inspect bounded first-party signals
        shell: bash
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlparse
          import requests
          from bs4 import BeautifulSoup
          from collectors.wiley import parse_latest_issue_signal
          from scripts.journal_monitor import fetch_official_issue_signal, fetch_rss_dois

          landing = "https://onlinelibrary.wiley.com/journal/17562171"
          feed = "https://onlinelibrary.wiley.com/feed/17562171/most-recent"
          headers = {
              "User-Agent": "AcademicDoorJournals/0.1 (non-profit academic metadata service; https://academic-door.github.io/)",
              "Accept-Language": "en-US,en;q=0.8",
          }
          out = {"landing_url": landing, "feed_url": feed}

          for label, url, accept in (
              ("landing", landing, "text/html,application/xhtml+xml"),
              ("feed", feed, "application/rss+xml,application/xml,text/xml,*/*"),
          ):
              try:
                  response = requests.get(
                      url,
                      headers={**headers, "Accept": accept},
                      timeout=30,
                      allow_redirects=True,
                  )
                  out[f"{label}_status"] = response.status_code
                  out[f"{label}_resolved_host"] = urlparse(response.url).hostname
                  out[f"{label}_resolved_path"] = urlparse(response.url).path
                  out[f"{label}_content_length"] = len(response.content)
                  out[f"{label}_content_type"] = response.headers.get("Content-Type", "")[:120]
                  soup = BeautifulSoup(response.content, "html.parser")
                  out[f"{label}_title"] = soup.title.get_text(" ", strip=True)[:160] if soup.title else ""
                  if label == "landing":
                      headings = [h.get_text(" ", strip=True) for h in soup.find_all(["h2", "h3", "h4"])]
                      out["landing_recent_issue_heading_count"] = sum(1 for h in headings if "recent issues" in h.casefold())
                      out["landing_toc_link_count"] = len(soup.select("a[href*='/toc/']"))
                      try:
                          out["landing_direct_parse"] = parse_latest_issue_signal(response.content, landing)
                      except Exception as exc:
                          out["landing_direct_parse_error"] = f"{type(exc).__name__}: {exc}"
              except Exception as exc:
                  out[f"{label}_request_error"] = f"{type(exc).__name__}: {exc}"

          try:
              out["production_landing_fetch"] = fetch_official_issue_signal({
                  "id": "rand",
                  "announcement_source": "wiley_recent_issues",
                  "announcement_url": landing,
              })
          except Exception as exc:
              out["production_landing_fetch_error"] = f"{type(exc).__name__}: {exc}"

          try:
              dois = sorted(fetch_rss_dois(feed))
              out["production_feed_doi_count"] = len(dois)
              out["production_feed_doi_sample"] = dois[:5]
              out["production_feed_has_rand_57_3"] = any(doi.startswith("10.1111/1756-2171.700") for doi in dois)
          except Exception as exc:
              out["production_feed_error"] = f"{type(exc).__name__}: {exc}"

          print(json.dumps(out, ensure_ascii=False, sort_keys=True))
          PY
