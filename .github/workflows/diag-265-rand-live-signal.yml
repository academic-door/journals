name: Inspect Econometric Society issue markup

on:
  push:
    branches:
      - diag/265-rand-live-signal
    paths:
      - .github/workflows/diag-265-rand-live-signal.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Inspect official 2026 issue markup
        shell: bash
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urljoin
          import requests
          from bs4 import BeautifulSoup, Tag

          url = "https://www.econometricsociety.org/publications/econometrica/volume/2026"
          r = requests.get(url, headers={
              "User-Agent": "AcademicDoorJournals/0.1 (non-profit academic metadata service; https://academic-door.github.io/)",
              "Accept": "text/html,application/xhtml+xml",
              "Accept-Language": "en-US,en;q=0.8",
          }, timeout=30, allow_redirects=True)
          soup = BeautifulSoup(r.content, "html.parser")
          hits = []
          for node in soup.find_all(["a", "h2", "h3", "h4", "div", "li"]):
              text = " ".join(node.get_text(" ", strip=True).split())
              low = text.casefold()
              if "issue 5" not in low:
                  continue
              parent = node.find_parent(["article", "li", "section", "div"])
              parent_text = " ".join(parent.get_text(" ", strip=True).split()) if isinstance(parent, Tag) else text
              hits.append({
                  "tag": node.name,
                  "text": text[:500],
                  "href": urljoin(r.url, str(node.get("href", ""))) if node.name == "a" else "",
                  "parent_text": parent_text[:1000],
                  "parent_classes": list(parent.get("class", [])) if isinstance(parent, Tag) else [],
              })
              if len(hits) >= 10:
                  break
          print(json.dumps({"status": r.status_code, "hits": hits}, ensure_ascii=False, sort_keys=True))
          PY
