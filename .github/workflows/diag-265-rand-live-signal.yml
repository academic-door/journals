name: Diagnose OUP freshness feeds

on:
  push:
    branches:
      - diag/265-rand-live-signal
    paths:
      - .github/workflows/diag-265-rand-live-signal.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Discover official OUP feed links
        shell: bash
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urljoin, urlparse
          import requests
          from bs4 import BeautifulSoup

          pages = {
              "EJ": "https://academic.oup.com/ej/issue",
              "JEEA": "https://academic.oup.com/jeea/issue",
              "RFS": "https://academic.oup.com/rfs/issue",
              "QJE": "https://academic.oup.com/qje/issue",
              "RES": "https://academic.oup.com/restud/issue",
          }
          headers = {
              "User-Agent": "AcademicDoorJournals/0.1 (non-profit academic metadata service; https://academic-door.github.io/)",
              "Accept": "text/html,application/xhtml+xml",
              "Accept-Language": "en-US,en;q=0.8",
          }
          out = {}
          for journal, url in pages.items():
              r = requests.get(url, headers=headers, timeout=30, allow_redirects=True)
              soup = BeautifulSoup(r.content, "html.parser")
              links = []
              for node in soup.find_all(["a", "link"], href=True):
                  href = str(node.get("href", ""))
                  typ = str(node.get("type", ""))
                  text = node.get_text(" ", strip=True)
                  if "rss" in href.casefold() or "rss" in typ.casefold() or "rss" in text.casefold():
                      absolute = urljoin(r.url, href)
                      if urlparse(absolute).hostname == "academic.oup.com" and absolute not in links:
                          links.append(absolute)
              out[journal] = {
                  "status": r.status_code,
                  "resolved_url": r.url,
                  "title": soup.title.get_text(" ", strip=True)[:120] if soup.title else "",
                  "rss_links": links[:20],
              }
          print(json.dumps(out, ensure_ascii=False, sort_keys=True))
          PY
