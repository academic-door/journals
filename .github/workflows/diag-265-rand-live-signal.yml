name: Probe Econometric Society freshness source

on:
  push:
    branches:
      - diag/265-rand-live-signal
    paths:
      - .github/workflows/diag-265-rand-live-signal.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Probe official Econometric Society pages
        shell: bash
        run: |
          python - <<'PY'
          import json
          from urllib.parse import urlparse
          import requests
          from bs4 import BeautifulSoup

          urls = {
              "ecta_home": "https://www.econometricsociety.org/publications/econometrica",
              "ecta_2026": "https://www.econometricsociety.org/publications/econometrica/volume/2026",
          }
          headers = {
              "User-Agent": "AcademicDoorJournals/0.1 (non-profit academic metadata service; https://academic-door.github.io/)",
              "Accept": "text/html,application/xhtml+xml",
              "Accept-Language": "en-US,en;q=0.8",
          }
          out = {}
          for label, url in urls.items():
              result = {"url": url}
              try:
                  r = requests.get(url, headers=headers, timeout=30, allow_redirects=True)
                  text = " ".join(BeautifulSoup(r.content, "html.parser").stripped_strings)
                  low = text.casefold()
                  result.update({
                      "status": r.status_code,
                      "resolved_host": urlparse(r.url).hostname,
                      "resolved_path": urlparse(r.url).path,
                      "content_type": r.headers.get("Content-Type", "")[:100],
                      "content_length": len(r.content),
                      "title": BeautifulSoup(r.content, "html.parser").title.get_text(" ", strip=True)[:160] if BeautifulSoup(r.content, "html.parser").title else "",
                      "has_volume_94": "volume 94" in low,
                      "has_issue_5": "issue 5" in low,
                      "has_september_2026": "september 2026" in low or "sep, 2026" in low or "sep 2026" in low,
                      "has_ecta_2026_94_5_identity": "volume 94" in low and "issue 5" in low,
                      "text_sample": text[:500],
                  })
              except Exception as exc:
                  result["error"] = f"{type(exc).__name__}: {exc}"
              out[label] = result
          print(json.dumps(out, ensure_ascii=False, sort_keys=True))
          PY
