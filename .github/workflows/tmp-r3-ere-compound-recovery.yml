name: Temporary R3 ERE compound recovery

on:
  push:
    branches:
      - r3/ere-compound-recovery-20260910

permissions:
  actions: write
  contents: write
  models: read

concurrency:
  group: journal-data-update
  cancel-in-progress: false

env:
  TARGET_IDS: ere-85-3-4,ere-86-1-2

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: r3/ere-compound-recovery-20260910
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Restore canonical data and capture baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api data/backfill-state data/backfill-staging data/translation-cache data/provenance/official-rosters
          mkdir -p public data data/provenance/official-rosters output
          git archive origin/data public/api public/project-manifest.json data/backfill-state data/backfill-staging data/translation-cache | tar -x
          if git ls-tree -r --name-only origin/data -- data/provenance/official-rosters | grep -q .; then
            git archive origin/data data/provenance/official-rosters | tar -x
          fi
          if git cat-file -e origin/data:public/backfill-status.md 2>/dev/null; then
            git show origin/data:public/backfill-status.md > public/backfill-status.md
          fi
          if git cat-file -e origin/data:public/gap-manifest.md 2>/dev/null; then
            git show origin/data:public/gap-manifest.md > public/gap-manifest.md
          fi
          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$RUNNER_TEMP/data-baseline" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --path data/provenance/official-rosters \
            --exclude 'public/api/v1/journals/*/issues/index.json'
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/audit_history_coverage.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --report-json "$RUNNER_TEMP/history-before.json"
          python scripts/build_gap_manifest.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json output/gap-before.json

      - name: Build exact two-issue recovery manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          targets = {
              "ere-85-3-4": ("85", "3-4", "https://link.springer.com/journal/10640/volumes-and-issues/85-3"),
              "ere-86-1-2": ("86", "1-2", "https://link.springer.com/journal/10640/volumes-and-issues/86-1"),
          }
          payload = json.loads(Path("output/gap-before.json").read_text(encoding="utf-8"))
          records = {r.get("issue_id"): r for r in payload.get("records", []) if r.get("issue_id") in targets}
          if set(records) != set(targets):
              raise SystemExit(f"target gap records missing: {sorted(set(targets) - set(records))}")
          selected = []
          for issue_id, (volume, issue, url) in targets.items():
              record = records[issue_id]
              assert str(record.get("volume")) == volume, record
              assert str(record.get("issue")) == issue, record
              assert record.get("official_url") == url, record
              assert record.get("source_status") == "source_pending", record
              assert record.get("publication_state") != "ready", record
              selected.append(record)
          out = {
              "schema_version": "1.0",
              "generated_at": payload.get("generated_at", ""),
              "summary": {"recoverable": len(selected)},
              "records": selected,
          }
          Path("output/ere-gap.json").write_text(json.dumps(out, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({k: records[k].get("category") for k in sorted(records)}, sort_keys=True))
          PY

      - name: Capture exact official Springer rosters and article details
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_springer_roster_evidence.py \
            --gap-manifest output/ere-gap.json \
            --output-root data/provenance/official-rosters/springer \
            --issue-ids "$TARGET_IDS" \
            --diagnostics-root output/evidence-failures

      - name: Validate official evidence before archive build
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from urllib.parse import urlparse

          expected = {
              "ere-85-3-4": "https://link.springer.com/journal/10640/volumes-and-issues/85-3",
              "ere-86-1-2": "https://link.springer.com/journal/10640/volumes-and-issues/86-1",
          }
          for issue_id, official_url in expected.items():
              path = Path("data/provenance/official-rosters/springer") / f"{issue_id}.json"
              if not path.exists():
                  raise SystemExit(f"official evidence missing: {issue_id}")
              evidence = json.loads(path.read_text(encoding="utf-8"))
              assert evidence.get("issue_id") == issue_id, evidence
              assert evidence.get("journal_id") == "ere", evidence
              assert evidence.get("official_url") == official_url, evidence
              assert evidence.get("finalized") is True, evidence
              items = evidence.get("items") or []
              if not items:
                  raise SystemExit(f"empty official roster: {issue_id}")
              for item in items:
                  if not item.get("doi") or not item.get("title_en") or not item.get("authors") or not item.get("abstract_en"):
                      raise SystemExit(f"incomplete official item in {issue_id}: {item.get('doi')}")
                  if urlparse(str(item.get("source_url", ""))).hostname != "link.springer.com":
                      raise SystemExit(f"non-Springer detail source in {issue_id}: {item.get('source_url')}")
              print(issue_id, "official_items", len(items), "excluded", len(evidence.get("excluded_items") or []))
          PY

      - name: Build and translate exact official archives
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          TRANSLATION_RETRIES: "5"
          TRANSLATION_WORKERS: "4"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_archives_from_roster_evidence.py \
            --evidence-root data/provenance/official-rosters/springer \
            --api-root public/api/v1 \
            --state-root data/backfill-state \
            --staging-root data/backfill-staging \
            --translation-cache-root data/translation-cache \
            --issue-ids "$TARGET_IDS" \
            --max-translations 80 \
            --start-year 2023 \
            --report-json output/ere-build-report.json
          python - <<'PY'
          import json
          from pathlib import Path
          wanted = {"ere-85-3-4", "ere-86-1-2"}
          report = json.loads(Path("output/ere-build-report.json").read_text(encoding="utf-8"))
          results = {row.get("issue_id"): row for row in report.get("results", []) if row.get("issue_id") in wanted}
          if set(results) != wanted:
              raise SystemExit(f"builder did not report both targets: {results}")
          bad = {k: v for k, v in results.items() if v.get("result") != "ready"}
          if bad:
              raise SystemExit(f"target archives not ready: {bad}")
          print(json.dumps(results, ensure_ascii=False, sort_keys=True))
          PY
          rm -f \
            data/backfill-staging/ere/ere-85-3-4.json \
            data/backfill-staging/ere/ere-86-1-2.json

      - name: Rebuild derived data and run acceptance gates
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rebuild_public_snapshot.py
          python scripts/publish_data_delta.py rebuild-archive-indexes --root .
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/backfill_status.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json public/api/v1/backfill-status.json \
            --out-md public/backfill-status.md
          python scripts/build_gap_manifest.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json public/api/v1/gap-manifest.json \
            --out-md public/gap-manifest.md
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_history_coverage.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --report-json "$RUNNER_TEMP/history-after.json"
          python scripts/audit_privacy.py
          python -m unittest tests.test_springer_roster_capture tests.test_build_archives_from_roster_evidence -v
          python scripts/rebuild_public_snapshot.py --check

      - name: Hard-assert exact target acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          targets = {
              "ere-85-3-4": ("85", "3-4"),
              "ere-86-1-2": ("86", "1-2"),
          }
          for issue_id, (volume, issue) in targets.items():
              archive = json.loads((Path("public/api/v1/journals/ere/issues") / f"{issue_id}.json").read_text(encoding="utf-8"))
              assert archive.get("issue_id") == issue_id, archive
              assert str(archive.get("volume")) == volume, archive
              assert str(archive.get("issue")) == issue, archive
              assert archive.get("content_status") == "complete", archive
              assert archive.get("source_status") == "official_verified", archive
              assert archive.get("publication_state") == "ready", archive
              count = int(archive.get("research_article_count") or 0)
              quality = archive.get("quality") or {}
              assert count > 0, archive
              assert int(quality.get("abstract_en_complete") or 0) == count, quality
              assert int(quality.get("translation_complete") or 0) == count, quality

          before = json.loads((Path(os.environ["RUNNER_TEMP"]) / "history-before.json").read_text(encoding="utf-8"))
          after = json.loads((Path(os.environ["RUNNER_TEMP"]) / "history-after.json").read_text(encoding="utf-8"))
          before_errors = [str(x) for x in before.get("errors", [])]
          after_errors = [str(x) for x in after.get("errors", [])]
          for issue_id in targets:
              if not any(issue_id in error for error in before_errors):
                  raise SystemExit(f"baseline did not contain expected target gap: {issue_id}")
              if any(issue_id in error for error in after_errors):
                  raise SystemExit(f"target history gap remains after recovery: {issue_id}")
          if int(after.get("error_count", len(after_errors))) >= int(before.get("error_count", len(before_errors))):
              raise SystemExit("history error count did not improve")
          print(json.dumps({"before": before.get("error_count"), "after": after.get("error_count")}, sort_keys=True))
          PY

      - name: Publish one guarded data delta
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/generated-data"
          data_tree="$RUNNER_TEMP/data-tree"
          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$generated" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --path data/provenance/official-rosters \
            --exclude 'public/api/v1/journals/*/issues/index.json'
          git fetch origin data
          git worktree add "$data_tree" origin/data
          git -C "$data_tree" switch -C data
          python scripts/publish_data_delta.py apply \
            --baseline "$RUNNER_TEMP/data-baseline" \
            --generated "$generated" \
            --target "$data_tree" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --path data/provenance/official-rosters \
            --exclude 'public/api/v1/journals/*/issues/index.json'
          rm -rf "$data_tree/public/api"
          cp -R public/api "$data_tree/public/api"
          cp public/project-manifest.json "$data_tree/public/project-manifest.json"
          cp public/backfill-status.md "$data_tree/public/backfill-status.md"
          cp public/gap-manifest.md "$data_tree/public/gap-manifest.md"
          git -C "$data_tree" rm -f --ignore-unmatch public/search.js
          git -C "$data_tree" config user.name "academic-door-bot"
          git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
          git -C "$data_tree" add -A public/api data/translation-cache data/backfill-state data/backfill-staging data/provenance/official-rosters
          git -C "$data_tree" add public/project-manifest.json public/backfill-status.md public/gap-manifest.md
          git -C "$data_tree" commit -m "Recover ERE compound historical issues"
          git -C "$data_tree" push origin HEAD:data
          echo "Published data SHA: $(git -C "$data_tree" rev-parse HEAD)"

      - name: Trigger canonical production deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main

      - name: Remove temporary recovery driver from branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git reset --hard HEAD
          git clean -fd
          if [ -f .github/workflows/tmp-r3-ere-compound-recovery.yml ]; then
            git rm .github/workflows/tmp-r3-ere-compound-recovery.yml
            git config user.name "academic-door-bot"
            git config user.email "academic-door-bot@users.noreply.github.com"
            git commit -m "chore(history): remove temporary ERE recovery driver"
            git push origin HEAD:r3/ere-compound-recovery-20260910
          fi
