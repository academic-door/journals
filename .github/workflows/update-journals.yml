name: Update journal data

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-journals.yml"
      - "collectors/**"
      - "config/**"
      - "data/translation-cache/**"
      - "data/order-overrides/**"
      - "schemas/**"
      - "scripts/**"
      - "requirements.txt"
  workflow_dispatch:
    inputs:
      journal:
        description: Any configured journal code, or ALL
        required: true
        default: ALL
        type: string
  schedule:
    # Daily full sweep is the safety net. The lightweight monitor runs every
    # two hours and deep-collects only journals with confirmed changes.
    - cron: "35 21 * * *"

permissions:
  contents: write
  issues: write
  models: read

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Restore last-known-good data baseline
        shell: bash
        run: |
          set -euo pipefail
          main_cache="$RUNNER_TEMP/main-translation-cache"
          mkdir -p "$main_cache"
          cp -R data/translation-cache/. "$main_cache/"
          if git ls-remote --exit-code origin refs/heads/data >/dev/null 2>&1; then
            git fetch origin data
            git archive origin/data public | tar -x
            if git cat-file -e origin/data:data/translation-cache 2>/dev/null; then
              git archive origin/data data/translation-cache | tar -x
            fi
            if git cat-file -e origin/data:data/monitoring/email-notifications.json 2>/dev/null; then
              mkdir -p data/monitoring
              git show origin/data:data/monitoring/email-notifications.json \
                > data/monitoring/email-notifications.json
            fi
          fi
          MAIN_CACHE="$main_cache" python - <<'PY'
          import json
          import os
          from pathlib import Path

          target_dir = Path("data/translation-cache")
          target_dir.mkdir(parents=True, exist_ok=True)
          for override_path in Path(os.environ["MAIN_CACHE"]).glob("*.json"):
              target_path = target_dir / override_path.name
              base = json.loads(target_path.read_text(encoding="utf-8")) if target_path.exists() else {}
              override = json.loads(override_path.read_text(encoding="utf-8"))
              base.update(override)
              target_path.write_text(
                  json.dumps(base, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt
      - name: Collect and validate
        id: collect
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
        run: |
          python scripts/update_journals.py --journal "${{ inputs.journal || 'ALL' }}" --translate
          python scripts/audit_public_data.py
          python scripts/audit_source_alignment.py --strict
          python -m unittest discover -s tests -v
          python scripts/audit_privacy.py

      - name: Publish generated public data to data branch
        id: publish
        if: steps.collect.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/generated-public"
          generated_cache="$RUNNER_TEMP/generated-translation-cache"
          data_tree="$RUNNER_TEMP/data-tree"
          mkdir -p "$generated"
          mkdir -p "$generated_cache"
          cp -R public/. "$generated/"
          cp -R data/translation-cache/. "$generated_cache/"

          if git ls-remote --exit-code origin refs/heads/data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add "$data_tree" origin/data
            cd "$data_tree"
            git switch -C data
          else
            git worktree add --detach "$data_tree"
            cd "$data_tree"
            git switch --orphan data
            git rm -rf --ignore-unmatch .
          fi

          rm -rf public data/translation-cache
          mkdir -p public
          mkdir -p data/translation-cache
          cp -R "$generated"/. public/
          cp -R "$generated_cache"/. data/translation-cache/
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add public data/translation-cache
          if git diff --cached --quiet; then
            echo "No public data changes."
            exit 0
          fi
          git commit -m "Update journal data"
          git push origin HEAD:data

      - name: Preserve partial enrichment and translation progress
        if: steps.collect.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          generated_cache="$RUNNER_TEMP/partial-translation-cache"
          generated_detected="$RUNNER_TEMP/partial-detected"
          data_tree="$RUNNER_TEMP/partial-data-tree"
          mkdir -p "$generated_cache" "$generated_detected"
          cp -R data/translation-cache/. "$generated_cache/"
          find public/api/v1/journals -path '*/issues/detected.json' -type f -print0 |
            while IFS= read -r -d '' file; do
              mkdir -p "$generated_detected/$(dirname "$file")"
              cp "$file" "$generated_detected/$file"
            done
          git fetch origin data
          git worktree add "$data_tree" origin/data
          cd "$data_tree"
          git switch -C data
          rm -rf data/translation-cache
          mkdir -p data/translation-cache
          cp -R "$generated_cache"/. data/translation-cache/
          cp -R "$generated_detected"/. .
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add data/translation-cache public/api/v1/journals/*/issues/detected.json
          if git diff --cached --quiet; then
            echo "No partial enrichment or translation progress to preserve."
            exit 0
          fi
          git commit -m "Preserve partial journal enrichment progress"
          git push origin HEAD:data

      - name: Sync audited journal issues to private Composer
        id: composer
        if: steps.collect.outcome == 'success'
        env:
          COMPOSER_DEPLOY_KEY: ${{ secrets.COMPOSER_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$COMPOSER_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          for attempt in 1 2 3; do
            target="$RUNNER_TEMP/composer-sync-$attempt"
            rm -rf "$target"
            git clone --depth=1 git@github.com:academic-door/academic-door-composer.git "$target"
            python "$target/scripts/build_data.py" \
              --journals-source "$GITHUB_WORKSPACE/public" \
              --output "$target/site/data"
            python "$target/scripts/validate_bundle.py" --site "$target/site"
            cd "$target"
            git config user.name "academic-door-bot"
            git config user.email "academic-door-bot@users.noreply.github.com"
            git add site/data
            if git diff --cached --quiet; then
              echo "Composer already contains the current audited journal issues."
              exit 0
            fi
            git commit -m "Sync audited journal issues"
            if git push origin HEAD:main; then
              exit 0
            fi
            cd "$GITHUB_WORKSPACE"
            sleep $((attempt * 5))
          done
          echo "Composer changed concurrently and could not be updated after three attempts."
          exit 1

      - name: Send private new-issue email
        id: email
        if: steps.collect.outcome == 'success' && steps.composer.outcome == 'success'
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
        run: python scripts/email_notifications.py --composer-status success

      - name: Persist private email notification state
        if: always() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          state="data/monitoring/email-notifications.json"
          if [ ! -f "$state" ]; then
            echo "No email notification state was produced."
            exit 0
          fi
          state_copy="$RUNNER_TEMP/email-notifications.json"
          data_tree="$RUNNER_TEMP/data-tree"
          cp "$state" "$state_copy"
          cd "$data_tree"
          mkdir -p data/monitoring
          cp "$state_copy" data/monitoring/email-notifications.json
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add -f data/monitoring/email-notifications.json
          if git diff --cached --quiet; then
            echo "Email notification state is unchanged."
            exit 0
          fi
          git commit -m "Update journal email notification state"
          git push origin HEAD:data

      - name: Open or close private email failure alert
        if: always() && steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f output/email-notification-result.json ]; then
            python scripts/email_notification_alerts.py \
              output/email-notification-result.json
          fi

      - name: Report validation failure
        if: steps.collect.outcome == 'failure'
        run: exit 1
