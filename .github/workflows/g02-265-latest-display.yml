name: G02 265 latest display implementation

on:
  push:
    branches:
      - fix/265-latest-display-invariants

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/265-latest-display-invariants
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply invariant implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/update_journals.py')
          text = path.read_text(encoding='utf-8')
          anchor = '\ndef is_detected_snapshot(issue: dict[str, Any]) -> bool:\n'
          helper = '''\ndef select_display_issue(\n    detected: dict[str, Any] | None,\n    ready: dict[str, Any] | None,\n) -> str:\n    """Choose the reader-facing snapshot without allowing detected regressions.\n\n    Ready is canonical for the same issue identity. A detected snapshot may lead\n    only when it is genuinely newer than the last ready issue. Raw detected\n    data remains available for diagnostics and enrichment.\n    """\n\n    if detected is None and ready is None:\n        return ""\n    if ready is None:\n        return "detected"\n    if detected is None:\n        return "ready"\n    if str(detected.get("issue_id", "")) == str(ready.get("issue_id", "")):\n        return "ready"\n    return "detected" if issue_is_newer(detected, ready) else "ready"\n\n\ndef is_detected_snapshot(issue: dict[str, Any]) -> bool:\n'''
          if 'def select_display_issue(' not in text:
              if anchor not in text:
                  raise SystemExit('helper anchor not found')
              text = text.replace(anchor, helper, 1)

          anchor = '        journal_entries[key] = entry\n'
          display_block = '''        display_source = select_display_issue(\n            detected if detected and is_detected_snapshot(detected) else None,\n            issue if issue and is_publishable_snapshot(issue) else None,\n        )\n        if display_source == "detected":\n            entry.update(\n                {\n                    "latest_display_issue_id": entry.get("latest_detected_issue_id", ""),\n                    "latest_display_issue_url": entry.get("latest_detected_issue_url", ""),\n                    "latest_display_issue_label": entry.get("latest_detected_issue_label", ""),\n                    "latest_display_publication_date": entry.get("latest_detected_publication_date", ""),\n                    "latest_display_publication_state": entry.get("latest_detected_publication_state", ""),\n                    "latest_display_source": "detected",\n                }\n            )\n        elif display_source == "ready":\n            entry.update(\n                {\n                    "latest_display_issue_id": entry.get("latest_ready_issue_id", entry.get("latest_issue_id", "")),\n                    "latest_display_issue_url": entry.get("latest_ready_issue_url", entry.get("latest_issue_url", "")),\n                    "latest_display_issue_label": entry.get("latest_issue_label", ""),\n                    "latest_display_publication_date": entry.get("publication_date", ""),\n                    "latest_display_publication_state": entry.get("publication_state", "ready"),\n                    "latest_display_source": "ready",\n                }\n            )\n        journal_entries[key] = entry\n'''
          if '"latest_display_issue_url"' not in text:
              if anchor not in text:
                  raise SystemExit('collection anchor not found')
              text = text.replace(anchor, display_block, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('src/components/Top5Explorer.astro')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '  latest_issue_url?: string;\n  latest_detected_issue_url?: string;\n',
              '  latest_issue_url?: string;\n  latest_detected_issue_url?: string;\n  latest_display_issue_url?: string;\n',
              1,
          )
          text = text.replace(
              '  (journal) => journal.latest_detected_issue_url || journal.latest_issue_url,\n',
              '  (journal) => journal.latest_display_issue_url || journal.latest_detected_issue_url || journal.latest_issue_url,\n',
              1,
          )
          text = text.replace(
              '  initialJournal?.latest_detected_issue_url || initialJournal?.latest_issue_url || "";\n',
              '  initialJournal?.latest_display_issue_url || initialJournal?.latest_detected_issue_url || initialJournal?.latest_issue_url || "";\n',
              1,
          )
          text = text.replace(
              '  const displayIssueUrl = (journal) =>\n    journal?.latest_detected_issue_url || journal?.latest_issue_url || "";\n',
              '  const displayIssueUrl = (journal) =>\n    journal?.latest_display_issue_url || journal?.latest_detected_issue_url || journal?.latest_issue_url || "";\n',
              1,
          )
          old = '''    const detectedId = state.activeJournal.latest_detected_issue_id\n      || state.activeJournal.latest_issue_id;\n    const readyId = state.activeJournal.latest_ready_issue_id\n      || state.activeJournal.latest_issue_id;\n    const options = [\n      {\n        issue_id: detectedId,\n        issue_label: state.activeJournal.latest_detected_issue_label\n          || state.activeJournal.latest_issue_label\n          || "最新卷期",\n        publication_date: state.activeJournal.latest_detected_publication_date\n          || state.activeJournal.publication_date\n          || "",\n        url: displayIssueUrl(state.activeJournal),\n        latest: true,\n        ready: detectedId === readyId,\n        publication_state: state.activeJournal.latest_detected_publication_state\n          || state.activeJournal.publication_state\n          || (detectedId === readyId ? "ready" : "unknown"),\n      },\n      ...(readyId && readyId !== detectedId && state.activeJournal.latest_issue_url ? [{\n        issue_id: readyId,\n        issue_label: state.activeJournal.latest_issue_label || "最近可发布卷期",\n        publication_date: state.activeJournal.publication_date || "",\n        url: state.activeJournal.latest_issue_url,\n        latest: false,\n        ready: true,\n        publication_state: state.activeJournal.latest_publication_state\n          || state.activeJournal.publication_state\n          || "ready",\n      }] : []),\n      ...entries\n        .filter((entry) => entry.issue_id !== detectedId && entry.issue_id !== readyId)\n        .map((entry) => ({ ...entry, latest: false, ready: true })),\n    ];\n'''
          new = '''    const displayId = state.activeJournal.latest_display_issue_id\n      || state.activeJournal.latest_detected_issue_id\n      || state.activeJournal.latest_issue_id;\n    const readyId = state.activeJournal.latest_ready_issue_id\n      || state.activeJournal.latest_issue_id;\n    const options = [\n      {\n        issue_id: displayId,\n        issue_label: state.activeJournal.latest_display_issue_label\n          || state.activeJournal.latest_detected_issue_label\n          || state.activeJournal.latest_issue_label\n          || "最新卷期",\n        publication_date: state.activeJournal.latest_display_publication_date\n          || state.activeJournal.latest_detected_publication_date\n          || state.activeJournal.publication_date\n          || "",\n        url: displayIssueUrl(state.activeJournal),\n        latest: true,\n        ready: displayId === readyId,\n        publication_state: state.activeJournal.latest_display_publication_state\n          || state.activeJournal.latest_detected_publication_state\n          || state.activeJournal.publication_state\n          || (displayId === readyId ? "ready" : "unknown"),\n      },\n      ...(readyId && readyId !== displayId && state.activeJournal.latest_issue_url ? [{\n        issue_id: readyId,\n        issue_label: state.activeJournal.latest_issue_label || "最近可发布卷期",\n        publication_date: state.activeJournal.publication_date || "",\n        url: state.activeJournal.latest_issue_url,\n        latest: false,\n        ready: true,\n        publication_state: state.activeJournal.latest_publication_state\n          || state.activeJournal.publication_state\n          || "ready",\n      }] : []),\n      ...entries\n        .filter((entry) => entry.issue_id !== displayId && entry.issue_id !== readyId)\n        .map((entry) => ({ ...entry, latest: false, ready: true })),\n    ];\n'''
          if old not in text:
              raise SystemExit('history selection block not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_freshness_invariants -v
      - run: python -m unittest discover -s tests -v
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name academic-door-bot
          git config user.email academic-door-bot@users.noreply.github.com
          git add scripts/update_journals.py src/components/Top5Explorer.astro
          git commit -m 'fix(freshness): select latest display safely'
          git push origin HEAD:fix/265-latest-display-invariants
