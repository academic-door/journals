name: Translation fix batch

on:
  workflow_dispatch:
    inputs:
      issue_ids:
        description: Exact comma-separated TRANSLATION_FIX issue IDs for this batch
        required: true
        type: string
      max_minutes:
        description: Maximum runtime for this bounded translation batch
        required: false
        default: "30"
        type: string

permissions:
  contents: write
  models: read

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  translate-and-publish:
    name: Translate and publish exact B issue subset
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Restore latest data branch without source recollection
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api data/translation-cache data/backfill-staging data/backfill-state
          mkdir -p public data
          git archive origin/data public/api data/translation-cache data/backfill-staging data/backfill-state | tar -x
          cp public/api/v1/backfill-status.json "$RUNNER_TEMP/status-before.json"
          cp public/api/v1/gap-manifest.json "$RUNNER_TEMP/gap-before.json"
          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$RUNNER_TEMP/data-baseline" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-staging \
            --path data/backfill-state

      - name: Translate only missing or invalid articles
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          TRANSLATION_RETRIES: "2"
          TRANSLATION_WORKERS: "4"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/translate_issue_subset.py \
            --api-root public/api/v1 \
            --staging-root data/backfill-staging \
            --cache-root data/translation-cache \
            --issue-ids "${{ inputs.issue_ids }}" \
            --report "$RUNNER_TEMP/translation-fix.json"

      - name: Rebuild candidate indexes and audit the exact subset
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rebuild_public_snapshot.py
          python scripts/publish_data_delta.py rebuild-archive-indexes --root .
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/backfill_status.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json public/api/v1/backfill-status.json \
            --out-md public/backfill-status.md
          python scripts/build_gap_manifest.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --out-json public/api/v1/gap-manifest.json \
            --out-md public/gap-manifest.md
          publish_ids="$(python -c 'import json,sys; print(",".join(json.load(open(sys.argv[1], encoding="utf-8"))["publishable_issue_ids"]))' "$RUNNER_TEMP/translation-fix.json")"
          model_calls="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["translation_model_calls"])' "$RUNNER_TEMP/translation-fix.json")"
          cache_reuses="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["translation_cache_reuses"])' "$RUNNER_TEMP/translation-fix.json")"
          if [[ -z "$publish_ids" ]]; then
            echo "No issue in this batch passed the translation/source publish gates" >&2
            exit 2
          fi
          python scripts/check_publish_subset.py \
            --before-status "$RUNNER_TEMP/status-before.json" \
            --after-status public/api/v1/backfill-status.json \
            --before-gap "$RUNNER_TEMP/gap-before.json" \
            --after-gap public/api/v1/gap-manifest.json \
            --publish-issue-ids "$publish_ids" \
            --translation-model-calls "$model_calls" \
            --translation-cache-reuses "$cache_reuses" \
            --report "$RUNNER_TEMP/publish-subset.json"
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_history_coverage.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --report-json "$RUNNER_TEMP/history-coverage.json"
          python scripts/audit_privacy.py
          python -m unittest discover -s tests -v
          python scripts/rebuild_public_snapshot.py --check

      - name: Publish only the audited data delta
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/generated-data"
          data_tree="$RUNNER_TEMP/data-tree"
          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$generated" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-staging \
            --path data/backfill-state
          git fetch origin data
          git worktree add "$data_tree" origin/data
          git -C "$data_tree" switch -C data
          python scripts/publish_data_delta.py apply \
            --baseline "$RUNNER_TEMP/data-baseline" \
            --generated "$generated" \
            --target "$data_tree" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-staging \
            --path data/backfill-state
          rm -rf "$data_tree/public/api"
          cp -R public/api "$data_tree/public/api"
          cp public/backfill-status.md "$data_tree/public/backfill-status.md"
          cp public/gap-manifest.md "$data_tree/public/gap-manifest.md"
          git -C "$data_tree" config user.name "academic-door-bot"
          git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
          git -C "$data_tree" add -A public/api data/translation-cache data/backfill-staging data/backfill-state public/backfill-status.md public/gap-manifest.md
          if git -C "$data_tree" diff --cached --quiet; then
            echo "No audited data delta to publish" >&2
            exit 2
          fi
          git -C "$data_tree" commit -m "Apply translation fix batch"
          git -C "$data_tree" push origin HEAD:data

      - name: Upload bounded B batch reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-fix-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/translation-fix.json
            ${{ runner.temp }}/publish-subset.json
            public/api/v1/backfill-status.json
            public/api/v1/gap-manifest.json
