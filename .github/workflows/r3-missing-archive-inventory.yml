name: R3 RePEc roster qualification

on:
  push:
    branches:
      - ops/r3-state-reconcile-data-20260911

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Probe exact RePEc serial sections only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import requests
          import yaml

          from collectors.metadata_fallback import (
              USER_AGENT,
              _parse_repec_serial_issues,
              _repec_serial_url,
          )

          config = yaml.safe_load(Path('config/journals.yml').read_text())['journals']
          targets = {
              'IER': [('64', '1')],
              'TE': [
                  ('18','1'),('18','2'),('18','3'),('18','4'),
                  ('19','1'),('19','2'),('19','3'),('19','4'),
                  ('21','2'),('21','3'),
              ],
          }
          session = requests.Session()
          session.headers.update({'User-Agent': USER_AGENT, 'Accept': 'text/html,application/xhtml+xml'})
          report = {'journals': {}, 'all_targets': 0, 'found_targets': 0, 'missing_targets': []}
          for journal, wanted in targets.items():
              definition = config[journal]
              serial_url = _repec_serial_url(definition['repec_series_code'])
              response = session.get(serial_url, timeout=60)
              response.raise_for_status()
              parsed = _parse_repec_serial_issues(response.content, serial_url)
              by_key = {(str(r['volume']), str(r['issue'])): r for r in parsed}
              rows = []
              for volume, issue in wanted:
                  report['all_targets'] += 1
                  target = by_key.get((volume, issue))
                  found = target is not None
                  if found:
                      report['found_targets'] += 1
                  else:
                      report['missing_targets'].append(f'{journal.lower()}-{volume}-{issue}')
                  items = list((target or {}).get('items') or [])
                  doi_count = sum(bool(str(item.get('doi','')).strip()) for item in items if isinstance(item, dict))
                  rows.append({
                      'issue_id': f'{journal.lower()}-{volume}-{issue}',
                      'found': found,
                      'item_count': len(items),
                      'doi_count': doi_count,
                  })
              report['journals'][journal] = {
                  'serial_url': serial_url,
                  'http_status': response.status_code,
                  'parsed_issue_count': len(parsed),
                  'targets': rows,
              }
          Path('repec-qualification.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r3-repec-roster-qualification
          path: repec-qualification.json
          if-no-files-found: error
