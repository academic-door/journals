name: R3 RePEc DOI evidence qualification

on:
  push:
    branches:
      - ops/r3-state-reconcile-data-20260911

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Inspect DOI-bearing attributes on representative TE RePEc detail pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          import requests
          import yaml
          from bs4 import BeautifulSoup

          from collectors.metadata_fallback import USER_AGENT, _parse_repec_serial_issues, _repec_serial_url, _extract_doi

          cfg = yaml.safe_load(Path('config/journals.yml').read_text())['journals']['TE']
          session = requests.Session()
          session.headers.update({'User-Agent': USER_AGENT, 'Accept': 'text/html,application/xhtml+xml'})
          serial_url = _repec_serial_url(cfg['repec_series_code'])
          serial = session.get(serial_url, timeout=60)
          serial.raise_for_status()
          parsed = _parse_repec_serial_issues(serial.content, serial_url)
          target = next(r for r in parsed if str(r['volume']) == '18' and str(r['issue']) == '1')
          rows = []
          for entry in target['items'][:3]:
              response = session.get(entry['detail_url'], timeout=60)
              response.raise_for_status()
              soup = BeautifulSoup(response.content, 'html.parser')
              candidates = []
              for node in soup.find_all(True):
                  for attr in ('href','content','value'):
                      raw = str(node.get(attr) or '')
                      doi = _extract_doi(raw)
                      if doi and doi not in candidates:
                          candidates.append(doi)
              text_doi = _extract_doi(soup.get_text(' ', strip=True))
              raw_matches = sorted(set(m.lower() for m in re.findall(r'10\.3982/[A-Za-z0-9._;()/:-]+', response.text, flags=re.I)))
              rows.append({
                  'title': entry['title'],
                  'detail_url': entry['detail_url'],
                  'detail_url_doi': entry.get('doi',''),
                  'text_doi': text_doi,
                  'attribute_dois': candidates,
                  'raw_10_3982_matches': raw_matches,
              })
          report = {'issue_id':'te-18-1','rows':rows}
          Path('repec-doi-evidence.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r3-repec-doi-evidence
          path: repec-doi-evidence.json
          if-no-files-found: error
