name: R3 RePEc archive qualification

on:
  push:
    branches:
      - ops/r3-state-reconcile-data-20260911

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Build one representative TE archive without translation or publication
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          from collectors.metadata_fallback import fetch_repec_history_issue
          from scripts.update_journals import (
              normalize_issue_content,
              stamp_issue_readiness,
              validate_issue,
              issue_content_status,
              issue_source_status,
              issue_publication_state,
          )

          cfg = yaml.safe_load(Path('config/journals.yml').read_text())['journals']['TE']
          issue = fetch_repec_history_issue(
              journal_id=cfg['id'],
              journal_name=cfg['name'],
              issn=str(cfg['issn']),
              volume='18',
              issue='1',
              repec_series_code=cfg['repec_series_code'],
          )
          issue = normalize_issue_content(issue)
          validate_issue(issue)
          stamp_issue_readiness(issue)
          articles = issue.get('articles') or []
          report = {
              'issue_id': issue.get('issue_id'),
              'volume': issue.get('volume'),
              'issue': issue.get('issue'),
              'publication_date': issue.get('publication_date'),
              'article_count': len(articles),
              'doi_complete': sum(bool(a.get('doi')) for a in articles),
              'authors_complete': sum(bool(a.get('authors')) for a in articles),
              'abstract_complete': sum(bool(a.get('abstract_en')) or a.get('article_type') == 'comment' for a in articles),
              'content_status': issue_content_status(issue),
              'source_status': issue_source_status(issue),
              'publication_state': issue_publication_state(issue),
              'quality': issue.get('quality') or {},
          }
          Path('repec-archive-qualification.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: r3-repec-archive-qualification
          path: repec-archive-qualification.json
          if-no-files-found: error
