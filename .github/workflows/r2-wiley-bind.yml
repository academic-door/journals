name: R2 Wiley evidence binding

on:
  push:
    branches:
      - r2/wiley-observed-evidence-20260911
    paths:
      - .github/workflows/r2-wiley-bind.yml

permissions:
  contents: write

jobs:
  bind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: r2/wiley-observed-evidence-20260911
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt
      - run: python scripts/_tmp_r2_wiley_bind.py
      - run: python -m unittest tests.test_r2_wiley_observed_evidence tests.test_history_discovery tests.test_r2_snapshot_authority -v
      - run: git diff --check

      - name: Commit config binding
        shell: bash
        run: |
          set -euo pipefail
          git config user.name academic-door-bot
          git config user.email academic-door-bot@users.noreply.github.com
          git add config/field-history.yml
          git commit -m "feat(r2): bind Wiley publisher-observed expected sets"
          git push origin HEAD:r2/wiley-observed-evidence-20260911
