name: G03 ordinal regression
on:
  push:
    branches:
      - fix/g03-translation-english-ordinal-20260916
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_translation_english_ordinals -v
