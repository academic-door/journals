name: G03 ordinal regression
on:
  push:
    branches:
      - fix/g03-translation-english-ordinal-20260916
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Apply staged patch when present
        run: |
          if [ -f scripts/g03_patch_ordinal.py ]; then
            python scripts/g03_patch_ordinal.py
          fi
      - name: Verify regressions
        run: |
          python -m unittest tests.test_translation_english_ordinals -v
          python -m unittest tests.test_translate_issue -v
          git diff --check
      - name: Commit implementation when present
        run: |
          if [ ! -f scripts/g03_patch_ordinal.py ]; then
            echo "Verification-only rerun."
            exit 0
          fi
          git config user.name academic-door-bot
          git config user.email academic-door-bot@users.noreply.github.com
          git rm scripts/g03_patch_ordinal.py
          git add scripts/translate_issue.py tests/test_translation_english_ordinals.py
          git commit -m 'fix(translation): canonicalize temporal ordinal quantities'
          git push origin HEAD:fix/g03-translation-english-ordinal-20260916
