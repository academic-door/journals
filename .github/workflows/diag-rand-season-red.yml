name: Diagnostic RAND seasonal regression

on:
  push:
    branches: [fix-rand-season-monitor-health]

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest tests.test_rand_season_horizon -v
