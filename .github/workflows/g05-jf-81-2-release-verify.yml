name: Backfill field journal history

on:
  push:
    branches:
      - ops/g05-jf-81-2-release-verify-20260918
    paths:
      - .github/workflows/g05-jf-81-2-release-verify.yml

permissions:
  contents: read

jobs:
  verify-release-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify canonical data head and Wiley 2026 readiness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          test "$(git rev-parse origin/data)" = "2a67b4301b28e1735252e775189e81b72cf39c37"
          work="$RUNNER_TEMP/data"
          mkdir -p "$work"
          git archive origin/data             public/api/v1/journals/ajae/issues             public/api/v1/journals/jf/issues             data/backfill-state | tar -x -C "$work"
          python scripts/build_completeness_ledger.py             --state "$work/data/backfill-state/field-2023-2024.json"             --state "$work/data/backfill-state/field-2025-2026.json"             --api-root "$work/public/api/v1"             --journals-config config/journals.yml             --window-start 2026-01-01             --window-end 2026-09-18             --out-json "$RUNNER_TEMP/ledger.json"
          ROOT="$work" LEDGER="$RUNNER_TEMP/ledger.json" python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["ROOT"])
          ledger=json.load(open(os.environ["LEDGER"], encoding="utf-8"))
          rows={r["journalKey"]:r for r in ledger["journals"]}
          expected={
              "AJAE":("COMPLETE",5,5,5,0,0),
              "JF":("COMPLETE",4,4,4,0,0),
          }
          for journal,want in expected.items():
              r=rows[journal]
              got=(r["status"],r["expectedIssueCount"],r["archivedIssueCount"],r["publicationReadyIssueCount"],r["missingIssueCount"],r["sourceBlockedIssueCount"])
              if got != want:
                  raise SystemExit(f"{journal}: {got!r} != {want!r}")
          rec=ledger["reconciliation"]
          required={"complete":23,"not_measured":26,"partial":0,"source_blocked":0,"authoritative_expected_issues_total":101,"archived_issues_total":101,"publication_ready_issues_total":101,"confirmed_missing_issues_total":0,"blocked_issues_total":0}
          for key,value in required.items():
              if rec[key] != value:
                  raise SystemExit(f"{key}={rec[key]} != {value}")
          jf=json.loads((root/"public/api/v1/journals/jf/issues/jf-81-2.json").read_text(encoding="utf-8"))
          if jf["publication_state"]!="ready" or jf["source_status"]!="official_verified" or jf["quality"]["translation_complete"]!=13:
              raise SystemExit("JF 81(2) readback regression")
          print(json.dumps({"reconciliation":rec,"AJAE":expected["AJAE"],"JF":expected["JF"],"jf_81_2_translation_complete":13},sort_keys=True))
          PY
