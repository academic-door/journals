name: Monitor journal updates

on:
  workflow_dispatch:
  schedule:
    # Every two hours at minute 17. Detection is metadata-only unless a change
    # is confirmed, so publisher sites are not polled 41 times per cycle.
    - cron: "17 */2 * * *"

permissions:
  contents: write
  issues: write
  models: read

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Restore last-known-good public data and monitor state
        shell: bash
        run: |
          set -euo pipefail
          main_cache="$RUNNER_TEMP/main-translation-cache"
          mkdir -p "$main_cache"
          cp -R data/translation-cache/. "$main_cache/"
          if git ls-remote --exit-code origin refs/heads/data >/dev/null 2>&1; then
            git fetch origin data
            rm -rf public/api
            git archive origin/data public/api public/project-manifest.json | tar -x
            if git cat-file -e origin/data:public/backfill-status.md 2>/dev/null; then
              git show origin/data:public/backfill-status.md > public/backfill-status.md
            fi
            if git cat-file -e origin/data:data/translation-cache 2>/dev/null; then
              git archive origin/data data/translation-cache | tar -x
            fi
            if git cat-file -e origin/data:data/monitoring/state.json 2>/dev/null; then
              mkdir -p data/monitoring
              git show origin/data:data/monitoring/state.json \
                > data/monitoring/state.json
            fi
            if git cat-file -e origin/data:data/monitoring/email-notifications.json 2>/dev/null; then
              mkdir -p data/monitoring
              git show origin/data:data/monitoring/email-notifications.json \
                > data/monitoring/email-notifications.json
            fi
          fi
          MAIN_CACHE="$main_cache" python - <<'PY'
          import json
          import os
          from pathlib import Path

          target_dir = Path("data/translation-cache")
          target_dir.mkdir(parents=True, exist_ok=True)
          for override_path in Path(os.environ["MAIN_CACHE"]).glob("*.json"):
              target_path = target_dir / override_path.name
              base = json.loads(target_path.read_text(encoding="utf-8")) if target_path.exists() else {}
              override = json.loads(override_path.read_text(encoding="utf-8"))
              base.update(override)
              target_path.write_text(
                  json.dumps(base, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY

      - name: Detect changes and update confirmed journals
        id: monitor
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/journal_monitor.py --run-updates --translate

      - name: Retry incomplete detected issues
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
          ELSEVIER_INST_TOKEN: ${{ secrets.ELSEVIER_INST_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/update_journals.py \
            --journal ALL \
            --translate \
            --enrich-detected

      - name: Check whether any issue was updated
        id: changed
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              Path("output/journal-monitor-result.json").read_text(encoding="utf-8")
          )
          monitor_changed = any(
              item.get("result") == "updated"
              for item in result.get("deep_updates", [])
          )
          update_result = json.loads(
              Path("output/journal-update-report.json").read_text(encoding="utf-8")
          )
          self_heal_changed = any(
              item.get("result") in {"updated", "detected_progress"}
              for item in update_result.get("results", [])
          )
          changed = monitor_changed or self_heal_changed
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"has_updates={'true' if changed else 'false'}\n")
          PY

      - name: Validate last-known-good output
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python -m unittest discover -s tests -v
          python scripts/audit_privacy.py
          python scripts/elsevier_quota_check.py

      - name: Publish data and monitoring state
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/generated-public"
          generated_cache="$RUNNER_TEMP/generated-translation-cache"
          generated_state="$RUNNER_TEMP/monitor-state.json"
          data_tree="$RUNNER_TEMP/data-tree"
          mkdir -p "$generated/api" "$generated_cache"
          cp -R public/api/. "$generated/api/"
          cp public/project-manifest.json "$generated/project-manifest.json"
          [ ! -f public/backfill-status.md ] || cp public/backfill-status.md "$generated/backfill-status.md"
          cp -R data/translation-cache/. "$generated_cache/"
          cp data/monitoring/state.json "$generated_state"

          git fetch origin data
          git worktree add "$data_tree" origin/data
          cd "$data_tree"
          git switch -C data
          rm -rf public/api data/translation-cache
          mkdir -p public/api data/translation-cache data/monitoring
          cp -R "$generated/api"/. public/api/
          cp "$generated/project-manifest.json" public/project-manifest.json
          [ ! -f "$generated/backfill-status.md" ] || cp "$generated/backfill-status.md" public/backfill-status.md
          cp -R "$generated_cache"/. data/translation-cache/
          cp "$generated_state" data/monitoring/state.json
          git rm -f --ignore-unmatch public/search.js
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add -A public/api data/translation-cache
          git add public/project-manifest.json
          [ ! -f public/backfill-status.md ] || git add public/backfill-status.md
          git add -f data/monitoring/state.json
          if git diff --cached --quiet; then
            echo "No journal or monitor-state changes."
            exit 0
          fi
          git commit -m "Monitor journal updates"
          git push origin HEAD:data

      - name: Sync audited issues to private Composer
        id: composer
        if: steps.changed.outputs.has_updates == 'true'
        continue-on-error: true
        env:
          COMPOSER_DEPLOY_KEY: ${{ secrets.COMPOSER_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$COMPOSER_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts

          for attempt in 1 2 3; do
            target="$RUNNER_TEMP/composer-monitor-sync-$attempt"
            rm -rf "$target"
            git clone --depth=1 git@github.com:academic-door/academic-door-composer.git "$target"
            python "$target/scripts/build_data.py" \
              --journals-source "$GITHUB_WORKSPACE/public" \
              --output "$target/site/data"
            python "$target/scripts/validate_bundle.py" --site "$target/site"
            cd "$target"
            git config user.name "academic-door-bot"
            git config user.email "academic-door-bot@users.noreply.github.com"
            git add site/data
            if git diff --cached --quiet; then
              echo "Composer already contains the current audited issues."
              exit 0
            fi
            git commit -m "Sync monitored journal issues"
            if git push origin HEAD:main; then
              exit 0
            fi
            cd "$GITHUB_WORKSPACE"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Send private new-issue email
        id: email
        if: always() && steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURITY: ${{ secrets.SMTP_SECURITY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NOTIFICATION_EMAIL_TO: ${{ secrets.NOTIFICATION_EMAIL_TO }}
          COMPOSER_STATUS: ${{ steps.composer.outcome }}
        shell: bash
        run: |
          status="${COMPOSER_STATUS:-skipped}"
          python scripts/email_notifications.py --composer-status "$status"

      - name: Persist private email notification state
        if: always() && steps.publish.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          state="data/monitoring/email-notifications.json"
          if [ ! -f "$state" ]; then
            echo "No email notification state was produced."
            exit 0
          fi
          state_copy="$RUNNER_TEMP/email-notifications.json"
          data_tree="$RUNNER_TEMP/data-tree"
          cp "$state" "$state_copy"
          cd "$data_tree"
          mkdir -p data/monitoring
          cp "$state_copy" data/monitoring/email-notifications.json
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add -f data/monitoring/email-notifications.json
          if git diff --cached --quiet; then
            echo "Email notification state is unchanged."
            exit 0
          fi
          git commit -m "Update journal email notification state"
          git push origin HEAD:data

      - name: Open or close private email failure alert
        if: always() && steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ -f output/email-notification-result.json ]; then
            python scripts/email_notification_alerts.py \
              output/email-notification-result.json
          fi

      - name: Open or close deduplicated failure alerts
        if: always()
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMPOSER_STATUS: ${{ steps.composer.outcome }}
        run: |
          status="${COMPOSER_STATUS:-skipped}"
          python scripts/monitor_alerts.py \
            output/journal-monitor-result.json \
            --composer-status "$status"

      - name: Write run summary
        if: always()
        shell: bash
        run: |
          if [ ! -f output/journal-monitor-result.json ]; then
            echo "## Journal monitor did not produce a result" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          result = json.loads(Path("output/journal-monitor-result.json").read_text())
          print("## Journal monitor")
          print(f"- Confirmed: {', '.join(result['confirmed_journals']) or 'none'}")
          print(f"- Pending confirmation: {', '.join(result['pending_journals']) or 'none'}")
          print(f"- Failed checks: {', '.join(result['failed_journals']) or 'none'}")
          for item in result.get("deep_updates", []):
              print(f"- Deep update {item['journal']}: {item['result']}")
          PY
          echo "- Composer sync: ${{ steps.composer.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          if [ -f output/email-notification-result.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          result = json.loads(
              Path("output/email-notification-result.json").read_text(encoding="utf-8")
          )
          print(
              f"- Private email: {result['status']} "
              f"(sent {result['sent']}, queued {result['queued']})"
          )
          PY
          fi
