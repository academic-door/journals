name: Repair Cambridge JEH 86-2 source authority

on:
  push:
    branches:
      - repair/cambridge-jeh-86-2-20260910
    paths:
      - .github/workflows/repair-cambridge-jeh-86-2.yml

permissions:
  contents: write

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Restore canonical data and baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api data/backfill-state data/backfill-staging
          mkdir -p public data data/provenance/official-rosters
          git archive origin/data public/api data/backfill-state data/backfill-staging data/translation-cache | tar -x
          if git ls-tree -r --name-only origin/data -- data/provenance/official-rosters | grep -q .; then
            git archive origin/data data/provenance/official-rosters | tar -x
          fi
          python scripts/publish_data_delta.py snapshot \
            --root . --output "$RUNNER_TEMP/data-baseline" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --path data/provenance/official-rosters \
            --exclude 'public/api/v1/journals/*/issues/index.json'
      - name: Capture and promote exact official JEH 86-2 roster
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/jeh-gap.json" <<'JSON'
          {
            "records": [
              {
                "issue_id": "jeh-86-2",
                "journal": "JEH",
                "year": 2026,
                "issue": "2",
                "source_status": "source_pending",
                "official_url": "https://www.cambridge.org/core/journals/journal-of-economic-history"
              }
            ]
          }
          JSON
          python scripts/capture_cambridge_roster_evidence.py \
            --gap-manifest "$RUNNER_TEMP/jeh-gap.json" \
            --output-root data/provenance/official-rosters/cambridge \
            --diagnostics-root "$RUNNER_TEMP/cambridge-failures"
          test -f data/provenance/official-rosters/cambridge/jeh-86-2.json
          python scripts/import_official_roster_evidence.py \
            data/provenance/official-rosters/cambridge/jeh-86-2.json \
            --api-root public/api/v1 \
            --output "$RUNNER_TEMP/jeh-86-2.candidate.json" \
            --state-root data/backfill-state \
            --translation-cache-root data/translation-cache \
            --promote
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('public/api/v1/journals/jeh/issues/jeh-86-2.json')
          issue = json.loads(path.read_text(encoding='utf-8'))
          print('JEH_86_2', issue['content_status'], issue['source_status'], issue['publication_state'])
          print('roster_authority', issue.get('quality', {}).get('roster_authority'))
          print('roster_transport', issue.get('quality', {}).get('roster_transport'))
          assert issue['content_status'] == 'complete'
          assert issue['source_status'] == 'publisher_verified'
          assert issue['publication_state'] == 'ready'
          assert issue.get('quality', {}).get('roster_authority') == 'official-issue-page'
          PY
      - name: Rebuild and audit bounded data result
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rebuild_public_snapshot.py
          python scripts/publish_data_delta.py rebuild-archive-indexes --root .
          state_args=()
          for state in data/backfill-state/*.json; do [ -f "$state" ] && state_args+=(--state "$state"); done
          python scripts/backfill_status.py "${state_args[@]}" --api-root public/api/v1 --out-json public/api/v1/backfill-status.json --out-md public/backfill-status.md
          python scripts/build_gap_manifest.py "${state_args[@]}" --api-root public/api/v1 --out-json public/api/v1/gap-manifest.json --out-md public/gap-manifest.md
          python scripts/rebuild_public_snapshot.py --check
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_privacy.py
          python -m unittest tests.test_cambridge_roster_capture tests.test_public_data_branch_ownership tests.test_public_snapshot_consistency -v
      - name: Publish guarded data delta
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/generated-data"
          data_tree="$RUNNER_TEMP/data-tree"
          python scripts/publish_data_delta.py snapshot \
            --root . --output "$generated" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --path data/provenance/official-rosters \
            --exclude 'public/api/v1/journals/*/issues/index.json'
          git fetch origin data
          git worktree add "$data_tree" origin/data
          git -C "$data_tree" switch -C data
          python scripts/publish_data_delta.py apply \
            --baseline "$RUNNER_TEMP/data-baseline" \
            --generated "$generated" \
            --target "$data_tree" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --path data/provenance/official-rosters \
            --exclude 'public/api/v1/journals/*/issues/index.json'
          rm -rf "$data_tree/public/api"
          cp -R public/api "$data_tree/public/api"
          cp public/project-manifest.json "$data_tree/public/project-manifest.json"
          cp public/backfill-status.md "$data_tree/public/backfill-status.md"
          cp public/gap-manifest.md "$data_tree/public/gap-manifest.md"
          git -C "$data_tree" rm -f --ignore-unmatch public/search.js
          git -C "$data_tree" config user.name "academic-door-bot"
          git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
          git -C "$data_tree" add -A public/api data/translation-cache data/backfill-state data/backfill-staging data/provenance/official-rosters
          git -C "$data_tree" add public/project-manifest.json public/backfill-status.md public/gap-manifest.md
          if git -C "$data_tree" diff --cached --quiet; then echo 'No data changes'; exit 0; fi
          git -C "$data_tree" commit -m "Promote JEH 86-2 from official Cambridge roster"
          git -C "$data_tree" push origin HEAD:data
