name: G03 LUP expected-target executor

on:
  push:
    branches:
      - fix/g03-lup-expected-target-20260916

permissions:
  contents: write

jobs:
  red-green:
    if: "${{ github.event.head_commit.message == 'chore: execute G03 LUP expected-target TDD' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/g03-lup-expected-target-20260916
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify focused baseline
        run: |
          python -m py_compile collectors/elsevier.py scripts/update_journals.py
          python -m unittest discover -s tests -p 'test_elsevier*.py' -v
      - name: Write RED regression tests
        shell: bash
        run: |
          cat > tests/test_elsevier_expected_target.py <<'PY'
          import inspect
          import unittest
          from types import SimpleNamespace
          from unittest.mock import patch

          from collectors.elsevier import fetch_current_issue
          from scripts.update_journals import collector_for


          class ElsevierExpectedTargetTests(unittest.TestCase):
              def test_fetch_current_issue_prefers_expected_volume_over_later_repec_preregistration(self) -> None:
                  content = b"""
                  <html><body>
                    <h3>2026, Volume 171, Issue C</h3>
                    <div><ul>
                      <li><a href="/a/eee/lauspo/v171y2026ics0264837726002826.html">Future paper</a></li>
                    </ul></div>
                    <h3>2026, Volume 170, Issue C</h3>
                    <div><ul>
                      <li><a href="/a/eee/lauspo/v170y2026ics0264837726002231.html">Expected paper</a></li>
                    </ul></div>
                  </body></html>
                  """
                  detail = {
                      "pii": "S0264837726002231",
                      "title_en": "Expected paper",
                      "authors": ["Ada Example"],
                      "abstract_en": "Expected abstract.",
                      "doi": "10.1016/j.landusepol.2026.100001",
                      "source_url": "https://www.sciencedirect.com/science/article/pii/S0264837726002231",
                      "detail_url": "https://ideas.repec.org/a/eee/lauspo/example.html",
                      "article_type": "research-article",
                      "publication_date": "November 2026",
                  }
                  kwargs = {
                      "journal_id": "lup",
                      "journal_name": "Land Use Policy",
                      "issn": "0264-8377",
                      "repec_series_url": "https://ideas.repec.org/s/eee/lauspo.html",
                      "issue_url_template": "https://www.sciencedirect.com/journal/land-use-policy/vol/{volume}/suppl/{issue}",
                      "rss_url": "https://rss.sciencedirect.com/publication/science/02648377",
                      "publication_lead_months": 2,
                  }
                  if "expected_volume" in inspect.signature(fetch_current_issue).parameters:
                      kwargs["expected_volume"] = "170"

                  with (
                      patch("collectors.elsevier._session"),
                      patch(
                          "collectors.elsevier._get",
                          return_value=SimpleNamespace(content=content),
                      ),
                      patch(
                          "collectors.metadata_fallback.fetch_sciencedirect_rss_issue",
                          return_value=None,
                      ),
                      patch(
                          "collectors.elsevier._crossref_issue_date",
                          return_value="November 2026",
                      ),
                      patch(
                          "collectors.elsevier._parse_repec_detail",
                          return_value=detail,
                      ),
                  ):
                      issue = fetch_current_issue(**kwargs)

                  self.assertEqual("170", issue["volume"])
                  self.assertEqual("lup-170-c", issue["issue_id"])

              def test_update_collector_forwards_expected_volume_to_elsevier(self) -> None:
                  config = {
                      "id": "lup",
                      "name": "Land Use Policy",
                      "collector": "elsevier",
                      "issn": "0264-8377",
                      "current_issue_url": "https://www.sciencedirect.com/journal/land-use-policy/issues",
                      "repec_series_url": "https://ideas.repec.org/s/eee/lauspo.html",
                      "issue_url_template": "https://www.sciencedirect.com/journal/land-use-policy/vol/{volume}/suppl/{issue}",
                      "publication_lead_months": 2,
                  }
                  kwargs = {}
                  if "expected_volume" in inspect.signature(collector_for).parameters:
                      kwargs["expected_volume"] = "170"

                  with patch(
                      "collectors.elsevier.fetch_current_issue",
                      return_value={"issue_id": "lup-170-c"},
                  ) as fetch_issue:
                      collector_for(config, **kwargs)()

                  self.assertEqual("170", fetch_issue.call_args.kwargs.get("expected_volume"))


          if __name__ == "__main__":
              unittest.main()
          PY
          set +e
          python -m unittest tests.test_elsevier_expected_target -v > /tmp/red.log 2>&1
          rc=$?
          set -e
          cat /tmp/red.log
          if [ "$rc" -eq 0 ]; then
            echo 'RED gate failed: regression unexpectedly passed before implementation'
            exit 1
          fi
          if ! grep -q 'AssertionError' /tmp/red.log; then
            echo 'RED gate failed: expected assertion-level behavioral failure'
            exit 1
          fi
      - name: Apply minimal GREEN implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('collectors/elsevier.py')
          text = path.read_text(encoding='utf-8')
          old = '''def _parse_repec_inventory(content: bytes, series_url: str) -> dict[str, Any]:
              soup = BeautifulSoup(content, "html.parser")
              heading = next(
                  (
                      node
                      for node in soup.find_all("h3")
                      if ISSUE_HEADING.search(node.get_text(" ", strip=True))
                  ),
                  None,
              )
              if heading is None:
                  raise ElsevierCollectorError("RePEc serial page has no usable volume heading")
              match = ISSUE_HEADING.search(heading.get_text(" ", strip=True))
              assert match is not None
          '''
          new = '''def _parse_repec_inventory(
              content: bytes,
              series_url: str,
              *,
              expected_volume: str = "",
              expected_issue: str = "",
          ) -> dict[str, Any]:
              soup = BeautifulSoup(content, "html.parser")
              headings: list[tuple[Any, re.Match[str]]] = []
              for node in soup.find_all("h3"):
                  match = ISSUE_HEADING.search(node.get_text(" ", strip=True))
                  if match is not None:
                      headings.append((node, match))
              if not headings:
                  raise ElsevierCollectorError("RePEc serial page has no usable volume heading")

              heading, match = headings[0]
              if expected_volume:
                  wanted_issue = expected_issue.casefold()
                  exact = next(
                      (
                          (node, candidate)
                          for node, candidate in headings
                          if candidate.group("volume") == expected_volume
                          and (
                              not wanted_issue
                              or candidate.group("issue").casefold() == wanted_issue
                          )
                      ),
                      None,
                  )
                  if exact is not None:
                      heading, match = exact
          '''
          if text.count(old) != 1:
              raise SystemExit('elsevier inventory anchor mismatch')
          text = text.replace(old, new)
          old = '''    publication_lead_months: int = 1,
              doi_template: str = "",
              max_workers: int = DETAIL_WORKERS,
          ) -> dict[str, Any]:
          '''
          new = '''    publication_lead_months: int = 1,
              doi_template: str = "",
              expected_volume: str = "",
              expected_issue: str = "",
              max_workers: int = DETAIL_WORKERS,
          ) -> dict[str, Any]:
          '''
          if text.count(old) != 1:
              raise SystemExit('elsevier signature anchor mismatch')
          text = text.replace(old, new)
          old = '''        inventory = _parse_repec_inventory(
                      _get(session, repec_series_url).content,
                      repec_series_url,
                  )
          '''
          new = '''        inventory = _parse_repec_inventory(
                      _get(session, repec_series_url).content,
                      repec_series_url,
                      expected_volume=expected_volume,
                      expected_issue=expected_issue,
                  )
          '''
          if text.count(old) != 1:
              raise SystemExit('elsevier parser call anchor mismatch')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          path = Path('scripts/update_journals.py')
          text = path.read_text(encoding='utf-8')
          old = '''def collector_for(config: dict[str, Any]) -> Callable[[], dict[str, Any]]:
          '''
          new = '''def collector_for(
              config: dict[str, Any],
              *,
              expected_volume: str = "",
              expected_issue: str = "",
          ) -> Callable[[], dict[str, Any]]:
          '''
          if text.count(old) != 1:
              raise SystemExit('collector_for definition anchor mismatch')
          text = text.replace(old, new)
          old = '''            publication_lead_months=int(config.get("publication_lead_months", 1)),
                      doi_template=config.get("doi_template", ""),
                  )
              if collector == "crossref":
          '''
          new = '''            publication_lead_months=int(config.get("publication_lead_months", 1)),
                      doi_template=config.get("doi_template", ""),
                      expected_volume=expected_volume,
                      expected_issue=expected_issue,
                  )
              if collector == "crossref":
          '''
          if text.count(old) != 1:
              raise SystemExit('elsevier forwarding anchor mismatch')
          text = text.replace(old, new)
          old = '''            try:
                          issue = collector_for(config)()
                          if re_enrich_elsevier:
          '''
          new = '''            try:
                          issue = collector_for(
                              config,
                              expected_volume=expected_volume,
                              expected_issue=expected_issue,
                          )()
                          if re_enrich_elsevier:
          '''
          if text.count(old) != 1:
              raise SystemExit('collect_one forwarding anchor mismatch')
          text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile collectors/elsevier.py scripts/update_journals.py tests/test_elsevier_expected_target.py
      - name: Verify GREEN
        run: |
          python -m unittest tests.test_elsevier_expected_target -v
          python -m unittest discover -s tests -p 'test_elsevier*.py' -v
          python -m unittest discover -s tests -p 'test_update_journals*.py' -v
          git diff --check
      - name: Commit verified implementation and remove executor
        shell: bash
        run: |
          rm .github/workflows/g03-lup-expected-target-executor.yml
          git config user.name academic-door-bot
          git config user.email academic-door-bot@users.noreply.github.com
          git add collectors/elsevier.py scripts/update_journals.py tests/test_elsevier_expected_target.py .github/workflows/g03-lup-expected-target-executor.yml
          git commit -m 'fix(elsevier): honor monitor-confirmed current target'
          git push origin HEAD:fix/g03-lup-expected-target-20260916
