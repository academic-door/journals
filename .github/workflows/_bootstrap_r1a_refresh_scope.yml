name: Bootstrap R1A discovery-only scope guard

on:
  push:
    branches:
      - journals-r1a-aer-freshness

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: journals-r1a-aer-freshness
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Make discovery-only mode side-effect narrow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/backfill_history.py')
          text = script.read_text(encoding='utf-8')
          old = '''    if migrate_legacy_state(state, journals):
        atomic_write_json(state_path, state)
'''
          new = '''    # Discovery-only refresh must never reconcile or downgrade historical
    # issue checkpoints. It is an evidence refresh, not an archive-state repair.
    if not args.refresh_discovery_only and migrate_legacy_state(state, journals):
        atomic_write_json(state_path, state)
'''
          if old not in text:
              raise SystemExit('migrate_legacy_state block not found')
          text = text.replace(old, new, 1)
          script.write_text(text, encoding='utf-8')

          test = Path('tests/test_refresh_discovery_scope.py')
          test.write_text('''import json
import sys
import tempfile
import unittest
from pathlib import Path
from unittest.mock import patch

import yaml

import scripts.backfill_history as backfill


class RefreshDiscoveryScopeTests(unittest.TestCase):
    def test_refresh_discovery_only_never_reconciles_issue_state(self):
        original_issue = {
            "journal": "AER",
            "year": 2026,
            "volume": "116",
            "issue": "8",
            "official_url": "https://www.aeaweb.org/journals/aer/issue/116/8",
            "status": "ready",
            "last_error": "",
            "retry_class": "manual",
            "content_status": "complete",
            "source_status": "official_verified",
            "publication_state": "ready",
        }
        with tempfile.TemporaryDirectory() as tmp:
            root = Path(tmp)
            state_path = root / "state.json"
            config_path = root / "history.yml"
            state_path.write_text(
                json.dumps(
                    {
                        "schema_version": "1.1",
                        "updated_at": "2026-08-24T00:00:00+00:00",
                        "issues": {"aer-116-8": original_issue},
                        "discovery": {},
                    }
                ),
                encoding="utf-8",
            )
            config_path.write_text(
                yaml.safe_dump(
                    {
                        "journals": {
                            "AER": {
                                "platform": "year_ranges",
                                "allowed_host": "www.aeaweb.org",
                                "issue_url_template": "https://www.aeaweb.org/journals/aer/issue/{volume}/{issue}",
                                "year_ranges": {2026: {"volume": "116", "issues": [8, 9]}},
                            }
                        }
                    },
                    sort_keys=False,
                ),
                encoding="utf-8",
            )
            argv = [
                "backfill_history.py",
                "--config", str(config_path),
                "--state", str(state_path),
                "--journals", "AER",
                "--from-year", "2026",
                "--to-year", "2026",
                "--refresh-discovery-only",
            ]
            with patch.object(sys, "argv", argv), patch.object(
                backfill,
                "migrate_legacy_state",
                side_effect=AssertionError("discovery-only must not reconcile issue state"),
            ):
                self.assertEqual(backfill.main(), 0)

            payload = json.loads(state_path.read_text(encoding="utf-8"))
            self.assertEqual(payload["issues"], {"aer-116-8": original_issue})
            self.assertEqual(payload["discovery"]["AER"]["issue_ids"], ["aer-116-8", "aer-116-9"])


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')
          PY

      - name: Run regressions and full suite
        run: |
          python -m unittest tests.test_refresh_discovery_scope -v
          python -m unittest tests.test_r1a_aer_freshness_workflow -v
          python -m unittest discover -s tests -v

      - name: Prove canonical AER refresh touches discovery only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api
          git archive origin/data public/api | tar -x
          mkdir -p data/backfill-state
          git show origin/data:data/backfill-state/field-2025-2026.json > data/backfill-state/field-2025-2026.json
          cp data/backfill-state/field-2025-2026.json "$RUNNER_TEMP/before.json"

          python scripts/backfill_history.py \
            --config config/field-history.yml \
            --state data/backfill-state/field-2025-2026.json \
            --journals AER \
            --from-year 2025 \
            --to-year 2026 \
            --refresh-discovery-only

          python - "$RUNNER_TEMP/before.json" data/backfill-state/field-2025-2026.json <<'PY'
          import json, sys
          before = json.load(open(sys.argv[1], encoding='utf-8'))
          after = json.load(open(sys.argv[2], encoding='utf-8'))
          assert before.get('issues') == after.get('issues'), 'issues mutated'
          assert before.get('expected_issue_exclusions') == after.get('expected_issue_exclusions'), 'exclusions mutated'
          assert before.get('rotation') == after.get('rotation'), 'rotation mutated'
          bdisc = dict(before.get('discovery') or {})
          adisc = dict(after.get('discovery') or {})
          b_aer = bdisc.pop('AER', None)
          a_aer = adisc.pop('AER', None)
          assert bdisc == adisc, 'non-AER discovery mutated'
          assert a_aer and a_aer.get('authority') == 'official_archive', a_aer
          assert 'aer-116-9' in a_aer.get('issue_ids', []), a_aer
          for key in set(before) | set(after):
              if key in {'updated_at', 'discovery'}:
                  continue
              assert before.get(key) == after.get(key), f'top-level mutation: {key}'
          print('AER discovery-only scope guard passed')
          print('old refreshed_at:', (b_aer or {}).get('refreshed_at'))
          print('new refreshed_at:', a_aer.get('refreshed_at'))
          PY

      - name: Publish fresh AER discovery with three-way data guard
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/r1a-baseline"
          generated="$RUNNER_TEMP/r1a-generated"
          data_tree="$RUNNER_TEMP/r1a-data-tree"
          cp "$RUNNER_TEMP/before.json" data/backfill-state/field-2025-2026.json.before
          mkdir -p "$baseline" "$generated"
          cp data/backfill-state/field-2025-2026.json.before "$baseline/field-2025-2026.json"
          cp data/backfill-state/field-2025-2026.json "$generated/field-2025-2026.json"

          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$baseline" \
            --path data/backfill-state/field-2025-2026.json.before >/dev/null 2>&1 || true
          rm -rf "$baseline" "$generated"
          python scripts/publish_data_delta.py snapshot \
            --root "$RUNNER_TEMP" \
            --output "$baseline" \
            --path before.json
          mkdir -p "$RUNNER_TEMP/generated-root/data/backfill-state"
          cp data/backfill-state/field-2025-2026.json "$RUNNER_TEMP/generated-root/data/backfill-state/field-2025-2026.json"
          mkdir -p "$RUNNER_TEMP/baseline-root/data/backfill-state"
          cp "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/baseline-root/data/backfill-state/field-2025-2026.json"
          rm -rf "$baseline" "$generated"
          python scripts/publish_data_delta.py snapshot \
            --root "$RUNNER_TEMP/baseline-root" \
            --output "$baseline" \
            --path data/backfill-state/field-2025-2026.json
          python scripts/publish_data_delta.py snapshot \
            --root "$RUNNER_TEMP/generated-root" \
            --output "$generated" \
            --path data/backfill-state/field-2025-2026.json

          for attempt in 1 2 3 4 5; do
            git fetch origin data
            git worktree remove --force "$data_tree" 2>/dev/null || true
            rm -rf "$data_tree"
            git worktree add "$data_tree" origin/data
            git -C "$data_tree" switch -C data
            if ! python scripts/publish_data_delta.py apply \
              --baseline "$baseline" \
              --generated "$generated" \
              --target "$data_tree" \
              --path data/backfill-state/field-2025-2026.json; then
              sleep $((attempt * 5))
              continue
            fi
            git -C "$data_tree" config user.name "academic-door-bot"
            git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
            git -C "$data_tree" add -f data/backfill-state/field-2025-2026.json
            if git -C "$data_tree" diff --cached --quiet; then
              echo "No AER discovery delta to publish."
              exit 0
            fi
            git -C "$data_tree" commit -m "Refresh AER authoritative discovery evidence"
            if git -C "$data_tree" push origin HEAD:data; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to publish AER discovery delta"
          exit 1

      - name: Commit guard implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add scripts/backfill_history.py tests/test_refresh_discovery_scope.py
          git diff --check
          git commit -m "fix: keep discovery-only refresh side-effect narrow"
          git push origin HEAD:journals-r1a-aer-freshness
