name: Bootstrap R1A discovery-only scope guard

on:
  push:
    branches:
      - journals-r1a-aer-freshness

permissions:
  contents: write

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: journals-r1a-aer-freshness
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Make discovery-only mode side-effect narrow
        shell: bash
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          script = Path('scripts/backfill_history.py')
          text = script.read_text(encoding='utf-8')
          old = "    if migrate_legacy_state(state, journals):\n        atomic_write_json(state_path, state)\n"
          new = "    # Discovery-only refresh must never reconcile or downgrade historical\n    # issue checkpoints. It is an evidence refresh, not an archive-state repair.\n    if not args.refresh_discovery_only and migrate_legacy_state(state, journals):\n        atomic_write_json(state_path, state)\n"
          if old not in text:
              raise SystemExit('migrate_legacy_state block not found')
          script.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_b64 = ""
          Path('tests/test_refresh_discovery_scope.py').write_bytes(base64.b64decode(test_b64))
          PY

      - name: Run regressions and full suite
        run: |
          python -m unittest tests.test_refresh_discovery_scope -v
          python -m unittest tests.test_r1a_aer_freshness_workflow -v
          python -m unittest discover -s tests -v

      - name: Prove canonical AER refresh touches discovery only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api
          git archive origin/data public/api | tar -x
          mkdir -p data/backfill-state
          git show origin/data:data/backfill-state/field-2025-2026.json > data/backfill-state/field-2025-2026.json
          cp data/backfill-state/field-2025-2026.json "$RUNNER_TEMP/before.json"
          python scripts/backfill_history.py \
            --config config/field-history.yml \
            --state data/backfill-state/field-2025-2026.json \
            --journals AER \
            --from-year 2025 \
            --to-year 2026 \
            --refresh-discovery-only
          python - "$RUNNER_TEMP/before.json" data/backfill-state/field-2025-2026.json <<'PY'
          import json, sys
          before = json.load(open(sys.argv[1], encoding='utf-8'))
          after = json.load(open(sys.argv[2], encoding='utf-8'))
          assert before.get('issues') == after.get('issues'), 'issues mutated'
          assert before.get('expected_issue_exclusions') == after.get('expected_issue_exclusions'), 'exclusions mutated'
          assert before.get('rotation') == after.get('rotation'), 'rotation mutated'
          bdisc = dict(before.get('discovery') or {})
          adisc = dict(after.get('discovery') or {})
          bdisc.pop('AER', None)
          a_aer = adisc.pop('AER', None)
          assert bdisc == adisc, 'non-AER discovery mutated'
          assert a_aer and a_aer.get('authority') == 'official_archive', a_aer
          assert 'aer-116-9' in a_aer.get('issue_ids', []), a_aer
          for key in set(before) | set(after):
              if key in {'updated_at', 'discovery'}:
                  continue
              assert before.get(key) == after.get(key), f'top-level mutation: {key}'
          print('AER discovery-only semantic scope guard passed')
          print('new refreshed_at:', a_aer.get('refreshed_at'))
          PY

      - name: Publish fresh AER discovery with three-way data guard
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/r1a-baseline"
          generated="$RUNNER_TEMP/r1a-generated"
          data_tree="$RUNNER_TEMP/r1a-data-tree"
          mkdir -p "$RUNNER_TEMP/baseline-root/data/backfill-state" "$RUNNER_TEMP/generated-root/data/backfill-state"
          cp "$RUNNER_TEMP/before.json" "$RUNNER_TEMP/baseline-root/data/backfill-state/field-2025-2026.json"
          cp data/backfill-state/field-2025-2026.json "$RUNNER_TEMP/generated-root/data/backfill-state/field-2025-2026.json"
          python scripts/publish_data_delta.py snapshot \
            --root "$RUNNER_TEMP/baseline-root" \
            --output "$baseline" \
            --path data/backfill-state/field-2025-2026.json
          python scripts/publish_data_delta.py snapshot \
            --root "$RUNNER_TEMP/generated-root" \
            --output "$generated" \
            --path data/backfill-state/field-2025-2026.json
          for attempt in 1 2 3 4 5; do
            git fetch origin data
            git worktree remove --force "$data_tree" 2>/dev/null || true
            rm -rf "$data_tree"
            git worktree add "$data_tree" origin/data
            git -C "$data_tree" switch -C data
            if ! python scripts/publish_data_delta.py apply \
              --baseline "$baseline" \
              --generated "$generated" \
              --target "$data_tree" \
              --path data/backfill-state/field-2025-2026.json; then
              sleep $((attempt * 5))
              continue
            fi
            git -C "$data_tree" config user.name "academic-door-bot"
            git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
            git -C "$data_tree" add -f data/backfill-state/field-2025-2026.json
            if git -C "$data_tree" diff --cached --quiet; then
              echo "No AER discovery delta to publish."
              exit 0
            fi
            git -C "$data_tree" commit -m "Refresh AER authoritative discovery evidence"
            if git -C "$data_tree" push origin HEAD:data; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "Failed to publish AER discovery delta"
          exit 1

      - name: Commit guard implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add scripts/backfill_history.py tests/test_refresh_discovery_scope.py
          git diff --check
          git commit -m "fix: keep discovery-only refresh side-effect narrow"
          git push origin HEAD:journals-r1a-aer-freshness
