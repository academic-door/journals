name: R3 history debt inventory

on:
  push:
    branches:
      - probe/r3-history-debt-inventory-20260911

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    env:
      DATA_SHA: b54433f2bafafec3f9a09f3b1870dddf6a739e78
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Materialize pinned canonical history data
        run: |
          git fetch --depth=1 origin data
          rm -rf data/backfill-state public/api/v1/journals
          git archive "$DATA_SHA" data/backfill-state public/api/v1/journals | tar -x
      - name: Audit and classify remaining debt
        run: |
          mapfile -t states < <(find data/backfill-state -maxdepth 1 -type f -name '*.json' | sort)
          args=()
          for state in "${states[@]}"; do args+=(--state "$state"); done
          python scripts/audit_history_coverage.py "${args[@]}" --api-root public/api/v1 --report-json /tmp/history.json
          python - <<'PY'
          import collections, json, re
          from pathlib import Path

          report = json.loads(Path('/tmp/history.json').read_text())
          errors = report['errors']

          def category(error: str) -> str:
              patterns = [
                  ('discovery_no_state', r'discovery has no state entry$'),
                  ('state_absent_discovery', r'state entry absent from discovery snapshot$'),
                  ('archive_missing', r'archive missing$'),
                  ('index_entry_missing', r'archive index entry missing$'),
                  ('state_publication_mismatch', r'state publication .* != archive '),
                  ('state_content_mismatch', r'state content_status .* != archive '),
                  ('state_source_mismatch', r'state source_status .* != archive '),
                  ('index_publication_mismatch', r'index publication_state .* != archive '),
                  ('index_content_mismatch', r'index content_status .* != archive '),
                  ('index_source_mismatch', r'index source_status .* != archive '),
                  ('ready_unverified', r'ready archive has unverified source$'),
                  ('discovery_snapshot_missing', r'discovery snapshot missing$'),
                  ('discovery_refreshed_missing', r'discovery refreshed_at missing$'),
                  ('discovery_authority_missing', r'discovery authority missing$'),
                  ('stale_collector_revision', r'stale collector_revision '),
                  ('duplicate_discovery_ids', r'duplicate discovery issue ids$'),
                  ('index_missing', r': index_missing$'),
                  ('unknown_journal', r'unknown journal '),
              ]
              for name, pattern in patterns:
                  if re.search(pattern, error):
                      return name
              return 'other'

          cats = collections.Counter(category(e) for e in errors)
          subjects = collections.Counter(e.split(':', 1)[0] for e in errors)
          issue_subjects = [s for s in subjects if '-' in s]
          prefixes = collections.Counter(s.split('-', 1)[0] for s in issue_subjects for _ in range(subjects[s]))

          print('R3_INVENTORY_COUNTS=' + json.dumps(report['counts'], sort_keys=True))
          print('R3_INVENTORY_ERROR_COUNT=' + str(report['error_count']))
          print('R3_INVENTORY_CATEGORIES=' + json.dumps(cats, sort_keys=True))
          print('R3_INVENTORY_PREFIXES=' + json.dumps(prefixes.most_common(), ensure_ascii=False))
          print('R3_INVENTORY_SUBJECTS=' + json.dumps(subjects.most_common(80), ensure_ascii=False))
          print('R3_INVENTORY_ERRORS_BEGIN')
          for error in errors:
              print(error)
          print('R3_INVENTORY_ERRORS_END')
          PY
