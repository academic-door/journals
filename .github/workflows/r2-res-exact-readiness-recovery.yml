name: R2 RES exact readiness recovery

on:
  push:
    branches:
      - r2-res-exact-readiness-recovery

permissions:
  contents: write
  models: read

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  res:
    uses: academic-door/journals/.github/workflows/backfill-field-history.yml@main
    with:
      journal: RES
      from_year: 2026
      to_year: 2026
      max_issues: 4
      max_translations: 120
      max_journals: 1
      translation_model: deepseek-chat
      refresh_discovery_only: false
    secrets: inherit

  verify:
    needs: res
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Overlay latest governed data branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api
          git archive origin/data public/api | tar -x
          mkdir -p "$RUNNER_TEMP/data-state"
          git show origin/data:data/backfill-state/field-2025-2026.json > "$RUNNER_TEMP/data-state/field-2025-2026.json"
      - name: Verify RES 2026 readiness
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_completeness_ledger.py \
            --state "$RUNNER_TEMP/data-state/field-2025-2026.json" \
            --api-root public/api/v1 \
            --out-json "$RUNNER_TEMP/completeness-2026.json"
          LEDGER="$RUNNER_TEMP/completeness-2026.json" python - <<'PY'
          import json, os
          from pathlib import Path
          payload = json.loads(Path(os.environ["LEDGER"]).read_text(encoding="utf-8"))
          row = next(r for r in payload["journals"] if r["journalKey"] == "RES")
          print(json.dumps({k: row.get(k) for k in (
              "journalKey", "authority", "authorityClassification", "freshnessStatus",
              "expectedIssueCount", "publicationReadyIssueCount", "status", "discoveryRefreshedAt"
          )}, ensure_ascii=False))
          if row["authorityClassification"] != "authoritative":
              raise SystemExit("RES authority is not authoritative")
          if row["freshnessStatus"] != "CURRENT_FOR_AUDIT_END":
              raise SystemExit("RES authoritative evidence is not current")
          if row["expectedIssueCount"] != 4 or row["publicationReadyIssueCount"] != 4:
              raise SystemExit("RES 2026 is not 4/4 publication-ready")
          if row["status"] != "COMPLETE":
              raise SystemExit(f"RES status is {row['status']}, expected COMPLETE")
          PY
          python scripts/rebuild_public_snapshot.py --check
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_privacy.py
