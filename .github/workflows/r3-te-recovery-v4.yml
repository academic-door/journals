name: R3 TE recovery writer v4

on:
  push:
    branches:
      - ops/r3-te-recovery-v4-20260911
    paths:
      - .github/workflows/r3-te-recovery-v4.yml

permissions:
  contents: write
  models: read

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TARGET_IDS: te-18-1,te-18-2,te-18-3,te-18-4,te-19-1,te-19-2,te-19-3,te-19-4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/r3-te-recovery-v4-20260911
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Restore execution-time canonical data and snapshot baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          export DATA_BASE_SHA="$(git rev-parse origin/data)"
          echo "DATA_BASE_SHA=$DATA_BASE_SHA" | tee -a "$GITHUB_ENV"
          rm -rf public/api data/backfill-state data/backfill-staging data/translation-cache
          mkdir -p public data
          git archive origin/data public/api data/backfill-state data/backfill-staging data/translation-cache | tar -x
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/build_gap_manifest.py \
            "${state_args[@]}" --api-root public/api/v1 --out-json "$RUNNER_TEMP/gap-before.json"
          python scripts/audit_history_coverage.py \
            "${state_args[@]}" --api-root public/api/v1 --report-json "$RUNNER_TEMP/history-before.json"
          python scripts/publish_data_delta.py snapshot \
            --root . --output "$RUNNER_TEMP/data-baseline" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --exclude 'public/api/v1/journals/*/issues/index.json'
          python - <<'PY'
          import json, os
          from pathlib import Path
          wanted=set(os.environ['TARGET_IDS'].split(','))
          gap=json.loads(Path(os.environ['RUNNER_TEMP'] + '/gap-before.json').read_text())
          rows={r['issue_id']:r for r in gap['records'] if r.get('issue_id') in wanted}
          if set(rows) != wanted:
              raise SystemExit(f'target set drift: expected {sorted(wanted)}, got {sorted(rows)}')
          bad={k:(v.get('category'),v.get('archive_exists')) for k,v in rows.items() if v.get('category')!='recoverable' or v.get('archive_exists')}
          if bad:
              raise SystemExit(f'targets are no longer the qualified missing-archive tranche: {bad}')
          before=json.loads(Path(os.environ['RUNNER_TEMP'] + '/history-before.json').read_text())
          print(f'DATA_BASE_SHA={os.environ["DATA_BASE_SHA"]}')
          print(f'TARGET_GATE=8/8 recoverable missing archives history_errors={len(before.get("errors",[]))}')
          PY

      - name: Recover and translate the exact TE tranche
        env:
          PYTHONPATH: ${{ github.workspace }}
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          TRANSLATION_RETRIES: '5'
          TRANSLATION_WORKERS: '4'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/backfill_history.py \
            --config config/field-history.yml \
            --state data/backfill-state/field-2023-2024.json \
            --journals TE \
            --issue-ids "$TARGET_IDS" \
            --from-year 2023 --to-year 2024 \
            --translate \
            --max-issues 8 \
            --max-translations 120 \
            --max-minutes 18 \
            --skip-global-indexes \
            --report-json "$RUNNER_TEMP/te-backfill.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path(os.environ['RUNNER_TEMP'] + '/te-backfill.json').read_text())
          wanted=set(os.environ['TARGET_IDS'].split(','))
          results={item['issue_id']:item for item in report.get('results',[])}
          if set(results) != wanted:
              raise SystemExit(f'backfill result set mismatch: {sorted(results)}')
          bad={key:item.get('result') for key,item in results.items() if item.get('result')!='ready'}
          if bad:
              raise SystemExit(f'not all TE targets reached ready: {bad}')
          translated=sum(int((item.get('translation') or {}).get('translated',0)) for item in results.values())
          print(f'BACKFILL_GATE=8/8 ready translated={translated}')
          PY

      - name: Rebuild derived data and run acceptance gates
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_data_delta.py rebuild-archive-indexes --root .
          state_args=()
          for state in data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/history_state_reconcile.py \
            "${state_args[@]}" \
            --api-root public/api/v1 \
            --issue-ids "$TARGET_IDS" \
            --report-json "$RUNNER_TEMP/state-reconcile.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          report=json.loads(Path(os.environ['RUNNER_TEMP'] + '/state-reconcile.json').read_text())
          wanted=set(os.environ['TARGET_IDS'].split(','))
          changed=[]
          for state in report.get('states',[]):
              changed.extend(state.get('changes',[]))
          changed_ids={item.get('issue_id') for item in changed}
          if not changed:
              raise SystemExit('target-bounded reconcile changed no stale checkpoint; expected overlap repair')
          if not changed_ids <= wanted:
              raise SystemExit(f'reconcile escaped target scope: {sorted(changed_ids-wanted)}')
          print(f'STATE_RECONCILE={len(changed)} rows issues={len(changed_ids)}')
          PY
          python scripts/rebuild_public_snapshot.py
          python scripts/backfill_status.py \
            "${state_args[@]}" --api-root public/api/v1 \
            --out-json public/api/v1/backfill-status.json --out-md public/backfill-status.md
          python scripts/build_gap_manifest.py \
            "${state_args[@]}" --api-root public/api/v1 \
            --out-json public/api/v1/gap-manifest.json --out-md public/gap-manifest.md
          python scripts/check_recovery_progress.py \
            --before "$RUNNER_TEMP/gap-before.json" \
            --after public/api/v1/gap-manifest.json \
            --report "$RUNNER_TEMP/recovery-progress.json"
          python scripts/audit_history_coverage.py \
            "${state_args[@]}" --api-root public/api/v1 --report-json "$RUNNER_TEMP/history-after.json"
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_privacy.py
          python -m unittest discover -s tests -v
          python scripts/rebuild_public_snapshot.py --check
          python - <<'PY'
          import json, os
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          before=json.loads((tmp/'history-before.json').read_text())
          after=json.loads((tmp/'history-after.json').read_text())
          b=set(map(str,before.get('errors',[])))
          a=set(map(str,after.get('errors',[])))
          added=sorted(a-b)
          removed=sorted(b-a)
          if added:
              raise SystemExit(f'history audit added errors: {added[:10]}')
          if len(a) >= len(b):
              raise SystemExit(f'history audit did not improve: {len(b)} -> {len(a)}')
          wanted=set(os.environ['TARGET_IDS'].split(','))
          unrelated=[err for err in removed if not any(err.startswith(issue_id + ': ') for issue_id in wanted)]
          if unrelated:
              raise SystemExit(f'history audit removed unrelated debt: {unrelated[:10]}')
          gap=json.loads(Path('public/api/v1/gap-manifest.json').read_text())
          rows={r['issue_id']:r for r in gap['records'] if r.get('issue_id') in wanted}
          bad={k:v.get('category') for k,v in rows.items() if v.get('category')!='ready'}
          if set(rows)!=wanted or bad:
              raise SystemExit(f'post-recovery target gate failed: rows={sorted(rows)} bad={bad}')
          (tmp/'removed-target-errors.json').write_text(json.dumps(removed, ensure_ascii=False, indent=2) + '\n')
          print(f'HISTORY_AUDIT={len(b)}->{len(a)} removed={len(removed)} target_only=true added=0')
          print('TARGET_READY=8/8')
          PY

      - name: Apply guarded delta to latest data branch and push once
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/generated-data"
          data_tree="$RUNNER_TEMP/data-tree"
          python scripts/publish_data_delta.py snapshot \
            --root . --output "$generated" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --exclude 'public/api/v1/journals/*/issues/index.json'
          git fetch origin data
          git worktree add "$data_tree" origin/data
          git -C "$data_tree" switch -C data
          python scripts/publish_data_delta.py apply \
            --baseline "$RUNNER_TEMP/data-baseline" \
            --generated "$generated" \
            --target "$data_tree" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --exclude 'public/api/v1/journals/*/issues/index.json'
          rm -rf "$data_tree/public/api"
          cp -R public/api "$data_tree/public/api"
          cp public/project-manifest.json "$data_tree/public/project-manifest.json"
          cp public/backfill-status.md "$data_tree/public/backfill-status.md"
          cp public/gap-manifest.md "$data_tree/public/gap-manifest.md"
          git -C "$data_tree" rm -f --ignore-unmatch public/search.js
          git -C "$data_tree" config user.name 'academic-door-bot'
          git -C "$data_tree" config user.email 'academic-door-bot@users.noreply.github.com'
          git -C "$data_tree" add -A public/api data/translation-cache data/backfill-state data/backfill-staging
          git -C "$data_tree" add public/project-manifest.json public/backfill-status.md public/gap-manifest.md
          if git -C "$data_tree" diff --cached --quiet; then
            echo 'No TE recovery data changes to publish.' >&2
            exit 1
          fi
          git -C "$data_tree" commit -m 'Recover TE 2023-2024 historical issues'
          git -C "$data_tree" push origin HEAD:data
          echo "PUBLISHED_SHA=$(git -C "$data_tree" rev-parse HEAD)" | tee -a "$GITHUB_ENV"

      - name: Canonical data readback
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          remote_sha="$(git rev-parse origin/data)"
          test "$remote_sha" = "$PUBLISHED_SHA"
          readback="$RUNNER_TEMP/readback"
          git worktree add "$readback" origin/data
          state_args=()
          for state in "$readback"/data/backfill-state/*.json; do
            [ -f "$state" ] && state_args+=(--state "$state")
          done
          python scripts/audit_history_coverage.py \
            "${state_args[@]}" --api-root "$readback/public/api/v1" \
            --report-json "$RUNNER_TEMP/history-readback.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          tmp=Path(os.environ['RUNNER_TEMP'])
          after=json.loads((tmp/'history-after.json').read_text())
          readback=json.loads((tmp/'history-readback.json').read_text())
          a=set(map(str,after.get('errors',[])))
          r=set(map(str,readback.get('errors',[])))
          if a != r:
              raise SystemExit(f'canonical readback audit drift: local={len(a)} remote={len(r)}')
          root=tmp/'readback/public/api/v1/journals/te/issues'
          missing=[]
          for issue_id in os.environ['TARGET_IDS'].split(','):
              payload=json.loads((root/f'{issue_id}.json').read_text())
              if payload.get('publication_state')!='ready':
                  missing.append((issue_id,payload.get('publication_state')))
          if missing:
              raise SystemExit(f'canonical target readback failed: {missing}')
          print(f'CANONICAL_READBACK_SHA={os.environ["PUBLISHED_SHA"]}')
          print(f'CANONICAL_HISTORY_ERRORS={len(r)}')
          print('CANONICAL_TARGET_READY=8/8')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: te-recovery-v4-acceptance
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/gap-before.json
            ${{ runner.temp }}/history-before.json
            ${{ runner.temp }}/te-backfill.json
            ${{ runner.temp }}/state-reconcile.json
            ${{ runner.temp }}/recovery-progress.json
            ${{ runner.temp }}/history-after.json
            ${{ runner.temp }}/history-readback.json
            ${{ runner.temp }}/removed-target-errors.json
