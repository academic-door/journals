name: G02 265 RSS announcement implementation

on:
  push:
    branches:
      - feat/265-official-rss-announcements
    paths:
      - .github/workflows/g02-265-rss-announcements.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/265-official-rss-announcements

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Apply minimal official-RSS announcement wiring
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/journal_monitor.py")
          text = path.read_text(encoding="utf-8")

          marker = '''def _candidate_payload(candidate: Candidate) -> dict[str, Any]:\n    return {\n        "issue_key": candidate.issue_key,\n        "volume": candidate.volume,\n        "issue": candidate.issue,\n        "publication_date": candidate.publication_date,\n        "fingerprint": candidate.fingerprint,\n        "doi_count": len(candidate.dois),\n        "unseen_dois": list(candidate.unseen_dois),\n    }\n\n\n'''
          replacement = marker + '''def _official_rss_announcement(\n    journal_id: str,\n    candidate: Candidate | None,\n    source_url: str,\n    observed_at: str,\n) -> dict[str, Any] | None:\n    """Build issue-existence evidence only from first-party RSS corroboration."""\n\n    if not candidate or not source_url or not candidate.publication_date:\n        return None\n    volume = candidate.volume.strip()\n    issue = candidate.issue.strip()\n    if not volume or not issue:\n        return None\n    token = lambda value: re.sub(r"[^a-z0-9]+", "-", value.casefold()).strip("-")\n    volume_token = token(volume)\n    issue_token = token(issue)\n    if not volume_token or not issue_token:\n        return None\n    return {\n        "schema_version": "1.0",\n        "journal_id": journal_id,\n        "issue_id": f"{journal_id}-{volume_token}-{issue_token}",\n        "volume": volume,\n        "issue": issue,\n        "issue_label": f"Vol. {volume} · No. {issue}",\n        "publication_date": candidate.publication_date,\n        "publication_state": "announced",\n        "source_authority": "first_party",\n        "source_kind": "official_rss",\n        "source_url": source_url,\n        "observed_at": observed_at,\n    }\n\n\n'''
          if marker not in text:
              raise SystemExit("candidate payload marker not found")
          text = text.replace(marker, replacement, 1)

          entry_marker = '''                entry = {\n                    **previous,\n                    **observation,\n                    "journal_id": config["id"],\n                    "status": status,\n                    "last_checked_at": checked_at,\n                    "current_fingerprint": issue_fingerprint(baseline),\n                    "current_issue_id": baseline.get("issue_id", ""),\n                    "failure_count": 0,\n                    "deep_failure_count": (\n                        int(previous.get("deep_failure_count", 0))\n                        if same_deep_candidate\n                        else 0\n                    ),\n                    "last_error": (\n                        str(previous.get("last_error", ""))\n                        if same_deep_candidate\n                        else ""\n                    ),\n                    "next_deep_retry_at": (\n                        str(previous.get("next_deep_retry_at", ""))\n                        if same_deep_candidate\n                        else ""\n                    ),\n                }\n'''
          entry_replacement = entry_marker + '''                if "official_rss" in observation.get("evidence", []):\n                    announcement = _official_rss_announcement(\n                        config["id"],\n                        candidate,\n                        str(config.get("rss_url", "")),\n                        checked_at,\n                    )\n                    if announcement:\n                        entry["announcement"] = announcement\n'''
          if entry_marker not in text:
              raise SystemExit("entry marker not found")
          text = text.replace(entry_marker, entry_replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify targeted announcement contract
        run: python -m unittest tests.test_monitor_announcements -v

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add scripts/journal_monitor.py
          git commit -m "feat(freshness): persist official RSS announcements"
          git push origin HEAD:feat/265-official-rss-announcements
