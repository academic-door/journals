name: B8 ITPF 33-5 candidate (isolated)

on:
  push:
    branches:
      - b8/g20-itpf-publisher-series-stage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Stage real publisher-supplied RePEc abstracts and translate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TRANSLATION_WORKERS: "2"
        run: |
          python scripts/b8_itpf_candidate.py \
            --output-dir "$RUNNER_TEMP/itpf-33-5" \
            --translate
          python - "$RUNNER_TEMP/itpf-33-5/itpf-33-5.report.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding="utf-8"))
          assert p["publisher_supplied_articles"] == 11
          assert p["source_status"] == "publisher_verified"
          assert p["first_party_full_toc_verified"] is False
          assert p["release_enabled"] is False
          print("ITPF isolated:",json.dumps({
              "count":p["publisher_supplied_articles"],
              "source":p["source_status"],
              "content":p["content_status"],
              "quality_ready":p["content_quality_ready"],
              "release":p["release_enabled"],
          }))
          PY
      - name: Preserve private content for owner review
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b8-itpf-33-5-staged-candidate
          path: ${{ runner.temp }}/itpf-33-5/
          retention-days: 1
          if-no-files-found: warn
