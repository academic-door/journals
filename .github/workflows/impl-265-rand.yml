name: Temporary implement RAND freshness

on:
  push:
    branches:
      - feat/265-rand-wiley-announcement
    paths:
      - .github/workflows/impl-265-rand.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/265-rand-wiley-announcement

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - run: python scripts/_impl_265_rand.py

      - run: python -m unittest tests.test_wiley_issue_signal tests.test_monitor_announcements -v

      - run: python -m unittest discover -s tests -v

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add collectors/wiley.py scripts/journal_monitor.py config/journals.yml
          git diff --cached --check
          git commit -m "feat(freshness): add bounded Wiley issue announcement signal"
          git push origin HEAD:feat/265-rand-wiley-announcement
