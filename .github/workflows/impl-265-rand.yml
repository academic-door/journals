name: Temporary implement #265 RAND Wiley announcement

on:
  push:
    branches:
      - feat/265-rand-wiley-announcement
    paths:
      - .github/workflows/impl-265-rand.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/265-rand-wiley-announcement

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Apply bounded RAND Wiley announcement implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          wiley_path = Path("collectors/wiley.py")
          wiley = wiley_path.read_text(encoding="utf-8")
          marker = "\ndef _parse_article_page(content: bytes, source_url: str) -> dict[str, Any]:\n"
          if "def parse_latest_issue_signal(" not in wiley:
              if marker not in wiley:
                  raise SystemExit("wiley insertion marker missing")
              implementation = r'''

def parse_latest_issue_signal(content: bytes, source_url: str) -> dict[str, str]:
    """Parse the latest issue identity from Wiley's first-party Recent issues block.

    This is issue-existence evidence only. It does not assert an article roster,
    article order, abstract completeness, translation readiness, or publication
    readiness.
    """

    if not _is_official_wiley_url(source_url):
        raise ValueError("Wiley issue signals require an official HTTPS Wiley URL")

    soup = BeautifulSoup(content, "html.parser")
    recent_heading = next(
        (
            node
            for node in soup.find_all(["h2", "h3", "h4"])
            if _normalise_section(_text(node)) == "recent issues"
        ),
        None,
    )
    if not isinstance(recent_heading, Tag):
        raise ValueError("Wiley Recent issues block is missing")

    scope = recent_heading.find_parent(["section", "article"])
    links: list[Tag] = []
    if isinstance(scope, Tag):
        links = [link for link in scope.select("a[href*='/toc/']") if isinstance(link, Tag)]
    else:
        for sibling in recent_heading.next_siblings:
            if isinstance(sibling, Tag) and sibling.name in {"h2", "h3", "h4"}:
                break
            if not isinstance(sibling, Tag):
                continue
            if sibling.name == "a" and "/toc/" in str(sibling.get("href", "")):
                links.append(sibling)
            links.extend(
                link
                for link in sibling.select("a[href*='/toc/']")
                if isinstance(link, Tag)
            )

    period_pattern = re.compile(
        r"\b(?:January|February|March|April|May|June|July|August|September|"
        r"October|November|December|Winter|Spring|Summer|Fall|"
        r"Autumn(?:\s+\(Fall\))?)\s+\d{4}\b",
        re.IGNORECASE,
    )
    path_pattern = re.compile(
        r"/toc/[^/]+/(?P<year>\d{4})/(?P<volume>[^/]+)/(?P<issue>[^/?#]+)$"
    )
    candidates: list[tuple[tuple[int, int, int], dict[str, str]]] = []
    seen_urls: set[str] = set()
    for link in links:
        label = _text(link)
        match = next(
            (pattern.search(label) for pattern in VOLUME_ISSUE_PATTERNS if pattern.search(label)),
            None,
        )
        if not match:
            continue
        absolute = urljoin(source_url, str(link.get("href", ""))).split("#", 1)[0]
        if absolute in seen_urls or not _is_official_wiley_url(absolute):
            continue
        seen_urls.add(absolute)
        path_match = path_pattern.search(urlparse(absolute).path.rstrip("/"))
        if not path_match:
            continue
        volume = match.group("volume").strip()
        issue = match.group("issue").strip()
        if volume != path_match.group("volume") or issue != path_match.group("issue"):
            continue
        context = link.find_parent(["li", "article"]) or link.parent
        period_match = period_pattern.search(_text(context) if isinstance(context, Tag) else label)
        publication_date = period_match.group(0) if period_match else ""
        issue_number = re.search(r"\d+", issue)
        candidates.append(
            (
                (
                    int(path_match.group("year")),
                    int(volume) if volume.isdigit() else -1,
                    int(issue_number.group(0)) if issue_number else -1,
                ),
                {
                    "volume": volume,
                    "issue": issue,
                    "publication_date": publication_date,
                    "source_kind": "official_archive",
                    "source_url": absolute,
                },
            )
        )

    if not candidates:
        raise ValueError("Wiley Recent issues block exposed no auditable issue identity")
    return max(candidates, key=lambda item: item[0])[1]
'''
              wiley = wiley.replace(marker, implementation + marker, 1)
              wiley_path.write_text(wiley, encoding="utf-8")

          monitor_path = Path("scripts/journal_monitor.py")
          monitor = monitor_path.read_text(encoding="utf-8")
          import_marker = "import yaml\n"
          if "from collectors.wiley import parse_latest_issue_signal" not in monitor:
              if import_marker not in monitor:
                  raise SystemExit("monitor import marker missing")
              monitor = monitor.replace(
                  import_marker,
                  import_marker + "\nfrom collectors.wiley import parse_latest_issue_signal\n",
                  1,
              )

          candidate_marker = "\ndef _candidate_payload(candidate: Candidate) -> dict[str, Any]:\n"
          if "def fetch_official_issue_signal(" not in monitor:
              if candidate_marker not in monitor:
                  raise SystemExit("candidate payload marker missing")
              signal_code = r'''

def fetch_official_issue_signal(
    config: dict[str, Any],
    *,
    session: requests.Session | None = None,
) -> dict[str, Any] | None:
    """Fetch configured first-party issue-existence evidence, fail closed."""

    if config.get("announcement_source") != "wiley_recent_issues":
        return None
    source_url = str(config.get("announcement_url", "")).strip()
    if not source_url:
        return None
    client = session or requests.Session()
    client.headers.update({"User-Agent": USER_AGENT, "Accept": "text/html"})
    response = _request_with_retry(client, source_url, attempts=2, timeout=30)
    return parse_latest_issue_signal(response.content, source_url)


def _issue_signal_matches_candidate(
    candidate: Candidate | None,
    signal: dict[str, Any] | None,
) -> bool:
    if not candidate or not signal:
        return False
    return (
        candidate.volume.strip() == str(signal.get("volume", "")).strip()
        and candidate.issue.strip() == str(signal.get("issue", "")).strip()
        and str(signal.get("source_kind", "")) == "official_archive"
        and str(signal.get("source_url", "")).startswith("https://onlinelibrary.wiley.com/")
    )


def _official_issue_signal_announcement(
    journal_id: str,
    candidate: Candidate | None,
    signal: dict[str, Any] | None,
    observed_at: str,
) -> dict[str, Any] | None:
    if not _issue_signal_matches_candidate(candidate, signal):
        return None
    assert candidate is not None and signal is not None
    volume = candidate.volume.strip()
    issue = candidate.issue.strip()
    publication_date = str(signal.get("publication_date", "")).strip()
    if not volume or not issue or not publication_date:
        return None
    token = lambda value: re.sub(r"[^a-z0-9]+", "-", value.casefold()).strip("-")
    volume_token = token(volume)
    issue_token = token(issue)
    if not volume_token or not issue_token:
        return None
    return {
        "schema_version": "1.0",
        "journal_id": journal_id,
        "issue_id": f"{journal_id}-{volume_token}-{issue_token}",
        "volume": volume,
        "issue": issue,
        "issue_label": f"Vol. {volume} · No. {issue}",
        "publication_date": publication_date,
        "publication_state": "announced",
        "source_authority": "first_party",
        "source_kind": "official_archive",
        "source_url": str(signal["source_url"]),
        "observed_at": observed_at,
    }
'''
              monitor = monitor.replace(candidate_marker, signal_code + candidate_marker, 1)

          old_eval_sig = '''def evaluate_observation(
    candidate: Candidate | None,
    baseline: dict[str, Any],
    previous_entry: dict[str, Any],
    *,
    rss_dois: set[str] | None = None,
) -> tuple[str, dict[str, Any]]:'''
          new_eval_sig = '''def evaluate_observation(
    candidate: Candidate | None,
    baseline: dict[str, Any],
    previous_entry: dict[str, Any],
    *,
    rss_dois: set[str] | None = None,
    official_issue_match: bool = False,
) -> tuple[str, dict[str, Any]]:'''
          if old_eval_sig in monitor:
              monitor = monitor.replace(old_eval_sig, new_eval_sig, 1)

          old_evidence = '''    evidence = ["crossref"]
    if rss_dois and set(candidate.unseen_dois) & rss_dois:
        evidence.append("official_rss")
'''
          new_evidence = '''    evidence = ["crossref"]
    if rss_dois and set(candidate.unseen_dois) & rss_dois:
        evidence.append("official_rss")
    if official_issue_match:
        evidence.append("official_archive")
'''
          if old_evidence in monitor:
              monitor = monitor.replace(old_evidence, new_evidence, 1)

          old_confirm = '''    confirmed = (
        "official_rss" in evidence
        or same_issue
        or clearly_new_issue
        or seen_count >= 2
    )'''
          new_confirm = '''    confirmed = (
        "official_rss" in evidence
        or "official_archive" in evidence
        or same_issue
        or clearly_new_issue
        or seen_count >= 2
    )'''
          if old_confirm in monitor:
              monitor = monitor.replace(old_confirm, new_confirm, 1)

          old_detect_sig = '''def detect_all(
    journal_configs: dict[str, dict[str, Any]],
    state: dict[str, Any],
    *,
    crossref_fetcher: Callable[[dict[str, Any], dict[str, Any]], list[dict[str, Any]]] = fetch_crossref_items,
    rss_fetcher: Callable[[str], set[str]] = fetch_rss_dois,
) -> tuple[dict[str, Any], dict[str, Any]]:'''
          new_detect_sig = '''def detect_all(
    journal_configs: dict[str, dict[str, Any]],
    state: dict[str, Any],
    *,
    crossref_fetcher: Callable[[dict[str, Any], dict[str, Any]], list[dict[str, Any]]] = fetch_crossref_items,
    rss_fetcher: Callable[[str], set[str]] = fetch_rss_dois,
    issue_signal_fetcher: Callable[[dict[str, Any]], dict[str, Any] | None] = fetch_official_issue_signal,
) -> tuple[dict[str, Any], dict[str, Any]]:'''
          if old_detect_sig in monitor:
              monitor = monitor.replace(old_detect_sig, new_detect_sig, 1)

          old_probe = '''                status, observation = evaluate_observation(
                    candidate,
                    baseline,
                    previous,
                    rss_dois=rss_dois,
                )'''
          new_probe = '''                issue_signal: dict[str, Any] | None = None
                official_issue_match = False
                if candidate and config.get("announcement_source"):
                    try:
                        issue_signal = issue_signal_fetcher(config)
                        official_issue_match = _issue_signal_matches_candidate(
                            candidate, issue_signal
                        )
                    except Exception:
                        # First-party issue-existence signals are additive only.
                        # A blocked or drifting publisher surface must not break
                        # metadata detection or manufacture authority.
                        issue_signal = None
                        official_issue_match = False
                status, observation = evaluate_observation(
                    candidate,
                    baseline,
                    previous,
                    rss_dois=rss_dois,
                    official_issue_match=official_issue_match,
                )'''
          if old_probe in monitor:
              monitor = monitor.replace(old_probe, new_probe, 1)

          old_announcement = '''                if "official_rss" in observation.get("evidence", []):
                    announcement = _official_rss_announcement(
                        config["id"],
                        candidate,
                        str(config.get("rss_url", "")),
                        checked_at,
                    )
                    if announcement:
                        entry["announcement"] = announcement
'''
          new_announcement = '''                if "official_rss" in observation.get("evidence", []):
                    announcement = _official_rss_announcement(
                        config["id"],
                        candidate,
                        str(config.get("rss_url", "")),
                        checked_at,
                    )
                    if announcement:
                        entry["announcement"] = announcement
                if "official_archive" in observation.get("evidence", []):
                    announcement = _official_issue_signal_announcement(
                        config["id"],
                        candidate,
                        issue_signal,
                        checked_at,
                    )
                    if announcement:
                        entry["announcement"] = announcement
'''
          if old_announcement in monitor:
              monitor = monitor.replace(old_announcement, new_announcement, 1)

          required = [
              "from collectors.wiley import parse_latest_issue_signal",
              "def fetch_official_issue_signal(",
              "official_issue_match: bool = False",
              "issue_signal_fetcher:",
              '"official_archive" in evidence',
              "_official_issue_signal_announcement(",
          ]
          missing = [value for value in required if value not in monitor]
          if missing:
              raise SystemExit(f"monitor patch incomplete: {missing}")
          monitor_path.write_text(monitor, encoding="utf-8")

          config_path = Path("config/journals.yml")
          config = config_path.read_text(encoding="utf-8")
          rand_current = "    current_issue_url: https://onlinelibrary.wiley.com/toc/17562171/current\n"
          rand_announcement = (
              rand_current
              + "    announcement_source: wiley_recent_issues\n"
              + "    announcement_url: https://onlinelibrary.wiley.com/journal/17562171\n"
          )
          rand_start = config.index("  RAND:\n")
          rand_end = config.index("\n  AEJMICRO:\n", rand_start)
          rand_block = config[rand_start:rand_end]
          if "announcement_source: wiley_recent_issues" not in rand_block:
              if rand_current not in rand_block:
                  raise SystemExit("RAND current URL marker missing")
              rand_block = rand_block.replace(rand_current, rand_announcement, 1)
              config = config[:rand_start] + rand_block + config[rand_end:]
              config_path.write_text(config, encoding="utf-8")
          PY

      - name: Verify targeted freshness contracts
        run: |
          python -m unittest tests.test_wiley_issue_signal tests.test_monitor_announcements -v

      - name: Verify full Python suite
        run: python -m unittest discover -s tests -v

      - name: Commit GREEN implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add collectors/wiley.py scripts/journal_monitor.py config/journals.yml
          git diff --cached --check
          git commit -m "feat(freshness): add bounded Wiley issue announcement signal"
          git push origin HEAD:feat/265-rand-wiley-announcement
