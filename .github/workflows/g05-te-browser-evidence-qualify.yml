name: G05 TE browser evidence qualification

on:
  push:
    branches:
      - brain/g05-te-browser-evidence-qualify
    paths:
      - .github/workflows/g05-te-browser-evidence-qualify.yml

permissions:
  contents: read
  models: read

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt

      - name: Preserve bounded browser-authorized evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/te-evidence"
          cp data/provenance/official-rosters/wiley/te-21-2.json "$RUNNER_TEMP/te-evidence/"
          cp data/provenance/official-rosters/wiley/te-21-3.json "$RUNNER_TEMP/te-evidence/"

      - name: Restore latest canonical data and overlay bounded evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          rm -rf public/api data/backfill-state data/backfill-staging data/translation-cache data/provenance/official-rosters
          mkdir -p public data/provenance/official-rosters/wiley
          git archive origin/data public/api data/backfill-state data/backfill-staging data/translation-cache | tar -x
          if git ls-tree -r --name-only origin/data -- data/provenance/official-rosters | grep -q .; then
            git archive origin/data data/provenance/official-rosters | tar -x
          fi
          cp "$RUNNER_TEMP/te-evidence/"*.json data/provenance/official-rosters/wiley/

      - name: Validate browser-authorized evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.import_official_roster_evidence import validate_evidence
          expected = {"te-21-2": 10, "te-21-3": 11}
          for issue_id, count in expected.items():
              path = Path(f"data/provenance/official-rosters/wiley/{issue_id}.json")
              payload = json.loads(path.read_text(encoding="utf-8"))
              validate_evidence(payload)
              if payload.get("method") != "browser-authorized":
                  raise SystemExit(f"{issue_id}: unexpected method")
              if len(payload.get("items", [])) != count:
                  raise SystemExit(f"{issue_id}: roster count mismatch")
              print(json.dumps({"issue_id": issue_id, "items": count, "official_url": payload["official_url"]}))
          PY

      - name: Build missing TE archives from official rosters
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.MODELS_TOKEN || github.token }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
          DEEPSEEK_MODEL: deepseek-chat
          TRANSLATION_RETRIES: "5"
          TRANSLATION_WORKERS: "4"
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_archives_from_roster_evidence.py \
            --evidence-root data/provenance/official-rosters/wiley \
            --api-root public/api/v1 \
            --state-root data/backfill-state \
            --staging-root data/backfill-staging \
            --translation-cache-root data/translation-cache \
            --issue-ids te-21-2,te-21-3 \
            --max-translations 60 \
            --report-json output/te-builder.json

      - name: Rebuild and enforce bounded acceptance
        env:
          PYTHONPATH: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/rebuild_public_snapshot.py
          python scripts/publish_data_delta.py rebuild-archive-indexes --root .
          python - <<'PY'
          import json
          from pathlib import Path
          expected = {"te-21-2": ("May 2026", 10), "te-21-3": ("July 2026", 11)}
          for issue_id, (date, count) in expected.items():
              path = Path(f"public/api/v1/journals/te/issues/{issue_id}.json")
              if not path.is_file():
                  raise SystemExit(f"missing archive {issue_id}")
              issue = json.loads(path.read_text(encoding="utf-8"))
              checks = {
                  "publication_state": issue.get("publication_state"),
                  "source_status": issue.get("source_status"),
                  "publication_date": issue.get("publication_date"),
                  "articles": len(issue.get("articles", [])),
                  "roster_authority": (issue.get("quality") or {}).get("roster_authority"),
                  "roster_transport": (issue.get("quality") or {}).get("roster_transport"),
              }
              if checks["publication_state"] != "ready":
                  raise SystemExit(f"{issue_id} not ready: {checks}")
              if checks["source_status"] != "official_verified":
                  raise SystemExit(f"{issue_id} not official_verified: {checks}")
              if checks["roster_authority"] != "official-issue-page":
                  raise SystemExit(f"{issue_id} authority mismatch: {checks}")
              if checks["roster_transport"] != "browser-authorized":
                  raise SystemExit(f"{issue_id} transport mismatch: {checks}")
              if checks["publication_date"] != date or checks["articles"] != count:
                  raise SystemExit(f"{issue_id} identity/count mismatch: {checks}")
              print(json.dumps({"issue_id": issue_id, **checks}, ensure_ascii=False))
          PY
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_privacy.py
          python scripts/rebuild_public_snapshot.py --check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g05-te-browser-evidence-qualification
          if-no-files-found: warn
          path: |
            output
            data/provenance/official-rosters/wiley/te-21-2.json
            data/provenance/official-rosters/wiley/te-21-3.json
            public/api/v1/journals/te/issues/te-21-2.json
            public/api/v1/journals/te/issues/te-21-3.json
            data/backfill-state
            data/translation-cache/te.json
