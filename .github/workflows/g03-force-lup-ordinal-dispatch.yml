name: G03 force LUP ordinal dispatch
on:
  push:
    branches:
      - ops/g03-force-lup-ordinal-20260916
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch canonical monitor for LUP only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/monitor-journals.yml/dispatches" \
            -d '{"ref":"main","inputs":{"force_deep_journals":"LUP"}}'
