name: Temporary add OUP freshness feeds

on:
  push:
    branches:
      - fix/265-oup-rss-freshness
    paths:
      - .github/workflows/impl-265-oup-rss.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/265-oup-rss-freshness
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Add verified official OUP RSS feeds
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("config/journals.yml")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "    current_issue_url: https://academic.oup.com/ej/issue\n":
                  "    current_issue_url: https://academic.oup.com/ej/issue\n    rss_url: https://academic.oup.com/rss/site_6182/4014.xml\n",
              "    current_issue_url: https://academic.oup.com/jeea/issue\n":
                  "    current_issue_url: https://academic.oup.com/jeea/issue\n    rss_url: https://academic.oup.com/rss/site_5571/3427.xml\n",
              "    current_issue_url: https://academic.oup.com/rfs/issue\n":
                  "    current_issue_url: https://academic.oup.com/rfs/issue\n    rss_url: https://academic.oup.com/rss/site_5511/3372.xml\n",
          }
          for old, new in replacements.items():
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one config marker: {old.strip()}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate YAML and feed routing config
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          config = yaml.safe_load(Path("config/journals.yml").read_text(encoding="utf-8"))["journals"]
          expected = {
              "EJ": "https://academic.oup.com/rss/site_6182/4014.xml",
              "JEEA": "https://academic.oup.com/rss/site_5571/3427.xml",
              "RFS": "https://academic.oup.com/rss/site_5511/3372.xml",
          }
          for key, url in expected.items():
              assert config[key]["rss_url"] == url, (key, config[key].get("rss_url"))
          PY
      - name: Run monitor announcement tests
        run: python -m unittest tests.test_monitor_announcements -v
      - name: Run full Python suite
        run: python -m unittest discover -s tests -v
      - name: Commit verified config
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "academic-door-bot"
          git config user.email "academic-door-bot@users.noreply.github.com"
          git add config/journals.yml
          git diff --cached --check
          git commit -m "fix(freshness): add verified OUP issue RSS feeds"
          git push origin HEAD:fix/265-oup-rss-freshness
