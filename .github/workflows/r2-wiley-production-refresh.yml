name: R2 Wiley governed production refresh

on:
  push:
    branches:
      - ops/r2-wiley-production-refresh-20260912
    paths:
      - .github/workflows/r2-wiley-production-refresh.yml

permissions:
  contents: write

concurrency:
  group: journal-data-update
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ops/r2-wiley-production-refresh-20260912

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install -r requirements.txt

      - name: Reverify merged main and restore execution-time latest data
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main data
          test "$(git rev-parse origin/main)" = "b96f50a3159bdb499707e09da220bcb4d8551a78"
          echo "MAIN_SHA=$(git rev-parse origin/main)"
          echo "DATA_BASE_SHA=$(git rev-parse origin/data)"
          main_cache="$RUNNER_TEMP/main-translation-cache"
          mkdir -p "$main_cache"
          cp -R data/translation-cache/. "$main_cache/"
          rm -rf public/api data/backfill-state data/backfill-staging data/translation-cache
          git archive origin/data public/api public/project-manifest.json data/backfill-state data/backfill-staging data/translation-cache | tar -x
          if git cat-file -e origin/data:public/backfill-status.md 2>/dev/null; then
            git show origin/data:public/backfill-status.md > public/backfill-status.md
          fi
          MAIN_CACHE="$main_cache" python - <<'PY'
          import json, os
          from pathlib import Path
          target_dir = Path('data/translation-cache')
          target_dir.mkdir(parents=True, exist_ok=True)
          for override_path in Path(os.environ['MAIN_CACHE']).glob('*.json'):
              target_path = target_dir / override_path.name
              base = json.loads(target_path.read_text(encoding='utf-8')) if target_path.exists() else {}
              base.update(json.loads(override_path.read_text(encoding='utf-8')))
              target_path.write_text(json.dumps(base, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Snapshot publication baseline and before ledger
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$RUNNER_TEMP/data-baseline" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --exclude 'public/api/v1/journals/*/issues/index.json'
          python scripts/build_completeness_ledger.py \
            --state data/backfill-state/field-2023-2024.json \
            --state data/backfill-state/field-2025-2026.json \
            --api-root public/api/v1 \
            --journals-config config/journals.yml \
            --window-start 2026-01-01 \
            --window-end 2026-09-12 \
            --out-json "$RUNNER_TEMP/before-ledger.json"

      - name: Refresh exact Wiley publisher-observed discovery only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/backfill_history.py \
            --config config/field-history.yml \
            --state data/backfill-state/field-2025-2026.json \
            --journals AJAE,ECTA,IER,TE,RAND,JF \
            --from-year 2025 \
            --to-year 2026 \
            --refresh-discovery-only \
            --report-json "$RUNNER_TEMP/wiley-refresh-report.json"
          python scripts/backfill_status.py \
            --state data/backfill-state/field-2023-2024.json \
            --state data/backfill-state/field-2025-2026.json \
            --out-json public/api/v1/backfill-status.json \
            --out-md public/backfill-status.md
          python scripts/audit_public_data.py --strict-provenance
          python scripts/audit_source_alignment.py --strict
          python scripts/audit_privacy.py

      - name: Qualify post-refresh completeness before publish
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_completeness_ledger.py \
            --state data/backfill-state/field-2023-2024.json \
            --state data/backfill-state/field-2025-2026.json \
            --api-root public/api/v1 \
            --journals-config config/journals.yml \
            --window-start 2026-01-01 \
            --window-end 2026-09-12 \
            --out-json "$RUNNER_TEMP/after-ledger.json"
          BEFORE="$RUNNER_TEMP/before-ledger.json" AFTER="$RUNNER_TEMP/after-ledger.json" python - <<'PY'
          import json, os
          before=json.load(open(os.environ['BEFORE'], encoding='utf-8'))
          after=json.load(open(os.environ['AFTER'], encoding='utf-8'))
          print('BEFORE_RECONCILIATION', json.dumps(before['reconciliation'], sort_keys=True))
          print('AFTER_RECONCILIATION', json.dumps(after['reconciliation'], sort_keys=True))
          expected = {
              'AJAE': ('SOURCE_BLOCKED', 4, 4, 0, 0, 4),
              'ECTA': ('COMPLETE', 4, 4, 4, 0, 0),
              'IER': ('COMPLETE', 3, 3, 3, 0, 0),
              'TE': ('PARTIAL', 3, 1, 1, 2, 0),
              'RAND': ('COMPLETE', 3, 3, 3, 0, 0),
              'JF': ('SOURCE_BLOCKED', 4, 4, 0, 0, 4),
          }
          rows={r['journalKey']:r for r in after['journals']}
          for journal, want in expected.items():
              r=rows[journal]
              got=(r['status'],r['expectedIssueCount'],r['archivedIssueCount'],r['publicationReadyIssueCount'],r['missingIssueCount'],r['sourceBlockedIssueCount'])
              print('WILEY', journal, json.dumps({
                  'status':r['status'],'authority':r['authority'],'freshness':r['freshnessStatus'],
                  'measuredThrough':r['measuredThrough'],'expected':r['expectedIssueCount'],
                  'archived':r['archivedIssueCount'],'ready':r['publicationReadyIssueCount'],
                  'missing':r['missingIssues'],'blocked':r['sourceBlockedIssues']}, sort_keys=True))
              if r['authority'] != 'official_archive_snapshot' or r['freshnessStatus'] != 'CURRENT_FOR_AUDIT_END':
                  raise SystemExit(f'{journal}: authority/freshness regression')
              if got != want:
                  raise SystemExit(f'{journal}: qualified tuple {got!r} != {want!r}')
          rec=after['reconciliation']
          required={'complete':20,'not_measured':26,'partial':1,'source_blocked':2,'authoritative_expected_issues_total':100,'archived_issues_total':98,'publication_ready_issues_total':90,'blocked_issues_total':8,'confirmed_missing_issues_total':2}
          for key,value in required.items():
              if rec[key] != value:
                  raise SystemExit(f'reconciliation {key}={rec[key]} != {value}')
          PY

      - name: Publish guarded data delta to latest data branch
        shell: bash
        run: |
          set -euo pipefail
          baseline="$RUNNER_TEMP/data-baseline"
          generated="$RUNNER_TEMP/generated-data"
          data_tree="$RUNNER_TEMP/data-tree"
          python scripts/publish_data_delta.py snapshot \
            --root . \
            --output "$generated" \
            --path public/api/v1/journals \
            --path data/translation-cache \
            --path data/backfill-state \
            --path data/backfill-staging \
            --exclude 'public/api/v1/journals/*/issues/index.json'

          for attempt in 1 2 3 4 5; do
            if ! git fetch origin data; then
              sleep $((attempt * 15))
              continue
            fi
            git worktree remove --force "$data_tree" 2>/dev/null || true
            rm -rf "$data_tree"
            git worktree add "$data_tree" origin/data
            git -C "$data_tree" switch -C data
            if ! python scripts/publish_data_delta.py apply \
              --baseline "$baseline" \
              --generated "$generated" \
              --target "$data_tree" \
              --path public/api/v1/journals \
              --path data/translation-cache \
              --path data/backfill-state \
              --path data/backfill-staging \
              --exclude 'public/api/v1/journals/*/issues/index.json'; then
              sleep $((attempt * 15))
              continue
            fi

            rm -rf "$GITHUB_WORKSPACE/public/api"
            mkdir -p "$GITHUB_WORKSPACE/public"
            cp -R "$data_tree/public/api" "$GITHUB_WORKSPACE/public/api"
            python scripts/rebuild_public_snapshot.py
            python scripts/publish_data_delta.py rebuild-archive-indexes --root "$GITHUB_WORKSPACE"
            state_args=()
            for state in data/backfill-state/field-2023-2024.json data/backfill-state/field-2025-2026.json; do
              if [ -f "$data_tree/$state" ]; then state_args+=(--state "$data_tree/$state"); fi
            done
            python scripts/backfill_status.py "${state_args[@]}" --api-root public/api/v1 --out-json public/api/v1/backfill-status.json --out-md public/backfill-status.md
            python scripts/audit_source_alignment.py --strict
            python scripts/rebuild_public_snapshot.py --check
            python scripts/audit_public_data.py --strict-provenance
            python scripts/audit_privacy.py
            mkdir -p "$data_tree/public/api"
            cp -R "$GITHUB_WORKSPACE/public/api/." "$data_tree/public/api/"
            cp "$GITHUB_WORKSPACE/public/project-manifest.json" "$data_tree/public/project-manifest.json"
            cp "$GITHUB_WORKSPACE/public/backfill-status.md" "$data_tree/public/backfill-status.md"

            git -C "$data_tree" rm -f --ignore-unmatch public/search.js
            git -C "$data_tree" config user.name "academic-door-bot"
            git -C "$data_tree" config user.email "academic-door-bot@users.noreply.github.com"
            git -C "$data_tree" add -A public/api data/translation-cache
            git -C "$data_tree" add public/project-manifest.json public/backfill-status.md
            git -C "$data_tree" add -f data/backfill-state data/backfill-staging 2>/dev/null || true
            if git -C "$data_tree" diff --cached --quiet; then
              echo "No Wiley discovery changes to publish."
              echo "PUBLISHED_DATA_SHA=$(git -C "$data_tree" rev-parse HEAD)"
              exit 0
            fi
            echo 'PUBLISH_DIFF_START'
            git -C "$data_tree" diff --cached --stat
            git -C "$data_tree" diff --cached --name-only
            echo 'PUBLISH_DIFF_END'
            git -C "$data_tree" commit -m "Refresh Wiley authoritative discovery"
            if git -C "$data_tree" push origin HEAD:data; then
              echo "PUBLISHED_DATA_SHA=$(git -C "$data_tree" rev-parse HEAD)"
              exit 0
            fi
            echo "Data changed during publish; refetching and reapplying the delta."
            sleep $((attempt * 15))
          done
          echo "Failed to publish Wiley discovery delta after five attempts."
          exit 1

      - name: Verify canonical data readback and final ledger
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin data
          echo "DATA_FINAL_SHA=$(git rev-parse origin/data)"
          rm -rf "$RUNNER_TEMP/readback"
          mkdir -p "$RUNNER_TEMP/readback"
          git archive origin/data public/api data/backfill-state | tar -x -C "$RUNNER_TEMP/readback"
          python scripts/build_completeness_ledger.py \
            --state "$RUNNER_TEMP/readback/data/backfill-state/field-2023-2024.json" \
            --state "$RUNNER_TEMP/readback/data/backfill-state/field-2025-2026.json" \
            --api-root "$RUNNER_TEMP/readback/public/api/v1" \
            --journals-config config/journals.yml \
            --window-start 2026-01-01 \
            --window-end 2026-09-12 \
            --out-json "$RUNNER_TEMP/readback-ledger.json"
          LEDGER="$RUNNER_TEMP/readback-ledger.json" python - <<'PY'
          import json, os
          payload=json.load(open(os.environ['LEDGER'], encoding='utf-8'))
          print('READBACK_RECONCILIATION', json.dumps(payload['reconciliation'], sort_keys=True))
          rows={r['journalKey']:r for r in payload['journals']}
          for journal in ('AJAE','ECTA','IER','TE','RAND','JF'):
              r=rows[journal]
              print('READBACK_WILEY', journal, r['status'], r['authority'], r['freshnessStatus'], r['expectedIssueCount'], r['archivedIssueCount'], r['publicationReadyIssueCount'], r['missingIssueCount'], r['sourceBlockedIssueCount'])
              if r['authority'] != 'official_archive_snapshot' or r['freshnessStatus'] != 'CURRENT_FOR_AUDIT_END':
                  raise SystemExit(f'{journal}: readback authority/freshness regression')
          PY
